<!doctype html>
<!-- service.html v9 — crew Service Area TV screen (drive-thru / front counter). Point a Fire Stick browser at:
     v9 (2026-07-13, Eddie ruling): Shift Showdown empty rows prefer fn-provided `state_copy`
     (fn v11) — the late-night row now reads "Not enough overnight surveys / Pocas encuestas
     nocturnas" (Base 12a-5a retired as a daily expectation; "Data delayed" implied data was
     coming). Dimmed styling + generic fallbacks unchanged.
     v8 (2026-07-12, Eddie): SHIFT SHOWDOWN card (fn v10 `shiftShowdown` payload) — the store's own
     dayparts ranked by current-month MTD guest OSAT (SMG VOICE daypart feeds), medal podium rows,
     crown on the leading shift, delta-vs-org-same-daypart pill + trend arrow vs prior month.
     BILINGUAL EN/ES (kitchen.html's i18n pattern — kick2/title2es/mes helpers now here too).
     A daypart whose feed is delayed (registry is_fresh=false) renders a dimmed "Data delayed"
     row — never a stale number as current. Data-through date stated on the card.
     v7 (2026-07-10, Eddie): EAD MTD card (pairs with fn v8 `ead` payload) — EAD % + rank of
     reporting stores + gap to #1 + org avg, Greeted-by-Name / Asked-if-App driver tiles, and
     a ranked bar graphic of all reporting stores (this store highlighted). Bonus-tier colored
     (55/65/75). States n, month, and how many stores have no surveys yet.
     https://edwardbiz-gif.github.io/manager-page/service.html?t=<token>&store=3444
     (3444 = Boulder Hill, the live demo store; default below is also 3444)
     Service-side sibling of kitchen.html. Fetches the service-screen Edge Function (JSON) and rotates
     full-screen cards. Crew-facing: store-level only, no names/pay. Every number states its data-through date.
     v6 (2026-07-10): TRUE OEPE + REAL R2P (pairs with fn v7). The MTD headline now reads calibrated
     OEPE w/o parked (line+win1+win2 × park calibration — was windows-only, ~50s low); the "FC R2P"
     stat is replaced by true R2P from the QSRSoft 3-peak monthly labeled with ITS month (DataPass
     cannot reconstruct DT R2P); the daily card's front-counter tile is relabeled "Front counter".
     v5 (2026-06-29): MTD-ONLY + AUTO WINNER ANNOUNCEMENT. The screen now reflects the CURRENT month only —
     the live MTD drive-thru figures lead, and the cross-store Board is the live MTD OEPE speed race (mtdRace,
     all 12, current month). The old last-full-month cards (guest-experience headline race, OEPE-by-peak,
     R2P/KVS/parked quality) are dropped (no current-month cross-store source). For the first
     d.winnerWindowDays (5) days of each new month, the rotation LEADS with a celebratory "last month's
     Guest Experience Champion" card (d.lastMonthWinner); after day 5 it reverts to MTD-only automatically
     (server decides via d.showWinner — pure date logic). Append &today=YYYY-MM-DD to the URL to test it.
     v4 (2026-06-24): (1) BENCHMARK EVERY STAT VS ORG — every metric card shows the all-12-store org average,
     this store's rank ("Nth of 12", direction-aware), and a +/- delta vs org (the benchLine/benchPill
     helpers read each metric's `bench` block from the payload). (2) FOUR DAILY PRODUCT RANKER cards —
     Crafted Sodas, Refreshers, Fried Apple Pies, FIFA World Cup Meals — each a 12-store leaderboard shown
     by BOTH raw units and per-1,000 guests, with this store highlighted; data-through stated.
     v3 (2026-06-24): (1) the lead drive-thru card is framed as JUNE — MONTH TO DATE (the MTD number leads,
     coverage in fine print). (2) the cross-store race is reframed from DT-speed into a GUEST-EXPERIENCE
     race: stores ranked on an equal-weight blend of VOICE OSAT + Accuracy + Friendliness (higher = better),
     latest month with all three (Friendliness lags ~a month). The Board ranks the same blend.
     v2 (2026-06-24): drive-thru speed leads with a JUNE MTD live card + a 2026 YTD card; by-peak /
     R2P-KVS-parked cards labelled with their last-complete month; delivery + voice labelled with month + YTD.
     Page reloads every 10 min and reloads data each load (daily-fresh). Deploy: push-pages.ps1 -> GH Pages. -->
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Area</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
  html,body{height:100%;background:#0a1424;color:#fff;overflow:hidden}
  #stage{position:fixed;inset:0}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:4vh 6vw;opacity:0;transition:opacity .8s ease;gap:2.2vh}
  .card.on{opacity:1}
  .card.blue{background:radial-gradient(circle at 50% 28%,#103a6e,#0a1424 75%)}
  .card.teal{background:radial-gradient(circle at 50% 28%,#0c4f4a,#0a1424 75%)}
  .card.gold{background:radial-gradient(circle at 50% 28%,#5a4500,#0a1424 75%)}
  /* winner-announcement card: celebratory deep-gold spotlight (month-rollover only) */
  .card.win{background:radial-gradient(circle at 50% 26%,#7a5a00,#2a1a00 60%,#0a1424 92%)}
  .card.win .trophy{font-size:16vh;line-height:1;filter:drop-shadow(0 0 2vh rgba(255,199,44,.6))}
  .card.win .winname{font-size:9vh;font-weight:900;color:#FFC72C;line-height:1}
  .card.win .winsub{font-size:4.6vh;font-weight:800}
  .kicker{color:#37C2FF;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:2.6vh}
  .kicker .es{display:block;letter-spacing:.08em;color:#2b96c9;font-size:2.2vh;margin-top:.4vh}
  .title{font-size:7vh;font-weight:900;line-height:1}
  .title2{font-size:5.2vh;font-weight:900;color:#37C2FF}
  .t-es{font-size:3vh;font-weight:800;color:#7fd4ff;margin-top:-.6vh}
  .sub-es{font-size:3.2vh;font-weight:700;max-width:82vw;color:#8fd0f5}
  .huge{font-size:21vh;font-weight:900;line-height:.9;color:#FFC72C}
  .huge .of{font-size:6vh;color:#fff;font-weight:700}
  .sub{font-size:4.2vh;font-weight:700;max-width:82vw}
  .score{font-size:3.2vh;color:#cdd}
  .fine{font-size:2.3vh;color:#8aa;font-weight:600;margin-top:.6vh}
  /* org benchmark line shown under a headline metric: "Org avg X · 3rd of 12 · +Y vs org" */
  .bench{font-size:2.5vh;color:#cfe3ff;font-weight:700;margin-top:.4vh;display:flex;gap:1.4vw;
    align-items:center;justify-content:center;flex-wrap:wrap}
  .bench .rk{background:#1f6fd6;color:#fff;border-radius:1vh;padding:.3vh 1.4vw;font-weight:900}
  .bench .rk.top{background:#FFC72C;color:#0a1424}
  .bench .dl{font-weight:900}.bench .dl.up{color:#46e07a}.bench .dl.dn{color:#ff7a6b}
  /* small benchmark pill for tiles (org avg + rank) */
  .tbench{font-size:2vh;color:#bcd;font-weight:700;margin-top:.4vh;line-height:1.25}
  .tbench .rk{color:#FFC72C;font-weight:900}.tbench .rk.top{color:#46e07a}
  .tbench .dl.up{color:#46e07a}.tbench .dl.dn{color:#ff7a6b}
  /* product-ranker card: two side-by-side mini-boards (raw units | per 1k guests) */
  .rank2{display:flex;gap:3vw;max-width:92vw;align-items:flex-start;justify-content:center}
  .rankcol{flex:1;max-width:44vw;display:flex;flex-direction:column;gap:.55vh}
  .rankcol .ch{font-size:2.6vh;font-weight:800;color:#9fd;margin-bottom:.5vh;text-align:center}
  .rankcol .rr{display:flex;align-items:center;gap:1vw;background:#13243f;padding:.7vh 1.2vw;border-radius:.9vh;font-size:2.3vh}
  .rankcol .rr.me{background:#1f6fd6;font-weight:900}
  .rankcol .rr .rk{width:3vw;color:#FFC72C;font-weight:900}.rankcol .rr.me .rk{color:#fff}
  .rankcol .rr .nm{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rankcol .rr .vl{font-weight:800}.rankcol .rr .un{font-size:1.7vh;color:#9bb;margin-left:.4vw}
  .board{width:74vw;max-height:74vh;display:flex;flex-direction:column;gap:.7vh;font-size:2.9vh}
  .row{display:flex;align-items:center;gap:1.5vw;background:#13243f;padding:1vh 2vw;border-radius:1vh}
  .row.me{background:#1f6fd6;font-weight:900}
  .row .rk{width:4vw;color:#FFC72C;font-weight:900}.row.me .rk{color:#fff}
  .row .nm{flex:1;text-align:left}.row .vl{font-weight:800}
  .row .un{font-size:2vh;color:#9bb;font-weight:600;margin-left:.4vw}
  .tiles{display:flex;gap:3vw;flex-wrap:wrap;align-items:stretch;justify-content:center;max-width:90vw}
  .tile{background:#13243f;border-radius:1.6vh;padding:3vh 3.5vw;min-width:24vw;display:flex;
    flex-direction:column;align-items:center;gap:1vh}
  .tile .tlab{font-size:3vh;font-weight:800;color:#9fd}
  .tile .tval{font-size:9vh;font-weight:900;color:#FFC72C;line-height:1}
  .tile .tval .u{font-size:3.4vh;color:#fff;font-weight:700}
  .tile .tgoal{font-size:2.4vh;color:#9bb}
  .tile.good .tval{color:#46e07a}.tile.bad .tval{color:#ff7a6b}
  .peaks{display:flex;gap:3vw;align-items:flex-end;justify-content:center;max-width:90vw}
  .peak{display:flex;flex-direction:column;align-items:center;gap:1.2vh;min-width:18vw}
  .peak .pn{font-size:3.4vh;font-weight:800}
  .peak .pv{font-size:8vh;font-weight:900;line-height:1}
  .peak .pu{font-size:2.6vh;color:#9bb}
  .quotes{display:flex;flex-direction:column;gap:2.6vh;max-width:84vw}
  .q{font-size:4.2vh;font-style:italic}
  .body{display:flex;flex-direction:column;gap:2vh;max-width:82vw}.ln{font-size:4.4vh;font-weight:700}
  .bars{display:flex;align-items:flex-end;gap:2.2vw;height:46vh}
  .bar{width:10vw;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .fill{width:100%;background:linear-gradient(#37C2FF,#1f6fd6);border-radius:1vh 1vh 0 0;min-height:2vh}
  .bv{font-size:2.4vh;font-weight:800;margin-top:1vh}.bm{font-size:2.2vh;color:#9bb}
  /* v8 Shift Showdown — podium rows (service palette) */
  .sdrow{display:flex;align-items:center;gap:1.4vw;background:#13243f;padding:1vh 2vw;border-radius:1vh}
  .sdrow.lead{background:linear-gradient(90deg,#6e5600,#13243f 70%);box-shadow:inset 0 0 0 .35vh #FFC72C}
  .sdrow.dim{opacity:.5}
  .sdrow .md{font-size:4.4vh;width:5.5vw;text-align:center}
  .sdrow .shift{flex:1;text-align:left;display:flex;flex-direction:column;gap:.2vh}
  .sdrow .sn{font-size:3.4vh;font-weight:900}
  .sdrow .sn .es{color:#7fd4ff;font-weight:800;font-size:2.7vh}
  .sdrow .sw{font-size:2vh;color:#9bb;font-weight:600}
  .sdrow .osat{font-size:5.2vh;font-weight:900;color:#FFC72C;min-width:13vw;text-align:right;line-height:1}
  .sdrow .osat .u{font-size:2.6vh;color:#fff;font-weight:700}
  .sdrow .pills{display:flex;flex-direction:column;align-items:flex-end;gap:.5vh;min-width:17vw}
  .sdpill{font-size:2vh;font-weight:800;border-radius:1vh;padding:.3vh 1.2vw;background:#0e1b30;color:#bcd}
  .sdpill.up{color:#46e07a}.sdpill.dn{color:#ff7a6b}
  .sdrow .dly{font-size:2.5vh;font-weight:800;color:#9bb;text-align:right;flex:1}
  #foot{position:fixed;bottom:1.4vh;width:100%;text-align:center;color:#6b8;font-size:1.9vh}
  #err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:3vh;color:#37C2FF;text-align:center;padding:6vw}
</style></head><body>
<div id="stage"></div><div id="foot"></div>
<script>
const FN = "https://nnsuyrhubsidwmrrsumm.supabase.co/functions/v1/service-screen";
// No apikey/Authorization header: the function has verify_jwt OFF and the gateway allows anonymous
// GET; auth is the in-URL capability token (?t=). Sending those headers would also trip the CORS
// preflight (the function only allow-lists content-type) — mirrors kitchen.html's headerless fetch.
const qs = new URLSearchParams(location.search);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ord = n => { const s=["th","st","nd","rd"],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const fmt = (v,dec=0) => v==null ? "—" : Number(v).toFixed(dec);
// v8 bilingual helpers — kitchen.html's i18n pattern (Spanish month names + two-line kicker/title)
const MES = {January:"enero",February:"febrero",March:"marzo",April:"abril",May:"mayo",June:"junio",
  July:"julio",August:"agosto",September:"septiembre",October:"octubre",November:"noviembre",December:"diciembre"};
const mes = m => MES[m]||m;
const kick2 = (en,es) => '<div class="kicker">'+en+'<span class="es">'+es+'</span></div>';
const title2es = (en,es) => '<div class="title2">'+en+'</div>'+(es?'<div class="t-es">'+es+'</div>':'');
// OEPE goal tone: lower seconds = faster = better. g.oepe_o (Outstanding) is the toughest target.
const oepeTone = (v,g) => v==null ? "" : (v<=g.oepe_o ? "good" : (v<=g.oepe_g ? "" : "bad"));
// R2P goal tone: lower seconds better. r2p_g (40) is best, r2p_p (60) is the floor.
const r2pTone = (v,g) => v==null ? "" : (v<=g.r2p_g ? "good" : (v<=g.r2p_p ? "" : "bad"));

// ── ORG BENCHMARK rendering ──────────────────────────────────────────────────────────────────
// A benchmark block from the payload: { org_avg, rank, total, me, delta, lower_is_better }.
// A delta is "good" (green ▲) when it moves the right way: for lower-is-better metrics a NEGATIVE delta
// is good; otherwise a POSITIVE delta is good. We show the delta's beat/behind sign relative to org.
function deltaParts(b,dec){
  if(!b||b.delta==null) return null;
  const good = b.lower_is_better ? b.delta<0 : b.delta>0;
  const sign = b.delta>0 ? "+" : (b.delta<0 ? "−" : "±");          // − is a true minus glyph
  return { txt: sign+fmt(Math.abs(b.delta),dec)+" vs org", cls: b.delta===0?"":(good?"up":"dn") };
}
// big benchmark line under a headline metric. `unit` appended to the org avg; `dec` rounding for display.
function benchLine(b,unit,dec){
  if(!b) return "";
  unit=unit||""; dec=dec==null?1:dec;
  const top = b.rank===1;
  let h='<div class="bench"><span>Org avg '+fmt(b.org_avg,dec)+esc(unit)+'</span>';
  if(b.rank!=null) h+='<span class="rk'+(top?" top":"")+'">'+(top?"🏆 #1 of "+b.total:ord(b.rank)+" of "+b.total)+'</span>';
  const d=deltaParts(b,dec); if(d) h+='<span class="dl '+d.cls+'">'+esc(d.txt)+'</span>';
  return h+'</div>';
}
// compact benchmark pill for inside a tile (org avg + rank + delta), wraps to 2 short lines.
function benchPill(b,unit,dec){
  if(!b) return "";
  unit=unit||""; dec=dec==null?1:dec;
  const top = b.rank===1;
  let h='<div class="tbench">org '+fmt(b.org_avg,dec)+esc(unit);
  if(b.rank!=null) h+=' · <span class="rk'+(top?" top":"")+'">'+ord(b.rank)+'/'+b.total+'</span>';
  const d=deltaParts(b,dec); if(d) h+='<br><span class="dl '+d.cls+'">'+esc(d.txt)+'</span>';
  return h+'</div>';
}

function buildCards(d){
  const cards=[], g=d.goals||{};
  const through = d.monthName;          // monthly cross-store numbers run through this (last-complete) month
  const lm = d.liveMtd||null;           // current-month MTD live drive-thru (month rolls itself, CT)
  const ytd = d.ytd||null;              // calendar YTD

  // 0) AUTO WINNER ANNOUNCEMENT — for the first d.winnerWindowDays of each new month, LEAD with a
  // celebratory "last month's contest winner" card (the guest-experience champion of the just-ended
  // month). Pure date logic on the server (d.showWinner); after the window it disappears automatically
  // and the rotation is MTD-only. This is the ONLY last-month content on the screen.
  if(d.showWinner && d.lastMonthWinner && d.lastMonthWinner.winner_name){
    const w=d.lastMonthWinner;
    const headline = w.is_me
      ? '<div class="winsub">🎉 That\'s US — '+esc(d.loc)+' took the crown!</div>'
      : (w.my_rank!=null
          ? '<div class="winsub">'+esc(d.loc)+' finished '+ord(w.my_rank)+' of '+w.total+(w.my_blend!=null?' ('+fmt(w.my_blend,1)+')':"")+' — let\'s win '+esc(d.currentMonth||"this month")+'!</div>'
          : '<div class="winsub">Let\'s win '+esc(d.currentMonth||"this month")+'!</div>');
    cards.push({a:"win",h:
      '<div class="kicker">🏆 '+esc(w.month)+' Guest Experience Champion · all '+w.total+' stores</div>'+
      '<div class="trophy">🏆</div>'+
      '<div class="winname">'+esc(w.winner_name)+'</div>'+
      (w.winner_blend!=null?'<div class="sub">Champion score <b>'+fmt(w.winner_blend,1)+'</b> · OSAT '+fmt(w.sat,1)+'% · Accuracy '+fmt(w.accuracy,1)+'% · Friendly '+fmt(w.friendliness,1)+'%</div>':"")+
      headline+
      '<div class="fine">guest-experience contest (OSAT + Accuracy + Friendliness) · '+esc(w.month)+' final standings · higher is better</div>'});
  }

  // 1) CURRENT-MONTH MTD LIVE — drive-thru speed (the freshest source), leads the rotation.
  // Framed prominently as MONTH-TO-DATE; the actual coverage (days / through-date) is fine print below.
  if(lm){
    const lb=lm.bench||{};
    cards.push({a:"gold",h:'<div class="kicker">'+esc(lm.month)+' — Month to Date · live drive-thru · OEPE w/o parked</div>'+
      '<div class="title">'+esc(d.loc)+'</div>'+
      '<div class="huge" style="color:'+(oepeTone(lm.oepe_s,g)==="good"?"#46e07a":oepeTone(lm.oepe_s,g)==="bad"?"#ff7a6b":"#FFC72C")+'">'+fmt(lm.oepe_s)+'<span class="of">s OEPE</span></div>'+
      '<div class="sub">'+esc(lm.month)+' month-to-date drive-thru speed · faster is better</div>'+
      benchLine(lb.oepe,"s",0)+
      '<div class="score">'+(lm.r2p_s!=null?'R2P '+fmt(lm.r2p_s)+'s'+(lm.r2p_month?' ('+esc(lm.r2p_month)+' 3-peak)':'')+' &nbsp;·&nbsp; ':'')+'Parked '+fmt(lm.park_pct,1)+'%</div>'+
      ((lb.r2p||lb.parked)?'<div class="bench" style="font-size:2.1vh">'+
        (lb.r2p?'<span>R2P org '+fmt(lb.r2p.org_avg,1)+'s · '+ord(lb.r2p.rank)+'/'+lb.r2p.total+'</span>':"")+
        (lb.parked?'<span>Parked org '+fmt(lb.parked.org_avg,1)+'% · '+ord(lb.parked.rank)+'/'+lb.parked.total+'</span>':"")+
      '</div>':"")+
      '<div class="fine">data through '+esc(lm.through||"")+' · '+fmt(lm.days)+' day'+(lm.days===1?"":"s")+' available · '+fmt(lm.cars)+' cars · org avg = all '+(lb.oepe?lb.oepe.total:12)+' stores, same window</div>'});
  }

  // 1b) 2026 YTD — the year so far (Jan–prior month monthly + this month MTD live)
  if(ytd){
    cards.push({a:"teal",h:'<div class="kicker">'+esc(ytd.label)+' · drive-thru · through '+esc(ytd.through||"")+'</div>'+
      '<div class="title2">Our year so far</div>'+
      '<div class="tiles">'+
      '<div class="tile"><div class="tlab">OEPE</div><div class="tval">'+fmt(ytd.oepe_s)+'<span class="u">s</span></div><div class="tgoal">w/o parked · faster is better</div>'+benchPill((ytd.bench||{}).oepe,"s",0)+'</div>'+
      (ytd.r2p_s!=null?'<div class="tile"><div class="tlab">R2P</div><div class="tval">'+fmt(ytd.r2p_s)+'<span class="u">s</span></div><div class="tgoal">'+esc(ytd.monthly_label||('Jan–'+through))+'</div></div>':"")+
      (ytd.kvs_s!=null?'<div class="tile"><div class="tlab">KVS / GC</div><div class="tval">'+fmt(ytd.kvs_s)+'<span class="u">s</span></div><div class="tgoal">'+esc(ytd.monthly_label||('Jan–'+through))+'</div></div>':"")+
      (ytd.park_pct!=null?'<div class="tile"><div class="tlab">Parked %</div><div class="tval">'+fmt(ytd.park_pct,1)+'<span class="u">%</span></div><div class="tgoal">avoidable waits</div></div>':"")+
      '</div>'});
  }

  // 2) THE BOARD — live MTD cross-store race (current-month OEPE speed, all 12, faster = better).
  // This is the headline race DURING the month. It replaces the old guest-experience blend race, which
  // lagged ~a month (Friendliness) and would otherwise show last month as if current. The blend now
  // appears ONLY in the month-rollover winner card above.
  const mr = d.mtdRace||{standings:[]};
  if(mr.rank!=null){
    const rbig = mr.rank===1
      ? '<div class="huge">🏆 #1!</div><div class="sub">'+esc(d.loc)+' is the fastest drive-thru of '+mr.total+' this month. Hold the lead!</div>'
      : '<div class="huge">'+ord(mr.rank)+'<span class="of"> of '+mr.total+'</span></div><div class="sub">'+
        (mr.gap!=null?'+'+fmt(mr.gap)+'s behind #1 — let\'s close the gap.':"Let's climb the board.")+'</div>';
    cards.push({a:"blue",h:'<div class="kicker">Drive-Thru Speed Race · '+esc(mr.month)+' MTD · OEPE seconds (faster = better)</div><div class="title">'+esc(d.loc)+'</div>'+rbig+
      (mr.oepe_s!=null?'<div class="score">Our MTD OEPE: <b>'+fmt(mr.oepe_s)+'s</b> · faster is better</div>':"")+
      '<div class="fine">current-month live drive-thru · data through '+esc(mr.through||"")+'</div>'});

    // The Board — all 12 ranked by current-month OEPE, fastest first
    cards.push({a:"teal",h:'<div class="kicker">The Board · '+esc(mr.month)+' MTD · drive-thru OEPE (lower = faster)</div>'+
      '<div class="title2">Drive-thru speed — all '+mr.total+'</div><div class="board">'+
      mr.standings.map((r,i)=>'<div class="row '+(r.me?"me":"")+'"><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(r.location_name)+'</span><span class="vl">'+fmt(r.oepe)+'<span class="un">s</span></span></div>').join("")+'</div>'});
  }

  // 2c) SHIFT SHOWDOWN (fn v10) — dayparts ranked by MTD guest OSAT; crown the leader (bilingual)
  if(d.shiftShowdown&&d.shiftShowdown.dayparts&&d.shiftShowdown.dayparts.some(p=>p.rank!=null)){
    const sd=d.shiftShowdown, MD=["🥇","🥈","🥉","🏅"];
    const rows=sd.dayparts.filter(p=>p.rank!=null).slice().sort((a,b)=>a.rank-b.rank);
    const out=sd.dayparts.filter(p=>p.rank==null);
    const tail=rows.length>1?rows[rows.length-1]:null;
    const cheer=tail?(tail.key==="base_4p_12a"
      ?'Beat the dinner slump — the crown is up for grabs!'
      :esc(tail.label_en)+' crew — the crown is up for grabs!'):'';
    const cheerEs=tail?(tail.key==="base_4p_12a"
      ?'¡A vencer el bajón de la cena — la corona está en juego!'
      :'¡Equipo de '+esc(tail.label_es.toLowerCase())+' — la corona está en juego!'):'';
    const pills=p=>{
      let h='';
      if(p.delta!=null) h+='<span class="sdpill '+(p.delta>=0?'up':'dn')+'">'+(p.delta>=0?'+':'−')+Math.abs(p.delta).toFixed(1)+' vs org · same shift / mismo turno</span>';
      if(p.arrow==='up') h+='<span class="sdpill up">▲ up vs '+esc(sd.prev_month)+' / sube vs '+esc(mes(sd.prev_month))+'</span>';
      else if(p.arrow==='down') h+='<span class="sdpill dn">▼ down vs '+esc(sd.prev_month)+' / baja vs '+esc(mes(sd.prev_month))+'</span>';
      else if(p.arrow==='flat') h+='<span class="sdpill">▬ even vs '+esc(sd.prev_month)+' / igual vs '+esc(mes(sd.prev_month))+'</span>';
      return h;
    };
    const rowH=rows.map(p=>'<div class="sdrow'+(p.rank===1?' lead':'')+'">'+
      '<span class="md">'+(MD[p.rank-1]||p.rank)+'</span>'+
      '<span class="shift"><span class="sn">'+(p.rank===1?'👑 ':'')+esc(p.label_en)+' <span class="es">/ '+esc(p.label_es)+'</span></span>'+
      '<span class="sw">'+esc(p.window)+(p.n!=null?' · '+p.n+' surveys / encuestas':'')+(p.org!=null?' · org '+p.org.toFixed(1)+'%':'')+'</span></span>'+
      '<span class="osat">'+p.osat.toFixed(1)+'<span class="u">%</span></span>'+
      '<span class="pills">'+pills(p)+'</span></div>').join("");
    const outH=out.map(p=>'<div class="sdrow dim"><span class="md">⏳</span>'+
      '<span class="shift"><span class="sn">'+esc(p.label_en)+' <span class="es">/ '+esc(p.label_es)+'</span></span><span class="sw">'+esc(p.window)+'</span></span>'+
      '<span class="dly">'+esc(p.state_copy||(p.state==="no_surveys"?'No surveys yet / Sin encuestas aún':'Data delayed / Datos retrasados'))+'</span></div>').join("");
    cards.push({a:"gold",h:kick2(
        'Shift Showdown · '+esc(sd.month)+' — month to date'+(sd.data_through?' · data through '+esc(sd.data_through):''),
        'Duelo de turnos · '+esc(mes(sd.month))+' — mes en curso'+(sd.data_through?' · datos hasta '+esc(sd.data_through):''))+
      title2es('Which shift wins our guests?','¿Qué turno conquista a nuestros clientes?')+
      (cheer?'<div class="sub" style="font-size:3.3vh">'+cheer+'</div><div class="sub-es" style="font-size:2.7vh">'+cheerEs+'</div>':'')+
      '<div class="board" style="width:82vw">'+rowH+outH+'</div>'+
      '<div class="fine">MTD guest OSAT by shift vs the same shift org-wide · SMG VOICE daypart feeds / OSAT del mes por turno vs el mismo turno en toda la organización</div>'});
  }

  // 5) LIVE TODAY (DataPass daily feed)
  if(d.live&&d.live.day){
    const ld=d.live.day, dlab=esc(d.live.date);
    cards.push({a:"gold",h:'<div class="kicker">Live drive-thru · '+dlab+'</div><div class="title2">Yesterday\'s drive-thru</div>'+
      '<div class="tiles">'+
      '<div class="tile '+oepeTone(ld.oepe_s,g)+'"><div class="tlab">OEPE</div><div class="tval">'+fmt(ld.oepe_s,0)+'<span class="u">s</span></div><div class="tgoal">'+fmt(ld.dt_cars)+' cars</div></div>'+
      '<div class="tile"><div class="tlab">Front counter</div><div class="tval">'+fmt(ld.fc_r2p_s,0)+'<span class="u">s</span></div><div class="tgoal">avg service time · front counter</div></div>'+
      '<div class="tile"><div class="tlab">Parked %</div><div class="tval">'+fmt(ld.park_pct,1)+'<span class="u">%</span></div><div class="tgoal">pull-forwards</div></div>'+
      '</div>'});
  }
  // 5b) LIVE BY DAYPART (today)
  if(d.live&&d.live.dayparts&&d.live.dayparts.length){
    cards.push({a:"blue",h:'<div class="kicker">Live OEPE by daypart · '+esc(d.live.date)+' · seconds</div><div class="title2">Where the clock ran</div>'+
      '<div class="board">'+d.live.dayparts.map(p=>'<div class="row"><span class="nm">'+esc(p.daypart)+'</span><span class="vl">'+fmt(p.oepe_s,0)+'<span class="un">s · '+fmt(p.cars)+' cars</span></span></div>').join("")+'</div>'});
  }

  // 6) DELIVERY (monthly)
  if(d.delivery){
    {const db=d.delivery.bench||{};
    cards.push({a:"teal",h:'<div class="kicker">McDelivery · '+esc(d.delivery.month)+' · org avg = all 12 stores</div><div class="title2">Delivery guests</div>'+
      '<div class="tiles">'+
      '<div class="tile"><div class="tlab">CSAT</div><div class="tval">'+fmt(d.delivery.csat,1)+'<span class="u">★</span></div><div class="tgoal">guest star rating</div>'+benchPill(db.csat,"★",1)+'</div>'+
      '<div class="tile"><div class="tlab">Restaurant time</div><div class="tval">'+fmt(d.delivery.restaurant_time_min,1)+'<span class="u">min</span></div><div class="tgoal">our part of the trip · target ~2.9</div>'+benchPill(db.restaurant_time,"m",1)+'</div>'+
      '</div>'});}
  }

  // 7) GUEST VOICE — DT satisfaction + B2B
  const v=d.voice||{};
  if(v.dt_osat&&v.dt_osat.score!=null){
    const vm = v.dt_osat.month ? new Date(v.dt_osat.month+"T00:00:00Z").toLocaleString("en-US",{month:"long",year:"numeric",timeZone:"UTC"}) : through;
    cards.push({a:"gold",h:'<div class="kicker">Guest voice · '+esc(vm)+(v.dt_osat.ytd!=null?' · 2026 YTD '+fmt(v.dt_osat.ytd,1)+'%':"")+'</div><div class="title2">Drive-thru satisfaction</div>'+
      '<div class="tiles">'+
      '<div class="tile"><div class="tlab">DT Overall Sat</div><div class="tval">'+fmt(v.dt_osat.score,1)+'<span class="u">%</span></div><div class="tgoal">top-box'+(v.dt_osat.ytd!=null?' · YTD '+fmt(v.dt_osat.ytd,1)+'%':"")+'</div>'+benchPill(v.dt_osat.bench,"%",1)+'</div>'+
      (v.dt_b2b&&v.dt_b2b.score!=null?'<div class="tile"><div class="tlab">DT Bottom-2-Box</div><div class="tval">'+fmt(v.dt_b2b.score,1)+'<span class="u">%</span></div><div class="tgoal">lower is better</div>'+benchPill(v.dt_b2b.bench,"%",1)+'</div>':"")+
      (v.fast&&v.fast.score!=null?'<div class="tile"><div class="tlab">"Fast"</div><div class="tval">'+fmt(v.fast.score,1)+'<span class="u">%</span></div><div class="tgoal">guests calling us fast</div>'+benchPill(v.fast.bench,"%",1)+'</div>':"")+
      '</div>'});
  }
  // 7b) DT OSAT trend
  if(v.dt_osat&&v.dt_osat.trend&&v.dt_osat.trend.length>=2){
    const tr=v.dt_osat.trend, mx=Math.max.apply(null,tr.map(t=>t.v).concat([1]));
    cards.push({a:"teal",h:'<div class="kicker">Our trend · DT Overall Satisfaction</div><div class="title2">Beat our best</div><div class="bars">'+
      tr.map(t=>'<div class="bar"><div class="fill" style="height:'+Math.round(t.v/mx*100)+'%"></div><div class="bv">'+fmt(t.v,0)+'</div><div class="bm">'+esc(t.m)+'</div></div>').join("")+'</div>'});
  }

  // 7c) EAD — Executed as Designed, MTD (fn v8 `ead` payload): % + rank + gap to #1,
  // the two drivers (Greeted by Name / Asked if using App), and a ranked bar graphic.
  if(d.ead&&d.ead.ead&&d.ead.ead.v!=null){
    const E=d.ead, e=E.ead;
    const tone = e.v>=75?"#46e07a":(e.v>=55?"#FFC72C":"#ff7a6b"); // July bonus tiers 55/65/75
    const mx = Math.max.apply(null, E.standings.map(s=>s.v).concat([1]));
    cards.push({a:"gold",h:'<div class="kicker">Executed as Designed · '+esc(E.month)+' — month to date</div>'+
      '<div class="huge" style="color:'+tone+'">'+fmt(e.v,1)+'<span class="of">% EAD</span></div>'+
      '<div class="sub">'+(e.rank!=null?ord(e.rank)+' of '+e.of+' reporting':'')+
        (e.gap_to_1!=null&&e.gap_to_1>0?' · '+fmt(e.gap_to_1,1)+' pts behind #1':(e.rank===1?' · leading the org':''))+
        (e.org!=null?' · org avg '+fmt(e.org,1)+'%':'')+'</div>'+
      '<div class="tiles">'+
      (E.greeted.v!=null?'<div class="tile"><div class="tlab">Greeted by name</div><div class="tval">'+fmt(E.greeted.v,1)+'<span class="u">%</span></div><div class="tgoal">'+(E.greeted.rank!=null?ord(E.greeted.rank)+'/'+E.greeted.of+' · ':'')+'org '+fmt(E.greeted.org,1)+'%</div></div>':'')+
      (E.app.v!=null?'<div class="tile"><div class="tlab">Asked if using app</div><div class="tval">'+fmt(E.app.v,1)+'<span class="u">%</span></div><div class="tgoal">'+(E.app.rank!=null?ord(E.app.rank)+'/'+E.app.of+' · ':'')+'org '+fmt(E.app.org,1)+'%</div></div>':'')+
      '</div>'+
      '<div class="board" style="max-height:32vh;font-size:2.2vh;gap:.4vh">'+
      E.standings.map((s,i)=>'<div class="row '+(s.me?"me":"")+'" style="padding:.4vh 2vw;position:relative;overflow:hidden">'+
        '<div style="position:absolute;left:0;top:0;bottom:0;width:'+Math.round(s.v/mx*100)+'%;background:rgba(255,199,44,.16)"></div>'+
        '<span class="rk">'+(i+1)+'</span><span class="nm">'+esc(s.location_name)+'</span><span class="vl">'+fmt(s.v,1)+'<span class="un">%</span></span></div>').join("")+'</div>'+
      '<div class="fine">'+(e.n!=null?'n='+e.n+' surveys · ':'')+'digital orders executed as designed · July bonus pays $20/$35/$50 at 55/65/75'+(E.no_survey_n>0?' · '+E.no_survey_n+' stores no '+esc(E.month)+' surveys yet':'')+' · SMG VOICE Digital · '+esc(E.month)+' MTD</div>'});
  }

  // 8) PRAISE quotes
  if(d.praise&&d.praise.length){
    cards.push({a:"gold",h:'<div class="kicker">Guest shout-outs · service & speed</div><div class="title2">Crew wins</div>'+
      '<div class="quotes">'+d.praise.slice(0,3).map(p=>'<div class="q">“'+esc(p.text)+'”<div class="score" style="margin-top:.4vh">'+esc(p.when)+'</div></div>').join("")+'</div>'});
  }

  // 8b) DAILY PRODUCT RANKERS — one card per product, two mini-boards (raw units | per 1,000 guests).
  // Both rankings are shown because Eddie wanted "both"; this store is highlighted in each. Data-through
  // comes from the rolling product window (PMIX feed retains ~6 days), stated in the kicker.
  const colors=["blue","teal","gold","blue"];
  (d.rankers||[]).forEach((rk,ix)=>{
    if(!rk.standings||!rk.standings.length) return;
    const byUnits=rk.standings.slice().sort((a,b)=>a.rank_units-b.rank_units);
    const byRate =rk.standings.slice().sort((a,b)=>a.rank_per1k-b.rank_per1k);
    const meTxt = rk.me
      ? (esc(d.loc)+': '+(rk.me.rank_units===1?'🏆 #1':ord(rk.me.rank_units))+' of '+rk.total+' by units ('+fmt(rk.me.units)+') · '+
         (rk.me.rank_per1k===1?'🏆 #1':ord(rk.me.rank_per1k))+' of '+rk.total+' per 1k guests ('+fmt(rk.me.per_1k,1)+')')
      : esc(d.loc)+': not selling this yet';
    const col=(rows,key,unit,dec)=>'<div class="rankcol"><div class="ch">'+(key==="units"?"Raw units":"Per 1,000 guests")+'</div>'+
      rows.map(r=>'<div class="rr '+(r.me?"me":"")+'"><span class="rk">'+(key==="units"?r.rank_units:r.rank_per1k)+'</span>'+
        '<span class="nm">'+esc(r.location_name)+'</span><span class="vl">'+(key==="units"?fmt(r.units):fmt(r.per_1k,1))+
        '<span class="un">'+unit+'</span></span></div>').join("")+'</div>';
    cards.push({a:colors[ix%colors.length],h:
      '<div class="kicker">Daily product race · '+esc(rk.label)+' · '+esc(rk.win_from||"")+'→'+esc(rk.data_through||"")+'</div>'+
      '<div class="title2">'+esc(rk.label)+' — all '+rk.total+'</div>'+
      '<div class="sub" style="font-size:3vh">'+meTxt+'</div>'+
      '<div class="rank2">'+col(byUnits,"units","",0)+col(byRate,"rate","",1)+'</div>'+
      '<div class="fine">ranked by units and by units per 1,000 guest counts · data through '+esc(rk.data_through||"")+' · all '+rk.total+' stores</div>'});
  });

  // 9..N) EDITABLE manual cards
  (d.editable||[]).forEach(c=>cards.push({a:"blue",h:'<div class="kicker">'+esc((c.section||"").toUpperCase())+'</div><div class="title2">'+esc(c.title)+'</div><div class="body">'+(c.lines||[]).map(l=>'<div class="ln">'+esc(l)+'</div>').join("")+'</div>'}));
  return cards;
}
function render(d){
  const cards=buildCards(d), stage=document.getElementById("stage");
  stage.innerHTML=cards.map(c=>'<div class="card '+c.a+'">'+c.h+'</div>').join("");
  document.getElementById("foot").textContent=esc(d.loc)+" · #"+esc(d.store)+" · Service Area"+(d.liveMtd?" · "+esc(d.liveMtd.month)+" MTD through "+esc(d.liveMtd.through||""):"")+(d.live&&d.live.date?" · live drive-thru through "+esc(d.live.date):"")+(d.mtdRace&&d.mtdRace.through?" · speed board "+esc(d.mtdRace.month)+" MTD":"")+(d.showWinner&&d.lastMonthWinner&&d.lastMonthWinner.winner_name?" · 🏆 "+esc(d.lastMonthWinner.month)+" champion: "+esc(d.lastMonthWinner.winner_name):"");
  const els=[].slice.call(document.querySelectorAll(".card")); let i=0; if(els.length) els[0].classList.add("on");
  setInterval(function(){ els[i].classList.remove("on"); i=(i+1)%els.length; els[i].classList.add("on"); },12000);
}
fetch(FN+"?t="+encodeURIComponent(qs.get("t")||"")+"&store="+encodeURIComponent(qs.get("store")||"3444"))
  .then(r=>r.json()).then(d=>{ if(!d.ok){document.body.innerHTML='<div id="err">Service screen: '+esc(d.error||"unavailable")+'. Check the link.</div>';return;} render(d); })
  .catch(e=>{document.body.innerHTML='<div id="err">Service screen offline — retrying…</div>';setTimeout(()=>location.reload(),30000);});
setTimeout(()=>location.reload(),600000); // refresh data every 10 min
</script></body></html>
