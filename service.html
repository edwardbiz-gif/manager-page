<!doctype html>
<!-- service.html v12 (2026-11-13, Eddie: "markedly improve the service and kitchen screens, make it amazing").
     Crew Service Area TV (drive thru / front counter). Point the Fire Stick at:
       https://edwardbiz-gif.github.io/manager-page/service.html?t=<service-screen token>&store=3444
     v12 is a full redesign on the shared screen kit (assets/screen-kit.css + screen-kit.js):
       * game day frame: team crest and name, live clock, the shift that is on now, progress rail,
         data-through line for the card on screen; bilingual EN/ES on every card (v11 was mostly English)
       * the speed race and its board are ONE card: giant rank, seconds needed to pass the next store,
         next OEPE goal, year to date, all 12 stores as animated bars with crests
       * NEW Guest Experience Race card: the live month to date standings of the contest behind the
         monthly champion card (satisfaction + accuracy + friendliness), with our three parts as meters
       * NEW Greeted by Name card (service-screen fn v14 `greeted`): the measure that replaced EAD,
         with the 65 / 72 / 80 goal marks. The EAD card and its July bonus line are gone with the feed.
       * latest day: tiles + where the clock ran by daypart + a 14 day OEPE line (was two cards, no trend)
       * the YTD card is folded into the race card (its R2P/KVS tiles ran on data that stops at May)
       * McDelivery shows only when its month is recent (the feed's last month is stated either way)
       * numbers refresh in place every 10 minutes; last good numbers stay up if the network drops
     Safety net: if this page fails to start, the TV falls back to service-classic.html (the v11 screen).
     Crew facing: store level only, no employee names or pay. &today=YYYY-MM-DD still tests the champion card.
     Test hooks: &src=_fx/<file>.json &card=<id> &speed=<n> &hour=<0-23> &lite=1 (see screen-kit.js). -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Area</title>
<script>
// Safety net: a script error before the first card, or nothing alive after 25 s, sends the TV to the classic screen.
var __ok = false;
function __classic() {
  if (__ok || /[?&]nf=1/.test(location.search)) return;
  location.replace("service-classic.html" + (location.search ? location.search + "&nf=1" : "?nf=1"));
}
window.onerror = function () { __classic(); };
setTimeout(__classic, 25000);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/screen-kit.css?v=1">
</head><body>
<script src="assets/screen-kit.js?v=1"></script>
<script>
(function () {
  var E = TV.esc, F = TV.fmt;
  var DP_ES = { Breakfast: "Desayuno", Lunch: "Almuerzo", Snack: "Tarde", Afternoon: "Tarde", Dinner: "Cena", Evening: "Noche", "Late Night": "Madrugada", Overnight: "Madrugada" };
  // OEPE goal tone (seconds, lower is better): Outstanding 110 / Excellent 120 / Good 130.
  function tone(v, g) { return v == null ? "" : (v <= g.oepe_o ? "good" : (v <= g.oepe_g ? "ok" : "bad")); }
  function benchText(b, unit, dec, o2) {
    if (!b) return "";
    var good = b.delta == null ? null : (b.lower_is_better ? b.delta < 0 : b.delta > 0);
    return "org " + F(b.org_avg, dec) + unit + (b.rank != null ? ' · <span class="chip' + (b.rank === 1 ? " top" : "") + '">' + TV.ord(b.rank) + " of " + b.total + "</span>" : "") +
      (b.delta && !o2 ? ' · <span class="' + (good ? "up" : "dn") + '">' + (b.delta > 0 ? "+" : "−") + F(Math.abs(b.delta), dec) + "</span>" : "");
  }

  function winnerCard(d) {
    var w = d.lastMonthWinner;
    if (!d.showWinner || !w || !w.winner_name) return null;
    var cur = TV.mon(d.currentMonth || "");
    var us = w.is_me
      ? "That is US! " + E(d.loc) + ' took the crown.<span class="es">¡Somos nosotros! ' + E(d.loc) + " se llevó la corona.</span>"
      : (w.my_rank != null
        ? E(d.loc) + " finished " + TV.ord(w.my_rank) + " of " + w.total + (w.my_blend != null ? " (" + F(w.my_blend, 1) + ")" : "") + ". Let us win " + E(cur) + '!<span class="es">Terminamos en el lugar ' + w.my_rank + " de " + w.total + ". ¡A ganar " + E(TV.mes(cur)) + "!</span>"
        : "Let us win " + E(cur) + '!<span class="es">¡A ganar ' + E(TV.mes(cur)) + "!</span>");
    return { id: "winner", dur: 16, html: '<div class="center">' +
      '<div class="eyebrow a" style="--i:0">🏆 ' + TV.bi(E(w.month) + " Guest Experience Champion", "Campeón de experiencia del cliente · " + E(TV.mes(w.month))) + "</div>" +
      '<div class="a" style="--i:1">' + TV.crest(w.winner_nsn, "win-crest") + "</div>" +
      '<div class="win-name a" style="--i:2">' + E(TV.teamName(w.winner_nsn, w.winner_name)) + "</div>" +
      (w.winner_blend != null ? '<div class="win-sub a" style="--i:3">Score ' + F(w.winner_blend, 1) + " · Satisfaction " + F(w.sat, 1) + "% · Accuracy " + F(w.accuracy, 1) + "% · Friendly " + F(w.friendliness, 1) + "%</div>" : "") +
      '<div class="win-sub a" style="--i:4">' + us + "</div></div>",
      foot: "Guest experience contest: drive thru satisfaction + accuracy + friendliness (SMG VOICE) · " + E(w.month) + " final standings · all " + w.total + " stores" };
  }

  function speedCard(d, ctx) {
    var mr = d.mtdRace, g = d.goals || {}, lm = d.liveMtd || {};
    if (!mr || mr.rank == null || !mr.standings.length) return null;
    var rows = mr.standings.map(function (r) { return { nsn: r.nsn, name: r.location_name, v: r.oepe, me: r.me }; });
    var i = rows.findIndex(function (r) { return r.me; });
    var v = mr.oepe_s, t = tone(v, g);
    var nextGoal = v == null ? null : (v > g.oepe_g ? g.oepe_g : (v > g.oepe_e ? g.oepe_e : (v > g.oepe_o ? g.oepe_o : null)));
    var month = TV.mon(mr.month);
    return { id: "speed", dur: 18, html:
      '<div class="split"><div class="col-hero">' +
        TV.head({ eb: "Drive Thru Speed Race · " + E(month), ebEs: "Carrera de velocidad · " + E(TV.mes(month)), h: "Drive thru speed", hEs: "Velocidad del drive thru" }) +
        TV.rankBlock(mr.rank, mr.total) +
        TV.coach(rows, i, { dec: 0, unitEn: "sec", unitEs: "seg", lower: true }) +
        TV.movement("oepe", mr.rank) +
        '<div class="stats a" style="--i:6">' +
          TV.stat("Our OEPE", "Nuestro OEPE", TV.cu(v, 0) + '<span class="u">s</span>', t === "ok" ? "gold" : t) +
          (nextGoal != null ? TV.stat("Next goal", "Próxima meta", nextGoal + '<span class="u">s</span>') : TV.stat("Goal", "Meta", "🏆")) +
          (d.ytd && d.ytd.oepe_s != null ? TV.stat(E(d.ytd.label), "Año a la fecha", F(d.ytd.oepe_s, 0) + '<span class="u">s</span>') : TV.stat("Days left", "Días restantes", TV.cu(ctx.daysLeft, 0))) +
        "</div>" +
      '</div><div class="col-main">' + TV.ladder(rows, { dec: 0, unit: "s" }) + "</div></div>",
      foot: "OEPE = order end to present end, parked cars excluded · " + E(month) + " through " +
        E(TV.isoLabel(mr.through)) + (lm.days ? " · " + lm.days + " days · " + TV.commas(lm.cars) + " cars" : "") + " · faster is better" };
  }

  // 14 day OEPE line with the 130 s goal marked
  function spark(tr, g) {
    if (!tr || tr.length < 3) return "";
    var W = 1000, H = 170, L = 14, R = 70, T = 34, B = 34, vals = tr.map(function (p) { return +p.v; });
    var lo = Math.min(Math.min.apply(null, vals), g.oepe_o) - 6, hi = Math.max(Math.max.apply(null, vals), g.oepe_g) + 6;
    var X = function (i) { return L + i * (W - L - R) / (tr.length - 1); }, Y = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
    var pts = tr.map(function (p, i) { return X(i).toFixed(1) + "," + Y(+p.v).toFixed(1); }).join(" "), li = tr.length - 1;
    return '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:14vh;display:block;overflow:visible">' +
      '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(g.oepe_g) + '" y2="' + Y(g.oepe_g) + '" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-dasharray="6 8"/>' +
      '<text x="' + (W - R + 8) + '" y="' + (Y(g.oepe_g) + 8) + '" font-size="24" font-weight="700" fill="#fff" fill-opacity=".75">' + g.oepe_g + "s</text>" +
      '<polyline class="ch-line" points="' + pts + '" fill="none" style="stroke:var(--accent)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<g class="ch-fade" style="--d:1.6s"><circle cx="' + X(li) + '" cy="' + Y(vals[li]) + '" r="11" fill="#FFC72C" stroke="#0a0a0a" stroke-width="3"/>' +
      '<text x="' + X(li) + '" y="' + (Y(vals[li]) - 20) + '" text-anchor="middle" font-size="34" font-weight="800" fill="#FFC72C" style="font-family:var(--disp)">' + F(vals[li], 0) + "s</text>" +
      '<text x="' + L + '" y="' + (H - 6) + '" font-size="24" font-weight="600" fill="#9ab">' + E(tr[0].d) + "</text>" +
      '<text x="' + X(li) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="24" font-weight="600" fill="#9ab">' + E(tr[li].d) + "</text></g></svg>";
  }
  function dayCard(d) {
    var lv = d.live || {}, ld = lv.day, g = d.goals || {};
    if (!ld) return null;
    var dps = lv.dayparts || [], mx = Math.max.apply(null, dps.map(function (p) { return +p.oepe_s || 0; }).concat([g.oepe_g * 1.15 || 150]));
    var when = TV.isoLabel(lv.date), t = tone(ld.oepe_s, g);
    return { id: "day", dur: 16, html:
      TV.head({ eb: "Latest full day · " + E(when), ebEs: "Último día completo · " + E(TV.mes(when)), h: "Where the clock ran", hEs: "Dónde corrió el reloj" }) +
      '<div class="split"><div class="col-hero" style="justify-content:center"><div class="tiles col">' +
        '<div class="tile a ' + (t === "ok" ? "" : t) + '" style="--i:3"><div class="tl">OEPE <span class="es">· ' + TV.commas(ld.dt_cars) + ' cars · autos</span></div><div class="tv num">' + TV.cu(ld.oepe_s, 0) + '<span class="u">s</span></div></div>' +
        '<div class="tile a" style="--i:4"><div class="tl">Parked <span class="es">· Estacionados</span></div><div class="tv num">' + TV.cu(ld.park_pct, 1) + '<span class="u">%</span></div></div>' +
        (ld.fc_r2p_s != null ? '<div class="tile a" style="--i:5"><div class="tl">Front counter <span class="es">· Mostrador</span></div><div class="tv num">' + TV.cu(ld.fc_r2p_s, 0) + '<span class="u">s</span></div></div>' : "") +
      '</div></div><div class="col-main" style="gap:2vh">' +
        (dps.length ? '<div class="panel a" style="--i:4"><div class="ptitle">OEPE by daypart <span class="es">· por turno</span> · white line = ' + g.oepe_g + 's goal · meta</div><div class="dps">' +
          dps.map(function (p, k) {
            return '<div class="dp"><span class="nm">' + E(p.daypart) + '<span class="es">' + E(DP_ES[p.daypart] || "") + '</span></span>' +
              '<span class="tr"><span class="fl ' + tone(p.oepe_s, g) + '" style="width:' + (100 * p.oepe_s / mx).toFixed(1) + "%;--i:" + k + '"></span><span class="goal" style="left:' + (100 * g.oepe_g / mx).toFixed(1) + '%"></span></span>' +
              '<span class="vl num">' + F(p.oepe_s, 0) + "s<small>" + TV.commas(p.cars) + " cars</small></span></div>";
          }).join("") + "</div></div>" : "") +
        (lv.trend && lv.trend.length >= 3 ? '<div class="panel a" style="--i:5"><div class="ptitle">Last ' + lv.trend.length + ' days <span class="es">· Últimos ' + lv.trend.length + " días</span></div>" + spark(lv.trend, g) + "</div>" : "") +
      "</div></div>",
      foot: "Drive thru on " + E(when) + " · OEPE excludes parked cars · green ≤ " + g.oepe_o + "s, gold ≤ " + g.oepe_g + "s, red above · DataPass" };
  }

  function gxCard(d, ctx) {
    var gx = d.gxRace;
    if (!gx || gx.rank == null || !gx.standings.length || gx.month !== d.currentMonth) return null; // only as a live, current month race
    var rows = gx.standings.map(function (r) { return { nsn: r.nsn, name: r.location_name, v: r.blend, me: r.me, dim: r.month && r.month !== gx.month_iso }; });
    var i = rows.findIndex(function (r) { return r.me; }), month = TV.mon(gx.month);
    var cm = function (en, es, v, k) {
      return '<div class="cm"><span class="nm">' + en + "<span>" + es + '</span></span><span class="tr"><span class="fl" style="display:block;width:' + Math.max(3, Math.min(100, v)) + "%;--i:" + k + '"></span></span><span class="vl num">' + F(v, 1) + "</span></div>";
    };
    return { id: "gx", dur: 18, html:
      '<div class="split"><div class="col-hero">' +
        TV.head({ eb: "Guest Experience Race · " + E(month), ebEs: "Carrera de experiencia · " + E(TV.mes(month)), h: "Guest experience", hEs: "Experiencia del cliente" }) +
        TV.rankBlock(gx.rank, gx.total) +
        TV.coach(rows, i, { dec: 1, unitEn: "pts", unitEs: "pts" }) +
        '<div class="comps a" style="--i:6">' +
          cm("Satisfaction", "Satisfacción", gx.sat, 0) + cm("Accuracy", "Exactitud", gx.accuracy, 1) + cm("Friendly", "Amabilidad", gx.friendliness, 2) +
        "</div>" +
      '</div><div class="col-main">' + TV.ladder(rows, { dec: 1 }) + "</div></div>",
      foot: "Average of satisfaction, accuracy and friendliness (SMG VOICE) · " + E(month) +
        " month to date · champion announced on the 1st · " + ctx.daysLeft + " days left" };
  }

  function greetedCard(d) {
    var G = d.greeted;
    if (!G || G.v == null || !G.standings || !G.standings.length) return null;
    var rows = G.standings.map(function (r) { return { nsn: r.nsn, name: r.location_name, v: r.v, me: r.me }; });
    var tiers = G.tiers || [65, 72, 80], next = null, month = TV.mon(G.month);
    var pos = function (v) { return Math.max(2, Math.min(100, (v - 40) / 60 * 100)).toFixed(1); }; // track runs 40% to 100%
    tiers.forEach(function (t) { if (next == null && G.v < t) next = t; });
    var coach = next == null
      ? '<div class="coach win a" style="--i:5"><div class="en">Top goal reached. Hold it!</div><div class="es">Meta máxima lograda. ¡A mantenerla!</div></div>'
      : '<div class="coach a" style="--i:5"><div class="en">' + F(next - G.v, 1) + " pts to the " + next + '% goal</div><div class="es">A ' + F(next - G.v, 1) + " pts de la meta de " + next + "%</div></div>";
    return { id: "greeted", dur: 18, html:
      '<div class="split"><div class="col-hero">' +
        TV.head({ eb: "Greeted by Name · " + E(month), ebEs: "Saludo por nombre · " + E(TV.mes(month)), h: "Use their name", hEs: "Usa su nombre" }) +
        '<div class="bigval a num" style="--i:3">' + TV.cu(G.v, 1) + '<span class="u">%</span></div>' +
        '<div class="msg a" style="--i:4;font-size:3.6vh">' + (G.rank === 1 ? "🏆 #1 of " + G.of : TV.ord(G.rank) + " of " + G.of) + (G.org != null ? " · org " + F(G.org, 1) + "%" : "") + "</div>" +
        '<div class="tiers a" style="--i:4"><span class="fl" style="width:' + pos(G.v) + '%"></span>' +
          tiers.map(function (t) { return '<span class="tk" style="left:' + pos(t) + '%"></span><span class="tkl' + (G.v >= t ? " hit" : "") + '" style="left:' + pos(t) + '%">' + t + "</span>"; }).join("") + "</div>" +
        coach +
      '</div><div class="col-main">' + TV.ladder(rows, { dec: 1, unit: "%" }) + "</div></div>",
      foot: "Digital order guests who say we greeted them by name (SMG VOICE) · " + E(month) + " month to date" +
        (G.n != null ? " · " + G.n + " surveys" : "") + " · gold marks = goals " + tiers.join(" / ") };
  }

  function voiceCard(d) {
    var v = d.voice || {}, o = v.dt_osat;
    if (!o || o.score == null) return null;
    var tr = o.trend || [], vals = tr.map(function (t) { return +t.v; });
    var curMo = new Date().toLocaleString("en-CA", { timeZone: "America/Chicago" }).slice(0, 7);
    var mtd = !!(o.month && String(o.month).slice(0, 7) === curMo), msg = "";
    if (tr.length >= 2) {
      var best = Math.max.apply(null, vals), bi = vals.lastIndexOf(best), li = tr.length - 1, gap = Math.round((best - vals[li]) * 10) / 10;
      msg = bi === li
        ? "Best month yet: <b>" + F(best, 1) + '%</b><span class="es">Nuestro mejor mes: ' + F(best, 1) + "%</span>"
        : "<b>" + F(gap, 1) + " pts</b> to beat " + E(tr[bi].m) + " (" + F(best, 1) + '%)<span class="es">A ' + F(gap, 1) + " pts de " + E(TV.mes(tr[bi].m)) + " (" + F(best, 1) + "%)</span>";
    }
    var tile = function (en, es, m, k, lowerGood) {
      if (!m || m.score == null) return "";
      return '<div class="tile a" style="--i:' + k + '"><div class="tl">' + TV.bi(en, es) + '</div><div class="row"><div class="tv num">' + TV.cu(m.score, 1) + '<span class="u">%</span></div>' +
        '<div class="tb">' + benchText(m.bench, "%", 1, true) + (lowerGood ? " · lower is better" : "") + "</div></div></div>";
    };
    return { id: "voice", dur: 17, html:
      '<div class="split"><div class="col-hero">' +
        TV.head({ eb: "Guest voice · drive thru", ebEs: "Voz del cliente", h: "Beat our best", hEs: "A superar nuestro mejor mes" }) +
        (msg ? '<div class="msg a" style="--i:2">' + msg + "</div>" : "") +
        '<div class="tiles col sm" style="margin-top:auto">' +
          tile("Satisfaction", "Satisfacción", o, 3) + tile("Unhappy guests", "Clientes insatisfechos", v.dt_b2b, 4, true) + tile("Called us fast", "Nos llaman rápidos", v.fast, 5) +
        "</div></div>" +
        '<div class="col-main">' + (tr.length >= 2 ? TV.lineChart(tr, { dec: 1, W: 1150, H: 700, lastNote: mtd ? "(so far)" : "" }) : "") + "</div></div>",
      foot: "Drive thru satisfaction by month, top box % (SMG VOICE" + (mtd ? "; this month is month to date" : "") + ")" +
        (o.ytd != null ? " · year to date " + F(o.ytd, 1) + "%" : "") };
  }

  function rankerCard(rk, d) {
    if (!rk.standings || !rk.standings.length) return null;
    var byU = rk.standings.slice().sort(function (a, b) { return a.rank_units - b.rank_units; })
      .map(function (r) { return { nsn: r.nsn, name: r.location_name, v: r.units, me: r.me, rk: r.rank_units }; });
    var byR = rk.standings.slice().sort(function (a, b) { return a.rank_per1k - b.rank_per1k; })
      .map(function (r) { return { nsn: r.nsn, name: r.location_name, v: r.per_1k, me: r.me, rk: r.rank_per1k }; });
    var me = rk.me, pos = function (n) { return n === 1 ? "🏆 #1" : TV.ord(n); };
    return { id: "rank-" + rk.lto_key, dur: 17, html:
      '<div class="split"><div class="col-hero" style="flex-basis:27%">' +
        TV.head({ eb: "Product race · last 7 days", ebEs: "Carrera de producto", h: E(rk.label), hEs: "" }) +
        (me ? '<div class="stats a" style="--i:3;margin-top:2vh;flex-direction:column;gap:2.4vh">' +
          TV.stat("By units", "Por unidades", pos(me.rank_units) + '<span class="u">of ' + rk.total + " · " + TV.commas(me.units) + "</span>", me.rank_units === 1 ? "gold" : "") +
          TV.stat("Per 1,000 guests", "Por 1,000 clientes", pos(me.rank_per1k) + '<span class="u">of ' + rk.total + " · " + F(me.per_1k, 1) + "</span>", me.rank_per1k === 1 ? "gold" : "") + "</div>"
          : '<div class="msg a" style="--i:3">' + E(d.loc) + ' is not selling this yet<span class="es">Aún no lo vendemos</span></div>') +
      '</div><div class="col-main"><div class="duo">' +
        '<div><div class="lcap">Units sold <span class="es">· Unidades</span></div>' + TV.ladder(byU, { dec: 0, compact: true }) + "</div>" +
        '<div><div class="lcap">Per 1,000 guests <span class="es">· Por 1,000 clientes</span></div>' + TV.ladder(byR, { dec: 1, compact: true }) + "</div>" +
      "</div></div></div>",
      foot: E(rk.label) + " sold " + E(TV.isoLabel(rk.win_from)) + " to " + E(TV.isoLabel(rk.data_through)) + " · by units and per 1,000 guests · all " + rk.total + " stores · DataPass" };
  }

  function deliveryCard(d) {
    var dl = d.delivery;
    if (!dl || !dl.period_month) return null;
    if ((Date.now() - new Date(dl.period_month + "T12:00:00Z").getTime()) / 864e5 > 75) return null; // an old month is not news
    var b = dl.bench || {};
    return { id: "delivery", dur: 13, html:
      TV.head({ eb: "McDelivery · " + E(dl.month), ebEs: "Entregas · " + E(TV.mes(dl.month)), h: "Delivery guests", hEs: "Clientes de entrega" }) +
      '<div class="grow"><div class="tiles">' +
        '<div class="tile a" style="--i:3"><div class="tl">Guest rating <span class="es">· Calificación</span></div><div class="tv num">' + TV.cu(dl.csat, 1) + '<span class="u">★</span></div><div class="tb">' + benchText(b.csat, "★", 1) + "</div></div>" +
        '<div class="tile a" style="--i:4"><div class="tl">Restaurant time <span class="es">· Tiempo en restaurante</span></div><div class="tv num">' + TV.cu(dl.restaurant_time_min, 1) + '<span class="u">min</span></div><div class="tb">' + benchText(b.restaurant_time, " min", 1) + "</div></div>" +
      "</div></div>",
      foot: "McDelivery guest rating and our part of the trip (order ready time) · " + E(dl.month) + " · all 12 stores" };
  }
