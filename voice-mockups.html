const fmt=v=>v==null?"—":(Math.round(v*10)/10);
const lab=k=>DATA.labels[k]||k;
function dArrow(d){ if(d==null)return '<span class="delta flat">·</span>';
 if(d>0)return '<span class="delta up">▲'+fmt(d)+'</span>'; if(d<0)return '<span class="delta dn">▼'+fmt(Math.abs(d))+'</span>';
 return '<span class="delta flat">0</span>'; }
// color vs BU (polarity aware): green good, red bad, scaled by gap
function vsBU(c){ if(c.june==null||c.bu==null) return ["#2a2f38","#cbd5e1"];
 let good = c.lower_better ? (c.june<=c.bu) : (c.june>=c.bu);
 let gap = Math.abs(c.june-c.bu);
 let strong = gap>=5;
 if(good) return [strong?"#14532d":"#1f5132", "#d1fae5"];
 return [strong?"#7f1d1d":"#7a2e2e", "#fee2e2"]; }
function rankBadge(c){ if(!c.rank) return "";
 let top = c.rank<=3, bot=c.rank> (c.rank_of-3);
 let col = top?"#16a34a":(bot?"#dc2626":"#9aa3af");
 return '<span class="rank" style="color:'+col+'">#'+c.rank+'/'+c.rank_of+'</span>'; }
// SVG line graph: series [{p,v}], plus BU dashed line
function graph(series, bu, lowerBetter){
 if(!series||series.length<2) return '<div class="legend">Not enough history to graph.</div>';
 const W=420,H=96,pad=6;
 const vals=series.map(d=>d.v).concat(bu!=null?[bu]:[]);
 let mn=Math.min(...vals), mx=Math.max(...vals); if(mx-mn<4){mx+=2;mn-=2;}
 const x=i=>pad+i*(W-2*pad)/(series.length-1);
 const y=v=>H-pad-(v-mn)/(mx-mn)*(H-2*pad);
 const pts=series.map((d,i)=>x(i)+","+y(d.v).toFixed(1)).join(" ");
 const last=series[series.length-1];
 let buline = bu!=null ? '<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+y(bu).toFixed(1)+'" y2="'+y(bu).toFixed(1)+'" stroke="#fbbf24" stroke-dasharray="4 3" stroke-width="1"/>'
   +'<text x="'+(W-pad)+'" y="'+(y(bu)-3).toFixed(1)+'" fill="#fbbf24" font-size="9" text-anchor="end">BU '+fmt(bu)+'</text>' : "";
 const lastGood = lowerBetter ? (last.v<=(bu??last.v)) : (last.v>=(bu??last.v));
 const stroke = lastGood ? "#34d399" : "#f87171";
 const labels = series.map((d,i)=> (i%2===0)?'<text x="'+x(i).toFixed(1)+'" y="'+(H-1)+'" fill="#5b626c" font-size="8" text-anchor="middle">'+d.p+'</text>':'').join("");
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+buline+
  '<polyline points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="2"/>'+
  '<circle cx="'+x(series.length-1).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="3.2" fill="'+stroke+'"/>'+labels+'</svg>';
}
function mrow(c){
 const [bg,fg]=vsBU(c);
 return '<div class="mrow"><span class="mlabel">'+c.label+'</span>'+
   '<span class="score" style="background:'+bg+';color:'+fg+'">'+fmt(c.june)+'</span>'+
   '<span class="meta">'+dArrow(c.delta)+'<br>BU '+fmt(c.bu)+' '+rankBadge(c)+'</span></div>';
}
function section(title, keys, cells){
 return '<div class="gtitle">'+title+'</div><div class="card">'+keys.map(k=>mrow(cells[k])).join("")+'</div>';
}
function render(e){
 const o=e.cells["Overall Satisfaction"];
 let h='';
 // OSAT graph
 h+='<div class="gtitle">OSAT trend</div><div class="card"><div class="ghead">'+
   '<span class="big">'+fmt(o.june)+'</span><span class="u">% OSAT · June MTD</span> '+dArrow(o.delta)+' '+rankBadge(o)+'</div>'+
   graph(e.hist_osat, e.cells["Overall Satisfaction"].bu, false)+'</div>';
 // critical metric graph
 if(e.watch){ const w=e.cells[e.watch];
  h+='<div class="gtitle">Critical metric — '+lab(e.watch)+'</div><div class="card">'+
    '<div class="watch">👁 <b>Watch:</b> '+lab(e.watch)+' '+fmt(w.june)+' '+dArrow(w.delta)+' · '+
    (e.watch_reason==="worsening"?"worst movement vs May":"furthest below BU")+'</div>'+
    graph(e.hist_watch, w.bu, w.lower_better)+'</div>';
 }
 h+=section("OSAT numbers", DATA.groups.osat, e.cells);
 h+=section("QSC", DATA.groups.rest, e.cells);
 h+=section("B2B numbers (lower = better)", DATA.groups.b2b, e.cells);
 return h;
}
const pk=document.getElementById("picker");
DATA.entities.forEach((e,i)=>{const b=document.createElement("button");b.className="pick";
 b.textContent=e.name.replace(" (Combined)","");b.onclick=()=>show(i);pk.appendChild(b);});
function show(i){document.querySelectorAll(".pick").forEach((p,j)=>p.classList.toggle("on",j===i));
 document.getElementById("stage").innerHTML=render(DATA.entities[i]);}
show(0);
</script></body></html>
