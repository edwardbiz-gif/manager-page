<script>
// ============================================================================
// LIVE DATA WIRING — read-only GET against the existing production Edge Function
// ============================================================================
var ENDPOINT = "https://nnsuyrhubsidwmrrsumm.supabase.co/functions/v1/manager-page";
// Capability token override via ?t= on THIS page; defaults to the Boulder Hill GM token.
var qp = new URLSearchParams(location.search);
var TOKEN = qp.get('t') || "0R03iGRi8nNwleEO_TQXdDTRufsc23hI";
var SHELL_VERSION = "slice-1";

// ---- tiny render helpers (escape, money, pct, dates) ----
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){if(n==null||isNaN(n))return '—';var a=Math.abs(n);if(a>=1e6)return '$'+(n/1e6).toFixed(2)+'M';if(a>=1e3)return '$'+Math.round(n/1e3)+'K';return '$'+Math.round(n).toLocaleString();}
function moneyFull(n){return n==null||isNaN(n)?'—':'$'+Math.round(n).toLocaleString();}
function pct(n,d){if(n==null||isNaN(n))return '—';return (n>0?'+':'')+Number(n).toFixed(d==null?1:d)+'%';}
function fmtDate(s){if(!s)return '';var d=new Date(s);if(isNaN(d))return esc(s);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function daysUntil(s){if(!s)return null;var d=new Date(s);if(isNaN(d))return null;return Math.round((d-new Date())/86400000);}
function sectWrap(fn){try{return fn();}catch(e){console.error('sect error',e);return '<div class="nodata">Couldn’t render this section ('+esc(e.message)+').</div>';}}

// sparkline from numeric series (token-themed, zero KB)
function sparkline(vals,color){
  if(!vals||!vals.length) return '';
  var w=62,h=28,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
  var pts=vals.map(function(v,i){var x=(i/(vals.length-1||1))*w;var y=h-2-((v-mn)/rng)*(h-4);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}

// ---- the main render: maps the LIVE payload into the Field-First GM home ----
function renderBoard(d){
  var m = d.manager||{};
  var store = (d.sales_summary&&d.sales_summary[0]&&d.sales_summary[0].store_name) || 'your store';
  var nsn = (d.datapass_labor&&d.datapass_labor.selected_nsn) || (d.service_times&&d.service_times.selected_nsn) || '';
  document.getElementById('who-name').textContent = 'Hi, '+((m.first_name)||'GM');
  document.getElementById('who-sub').textContent = (m.role||'GM')+' · '+store+(nsn?' #'+nsn:'');
  var vs=document.getElementById('vstamp'); vs.textContent='api '+(d.fn_version||'?')+' · LIVE'; vs.classList.add('live');

  // ---------- build the priority stack from REAL data (advisory scoring, plan-spec §7.5 lite) ----------
  var cards=[];

  // (1) open complaints needing response -> Urgent
  var comps = (d.complaints||[]).filter(function(c){return c.task_status!=='closed' && c.task_status!=='done';});
  comps.forEach(function(c){
    var age = c.received_at? Math.max(0,Math.round((new Date()-new Date(c.received_at))/86400000)) : null;
    cards.push({sev:1,label:'Urgent',
      h:'Open complaint — '+esc(c.issue_reason||c.issue_category||'guest issue'),
      why:'Case <b>#'+esc(c.case_number)+'</b> · '+esc(c.issue_category||'')+(age!=null?' · received <b>'+age+'d</b> ago':'')+(c.recovery_needed?' · recovery needed':''),
      spark:'<svg class="spark" viewBox="0 0 62 28" preserveAspectRatio="none"><polyline points="0,8 12,10 24,7 36,14 48,20 62,24" fill="none" stroke="var(--bad)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>',
      acts:['Draft reply','Resolve']});
  });

  // (2) urgent / overdue tasks
  (d.tasks||[]).forEach(function(t){
    if(t.status==='done'||t.status==='closed') return;
    var du = daysUntil(t.due_at);
    var overdue = du!=null && du<0;
    var urgent = t.priority==='urgent';
    var hi = t.priority==='high';
    if(!(overdue||urgent||hi)) return; // only surface what needs the GM
    var sev = (overdue||urgent)?1:2;
    cards.push({sev:sev,label:overdue?'Overdue':(urgent?'Urgent':'High'),
      h:esc(t.title),
      why:(t.category?'<b>'+esc(t.category)+'</b> · ':'')+(t.due_at?(overdue?'overdue by <b>'+Math.abs(du)+'d</b>':'due in <b>'+du+'d</b> ('+fmtDate(t.due_at)+')'):'no due date')+(t.priority?' · '+esc(t.priority)+' priority':''),
      acts:['Open task','Mark done']});
  });

  // (3) OSAT miss vs Business Unit (voice) -> Watch, with honest n<30 handling.
  //     Shape: voice_trend.entities[i].cells[<metric>] = {june,delta,n,bu,lower_better,rank,rank_of}
  var vt=d.voice_trend;
  var myEnt = vt && Array.isArray(vt.entities) && vt.entities.length ? vt.entities[0] : null;
  if(myEnt && myEnt.cells){
    var osat = myEnt.cells['Overall Satisfaction'];
    if(osat && osat.june!=null){
      var n = osat.n||0;
      if(n>0 && n<30){
        cards.push({sev:3,label:'FYI',h:'OSAT — not enough data yet',
          why:'Only <b>n='+n+'</b> VOICE responses this period (need ≥30). No verdict until the sample is reliable.',
          nodata:'No fabricated red — re-checks as the sample grows.'});
      } else if(osat.bu!=null && osat.june < osat.bu){
        cards.push({sev:2,label:'Watch',h:'OSAT below Business Unit',
          why:'Overall Satisfaction <b>'+osat.june.toFixed(1)+'%</b> vs BU <b>'+osat.bu.toFixed(1)+'%</b> ('+(osat.june-osat.bu).toFixed(1)+' pts)'+(osat.rank?' · rank #'+osat.rank+'/'+osat.rank_of:'')+(n?' · n='+n:''),
          acts:['See VOICE','Acknowledge']});
      }
    }
  }

  // (4) guest items needing response (customer feedback)
  var cf=d.customer_feedback;
  if(cf && cf.summary && cf.summary.needs_response>0){
    cards.push({sev:2,label:'Watch',h:cf.summary.needs_response+' guest item'+(cf.summary.needs_response>1?'s':'')+' need a response',
      why:'Last 30d: <b>'+cf.summary.last30_total+'</b> total · <b>'+cf.summary.last30_negative+'</b> negative · avg rating <b>'+(cf.summary.avg_rating_30||0).toFixed(2)+'</b>'+(cf.data_through?' · thru '+esc(cf.data_through):''),
      acts:['Open feedback','Acknowledge']});
  }

  // (5) new-hire training past deadline (only when hire dates drive a real deadline)
  var nh=d.newHireTraining;
  if(nh && nh.summary){
    if(nh.summary.overdue>0){
      cards.push({sev:2,label:'Watch',h:nh.summary.overdue+' new hire(s) past training deadline',
        why:'<b>'+nh.summary.overdue+'</b> overdue · <b>'+(nh.summary.due_soon||0)+'</b> due soon · hire+14d PBS deadline · thru '+esc(nh.data_through||''),
        acts:['See courses','Mark done']});
    }
  }

  // sort severity then keep top 7
  cards.sort(function(a,b){return a.sev-b.sev;});
  var shown = cards.slice(0,7);
  var activeCount = shown.filter(function(c){return !c.nodata;}).length;

  // ---------- chips (real counts) ----------
  var tlist=(d.tasks||[]).filter(function(t){return t.status!=='done'&&t.status!=='closed';});
  var overdueN = tlist.filter(function(t){var du=daysUntil(t.due_at);return du!=null&&du<0;}).length;
  var soonN = tlist.filter(function(t){var du=daysUntil(t.due_at);return du!=null&&du>=0&&du<=7;}).length;
  var hiN = tlist.filter(function(t){return t.priority==='high'||t.priority==='urgent';}).length;

  // ---------- pins (cleanliness race + OSAT incentive) ----------
  function myRow(arr,id){return (arr||[]).filter(function(s){return s.store_id===id;})[0];}
  var myId = m && m.role==='GM' ? (d.sales_summary&&d.sales_summary[0]&&d.sales_summary[0].store_id) : null;
  var pinsHtml = sectWrap(function(){
    var h='';
    var cr=d.cleanliness_race;
    if(cr && cr.standings){
      var mine=myRow(cr.standings, myId)|| (cr.your_store_ids&&myRow(cr.standings,cr.your_store_ids[0]));
      h+='<div class="pin gold"><div class="pt">🏆 '+esc(cr.title||'Cleanliness race')+'</div>'
        +'<div class="pv">'+(mine?('#'+mine.rank+' of '+cr.standings.length):'—')+'</div>'
        +'<div class="pn">'+(mine?(mine.score!=null?mine.score.toFixed(1)+'% · ':'')+'thru '+esc(cr.data_through||''):esc(cr.note||''))+'</div></div>';
    }
    var oi=d.osat_incentive;
    if(oi && oi.standings){
      var minО=myRow(oi.standings, myId)||(oi.your_store_ids&&myRow(oi.standings,oi.your_store_ids[0]));
      var inMoney=minО&&minО.in_money;
      h+='<div class="pin'+(inMoney?' win':'')+'"><div class="pt">🎯 '+esc(oi.title||'OSAT incentive')+'</div>'
        +'<div class="pv">'+(minО?minО.score.toFixed(1)+'%':'—')+' <span style="font-size:11px;color:var(--'+(inMoney?'good':'unfav')+')">'+(inMoney?'✓ in money':'below '+(oi.threshold||72)+'%')+'</span></div>'
        +'<div class="pn">'+esc(oi.amount||'')+' · thru '+esc(oi.data_through||'')+'</div></div>';
    }
    return h||'<div class="nodata">No active contests in the live payload.</div>';
  });

  // ---------- priority stack html ----------
  var feedHtml = shown.map(function(c){
    var acts = c.acts? '<div class="acts">'+c.acts.map(function(a,i){return '<button class="btn '+(i===0?'primary':'ghost')+'" onclick="resolveCard(this)">'+esc(a)+'</button>';}).join('')+'</div><div class="donetag">✓ Done — verdict updated</div>':'';
    var nd = c.nodata? '<div class="nodata">'+esc(c.nodata)+'</div>':'';
    return '<article class="story s'+c.sev+'"><div class="top"><span class="sev-badge">'+esc(c.label)+'</span>'
      +'<div class="hl"><h3>'+c.h+'</h3><p class="why">'+c.why+'</p></div>'+(c.spark||'')+'</div>'+acts+nd+'</article>';
  }).join('') || '<div class="nodata">Nothing needs you right now — all clear.</div>';

  // ---------- glance tiles (real) ----------
  var sc=d.sales_comps, ss=(d.sales_summary&&d.sales_summary[0])||{};
  var laborTile=(d.datapass_labor&&d.datapass_labor.tiles&&d.datapass_labor.tiles[0])||null;
  var voiceOsat = (myEnt&&myEnt.cells&&myEnt.cells['Overall Satisfaction'])||null;
  var glanceHtml = sectWrap(function(){
    var sYoY = sc&&sc.mtd? sc.mtd.sales_yoy : ss.mtd_yoy_pct;
    var sVal = sc&&sc.mtd? sc.mtd.sales : ss.mtd_product_sales;
    var gcYoY = sc&&sc.mtd? sc.mtd.gc_yoy : ss.mtd_gc_yoy_pct;
    var laborPct = laborTile? laborTile.total_labor_pct : null;
    var laborTarget = laborTile? laborTile.target_pct : null;
    var t1='<div class="gtile"><div class="gl">Sales MTD · YoY</div>'
      +'<div class="gv" style="color:var(--'+(sYoY>=0?'fav':'unfav')+')">'+pct(sYoY)+'</div>'
      +'<div class="gd '+(sYoY>=0?'up':'down')+'">'+(sYoY>=0?'▲':'▼')+' '+moneyFull(sVal)+' · GC '+pct(gcYoY)+'</div>'
      +'<div class="gsub">'+(ss.mtd_days_loaded||'')+' days loaded · thru '+fmtDate(ss.mtd_last_day)+'</div></div>';
    var oN = voiceOsat&&voiceOsat.n;
    var t2='<div class="gtile"><div class="gl">OSAT</div>'
      +'<div class="gv">'+(voiceOsat&&voiceOsat.june!=null?voiceOsat.june.toFixed(1)+'%':'—')+'</div>'
      +'<div class="gd '+(voiceOsat&&voiceOsat.rank&&voiceOsat.rank<=6?'up':'down')+'">'+(voiceOsat&&voiceOsat.rank?'rank #'+voiceOsat.rank+'/'+voiceOsat.rank_of:'')+(voiceOsat&&voiceOsat.bu!=null?' · vs BU '+voiceOsat.bu.toFixed(1)+'%':'')+'</div>'
      +'<div class="gsub">'+(oN?'n='+oN+(oN<30?' · small sample*':''):'')+' · '+esc((vt&&vt.data_through)||'')+'</div></div>';
    var overTarget = laborTarget!=null && laborPct!=null ? laborPct-laborTarget : null;
    var t3='<div class="gtile"><div class="gl">Labor % (DataPass)</div>'
      +'<div class="gv" style="color:var(--'+(overTarget!=null?(overTarget>0?'unfav':'fav'):'ink')+')">'+(laborPct!=null?laborPct.toFixed(1)+'%':'—')+'</div>'
      +'<div class="gd '+(overTarget>0?'down':'up')+'">'+(laborTarget!=null?(overTarget>0?'▲ +'+overTarget.toFixed(1)+' over '+laborTarget+'%':'on target'):'no target set')+'</div>'
      +'<div class="gsub">'+(laborTile?'closed '+fmtDate(laborTile.labor_date):'')+' · single-day basis</div></div>';
    var cf2=d.customer_feedback&&d.customer_feedback.summary;
    var t4='<div class="gtile"><div class="gl">Open guest items</div>'
      +'<div class="gv" style="color:var(--'+(cf2&&cf2.needs_response>0?'unfav':'fav')+')">'+(cf2?cf2.needs_response:'—')+'</div>'
      +'<div class="gd '+(cf2&&cf2.needs_response>0?'down':'up')+'">'+(cf2?(cf2.needs_response>0?'need response now':'all answered'):'')+'</div>'
      +'<div class="gsub">'+(cf2?'last 30d: '+cf2.last30_total+' total · '+cf2.last30_negative+' negative':'')+'</div></div>';
    return t1+t2+t3+t4;
  });

  // ---------- modules (collapsed previews) ----------
  // Sales weekly trend from real daily series (aggregate to ISO-ish weekly buckets isn't needed for a sparkline)
  var salesModule = sectWrap(function(){
    var series=(sc&&sc.series)||[];
    var vals=series.map(function(r){return r.sales;});
    var w=348,h=90,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
    var pts=vals.map(function(v,i){var x=(i/(vals.length-1||1))*w;var y=h-4-((v-mn)/rng)*(h-12);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
    var last=series[series.length-1]||{};
    return '<details class="mod"><summary><span class="mi">📈</span>'
      +'<span class="mt"><b>Sales — daily MTD</b><span>live ledger · thru '+esc((sc&&sc.data_through)||'')+'</span></span>'
      +'<span class="ct">'+pct(sc&&sc.mtd&&sc.mtd.sales_yoy)+' YoY</span><span class="chev">›</span></summary>'
      +'<div class="body"><svg viewBox="0 0 '+w+' '+h+'" width="100%" height="92" preserveAspectRatio="none" aria-label="Daily sales MTD">'
      +'<polyline points="'+pts+'" fill="none" stroke="var(--mcd-green)" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>'
      +'<div class="cap">Daily product sales, '+series.length+' days this month. Latest '+fmtDate(last.date)+': '+moneyFull(last.sales)+' ('+pct(last.sales_yoy)+' YoY).</div>'
      +'<div class="kv"><span class="k">MTD product sales</span><span class="v">'+moneyFull(sc&&sc.mtd&&sc.mtd.sales)+'</span></div>'
      +'<div class="kv"><span class="k">MTD sales YoY</span><span class="v '+((sc&&sc.mtd&&sc.mtd.sales_yoy)>=0?'up':'down')+'">'+pct(sc&&sc.mtd&&sc.mtd.sales_yoy)+'</span></div>'
      +'<div class="kv"><span class="k">MTD guest counts YoY</span><span class="v '+((sc&&sc.mtd&&sc.mtd.gc_yoy)>=0?'up':'down')+'">'+pct(sc&&sc.mtd&&sc.mtd.gc_yoy)+'</span></div>'
      +'<div class="kv"><span class="k">Avg check</span><span class="v">$'+(ss.mtd_avg_check||0).toFixed(2)+'</span></div></div></details>';
  });

  var voiceModule = sectWrap(function(){
    if(!myEnt||!myEnt.cells) return '';
    var cells=myEnt.cells;
    function row(name){var x=cells[name];if(!x||x.june==null)return '';var lb=!!x.lower_better;
      var good = x.bu==null?true:(lb? x.june<=x.bu : x.june>=x.bu);
      var isB2B = name.indexOf('B2B')>=0;
      return '<div class="kv"><span class="k">'+esc(x.label||name)+(x.n&&x.n<30?' *':'')+'</span>'
        +'<span class="v '+(good?'up':'down')+'">'+x.june.toFixed(1)+(isB2B?'':'%')+' '+(good?'▲':'▼')+'</span></div>';}
    var osat=cells['Overall Satisfaction'];
    return '<details class="mod"><summary><span class="mi">⭐</span>'
      +'<span class="mt"><b>VOICE</b><span>vs BU CHICAGO-MOCNI · '+esc(vt.data_through||'')+'</span></span>'
      +'<span class="ct">OSAT '+(osat?osat.june.toFixed(1)+'%':'—')+'</span><span class="chev">›</span></summary>'
      +'<div class="body">'+row('Overall Satisfaction')+row('Accuracy')+row('Overall Quality')+row('Fast')+row('Fast B2B')
      +'<div class="cap">vs Business Unit benchmark · * = n&lt;30 small sample · polarity-aware. Live from voice_scores.</div></div></details>';
  });

  var trainModule = sectWrap(function(){
    if(!nh||!nh.summary) return '';
    var s=nh.summary;
    return '<details class="mod"><summary><span class="mi">🎓</span>'
      +'<span class="mt"><b>New-hire training</b><span>'+esc(nh.tracked_note||'')+'</span></span>'
      +'<span class="ct">refreshed '+fmtDate(nh.refreshed_at)+'</span><span class="chev">›</span></summary>'
      +'<div class="body"><div class="kv"><span class="k">Employees tracked</span><span class="v">'+s.employees+'</span></div>'
      +'<div class="kv"><span class="k">New hires (in window)</span><span class="v">'+s.new_hires+'</span></div>'
      +'<div class="kv"><span class="k">Overdue</span><span class="v '+(s.overdue>0?'down':'up')+'">'+s.overdue+'</span></div>'
      +'<div class="kv"><span class="k">Due soon</span><span class="v">'+s.due_soon+'</span></div>'
      +'<div class="kv"><span class="k">Complete</span><span class="v up">'+s.complete+'</span></div>'
      +'<div class="cap">'+(nh.hire_dates_loaded?'':'Hire dates not yet loaded — deadlines pending. ')+'Names First-L only (PII gating) · deadline = hire+14d (PBS).</div></div></details>';
  });

  // P&L + invoices: NOT in the GM token payload -> honest labelled placeholders (Narrative graft)
  var pnlPlaceholder = '<details class="mod"><summary><span class="mi">💵</span>'
    +'<span class="mt"><b>P&amp;L up to PAC <span class="tag-ph">placeholder</span></b><span>not in the GM API response</span></span>'
    +'<span class="ct">owner/sup tier</span><span class="chev">›</span></summary>'
    +'<div class="body"><div class="nodata">v_r365_pnl_ytd_store is gated to owner/supervisor tokens in the current Edge Fn (v88). '
    +'Per plan-spec §6, the GM home would read the precomputed _pct columns once exposed — never recomputed client-side. No fabricated PAC shown.</div></div></details>';
  var invPlaceholder = '<details class="mod"><summary><span class="mi">🧾</span>'
    +'<span class="mt"><b>MTD invoices <span class="tag-ph">placeholder</span></b><span>not in the GM API response</span></span>'
    +'<span class="ct">v_invoice_tracker_mtd</span><span class="chev">›</span></summary>'
    +'<div class="body"><div class="nodata">Invoice tracker (posted vs in-flight) is not in this token’s payload. Labelled placeholder — wires in once the v2 Edge Fn exposes it to the GM scope.</div></div></details>';

  // ---------- assemble ----------
  var verdictTint = activeCount===0?'clear':'';
  var html =
   '<div class="desk-grid"><div class="col-feed">'
   +'<section class="verdict '+verdictTint+'" id="verdict"><div class="eyebrow">Your store today</div>'
   +'<div class="bignum">'+(activeCount===0?'<em>All clear</em> — nothing needs you':'<em id="vcount">'+activeCount+'</em> thing'+(activeCount===1?'':'s')+' need you today')+'</div>'
   +'<div class="sub">'+(activeCount===0?'Nice work. New items surface here as they come in.':'Live priority feed below, scored from tasks, complaints, guest feedback and VOICE.')+'</div>'
   +'<div class="thru"><span class="pulse-dot"></span> Data through '+fmtDate((sc&&sc.data_through))+', 2026 · LIVE</div></section>'
   +'<div class="pins" aria-label="Pinned contests">'+pinsHtml+'</div>'
   +'<div class="shead"><h2>What needs you</h2><span class="h-meta">scored · '+activeCount+' active</span></div>'
   +'<div class="chips"><span class="chip alert">Overdue <b>'+overdueN+'</b></span><span class="chip warn">Due ≤7d <b>'+soonN+'</b></span>'
   +'<span class="chip">Hi-pri <b>'+hiN+'</b></span><span class="chip">Active tasks <b>'+tlist.length+'</b></span></div>'
   +'<div class="feed" id="feed">'+feedHtml+'</div></div>'
   +'<div class="col-detail">'
   +'<div class="shead"><h2>Today at a glance</h2><span class="h-meta">MTD thru '+fmtDate(ss.mtd_last_day)+'</span></div>'
   +'<div class="glance">'+glanceHtml+'</div>'
   +'<div class="shead"><h2>More for your store</h2><span class="h-meta">tap to expand · live</span></div>'
   +'<div class="modules">'+salesModule+pnlPlaceholder+trainModule+voiceModule+invPlaceholder+'</div>'
   +'<div class="intake"><b>Need something?</b><p>Maintenance, IT, office, or a question — routes to the right person + your supervisor.</p>'
   +'<button class="btn primary" style="flex:0 0 auto;display:inline-block" onclick="alert(\'Live slice: intake POST is read-only here. Production routes to dept owner + supervisor (INTAKE_ROUTING).\')">＋ I need something</button></div>'
   +'<div class="foot">LIVE vertical slice · Field-First GM Today home · real data from manager-page '+(d.fn_version||'')+' (read-only).<br>'
   +esc(store)+(nsn?' #'+nsn:'')+' · data through '+fmtDate(sc&&sc.data_through)+', 2026 · token: GM (Boulder Hill).</div>'
   +'</div></div>';

  document.getElementById('root').innerHTML = html;

  // tab dot if anything needs the GM
  if(activeCount>0){var td=document.getElementById('todaydot');if(td)td.style.display='block';}

  // one restrained count-up
  var el=document.getElementById('vcount');
  if(el && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    var target=parseInt(el.textContent,10);el.textContent='0';var n=0;
    var t=setInterval(function(){n++;el.textContent=n;if(n>=target)clearInterval(t);},140);
  }
  console.log('renderBoard: rendered, cards=',shown.length,'active=',activeCount,'fn_version=',d.fn_version);
  return shown.length;
}

// act-and-dismiss (client-only in this read-only slice; production writes via audited POST)
function resolveCard(btn){
  var card=btn.closest('.story');if(card.classList.contains('done'))return;
  card.classList.add('done');
  var v=document.getElementById('vcount');
  if(v){var n=Math.max(0,parseInt(v.textContent,10)-1);v.textContent=n;
    var vd=document.getElementById('verdict');
    if(n===0){vd.classList.add('clear');vd.querySelector('.bignum').innerHTML='<em>All clear</em> — nothing needs you';
      vd.querySelector('.sub').textContent='Nice work. New items will surface here as they come in.';}}
}

// theme toggle
var tb=document.getElementById('themeBtn');
tb.onclick=function(){var on=document.body.getAttribute('data-theme')==='arches';
  if(on){document.body.removeAttribute('data-theme');tb.textContent='🌙';}
  else{document.body.setAttribute('data-theme','arches');tb.textContent='☀️';}};
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});t.classList.add('active');};});

// ---- fetch the LIVE board ----
(function(){
  var t0=performance.now();
  fetch(ENDPOINT+'?t='+encodeURIComponent(TOKEN),{method:'GET',headers:{'accept':'application/json'}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(j){
      console.log('live fetch ok in',Math.round(performance.now()-t0),'ms; data keys=',Object.keys(j.data||{}).length);
      if(!j.data) throw new Error('no data object in response');
      renderBoard(j.data);
    })
    .catch(function(e){
      console.error('live fetch failed',e);
      document.getElementById('root').innerHTML='<div class="errbox"><b>Could not load the live board.</b><br>'+esc(e.message)
        +'<br><br>This slice fetches the production manager-page Edge Function read-only. Check the token in <code>?t=</code> or network access.</div>';
    });
})();
</script>
