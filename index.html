// Look-back review (closed-shift feed); station is schedule-inferred; aggregate heads only.
// Daypart chips filter the 15-min grid client-side; the store switcher re-fetches (?dp_store=).
const DP_DAYPARTS=[["Breakfast",4,11],["Lunch",11,14],["Snack",14,16],["Dinner",16,21],["Evening",21,24],["Late",0,4]];
const DP_STATIONS=["Grill","DriveThru","FrontCounter","Fries","Floor","McCafe"];

function dpHour(b){return parseInt(String(b).slice(11,13),10);}
function dpHM(b){return String(b).slice(11,16);}
function dpDaypartOf(b){const h=dpHour(b);for(const a of DP_DAYPARTS){const s=a[1],e=a[2];if(s<e?(h>=s&&h<e):(h>=s||h<e))return a[0];}return "Late";}
function dpGapClass(g){return g===0?"ok":(g>0?"over":"under");}
function dpGapTxt(g){return g===0?"0":(g>0?"+"+g:"−"+Math.abs(g));}
function dpData(){return (STATE&&STATE.data&&STATE.data.datapass_labor)||null;}

function lbMarkOff(sid, geid){

function dpPickDaypart(dp){
  document.querySelectorAll('.dp-chip').forEach(c=>c.classList.toggle('on', c.dataset.dp===dp));
  const d=dpData(); const b=d&&d.board; const m=document.getElementById('dpMatrix'); const al=document.getElementById('dpAlert');
  if(!b||!m) return;
  const slots=[...new Set((b.grid||[]).filter(g=>dpDaypartOf(g.bucket)===dp).map(g=>g.bucket))].sort();
  if(!slots.length){ m.innerHTML='<div class="dp-empty">No deployment data for '+esc(dp)+' on this day.</div>'; if(al) al.innerHTML=''; return; }
  const cell={}; (b.grid||[]).forEach(g=>{ cell[g.station+'|'+g.bucket]=g; });
  const salesAt={}; (b.sales||[]).forEach(s=>{ salesAt[s.bucket]=+s.forecast_sales||0; });
  const present=DP_STATIONS.filter(st=>slots.some(t=>{const g=cell[st+'|'+t]; return g&&(g.actual||g.forecast);}));
  let html='<table class="dp-tbl"><tr><th class="dp-rl">Station</th>'+slots.map(t=>'<th>'+esc(dpHM(t))+'</th>').join('')+'<th class="dp-tot">avg</th></tr>';
  html+='<tr class="dp-salesrow"><td class="dp-rl">Fcst $</td>'+slots.map(t=>'<td>'+(salesAt[t]?('$'+Math.round(salesAt[t])):'&middot;')+'</td>').join('')+'<td class="dp-tot">$'+Math.round(slots.reduce((a,t)=>a+(salesAt[t]||0),0))+'</td></tr>';
  present.forEach(st=>{
    let sa=0,sf=0;
    const cells=slots.map(t=>{const g=cell[st+'|'+t]||{actual:0,forecast:0,gap:0}; sa+=g.actual; sf+=g.forecast; return '<td class="dp-c '+dpGapClass(g.gap)+'"><b>'+g.actual+'</b><span>/'+g.forecast+'</span></td>';}).join('');
    const aa=Math.round(sa/slots.length), af=Math.round(sf/slots.length), tg=aa-af;
    html+='<tr><td class="dp-rl">'+esc(DP_STATION_LABEL[st]||st)+'</td>'+cells+'<td class="dp-tot '+dpGapClass(tg)+'">'+aa+'/'+af+'</td></tr>';
  });
  html+='</table>'; m.innerHTML=html;
  const avgGap={}; present.forEach(st=>{ avgGap[st]=Math.round(slots.reduce((a,t)=>a+((cell[st+'|'+t]||{gap:0}).gap),0)/slots.length); });
  const over=present.filter(st=>avgGap[st]>0).sort((a,b)=>avgGap[b]-avgGap[a])[0];
  const under=present.filter(st=>avgGap[st]<0).sort((a,b)=>avgGap[a]-avgGap[b])[0];
  const parts=[];
  if(over) parts.push('<b>'+esc(DP_STATION_LABEL[over])+'</b> over (+'+avgGap[over]+' avg)');
  if(under) parts.push('<b>'+esc(DP_STATION_LABEL[under])+'</b> short ('+avgGap[under]+' avg)');
  if(al) al.innerHTML = parts.length?('<span class="dp-tag">'+esc(dp)+'</span> '+parts.join(' &middot; ')+' &mdash; check the mix.'):'';
}

  // ===== 4) GUEST FEEDBACK — unified feed, then actionable complaints =====
  h+='<div id="sec-feedback" class="sec"></div>';
  // Unified Guest Feedback (1-800 + SMG + Google) leads; Low-Rated Comments
  // folded into it. Open Complaints stays below for the resolve/draft actions.
  // (VOICE OSAT score tables moved to "More" — they're performance, not comments.)
  h+=sect(()=>renderCustomerFeedback(data.customer_feedback));
  h+=sect(()=>renderComplaints(data.complaints||[]));

  // ===== 5) MORE — operations detail =====
  h+='<div id="sec-more" class="sec"></div>';
  h+=sect(()=>renderVoiceTrend(data.voice_trend));
  h+=sect(()=>renderTurnover(data.turnover||[]));
  h+=sect(()=>renderProductSales(data.sales_summary||[]));
  h+=sect(()=>renderVisits(data.visits||[], stores));
  h+=sect(()=>renderLabor(data.labor||[]));
  h+=sect(()=>renderBonus(data.bonus_results||[]));
  h+=sect(()=>renderBonusAdjustments(data.bonus_adjustments||[], mgr));
  h+=sect(()=>renderManagerRank(data.manager_rank||[]));
  // Owner-only manual-reports health + promos/key-dates (moved below the fold).
  h+=sect(()=>renderManualReports(data.manual_reports));
  h+=sect(()=>renderKeyDates(data.key_dates||[]));

  h+='<div class="foot">Updated just now &middot; reload for fresh data.<br>Questions? Text Eddie.</div>';
  h+='</div>';
  return h;
}

function showError(msg, raw){
  document.getElementById("app").innerHTML='<div class="errbox"><b>Could not load.</b><br>'+esc(msg)+(raw?'<pre style="font-size:10px;white-space:pre-wrap">'+esc(typeof raw==="string"?raw:JSON.stringify(raw)).slice(0,2000)+'</pre>':'')+'</div>';
}

function pickIntakeOpt(ev, lbl){
  // Click on a label sets its radio checked + toggles `.sel` for visual
  // selection. The native radio input is visually hidden (off-screen) so
  // labels are the click target; bail out if the click was on the input
  // itself so the browser's native check still applies.
  if(ev.target.tagName==='INPUT') return;
  ev.preventDefault();
  ev.stopPropagation();
  lbl.parentElement.querySelectorAll('label').forEach(l=>l.classList.remove('sel'));
  lbl.classList.add('sel');
  const inp=lbl.querySelector('input');
  if(inp) inp.checked=true;
}
async function saveIntake(ev, btn){
  ev.stopPropagation();
  const form=btn.closest(".form");
  const cat=form.querySelector('input[name=category]:checked');
  if(!cat){ alert("Pick a category."); return; }
  const desc=form.querySelector('[name=description]').value.trim();
  if(!desc){ alert("Tell us what you need."); return; }
  const sev=form.querySelector('input[name=severity]:checked');
  const payload={
    action: "intake",
    category: cat.value,
    description: desc,
    severity: sev ? sev.value : "normal",
  };
  form.classList.add("busy");
  try{
    const res = await callApi(payload);
    setBoard(res);
  }catch(e){
    form.classList.remove("busy");
    alert("Submit failed: " + (e && e.message));
  }
}

async function callApi(body){
  const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function findComplaintRow(el){
  while(el && !el.classList.contains("c-row")) el=el.parentElement;
  return el;

function toggleComplaint(headEl){

function copyDraft(ev, btn){
  ev.stopPropagation();
  const id=btn.dataset.copyId;
  const pre=document.getElementById("draft-"+id);
  if(!pre) return;
  const txt=pre.innerText;
  const done=()=>{ btn.textContent="Copied!"; btn.classList.add("ok");
    setTimeout(()=>{ btn.textContent="Copy"; btn.classList.remove("ok"); }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>{
      const ta=document.createElement("textarea"); ta.value=txt;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }
      catch(_e){ alert("Copy failed - select the draft manually."); }
      finally{ document.body.removeChild(ta); }
    });
  } else {
    const ta=document.createElement("textarea"); ta.value=txt;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }
    catch(_e){ alert("Copy failed - select the draft manually."); }
    finally{ document.body.removeChild(ta); }
  }
}
async function resolveComplaint(ev, btn){
  ev.stopPropagation();
  const row=findComplaintRow(btn);
  if(!row) return;
  const id=Number(row.dataset.id);
  // Confirm step - SLA clock is real; bad clicks shouldn't lose progress.
  if(!confirm("Mark this complaint resolved?\n\nThis closes the linked task and stamps the complaint as handled. You can't undo this from the page.")) return;
  row.classList.add("busy");
  try{
    const res = await callApi({ action: "resolve_complaint", id });
    setBoard(res);
  }catch(e){
    row.classList.remove("busy");
    alert("Resolve failed: " + (e && e.message));
  }
}

// ===== Auto theme: light by day, dark "arches" after sunset (America/Chicago) =====
// Sun times computed client-side (Sunrise/Sunset Almanac algorithm) for Chicago,
// reduced to Central minutes-of-day so the comparison is timezone-safe regardless
// of the viewer's own zone. Re-checked every 5 min so it flips live at dusk/dawn.
function _ctMins(d){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour12:false,hour:'2-digit',minute:'2-digit'}).formatToParts(d);
  let h=+p.find(x=>x.type==='hour').value, m=+p.find(x=>x.type==='minute').value;
  if(h===24)h=0; return h*60+m;
}
function _ctDate(d){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  return {y:+p.find(x=>x.type==='year').value,m:+p.find(x=>x.type==='month').value,d:+p.find(x=>x.type==='day').value};
}
function _sunMins(y,m,d,lat,lng,isSet){
  const rad=Math.PI/180, deg=180/Math.PI;
  const N=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/86400000);
  const lngHour=lng/15, t=N+((isSet?18:6)-lngHour)/24;
  const M=(0.9856*t)-3.289;
  let L=M+1.916*Math.sin(M*rad)+0.020*Math.sin(2*M*rad)+282.634; L=((L%360)+360)%360;
  let RA=deg*Math.atan(0.91764*Math.tan(L*rad)); RA=((RA%360)+360)%360;
  RA=(RA+(Math.floor(L/90)*90-Math.floor(RA/90)*90))/15;
  const sinDec=0.39782*Math.sin(L*rad), cosDec=Math.cos(Math.asin(sinDec));
  const cosH=(Math.cos(90.833*rad)-sinDec*Math.sin(lat*rad))/(cosDec*Math.cos(lat*rad));
  if(cosH>1||cosH<-1) return null;
  let H=(isSet?deg*Math.acos(cosH):360-deg*Math.acos(cosH))/15;
  let UT=H+RA-0.06571*t-6.622-lngHour; UT=((UT%24)+24)%24;
  return _ctMins(new Date(Date.UTC(y,m-1,d)+UT*3600000));
}
function applyAutoTheme(){
  try{
    const now=new Date(), cd=_ctDate(now), nowMin=_ctMins(now);
    const sr=_sunMins(cd.y,cd.m,cd.d,41.85,-87.65,false);
    const ss=_sunMins(cd.y,cd.m,cd.d,41.85,-87.65,true);
    const dark = (sr==null||ss==null) ? false : (nowMin>=ss || nowMin<sr);
    if(dark) document.body.dataset.theme='arches';
    else document.body.removeAttribute('data-theme');
  }catch(e){ /* on any failure leave the safe light default */ }
}
applyAutoTheme();
setInterval(applyAutoTheme, 5*60*1000);

async function init(){
  if(!TOKEN){
    showError("Missing token. This link should include ?t=<token>.");
    return;
  }
  try{
    const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN));
    if(r.status === 401){ showError("This link has expired or is invalid. Text Eddie for a fresh one."); return; }
    if(!r.ok) throw new Error("HTTP " + r.status);
    const payload = await r.json();
    setBoard(payload);
  }catch(e){
    showError("Could not load board: " + (e && e.message));
  }
}
