  const stars=r=> r==null?'':'★'.repeat(Math.round(r))+'☆'.repeat(Math.max(0,5-Math.round(r)));
  const sentBadge=it=>{
    if(it.source==='complaint'||it.sentiment==='negative')
      return '<span class="t-tag" style="background:var(--due-over);color:var(--due-overc)">'+(it.source==='complaint'?'Complaint':'Low')+'</span>';
    if(it.sentiment==='neutral')
      return '<span class="t-tag" style="background:var(--due-soon);color:var(--due-soonc)">Mixed</span>';
    return '<span class="t-tag" style="background:var(--paper);color:var(--ok)">Praise</span>';
  };
  const items=cf.items.slice().sort((a,b)=>{
    const d=(b.needs_response?1:0)-(a.needs_response?1:0);
    if(d) return d;
    return String(b.occurred_at||'').localeCompare(String(a.occurred_at||''));
  });
  const itemHtml=it=>{
    const txt=String(it.body_text||'');
    const body=txt.length>200 ? esc(txt.slice(0,200))+'&hellip;' : esc(txt);
    const link=it.link_url ? ' <a href="'+esc(it.link_url)+'" target="_blank" rel="noopener">open &#8599;</a>' : '';
    return '<div class="fb-item"><div class="fb-top"><span class="fb-store">'+esc(it.store_name||it.store_number||'Org')+'</span>'+sentBadge(it)+'</div>'+
      '<div class="fb-sub"><span class="src">'+esc(SRC[it.source]||it.source)+'</span> &middot; '+esc(it.topic||'')+
        ' &middot; '+(it.occurred_at?esc(fmtDate(vdate(it.occurred_at))):'')+
        (it.rating!=null?' <span style="color:var(--accent)">'+stars(it.rating)+'</span>':'')+link+'</div>'+
      (body?'<div class="fb-body">'+body+'</div>':'')+'</div>';
  };
  const top=items.slice(0,3).map(itemHtml).join('');
  const rest=items.slice(3,10).map(itemHtml).join('');
  const byS=(s.by_source||[]).map(b=>esc(SRC[b.source]||b.source)+' '+b.count).join(' &middot; ');
  let h='<div class="card fb"><h3>Guest Feedback<span class="ct">'+(s.needs_response||0)+' need reply</span></h3>'+
    '<div class="cfwrap">'+
      '<div class="cfb"><div class="cfn">'+(s.needs_response||0)+'</div><div class="cfl">Need reply</div></div>'+
      '<div class="cfb"><div class="cfn">'+(s.avg_rating_30!=null?s.avg_rating_30:'&mdash;')+'</div><div class="cfl">Avg &#9733; 30d</div></div>'+
      '<div class="cfb"><div class="cfn">'+(s.last30_negative||0)+'</div><div class="cfl">Neg 30d</div></div>'+
      '<div class="cfb"><div class="cfn">'+(s.last30_total||0)+'</div><div class="cfl">Total 30d</div></div>'+
    '</div>'+
    (byS?'<div class="summary" style="margin:0 0 8px">'+byS+(cf.data_through?' &middot; through '+esc(fmtDate(vdate(cf.data_through))):'')+'</div>':'')+
    top+
    (rest?'<button class="seeall" onclick="toggleDetail(this)"><span class="more">See more &#9662;</span><span class="less" style="display:none">Show less &#9652;</span></button><div class="task-detail">'+rest+'</div>':'')+
    '</div>';
  return h;
}

// ---- Crew Listening results banner (Owner-only; transient announcement) ----
// Links to the private "2026 Crew Experience Survey - Ed Org" results sheet, so
// it's owner-scoped (GMs would hit an access wall + responses are sensitive).
// Update the counts / remove when the survey wraps.
// Crew Listening banner — rolled out to ALL views, role-scoped (data.crew_readouts
// is already filtered to the viewer's stores by the Edge Function).
function renderCrewListeningBanner(mgr, scopeAll, readouts){
  const role=mgr.role||"";
  const list=Array.isArray(readouts)?readouts.filter(r=>r.url):[];
  const chips=list.map(r=>
    '<a href="'+esc(r.url)+'" target="_blank" rel="noopener" style="flex:0 0 auto;background:#fff;color:#1d4ed8;'+
    'font-weight:700;font-size:12px;padding:6px 10px;border-radius:8px;text-decoration:none;white-space:nowrap">'+
    '&#128202; '+esc(String(r.store_name||r.nsn).split(/[-/]/)[0].trim())+'</a>').join("");
  let badge='', body='';
  if(scopeAll){
    badge='10 / 12 stores';
    body='Per-store analysis is ready for 10 of 12 stores. We still need <b>~20 more responses</b> from <b>Plano</b> and <b>Lisle</b> to close those out.';
  } else if(list.length){
    badge=list.length+(list.length===1?' store':' stores');
    body=(role==='GM')
      ? 'Your store’s crew listening analysis is ready — open it below.'
      : 'Crew listening analysis is ready for your stores — open any below.';
  } else {
    // non-owner with nothing ready yet (e.g. Plano/Lisle) — nudge for responses
    body='We’re still collecting crew responses for your store. Encourage your crew to take the survey so we can share your results.';
  }
  return '<div class="card" style="border-color:#1d4ed8;background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff">'+
    '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">&#128226;</span>'+
    '<b style="font-size:15px">Crew Listening</b>'+
    (badge?'<span style="margin-left:auto;font-weight:800;font-size:14px;white-space:nowrap">'+badge+'</span>':'')+'</div>'+
    '<div style="font-size:12.5px;opacity:.95;margin-top:5px">'+body+'</div>'+
    (chips
      ? '<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;opacity:.85;margin:9px 0 4px">Open a store’s analysis</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:6px">'+chips+'</div>'
      : '')+
    '</div>';
}

function renderBoard(payload){
  STATE = payload;
  const data = payload.data || {};
  const result = payload.result;
  const mgr = data.manager || {};
  const stores = data.stores || [];
  const tasks = tasksWithStoreName(data.tasks||[], stores);
  const t0=today0();
  let overdue=0, dueSoon=0, hi=0;
  tasks.forEach(t=>{
    if(t.due_at){
      const d=vdate(t.due_at);
      const days=Math.round((d-t0)/864e5);
      if(days<0) overdue++; else if(days<=7) dueSoon++;
    }
    if(t.priority==="urgent" || t.priority==="high") hi++;
  });

  const now=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const storeLine = stores.map(s=>s.name).join(" · ");

  let h='<div class="phone">';
  // Visible version stamp (top): shell version + backend version. If they differ,
  // the backend tag goes red — an at-a-glance "is my deploy live / cache stale" check.
  const fnV = data.fn_version || "?";
  const mism = (fnV !== "?" && fnV !== SHELL_VERSION);
  h+='<div class="ver">Ed Ops &middot; <b>'+esc(SHELL_VERSION)+'</b>'+
     ' <span'+(mism?' class="mism"':'')+'>api '+esc(fnV)+'</span></div>';
  // RGR countdown banner — soonest upcoming RGR within 45 days in this patch,
  // followed by the live prep checklist for any in-window store (Owner Hub tool #2).
  h+=sect(()=>renderCountdown(data.visits||[], stores, data.rgr));
  h+=sect(()=>renderRgrChecklist(data.rgr, mgr));

  // Branded header — arches mark + greeting.
  h+='<div class="brand"><div class="mark">M</div>'+
     '<div class="hdr" style="margin:0"><h2>Hi, '+esc(mgr.first_name||"")+'</h2>'+
     '<div class="sub">'+esc(mgr.role||"")+(storeLine?' &middot; '+esc(storeLine):'')+
     ' &middot; '+esc(now)+'</div></div></div>';
  h+=flashHtml(result);

  // Hazel showcase launch — Owner-only, pinned to the very top of the Hub.
  h+=sect(()=>renderHazelLink(mgr));

  // Business Advisor briefing — Owner-only, very top (renders "" when empty).
  h+=sect(()=>renderAdvisorBriefing(data.advisor_briefing));

  // Supervisor Meeting — Owner-only agenda card (Owner Hub tool #3): link + Update.
  h+=sect(()=>renderMeeting(data.meeting, mgr));

  // Store Submissions — campaign CTA (GM upload) / tracker (Owner-Sup), pinned
  // near the top so the ask/visibility is unmissable. Renders "" when there's
  // nothing for this role (GM with no targeted campaign; non-owner with none).
  h+='<div id="sec-campaigns" class="sec"></div>';
  h+=sect(()=>renderCampaigns(data.campaigns, mgr));
  // Crew Listening survey results banner — directly below the campaign card (all views, role-scoped).
  h+=sect(()=>renderCrewListeningBanner(mgr, data.scope_all, data.crew_readouts));

  // ===== 1) TASKS — the action hub, pinned to the top =====
  h+='<div id="sec-tasks" class="sec"></div>';
  // Owner pulse — complaints/onboarding/intakes snapshot above the chips (Owner only).
  h+=sect(()=>renderOwnerPulse(data.owner_pulse));
  h+='<div class="chips">'+
     '<div class="chip"><div class="n">'+tasks.length+'</div><div class="l">Active</div></div>'+
     '<div class="chip high"><div class="n">'+hi+'</div><div class="l">Hi-pri</div></div>'+
     '<div class="chip over"><div class="n">'+overdue+'</div><div class="l">Overdue</div></div>'+
     '<div class="chip"><div class="n">'+dueSoon+'</div><div class="l">Due &le; 7d</div></div>'+
     '</div>';
  // GM intake — "I need something" CTA. Routes to Eddie + supervisor based
  // on category server-side. GMs only; other roles use + Add task directly.
  if(mgr.role==='GM'){
    h+='<div class="intake-bar">'+
       '<button class="intake-btn" onclick="openIntakeForm()">I need something'+
       '<span class="sub">IT, maintenance, office help, or supervisor patch — Eddie sees it immediately.</span>'+
       '</button></div>'+
       '<div id="intakeFormMount"></div>';
  }
  h+='<div class="add-bar">'+
     '<button class="add-btn" onclick="openNewForm()">+ Add task</button></div>'+
     '<div id="newFormMount"></div>';
  // Top-5 tasks + expandable full breakdown (Hot / per-store / Cross-store).
  h+=sect(()=>renderTasksBlock(tasks, stores));

  // ===== 2) SALES & GUESTS — daily YoY pulse + MTD chart =====
  h+='<div id="sec-sales" class="sec"></div>';
  h+=sect(()=>renderSalesComps(data.sales_comps));

  // ===== 3) CLEANLINESS RACE — gamified leaderboard, all roles =====
  h+='<div id="sec-race" class="sec"></div>';
  h+=sect(()=>renderCleanlinessRace(data.cleanliness_race));
  h+=sect(()=>renderOsatIncentive(data.osat_incentive));

  // ===== 4) GUEST FEEDBACK — unified feed, then actionable complaints =====
  h+='<div id="sec-feedback" class="sec"></div>';
  // Unified Guest Feedback (1-800 + SMG + Google) leads; Low-Rated Comments
  // folded into it. Open Complaints stays below for the resolve/draft actions.
  // (VOICE OSAT score tables moved to "More" — they're performance, not comments.)
  h+=sect(()=>renderCustomerFeedback(data.customer_feedback));
  h+=sect(()=>renderComplaints(data.complaints||[]));

  // ===== 5) MORE — operations detail =====
  h+='<div id="sec-more" class="sec"></div>';
  h+=sect(()=>renderVoiceTrend(data.voice_trend));
  h+=sect(()=>renderTurnover(data.turnover||[]));
  h+=sect(()=>renderProductSales(data.sales_summary||[]));
  h+=sect(()=>renderVisits(data.visits||[], stores));
  h+=sect(()=>renderLabor(data.labor||[]));
  h+=sect(()=>renderBonus(data.bonus_results||[]));
  h+=sect(()=>renderBonusAdjustments(data.bonus_adjustments||[], mgr));
  h+=sect(()=>renderManagerRank(data.manager_rank||[]));
  // Owner-only manual-reports health + promos/key-dates (moved below the fold).
  h+=sect(()=>renderManualReports(data.manual_reports));
  h+=sect(()=>renderKeyDates(data.key_dates||[]));

  h+='<div class="foot">Updated just now &middot; reload for fresh data.<br>Questions? Text Eddie.</div>';
  h+='</div>';
  return h;
}

function pickIntakeOpt(ev, lbl){
  // Click on a label sets its radio checked + toggles `.sel` for visual
  // selection. The native radio input is visually hidden (off-screen) so
  // labels are the click target; bail out if the click was on the input
  // itself so the browser's native check still applies.
  if(ev.target.tagName==='INPUT') return;
  ev.preventDefault();
  ev.stopPropagation();
  lbl.parentElement.querySelectorAll('label').forEach(l=>l.classList.remove('sel'));
  lbl.classList.add('sel');
  const inp=lbl.querySelector('input');
  if(inp) inp.checked=true;
}
async function saveIntake(ev, btn){
  ev.stopPropagation();
  const form=btn.closest(".form");
  const cat=form.querySelector('input[name=category]:checked');
  if(!cat){ alert("Pick a category."); return; }
  const desc=form.querySelector('[name=description]').value.trim();
  if(!desc){ alert("Tell us what you need."); return; }
  const sev=form.querySelector('input[name=severity]:checked');
  const payload={
    action: "intake",
    category: cat.value,
    description: desc,
    severity: sev ? sev.value : "normal",
  };
  form.classList.add("busy");
  try{
    const res = await callApi(payload);
    setBoard(res);
  }catch(e){
    form.classList.remove("busy");
    alert("Submit failed: " + (e && e.message));
  }
}

async function callApi(body){
  const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function copyDraft(ev, btn){
  ev.stopPropagation();
  const id=btn.dataset.copyId;
  const pre=document.getElementById("draft-"+id);
  if(!pre) return;
  const txt=pre.innerText;
  const done=()=>{ btn.textContent="Copied!"; btn.classList.add("ok");
    setTimeout(()=>{ btn.textContent="Copy"; btn.classList.remove("ok"); }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>{
      const ta=document.createElement("textarea"); ta.value=txt;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }
      catch(_e){ alert("Copy failed - select the draft manually."); }
      finally{ document.body.removeChild(ta); }
    });
  } else {
    const ta=document.createElement("textarea"); ta.value=txt;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }
    catch(_e){ alert("Copy failed - select the draft manually."); }
    finally{ document.body.removeChild(ta); }
  }
}
async function resolveComplaint(ev, btn){
  ev.stopPropagation();
  const row=findComplaintRow(btn);
  if(!row) return;
  const id=Number(row.dataset.id);
  // Confirm step - SLA clock is real; bad clicks shouldn't lose progress.
  if(!confirm("Mark this complaint resolved?\n\nThis closes the linked task and stamps the complaint as handled. You can't undo this from the page.")) return;
  row.classList.add("busy");
  try{
    const res = await callApi({ action: "resolve_complaint", id });
    setBoard(res);
  }catch(e){
    row.classList.remove("busy");
    alert("Resolve failed: " + (e && e.message));
  }
}

// ===== Auto theme: light by day, dark "arches" after sunset (America/Chicago) =====
// Sun times computed client-side (Sunrise/Sunset Almanac algorithm) for Chicago,
// reduced to Central minutes-of-day so the comparison is timezone-safe regardless
// of the viewer's own zone. Re-checked every 5 min so it flips live at dusk/dawn.
function _ctMins(d){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour12:false,hour:'2-digit',minute:'2-digit'}).formatToParts(d);
  let h=+p.find(x=>x.type==='hour').value, m=+p.find(x=>x.type==='minute').value;
  if(h===24)h=0; return h*60+m;
}
function _ctDate(d){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  return {y:+p.find(x=>x.type==='year').value,m:+p.find(x=>x.type==='month').value,d:+p.find(x=>x.type==='day').value};
}
function _sunMins(y,m,d,lat,lng,isSet){
  const rad=Math.PI/180, deg=180/Math.PI;
  const N=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/86400000);
  const lngHour=lng/15, t=N+((isSet?18:6)-lngHour)/24;
  const M=(0.9856*t)-3.289;
  let L=M+1.916*Math.sin(M*rad)+0.020*Math.sin(2*M*rad)+282.634; L=((L%360)+360)%360;
  let RA=deg*Math.atan(0.91764*Math.tan(L*rad)); RA=((RA%360)+360)%360;
  RA=(RA+(Math.floor(L/90)*90-Math.floor(RA/90)*90))/15;
  const sinDec=0.39782*Math.sin(L*rad), cosDec=Math.cos(Math.asin(sinDec));
  const cosH=(Math.cos(90.833*rad)-sinDec*Math.sin(lat*rad))/(cosDec*Math.cos(lat*rad));
  if(cosH>1||cosH<-1) return null;
  let H=(isSet?deg*Math.acos(cosH):360-deg*Math.acos(cosH))/15;
  let UT=H+RA-0.06571*t-6.622-lngHour; UT=((UT%24)+24)%24;
  return _ctMins(new Date(Date.UTC(y,m-1,d)+UT*3600000));
}
function applyAutoTheme(){
  try{
    const now=new Date(), cd=_ctDate(now), nowMin=_ctMins(now);
    const sr=_sunMins(cd.y,cd.m,cd.d,41.85,-87.65,false);
    const ss=_sunMins(cd.y,cd.m,cd.d,41.85,-87.65,true);
    const dark = (sr==null||ss==null) ? false : (nowMin>=ss || nowMin<sr);
    if(dark) document.body.dataset.theme='arches';
    else document.body.removeAttribute('data-theme');
  }catch(e){ /* on any failure leave the safe light default */ }
}
applyAutoTheme();
setInterval(applyAutoTheme, 5*60*1000);

async function init(){
  if(!TOKEN){
    showError("Missing token. This link should include ?t=<token>.");
    return;
  }
  try{
    const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN));
    if(r.status === 401){ showError("This link has expired or is invalid. Text Eddie for a fresh one."); return; }
    if(!r.ok) throw new Error("HTTP " + r.status);
    const payload = await r.json();
    setBoard(payload);
  }catch(e){
    showError("Could not load board: " + (e && e.message));
  }
}
init();
