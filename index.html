<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Always revalidate the shell so a redeploy can't leave a stale/half-cached copy
     (root cause of the 2026-06-10 "white but clickable" incident — rapid redeploys). -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>My Task Board</title>
<style>
/* Light "paper" palette is the SAFE DEFAULT (fallback). The live look is the
   dark "arches" theme set via <body data-theme="arches"> below — remove that one
   attribute to revert instantly to this proven light board. */
:root{color-scheme:light;
 --fg:#1f2421;--ink2:#3f3f46;--muted:var(--muted);--line:#e7e8e5;--bg:#eceee9;--card:#fff;
 --accent:#2c5f2d;--on-accent:#fff;--urgent:#b42318;--high:#b54708;--paper:#f4f5f3;
 --ok:#1a7f4b;--warn:#b54708;
 --due-over:#fee4e2;--due-overc:#b42318;
 --due-soon:#fef3c7;--due-soonc:#92400e;
 --st-new:#64748b;--st-assigned:#2563eb;
 --st-in_progress:#d97706;--st-waiting:#7c3aed;
 --btn:#2c5f2d;--btn-h:#1f4520;
 --tabbar-bg:rgba(255,255,255,.94);--tab-active-bg:rgba(44,95,45,.10)}

/* ===== ARCHES — dark McDonald's theme (gold + red on charcoal) ===== */
body[data-theme="arches"]{color-scheme:dark;
 --fg:#eef4fb;--ink2:#c2d0dd;--muted:#8aa0b4;--line:#26323f;
 --bg:radial-gradient(900px 480px at 80% -10%, #15314a, #0a0e13 60%);--card:#1b2632;
 --accent:#ffc72c;--on-accent:#3a2a00;--urgent:#e5484d;--high:#e8a33d;--paper:#141b24;
 --ok:#43d39e;--warn:#e8a33d;
 --due-over:#3a1412;--due-overc:#ff8a80;
 --due-soon:#33290a;--due-soonc:#ffd454;
 --st-new:#9fb0c2;--st-assigned:#7fb0ff;
 --st-in_progress:#f0b357;--st-waiting:#c4a3ff;
 --btn:#da291c;--btn-h:#b21f15;
 --tabbar-bg:rgba(12,17,23,.92);--tab-active-bg:rgba(255,199,44,.14)}
body[data-theme="arches"] .phone{background:var(--paper);border-color:var(--line);
 box-shadow:0 6px 26px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
 background:var(--bg);color:var(--fg);line-height:1.45;padding:18px 12px 44px;
 -webkit-text-size-adjust:100%}
.phone{max-width:432px;margin:0 auto;background:var(--paper);
 border:1px solid #d6d8d3;border-radius:22px;padding:16px 15px 28px;
 box-shadow:0 6px 26px rgba(0,0,0,.11)}
.ver{text-align:right;font-size:10px;color:var(--muted);letter-spacing:.04em;
 margin:-6px 0 4px;font-weight:600}
.ver b{color:var(--accent)}
.ver .mism{color:var(--urgent)}
.rgr-banner{background:var(--accent);color:#fff;border-radius:13px;
 padding:13px 15px;text-align:center;margin-bottom:8px}
.rgr-banner.warn{background:var(--high)}
.rgr-banner.over{background:var(--urgent)}
.rgr-banner .k{font-size:10.5px;font-weight:700;text-transform:uppercase;
 letter-spacing:.07em;opacity:.85}
.rgr-banner .big{font-size:33px;font-weight:800;line-height:1.05;margin:2px 0 0}
.rgr-banner .big span{font-size:14px;font-weight:600;opacity:.85}
.rgr-banner .m{font-size:13px;margin-top:3px;opacity:.95}
.rgr-banner .extra{font-size:11px;margin-top:4px;opacity:.85;font-weight:600}
.rgr-banner .cta{display:inline-block;margin-top:8px;background:rgba(255,255,255,.92);
 color:var(--accent);font-weight:700;font-size:12px;padding:6px 12px;border-radius:8px;
 text-decoration:none}
.rgr-card .rgr-meta{font-size:12.5px;color:var(--muted);margin:-2px 0 8px}
.rgr-bar{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:0 0 10px}
.rgr-bar-fill{height:100%;background:var(--accent);border-radius:5px;transition:width .25s}
.rgr-sec{margin-top:6px}
.rgr-sec-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
 color:var(--accent);margin:8px 0 2px}
.rgr-intro{font-size:12px;color:var(--muted);margin:0 0 6px}
.rgr-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
.rgr-row.done .rgr-lbl{color:var(--muted);text-decoration:line-through}
.rgr-box{flex:0 0 auto;width:23px;height:23px;border-radius:6px;border:2px solid var(--accent);
 background:#fff;color:#fff;font-size:14px;font-weight:800;line-height:1;cursor:pointer;
 display:flex;align-items:center;justify-content:center;margin-top:1px}
.rgr-box.on{background:var(--accent)}
.rgr-main{flex:1 1 auto;min-width:0}
.rgr-lbl{font-size:13px;line-height:1.32}
.rgr-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
 color:var(--muted);background:var(--line);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.rgr-by{font-size:11px;color:var(--muted);margin-top:2px}
.rgr-thumb{width:46px;height:46px;object-fit:cover;border-radius:6px;cursor:pointer;
 border:1px solid var(--line);margin-top:6px}
.rgr-actions{flex:0 0 auto;display:flex;gap:4px;align-items:flex-start}
.rgr-cam,.rgr-del{background:none;border:0;cursor:pointer;font-size:16px;padding:2px 3px;line-height:1}
.rgr-del{color:var(--urgent);font-weight:700}
.rgr-add{display:flex;gap:6px;margin-top:9px}
.rgr-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:13px}
.rgr-add .add-btn{width:auto;padding:8px 14px}
.hdr{margin-bottom:10px}
.hdr h2{font-size:22px;font-weight:700}
.hdr .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:9px;
 padding:7px 10px;min-width:74px;flex:1 1 auto}
.chip .n{font-size:19px;font-weight:700;line-height:1}
.chip .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;
 letter-spacing:.04em;margin-top:3px}
.chip.over .n{color:var(--urgent)}
.chip.high .n{color:var(--high)}
.add-bar{display:flex;justify-content:center;margin:6px 0 0}
.add-btn{background:var(--btn);color:#fff;border:0;border-radius:9px;
 padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;
 box-shadow:0 1px 3px rgba(0,0,0,.13);width:100%}
.add-btn:hover{background:var(--btn-h)}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;
 padding:14px;margin-top:13px}
.card h3{font-size:11.5px;font-weight:700;text-transform:uppercase;
 letter-spacing:.05em;color:var(--accent);margin-bottom:8px}
.card h3 .ct{color:var(--muted);font-weight:600;margin-left:6px;
 text-transform:none;letter-spacing:0;font-size:11px}
.summary{font-size:12.5px;color:var(--muted);margin:-2px 0 6px}
.t-row{display:block;padding:10px 0;border-top:1px solid var(--line);
 position:relative}
.t-row:first-of-type{border-top:0}
.t-row::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;
 width:3px;border-radius:0 3px 3px 0;background:#cbd5e1}
.t-row.p-urgent::before{background:var(--urgent)}
.t-row.p-high::before{background:var(--high)}
.t-row.p-normal::before{background:#9ca3af}
.t-row.p-low::before{background:#cbd5e1}
.t-head{cursor:pointer}
.t-top{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);
 flex-wrap:wrap}
.t-id{font-weight:700}
.t-pri{font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:10px}
.t-pri.p-urgent{color:var(--urgent)}
.t-pri.p-high{color:var(--high)}
.t-pri.p-normal{color:var(--muted)}
.t-store{margin-left:auto;background:var(--paper);color:var(--accent);
 border-radius:5px;padding:1px 6px;font-size:10px;font-weight:600;letter-spacing:.02em}
.t-title{font-weight:600;font-size:14px;margin:5px 0 6px;line-height:1.35}
.t-meta{display:flex;gap:5px;flex-wrap:wrap}
.t-tag{font-size:10.5px;border-radius:5px;padding:1px 7px;
 border:1px solid var(--line);background:var(--paper);color:var(--muted);white-space:nowrap}
.t-tag.due-over{background:var(--due-over);border-color:#fecaca;color:var(--due-overc);font-weight:600}
.t-tag.due-soon{background:var(--due-soon);border-color:#fde68a;color:var(--due-soonc)}
.t-tag.st-new{color:var(--st-new)}
.t-tag.st-assigned{color:var(--st-assigned)}
.t-tag.st-in_progress{color:var(--st-in_progress)}
.t-tag.st-waiting{color:var(--st-waiting)}
.t-tag.cat{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:9.5px}
.t-tag.cat-it{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
.t-tag.cat-maintenance{background:#fef3c7;border-color:#fde68a;color:#92400e}
.t-tag.cat-office{background:#f3e8ff;border-color:#e9d5ff;color:#6b21a8}
.t-tag.cat-store{background:#eef9ec;border-color:#cce6ce;color:var(--accent)}
.t-tag.cat-patch{background:#e0f2fe;border-color:#bae6fd;color:#075985}
.t-desc{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
 font-size:12px;color:var(--ink2);white-space:pre-wrap}
.t-row:not(.open) .t-desc{display:none}
.t-row:not(.open) .t-actions{display:none}
.t-row:not(.open) .form-mount{display:none}
.t-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;padding-top:9px;
 border-top:1px dashed var(--line)}
.act{font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer;
 border:1px solid var(--line);background:var(--card)}
.act.primary{background:var(--btn);color:#fff;border-color:var(--btn)}
.act.danger{color:var(--urgent);border-color:#fecaca;background:#fff7f7}
.form{background:var(--paper);border:1px solid var(--line);border-radius:8px;
 padding:10px;margin-top:9px}
.form label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;
 letter-spacing:.03em;color:var(--muted);margin-bottom:3px;margin-top:6px}
.form input,.form select,.form textarea{font:inherit;width:100%;
 border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;
 background:var(--card);color:var(--fg)}
.form textarea{min-height:60px;resize:vertical}
.form .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .row-actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.busy{opacity:.55;pointer-events:none}
.flash{font-size:13px;padding:8px 11px;border-radius:7px;margin:10px 0 4px}
.flash.ok{background:#eef9ec;color:var(--accent);border:1px solid #cce6ce}
.flash.err{background:var(--due-over);color:var(--urgent);border:1px solid #fecaca}
.metric{display:flex;justify-content:space-between;align-items:baseline;
 padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.metric:first-of-type{border-top:0}
.metric .v{font-weight:700;font-size:14.5px}
.metric .d{font-size:11px;color:var(--muted);margin-left:5px;font-weight:400}
.up{color:var(--accent)}.dn{color:var(--urgent)}
.sub2{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
 color:var(--muted);margin:10px 0 4px}
.sub2:first-child{margin-top:0}
.mr-tbl{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.mr-tbl th{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
 color:var(--muted);text-align:right;padding:3px 3px 4px;border-bottom:1px solid var(--line)}
.mr-tbl th.l{text-align:left}
.mr-tbl td{padding:4px 3px;border-top:1px solid var(--line);text-align:right;
 font-variant-numeric:tabular-nums}
.mr-tbl td.l{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-tbl tr:first-child td{border-top:0}
.mr-tbl tr.top td.l{color:var(--accent);font-weight:700}
.mr-tbl col.c-mgr{width:auto}
.mr-tbl col.c-sh{width:26px}
.mr-tbl col.c-oepe{width:38px}
.mr-tbl col.c-kvs{width:32px}
.mr-tbl col.c-r2p{width:32px}
.mr-tbl col.c-lab{width:44px}
.mr-tbl col.c-pk{width:38px}
.mr-tbl col.c-kpi{width:52px}
.mr-tbl col.c-pk2{width:58px}
.mr-tbl col.c-ps{width:68px}
.mr-tbl col.c-yoy{width:44px}
.mr-tbl col.c-gcv{width:46px}
.mr-tbl col.c-avg{width:42px}
.bgrp{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
 color:var(--muted);margin:11px 0 3px}
.bgrp:first-child{margin-top:0}
.brow{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
.brow-self{background:var(--paper);border-left:3px solid #2867d1;padding-left:8px}
.brow-head{border-bottom:1px solid #e5e7eb;padding-bottom:4px;margin-bottom:4px;color:var(--muted)}

.brow:first-of-type{border-top:0}
.bamt{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--on-accent);background:var(--accent);
 border-radius:7px;padding:3px 8px;white-space:nowrap;align-self:flex-start}
.bcrit{font-size:13.5px;font-weight:600}
.bcrit .s{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.dq{font-size:12.5px;line-height:1.7}
.dq span{display:inline-block;background:#fee4e2;color:var(--urgent);font-weight:600;
 border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;font-size:11.5px}
.bnote{font-size:11.5px;color:var(--muted);font-style:italic;
 border-top:1px solid var(--line);margin-top:9px;padding-top:8px}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 0 2px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px;line-height:1.6}
.loading{text-align:center;color:var(--muted);font-size:13px;padding:40px 0}
.errbox{max-width:432px;margin:14px auto;background:var(--card);border:1px solid var(--line);
 border-radius:11px;padding:13px;font-size:12.5px}
.errbox b{color:var(--urgent)}

/* ---- Open Complaints card ----------------------------------------- */
.card.complaints h3{color:var(--urgent)}
.c-row{display:block;padding:11px 0;border-top:1px solid var(--line);position:relative}
.c-row:first-of-type{border-top:0}
.c-row::before{content:"";position:absolute;left:-14px;top:11px;bottom:11px;
 width:3px;border-radius:0 3px 3px 0;background:#cbd5e1}
.c-row.sla-over::before{background:var(--urgent)}
.c-row.sla-today::before{background:var(--high)}
.c-row.sla-tom::before{background:#d97706}
.c-row.sla-ok::before{background:#9ca3af}
.c-head{cursor:pointer}
.c-top{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.c-id{font-weight:700}
.c-store{margin-left:auto;background:var(--paper);color:var(--accent);border-radius:5px;
 padding:1px 6px;font-size:10px;font-weight:600;letter-spacing:.02em}
.c-title{font-weight:600;font-size:14px;margin:5px 0 6px;line-height:1.35}
.c-title .who{color:var(--fg)}
.c-title .sep{color:var(--muted);margin:0 5px;font-weight:400}
.c-title .what{color:var(--muted);font-weight:500;font-size:13px}
.c-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sla{font-size:10.5px;border-radius:5px;padding:1px 7px;border:1px solid var(--line);
 background:var(--paper);color:var(--muted);white-space:nowrap;font-weight:700;
 text-transform:uppercase;letter-spacing:.03em}
.sla.over{background:var(--due-over);border-color:#fecaca;color:var(--due-overc)}
.sla.today{background:#fee4e2;border-color:#fecaca;color:var(--due-overc)}
.sla.tom{background:var(--due-soon);border-color:#fde68a;color:var(--due-soonc)}
.sla.ok{background:#eef9ec;border-color:#cce6ce;color:var(--accent)}
.sla.recov{background:var(--urgent);border-color:var(--urgent);color:#fff}
.c-age{font-size:10.5px;color:var(--muted)}
.c-body{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.c-row.open .c-body{display:block}
.c-section{margin-top:10px}
.c-section:first-child{margin-top:0}
.c-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
 color:var(--muted);margin-bottom:4px;display:flex;align-items:center}
.c-quote{background:#fafbf9;border:1px solid var(--line);border-radius:7px;
 padding:8px 10px;font-size:12.5px;color:#3f3f46;white-space:pre-wrap;line-height:1.5}
.c-quote.draft{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
 background:#fff;color:#1f2421;max-height:240px;overflow:auto}
.c-contact{font-size:12px;color:var(--ink2);line-height:1.65}
.c-contact .k{color:var(--muted);font-weight:600;margin-right:5px;display:inline-block;
 min-width:46px;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.c-contact a{color:var(--accent);text-decoration:none}
.c-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;padding-top:9px;
 border-top:1px dashed var(--line)}
.c-actions .act.primary{background:var(--urgent);border-color:var(--urgent);color:#fff}
.c-actions .act.primary:hover{background:#8a1a13;border-color:#8a1a13}
.c-copy{font-size:11.5px;color:var(--accent);font-weight:600;margin-left:auto;
 background:transparent;border:0;cursor:pointer;padding:0}
.c-copy.ok{color:var(--accent)}

/* ---- GM intake form ("I need something") ------------------------- */
.intake-bar{margin:10px 0 0}
.intake-btn{width:100%;background:#1f4520;color:#fff;border:0;border-radius:9px;
 padding:13px 14px;font-size:14.5px;font-weight:700;cursor:pointer;
 box-shadow:0 1px 3px rgba(0,0,0,.13);text-align:center;line-height:1.25}
.intake-btn:hover{background:#143012}
.intake-btn .sub{display:block;font-weight:500;font-size:11.5px;opacity:.85;margin-top:3px}
.intake-radios{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.intake-radios label{display:inline-flex;align-items:center;gap:5px;background:var(--card);
 border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;
 font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg);cursor:pointer;
 margin:0;background:var(--card)}
.intake-radios label.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.intake-radios input{position:absolute;opacity:0;pointer-events:none}

/* ===== Arches redesign additions (v33 shell) ===================== */
/* Branded header mark */
.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);
 color:var(--on-accent,#3a2a00);display:grid;place-items:center;font-weight:900;
 font-size:20px;flex:none}
.brand .mark.rfallback{}

/* Section anchors get scroll offset so the bottom nav jump lands cleanly */
.sec{scroll-margin-top:10px}

/* Sales/GC comps card — daily YoY pulse + MTD chart */
.comps{background:var(--card);border:1px solid var(--line);border-radius:13px;
 padding:14px;margin-top:13px}
.comps h3{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
 color:var(--accent);margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline}
.comps h3 .meta{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:none;letter-spacing:0}
.comp-nums{display:flex;gap:9px;margin-bottom:11px}
.comp{flex:1 1 0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.comp .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.comp .v{font-size:24px;font-weight:800;line-height:1.05;margin-top:3px;font-variant-numeric:tabular-nums}
.comp .s{font-size:11px;color:var(--muted);margin-top:2px}
.comp .v.up{color:var(--ok,#1a7f4b)} .comp .v.dn{color:var(--urgent)}
.comp-chart{width:100%;height:118px;display:block}
.comp-legend{display:flex;gap:14px;justify-content:center;margin-top:6px;font-size:10.5px;color:var(--muted)}

<script>
const ENDPOINT = "https://nnsuyrhubsidwmrrsumm.supabase.co/functions/v1/manager-page";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const VIEW = new URLSearchParams(location.search).get("view") || "";   // "meeting" = focused owner agenda; "hazel" = showcase view
// Visible deploy marker — bump on every shell push so propagation is verifiable
// at a glance. The backend (Edge Fn) version comes from data.fn_version; if the

const VOICE_ORDER = ["Overall Quality","Accuracy","Fast","Friendliness","Overall Cleanliness","Taste of Food"];
const VISIT_LABEL = {

// GM intake form ("I need something") — only the four GM-facing buckets;

const INTAKE_CATEGORIES = [
  {value:"it",          label:"IT"},

// Q1 2026 GM Bonus Plan - from the GM meeting deck. Update each quarter.
// 2026 Bonus Plan — single set of terms used for both quarters; results

const BONUS_PLAN = {

  service:[
    {amt:"$95", crit:"Level 1"},

     sub:"Accuracy % in VOICE · Upsell % (Lg Meals/Total) · Pies per 100k GC"}
  ],

];

let STATE = null;  // last server response (data + result + stores + manager)

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>(
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function vdate(s){return new Date(String(s).slice(0,10)+"T00:00:00");}
function today0(){const t=new Date();t.setHours(0,0,0,0);return t;}
function fmtDate(d){if(!d)return"";
  const t=(d instanceof Date)?d:new Date(d);
  if(isNaN(t)) return "";
  return t.toLocaleDateString("en-US",{month:"short",day:"numeric"});}
function fmtNum(v){return (v==null||v==="")?'&mdash;':esc(String(v));}
function fmtPct(v){return (v==null||v==="")?'&mdash;':esc(Number(v).toFixed(1))+'%';}
function isoDate(d){if(!d) return "";
  const t=(d instanceof Date)?d:new Date(d);
  if(isNaN(t)) return "";
  return t.toISOString().slice(0,10);}

function shortMgr(name){
  const s=String(name||"").trim();
  const i=s.indexOf(",");
  if(i<0) return s;
  const last=s.slice(0,i).trim();
  const first=s.slice(i+1).trim();
  const tc=t=>t? t.charAt(0).toUpperCase()+t.slice(1).toLowerCase() : t;
  return (first.split(/\s+/).map(tc).join(" ")+" "+tc(last)).trim();
}

// Surfaces the soonest upcoming RGR visit in the manager's patch as a
// banner at the top of the board. Shows for any role (Owner / Supervisor /
// GM) — the Edge Function already scopes `visits` to the manager's stores,
// so a supervisor sees the next RGR across their patch and a GM sees only
// their store's. Banner only renders when an RGR is within 45 days.
// Upcoming RGRs (soonest first, deduped by store+date). Drawn from BOTH the scoped
// visits feed AND the active checklist runs (data.rgr) — the latter covers a run
// broadcast to a supervisor outside their patch, which won't be in their visits.
function nextRGR(visits, rgr){
  const t0=today0(), cand=[];
  (visits||[]).forEach(v=>{ if(v.visit_type==="rgrv" && v.visit_date && vdate(v.visit_date)>=t0)
    cand.push({store_id:v.store_id, visit_date:v.visit_date, store_name:v.store_name}); });
  (Array.isArray(rgr)?rgr:[]).forEach(r=>{ if(r.visit_date && vdate(r.visit_date)>=t0)
    cand.push({store_id:r.store_id, visit_date:r.visit_date, store_name:r.store_name}); });
  cand.sort((a,b)=>vdate(a.visit_date)-vdate(b.visit_date));
  const seen={}, uniq=[];
  cand.forEach(c=>{ const k=c.store_id+'|'+c.visit_date; if(!seen[k]){seen[k]=1;uniq.push(c);} });
  return uniq;
}

function renderCountdown(visits, stores, rgr){
  const list=nextRGR(visits, rgr);
  const r=list[0];
  if(!r) return "";
  const days=Math.round((vdate(r.visit_date)-today0())/864e5);
  if(days>45) return "";
  // Heat tier: <=7 days = over (red), <=14 days = warn (amber), else = accent (green).
  const tier = days<=7 ? 'over' : (days<=14 ? 'warn' : '');
  const when=vdate(r.visit_date).toLocaleDateString("en-US",
    {weekday:"short",month:"long",day:"numeric"});
  const lbl=days===0?"today":(days===1?"day away":"days away");
  const big=days===0?'<div class="big">Today</div>'
    :'<div class="big">'+days+' <span>'+lbl+'</span></div>';
  // Store name from the candidate (visits/rgr) if present, else look up from stores.
  const byStore = Object.fromEntries((stores||[]).map(s => [s.id, s.name]));
  const storeName = r.store_name || byStore[r.store_id] || '';
  const others = list.length - 1;
  const extra = others>0
    ? '<div class="extra">+ '+others+' more RGR'+(others===1?'':'s')+' upcoming</div>'
    : '';
  // If a prep checklist is live for this RGR, link straight to it.
  const hasChecklist=Array.isArray(rgr) && rgr.some(x=>x.store_id===r.store_id);
  const cta=hasChecklist
    ? '<a class="cta" href="#rgr-checklist" onclick="rgrOpenChecklist();return false;">&#128203; Open prep checklist</a>'
    : '';
  return '<div class="rgr-banner'+(tier?' '+tier:'')+'"><div class="k">Next RGR Visit</div>'+big+
    '<div class="m">'+esc(storeName)+' &middot; '+esc(when)+'</div>'+
    extra+cta+'</div>';
}

// ---- RGR Prep Checklist (Owner Hub tool #2) — renders under the RGR banner ----
// data.rgr is role-scoped server-side: one card per active in-window store.
// Base items are locked; any in-scope user ticks/photos/adds; GM+ delete customs.
const RGR_SECTION_INTRO = { "Paperwork":"The items below should be readily available for review:" };
function rgrItemRow(it, run){
  const checked=!!it.checked;
  const idRef=it.is_base ? ("'tmpl',"+it.template_item_id) : ("'entry',"+it.entry_id);
  const inputId="rgrf_"+run.run_id+"_"+(it.entry_id||("t"+it.template_item_id));
  const box='<button class="rgr-box'+(checked?' on':'')+'" title="Mark ready" '+
    'onclick="rgrCheck('+run.run_id+','+idRef+','+(checked?'false':'true')+')">'+(checked?'&#10003;':'')+'</button>';
  const stamp=(checked&&it.checked_by)
    ? '<div class="rgr-by">&#10003; '+esc(it.checked_by)+(it.checked_at?' &middot; '+esc(fmtDate(vdate(it.checked_at))):'')+'</div>' : '';
  const photo=it.photo_url?'<img class="rgr-thumb" src="'+esc(it.photo_url)+'" onclick="lb(this.src)">':'';
  const tag=it.is_base?'':'<span class="rgr-tag">added</span>';
  const cam='<input type="file" id="'+inputId+'" accept="image/*,application/pdf" capture style="display:none" '+
    'onchange="rgrPhoto(this,'+run.run_id+','+idRef+')">'+
    '<button class="rgr-cam" title="Attach photo/file" onclick="document.getElementById(\''+inputId+'\').click()">&#128247;</button>';
  const del=(!it.is_base && run.can_delete)
    ? '<button class="rgr-del" title="Remove item" onclick="rgrDelete('+it.entry_id+')">&times;</button>' : '';
  return '<div class="rgr-row'+(checked?' done':'')+'">'+box+
    '<div class="rgr-main"><div class="rgr-lbl">'+esc(it.label)+tag+'</div>'+stamp+photo+'</div>'+
    '<div class="rgr-actions">'+cam+del+'</div></div>';
}
function rgrRunCard(run, mgr){
  const t0=today0(), vd=vdate(run.visit_date);
  const days=Math.round((vd-t0)/864e5);
  const when=vd.toLocaleDateString("en-US",{weekday:"short",month:"long",day:"numeric"});
  const dlabel=days<0?(Math.abs(days)+" day"+(days===-1?"":"s")+" ago"):(days===0?"today":(days+" day"+(days===1?"":"s")+" away"));
  const pct=run.total?Math.round(run.done/run.total*100):0;
  const secs=(run.sections||[]).map(sec=>{
    const intro=RGR_SECTION_INTRO[sec.name]?'<div class="rgr-intro">'+esc(RGR_SECTION_INTRO[sec.name])+'</div>':'';
    const rows=(sec.items||[]).map(it=>rgrItemRow(it,run)).join("");
    const add='<div class="rgr-add">'+
      '<input type="text" placeholder="Add an item…" onkeydown="if(event.key===\'Enter\'){this.nextElementSibling.click();}">'+
      '<button class="add-btn" onclick="rgrAddItem(event,this,'+run.run_id+',\''+esc(sec.name)+'\')">Add</button></div>';
    return '<div class="rgr-sec"><div class="rgr-sec-h">'+esc(sec.name)+'</div>'+intro+rows+add+'</div>';
  }).join("");
  // Collapsible list: expanded by default for the store's GM (who works it);
  // collapsed for Owner/Supervisor (awareness / cross-patch broadcast) to keep the
  // top tidy. Default expanded for GM also avoids re-collapsing after each check.
  const open = !!(mgr && mgr.role==="GM");
  const toggle='<button class="seeall" onclick="toggleDetail(this)" style="margin-top:2px">'+
    '<span class="more" style="display:'+(open?'none':'')+'">Show checklist &#9662;</span>'+
    '<span class="less" style="display:'+(open?'':'none')+'">Hide checklist &#9652;</span></button>';
  return '<div class="card rgr-card" id="rgr-checklist">'+
    '<h3>RGR Prep &mdash; '+esc(run.store_name)+'<span class="ct">'+run.done+'/'+run.total+' ready</span></h3>'+
    '<div class="rgr-meta">Visit '+esc(when)+' &middot; '+esc(dlabel)+'</div>'+
    '<div class="rgr-bar"><div class="rgr-bar-fill" style="width:'+pct+'%"></div></div>'+
    toggle+'<div class="task-detail'+(open?' open':'')+'">'+secs+'</div></div>';
}
function renderRgrChecklist(rgr, mgr){
  const list=Array.isArray(rgr)?rgr:[];
  if(!list.length) return "";
  return list.map(r=>rgrRunCard(r, mgr)).join("");
}
// Banner CTA: expand the (collapsed-for-sup/owner) checklist AND scroll to it.
function rgrOpenChecklist(){
  const cards=document.querySelectorAll('.rgr-card');
  cards.forEach(card=>{
    const d=card.querySelector('.task-detail');
    if(d && !d.classList.contains('open')){
      d.classList.add('open');
      const btn=card.querySelector('.seeall');
      if(btn){ const m=btn.querySelector('.more'), l=btn.querySelector('.less');
        if(m) m.style.display='none'; if(l) l.style.display=''; }
    }
  });
  const first=document.getElementById('rgr-checklist');
  if(first) first.scrollIntoView({behavior:'smooth', block:'start'});
}
async function rgrCheck(runId, kind, id, checked){
  const body={action:"rgr_check", run_id:runId, checked:checked};
  if(kind==="tmpl") body.template_item_id=id; else body.entry_id=id;
  try{ setBoard(await callApi(body)); }
  catch(e){ alert("Couldn't save: "+(e&&e.message)); }
}
async function rgrPhoto(input, runId, kind, id){
  if(!input.files||!input.files.length) return;
  const fd=new FormData(); fd.append("action","rgr_photo"); fd.append("run_id",String(runId));
  if(kind==="tmpl") fd.append("template_item_id",String(id)); else fd.append("entry_id",String(id));
  fd.append("file", input.files[0]);
  input.disabled=true;
  try{ setBoard(await callApiForm(fd)); }
  catch(e){ input.disabled=false; alert("Upload failed: "+(e&&e.message)); }
}
async function rgrAddItem(ev, btn, runId, section){
  ev.stopPropagation();
  const inp=btn.previousElementSibling;
  const label=(inp&&inp.value||"").trim();
  if(!label){ if(inp) inp.focus(); return; }
  try{ setBoard(await callApi({action:"rgr_add_item", run_id:runId, label:label, section:section})); }
  catch(e){ alert("Add failed: "+(e&&e.message)); }
}
async function rgrDelete(entryId){
  if(!confirm("Remove this added item?")) return;
  try{ setBoard(await callApi({action:"rgr_delete_item", entry_id:entryId})); }
  catch(e){ alert("Delete failed: "+(e&&e.message)); }
}

function dueTag(due_at){
  if(!due_at) return "";
  const d=vdate(due_at), t0=today0();
  const days=Math.round((d-t0)/864e5);
  const label=fmtDate(d);
  if(days<0) return '<span class="t-tag due-over">Overdue '+esc(label)+'</span>';
  if(days===0) return '<span class="t-tag due-over">Due today</span>';
  if(days<=7) return '<span class="t-tag due-soon">Due '+esc(label)+'</span>';
  return '<span class="t-tag">Due '+esc(label)+'</span>';
}
function statusTag(status){
  return '<span class="t-tag st-'+esc(status||"new")+'">'+esc(String(status||"").replace("_"," "))+'</span>';
}
function cohortsTag(c){
  return c ? '<span class="t-tag">w/ '+esc(c)+'</span>' : "";
}
function categoryTag(cat){
  const c=String(cat||"").trim().toLowerCase();
  if(!c) return "";
  return '<span class="t-tag cat cat-'+esc(c)+'">'+esc(c)+'</span>';
}
function categoryOptionsHtml(sel){
  let h='<option value=""'+(!sel?' selected':'')+'>— None —</option>';
  CATEGORY_OPTS.forEach(v=>{
    h+='<option value="'+v+'"'+(v===sel?' selected':'')+'>'+v+'</option>';
  });
  return h;
}

function storeOptionsHtml(stores, selectedId){
  let h='<option value=""'+(selectedId==null?' selected':'')+'>— Cross-store / Org —</option>';
  stores.forEach(s=>{
    h+='<option value="'+s.id+'"'+(selectedId==s.id?' selected':'')+'>'+esc(s.name)+'</option>';
  });
  return h;
}
function optionsHtml(arr, sel){
  return arr.map(v=>'<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(v)+'</option>').join("");
}

      '<textarea name="description">'+esc(t.description||"")+'</textarea></div>'+
    '<div class="row-actions">'+
      '<button class="act" onclick="cancelEdit(event,this)">Cancel</button>'+
      '<button class="act primary" onclick="saveEdit(event,this)">Save</button>'+
    '</div>'+
  '</div>';
}

      '<div><label>Status</label>'+
        '<select name="status">'+optionsHtml(STATUS_OPTS,"new")+'</select></div>'+
      '<div><label>Due date</label>'+
        '<input type="date" name="due_at"></div>'+
      '<div><label>Store</label>'+

// renderTurnover - crew + shift-leader monthly turnover with a 6-month
// sparkline. One section per role. Each row: store, # (roster_size),
// latest TTM%, latest monthly%, sparkline. Owner sees a synthesized
// Combined row (from turnover_org view) on top. Color thresholds tuned
// to org crew avg ~80%: green < 80, amber 80-119, red >= 120.
function renderTurnover(rows){
  if(!Array.isArray(rows) || !rows.length) return "";
  const byRole = {crew: [], shift_leader: []};
  rows.forEach(r => { (byRole[r.role] = byRole[r.role] || []).push(r); });
  const labelOf = role => role === 'crew' ? 'Crew' : 'Shift Leader';
  const colorOf = pct => {
    if (pct == null) return 'var(--muted)';
    if (pct < 80) return 'var(--ok)';
    if (pct < 120) return 'var(--warn)';
    return 'var(--urgent)';
  };
  const sparkline = trend => {
    const W = 84, H = 22, P = 2;
    const vals = (trend||[]).map(t => Number(t.pct)).filter(v => !isNaN(v));
    if (vals.length < 2) return '<span style="color:var(--muted);font-size:11px">—</span>';
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const range = hi - lo || 1;
    const pts = vals.map((v, i) => {
      const x = P + (i * (W - 2*P) / (vals.length - 1));
      const y = H - P - ((v - lo) / range) * (H - 2*P);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    const last = vals[vals.length - 1];
    const lastX = (W - P).toFixed(1);
    const lastY = (H - P - ((last - lo) / range) * (H - 2*P)).toFixed(1);
    return '<svg width="'+W+'" height="'+H+'" style="vertical-align:middle">'+
           '<polyline fill="none" stroke="var(--accent)" stroke-width="1.5" points="'+pts+'"/>'+
           '<circle cx="'+lastX+'" cy="'+lastY+'" r="2" fill="'+colorOf(last)+'"/>'+
           '</svg>';
  };
  // Derive "Through {Month YYYY}" from the freshest latest_month across rows.
  // Parse YYYY-MM parts manually (avoid Date() UTC-shift into the prior month).
  const months = rows.map(r => r.latest_month).filter(Boolean).sort();
  const maxMo = months.length ? months[months.length - 1] : null;
  let throughMo = '';
  if (maxMo) {
    const m = String(maxMo).match(/^(\d{4})-(\d{2})/);
    if (m) {
      const MONTHS = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
      const mi = parseInt(m[2], 10) - 1;
      if (mi >= 0 && mi < 12) throughMo = MONTHS[mi] + ' ' + m[1];
    }
  }
  let h = '<div class="card"><h3>Turnover</h3>'+
          '<div class="summary">'+(throughMo ? 'Through '+throughMo+' &middot; ' : '')+
          'Monthly annualized &middot; trailing 12mo % &middot; 6-mo trend</div>';
  for (const role of ['crew','shift_leader']) {
    const list = byRole[role] || [];
    if (!list.length) continue;
    h += '<div style="margin-top:8px;font-weight:600;font-size:12px;color:var(--muted);'+
         'text-transform:uppercase;letter-spacing:.6px">'+labelOf(role)+'</div>';
    h += '<table style="width:100%;font-size:12.5px;border-collapse:collapse;margin-top:4px">'+
         '<thead><tr style="text-align:left;color:var(--muted);font-weight:500">'+
         '<th style="padding:4px 6px 4px 0">Store</th>'+
         '<th style="padding:4px 6px;text-align:right">#</th>'+
         '<th style="padding:4px 6px;text-align:right">TTM%</th>'+
         '<th style="padding:4px 6px;text-align:right">This mo%</th>'+
         '<th style="padding:4px 0 4px 6px;text-align:right">6mo</th>'+
         '</tr></thead><tbody>';
    list.forEach(r => {
      const ttm = r.latest_ttm_pct == null ? '—' : Number(r.latest_ttm_pct).toFixed(0)+'%';
      const mo  = r.latest_monthly_pct == null ? '—' : Number(r.latest_monthly_pct).toFixed(0)+'%';
      const ros = r.latest_roster == null ? '—' : Number(r.latest_roster).toLocaleString();
      const isCombined = r.store_id == null;
      h += '<tr style="border-top:1px solid var(--line)">'+
           '<td style="padding:6px 6px 6px 0;'+(isCombined?'font-weight:700':'')+'">'+
             esc(r.store_name||'')+'</td>'+
           '<td style="padding:6px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums">'+ros+'</td>'+
           '<td style="padding:6px;text-align:right;color:'+colorOf(r.latest_ttm_pct)+';font-weight:600">'+ttm+'</td>'+
           '<td style="padding:6px;text-align:right;color:var(--muted)">'+mo+'</td>'+
           '<td style="padding:6px 0 6px 6px;text-align:right">'+sparkline(r.trend)+'</td>'+
           '</tr>';
    });
    h += '</tbody></table>';
  }
  return h + '</div>';
}

// Product Sales card — MTD Product Sales + YoY, MTD GC + YoY, MTD Avg Check,
// Trailing 52-week Product Sales. Labels grow transparently with days_loaded
// until we hit a full year.
function renderProductSales(rows){
  if(!Array.isArray(rows) || !rows.length) return "";
  rows = rows.filter(r => r.store_id != null);  // drop Combined row; portfolio MTD now lives in the top Sales & Guests card
  if(!rows.length) return "";
  if(!rows.some(r => r.mtd_product_sales != null || r.t52w_product_sales != null)) return "";

  const $$  = v => (v==null) ? '&mdash;' : '$'+Number(v).toLocaleString('en-US',{maximumFractionDigits:0});
  const $$2 = v => (v==null) ? '&mdash;' : '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const pct = v => {
    if(v==null) return '&mdash;';
    const n = Number(v);
    const cls = n > 0 ? 'up' : (n < 0 ? 'dn' : '');
    const sign = n > 0 ? '+' : '';
    return '<span class="'+cls+'">'+sign+n.toFixed(1)+'%</span>';
  };
  const num = v => (v==null) ? '&mdash;' : Number(v).toLocaleString('en-US');
  const shortName = n => {
    const s = String(n||"").trim();
    if(s.toLowerCase()==="combined") return "Combined";
    return s.replace(/^\d{4,6}\s*-\s*/,"").split(/[-/]/)[0].trim() || s;
  };

  const periods = rows.map(r => r.mtd_last_day).filter(Boolean).sort();
  const mtdDays = Math.max(0, ...rows.map(r => r.mtd_days_loaded || 0));
  const t52wDays = Math.max(0, ...rows.map(r => r.t52w_days_loaded || 0));
  const asOf = periods.length ? fmtDate(vdate(periods[periods.length - 1])) : '';
  const mtdLabel = 'MTD &middot; '+mtdDays+' day'+(mtdDays===1?'':'s')+' loaded'+(asOf?' &middot; through '+esc(asOf):'');
  const t52wLabel = t52wDays >= 365
    ? 'Trailing 52w'
    : 'Trailing 52w &middot; '+t52wDays+' day'+(t52wDays===1?'':'s')+' loaded (growing)';

  let h = '<div class="card"><h3>Product Sales</h3>'+
          '<div class="summary">'+mtdLabel+'</div>';

  h += '<table class="mr-tbl" style="margin-top:6px">'+
       '<colgroup><col class="c-mgr"><col class="c-ps"><col class="c-yoy">'+
       '<col class="c-gcv"><col class="c-yoy"><col class="c-avg"></colgroup>'+
       '<thead><tr><th class="l">Store</th><th>MTD$</th><th>YoY</th>'+
       '<th>GC</th><th>GC YoY</th><th>Avg$</th></tr></thead><tbody>';
  rows.forEach(r => {
    const isCombined = r.store_id == null;
    h += '<tr'+(isCombined?' class="top"':'')+'>'+
         '<td class="l" title="'+esc(r.store_name||"")+'">'+esc(shortName(r.store_name))+'</td>'+
         '<td>'+$$(r.mtd_product_sales)+'</td>'+
         '<td>'+pct(r.mtd_yoy_pct)+'</td>'+
         '<td>'+num(r.mtd_gc)+'</td>'+
         '<td>'+pct(r.mtd_gc_yoy_pct)+'</td>'+
         '<td>'+$$2(r.mtd_avg_check)+'</td></tr>';
  });
  h += '</tbody></table>';

  h += '<div class="sub2" style="margin-top:12px">'+t52wLabel+'</div>'+
       '<table class="mr-tbl">'+
       '<colgroup><col class="c-mgr"><col class="c-ps"></colgroup>'+
       '<thead><tr><th class="l">Store</th><th>Sales</th></tr></thead><tbody>';
  rows.forEach(r => {
    const isCombined = r.store_id == null;
    h += '<tr'+(isCombined?' class="top"':'')+'>'+
         '<td class="l" title="'+esc(r.store_name||"")+'">'+esc(shortName(r.store_name))+'</td>'+
         '<td>'+$$(r.t52w_product_sales)+'</td></tr>';
  });
  h += '</tbody></table>';

  return h + '</div>';
}

// Bonus plan (Q1 GM Bonus Plan reference + earned $ rollup by store).
// Shown for every role — supervisors review their patch's bonus performance,
// GMs see their own store, Owner sees all.
// Aggregates bonus_rankings rows for ONE quarter (filter by quarter key)
// into per-store dollar totals, sorted highest-earning first.
function aggregateBonusByStore(results, quarterKey){
  const by = {};
  (results||[])
    .filter(r => (r.quarter||'').trim() === quarterKey)
    .forEach(r => {
      const k = r.store_name || r.store || '?';
      if(!by[k]) by[k] = { store:k, dollars:0, count:0 };
      by[k].dollars += Number(r.award_amount || 0);
      by[k].count += 1;
    });
  return Object.values(by).sort((a,b) => b.dollars - a.dollars);
}

// === Adjusted Q1 Bonuses card (compute_q1_2026_trueup) ===
// Pins per-recipient bonus payouts from public.bonus_adjustments alongside
// the original Q1 placements from bonus_rankings, so each viewer sees
// both what they were originally paid AND the true-up total. The Edge
// Function attaches original_amount, adjusted_amount, and delta_amount
// to every row (delta = additional dollars to cut in the true-up payroll).
//
// Visibility:
//   GM      -> sees their own row + DM/AM rows at their store
//   Sup     -> sees their own row + all GM/DM/AM rows in their patch
//   Owner   -> sees everything
//   Other   -> card is hidden
function renderBonusAdjustments(rows, mgr){
  if(!Array.isArray(rows) || !rows.length) return "";
  const role = (mgr && mgr.role) || "";
  if(role !== "GM" && role !== "Supervisor" && role !== "Owner") return "";

  // Group rows by manager so each person has one block, summing original /
  // adjusted / delta across any sub-rows (a supervisor with one patch row
  // collapses cleanly; the structure also supports future multi-row cases).
  const byMgr = new Map();
  rows.forEach(r => {
    const k = r.manager_id;
    if(!byMgr.has(k)) byMgr.set(k, {
      manager_id: k, manager_name: r.manager_name,
      is_self: !!r.is_self, role: r.role,
      rows: [], original: 0, adjusted: 0, delta: 0,
    });
    const g = byMgr.get(k);
    g.rows.push(r);
    g.original += Number(r.original_amount || 0);
    g.adjusted += Number(r.adjusted_amount || 0);
    g.delta    += Number(r.delta_amount || 0);
    const rank = { supervisor:0, gm:1, am:2, dm:3 };
    if((rank[r.role] ?? 9) < (rank[g.role] ?? 9)) g.role = r.role;
  });

  // Sort: self first, then supervisors, then GMs, then DMs/AMs.
  const tier = { supervisor:1, gm:2, am:3, dm:4 };
  const groups = Array.from(byMgr.values()).sort((a,b)=>{
    if(a.is_self !== b.is_self) return a.is_self ? -1 : 1;
    const ta = tier[a.role] ?? 9, tb = tier[b.role] ?? 9;
    if(ta !== tb) return ta - tb;
    return String(a.manager_name).localeCompare(String(b.manager_name));
  });

  const quarter = esc(rows[0].quarter || "Q1 2026");
  const totals = rows.reduce((acc,r)=>{

function vtFmt(v){return v==null?"&mdash;":(Math.round(v*10)/10);}
function vtLab(k){return (STATE.data.voice_trend&&STATE.data.voice_trend.labels[k])||k;}
function vtArrow(d){ if(d==null)return '<span style="color:var(--muted)">·</span>';
  if(d>0)return '<span style="color:#16a34a;font-weight:700">&#9650;'+vtFmt(d)+'</span>';
  if(d<0)return '<span style="color:#dc2626;font-weight:700">&#9660;'+vtFmt(Math.abs(d))+'</span>';
  return '<span style="color:var(--muted)">0</span>'; }
function vtVsBU(c){ if(c.june==null||c.bu==null) return ["var(--paper)","var(--fg)"];
  const good=c.lower_better?(c.june<=c.bu):(c.june>=c.bu);
  const strong=Math.abs(c.june-c.bu)>=5;
  if(good) return [strong?"#15803d":"#2f9e54","#fff"];
  return [strong?"#b4231b":"#cf5b52","#fff"]; }
function vtRank(c){ if(!c.rank)return ""; const top=c.rank<=3,bot=c.rank>(c.rank_of-3);
  const col=top?"#16a34a":(bot?"#dc2626":"var(--muted)");
  return '<span style="font-weight:700;font-size:10.5px;color:'+col+'">#'+c.rank+'/'+c.rank_of+'</span>'; }
function vtGraph(series,bu,lowerBetter){
  if(!series||series.length<2) return '<div style="font-size:11px;color:var(--muted);margin-top:4px">Not enough history to graph.</div>';
  const W=420,H=90,pad=6;
  const vals=series.map(d=>d.v).concat(bu!=null?[bu]:[]);
  let mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals); if(mx-mn<4){mx+=2;mn-=2;}
  const x=i=>pad+i*(W-2*pad)/(series.length-1), y=v=>H-pad-(v-mn)/(mx-mn)*(H-2*pad);
  const pts=series.map((d,i)=>x(i)+","+y(d.v).toFixed(1)).join(" ");
  const last=series[series.length-1];
  const buline=bu!=null?'<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+y(bu).toFixed(1)+'" y2="'+y(bu).toFixed(1)+'" stroke="#d4a017" stroke-dasharray="4 3" stroke-width="1"/><text x="'+(W-pad)+'" y="'+(y(bu)-3).toFixed(1)+'" fill="#d4a017" font-size="9" text-anchor="end">BU '+vtFmt(bu)+'</text>':'';
  const good=lowerBetter?(last.v<=(bu==null?last.v:bu)):(last.v>=(bu==null?last.v:bu));
  const stroke=good?"#16a34a":"#dc2626";
  const labels=series.map((d,i)=>(i%2===0)?'<text x="'+x(i).toFixed(1)+'" y="'+(H-1)+'" fill="#94a3b8" font-size="8" text-anchor="middle">'+d.p+'</text>':'').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:84px;display:block;margin-top:4px">'+buline+'<polyline points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="2"/><circle cx="'+x(series.length-1).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="3.2" fill="'+stroke+'"/>'+labels+'</svg>';
}

// ---- Open Complaints card ------------------------------------------
// Surfaces complaint rows that pull_complaints.py created from
// us-care.mcdonalds.com emails. Each row has an SLA badge (Overdue / Due
// today / Due tomorrow / Within SLA) based on the linked task's 72h due_at,
// sorted by SLA pressure. Expand reveals the full complaint text + the
// draft response email (sliced out of task description) + Mark Resolved.

function slaBucket(dueAt){
  // Returns {key, label} for the SLA badge. Keyed off due_at (the 72h clock).
  if(!dueAt) return {key:"ok", label:"Within SLA"};
  const due=new Date(dueAt).getTime(), now=Date.now();
  const ms=due-now, h=ms/3600000;
  if(h < 0) return {key:"over", label:"Overdue"};
  if(h < 24) return {key:"today", label:"Due today"};
  if(h < 48) return {key:"tom", label:"Due tomorrow"};
  return {key:"ok", label:"Within SLA"};
}
function ageSince(ts){
  if(!ts) return "";
  const ms=Date.now()-new Date(ts).getTime();
  const h=Math.floor(ms/3600000);
  if(h < 1) return "just now";
  if(h < 24) return h+"h ago";
  const d=Math.floor(h/24);
  return d+"d ago";
}

// Pull the draft response email out of the task description. The loader
// (pull_complaints.py / build_task_description) writes a "---" rule then
// "**Draft response email** (paste...)" then the body. We grab everything
// after that header and strip the parenthetical.
function extractDraft(desc){
  if(!desc) return "";
  const m=String(desc).match(/\*\*Draft response email\*\*[^\n]*\n+([\s\S]+)$/);
  return m ? m[1].trim() : "";
}

function renderComplaints(rows){
  if(!rows || !rows.length) return "";
  // Sort: SLA pressure first (over -> today -> tom -> ok), then earliest due.
  const order={over:0, today:1, tom:2, ok:3};
  const enriched=rows.map(r=>({...r, _sla: slaBucket(r.due_at)}));
  enriched.sort((a,b)=>{
    const oa=order[a._sla.key]??9, ob=order[b._sla.key]??9;

        enriched.length+'</span></h3>'+

  enriched.forEach(c=>{
    const sla=c._sla;
    const issue=c.issue_subcode || c.issue_reason || c.issue_category || "see details";
    const cust=c.customer_name || "(unknown customer)";
    const store=c.store_name || "";
    const draft=extractDraft(c.task_description);
    const comment=(c.comment && String(c.comment).trim()) || "(no comment captured)";

    // Row head - intentionally NO phone number (PII; link-leak concern).

    // the draft response in copyable form + Mark Resolved.
    const phoneLine = c.customer_phone
      ? '<div><span class="k">Phone</span>'+esc(c.customer_phone)+'</div>' : '';
    const emailLine = c.customer_email
      ? '<div><span class="k">Email</span><a href="mailto:'+esc(c.customer_email)+'">'+
        esc(c.customer_email)+'</a></div>' : '';
    const closureLine = c.closure_url
      ? '<div style="margin-top:6px;font-size:11.5px"><a href="'+esc(c.closure_url)+
        '" target="_blank" rel="noopener" style="color:var(--accent)">'+
        '&rarr; Close case in McD portal</a></div>' : '';
    const draftBlock = draft
      ? '<div class="c-section">'+
        '<div class="c-label">Draft response email'+
          '<button class="c-copy" data-copy-id="'+c.id+'" onclick="copyDraft(event,this)">Copy</button>'+
        '</div>'+
        '<div class="c-quote draft" id="draft-'+c.id+'">'+esc(draft)+'</div></div>'
      : '';

    h+='<div class="c-row sla-'+sla.key+'" data-id="'+c.id+'">'+
       '<div class="c-head" onclick="toggleComplaint(this)">'+
         '<div class="c-top">'+
           '<span class="c-id">'+idStr+'</span>'+
           '<span>'+ageSince(c.received_at)+'</span>'+
           storeTag+
         '</div>'+
         '<div class="c-title">'+
           '<span class="who">'+esc(cust)+'</span>'+
           '<span class="sep">&middot;</span>'+
           '<span class="what">'+esc(issue)+'</span>'+
         '</div>'+
         '<div class="c-meta">'+
           '<span class="sla '+sla.key+'">'+esc(sla.label)+'</span>'+
           recovTag+
         '</div>'+
       '</div>'+
       '<div class="c-body">'+
         '<div class="c-section">'+
           '<div class="c-label">Customer&rsquo;s words</div>'+
           '<div class="c-quote">'+esc(comment)+'</div>'+
         '</div>'+
         (phoneLine||emailLine||closureLine ?
           '<div class="c-section"><div class="c-label">Contact</div>'+
           '<div class="c-contact">'+phoneLine+emailLine+closureLine+'</div></div>' : '')+
         draftBlock+
         '<div class="c-actions">'+
           '<button class="act primary" onclick="resolveComplaint(event,this)">Mark resolved</button>'+
         '</div>'+
       '</div>'+
       '</div>';
  });
  return h+'</div>';
}

function renderManualReports(rows){
  // Owner-only: non-Owner payloads omit data.manual_reports entirely, so this
  // returns "" for everyone else. Two sections (manual feeds vs auto-pipeline
  // health); overdue first; quiet "all current" headline when nothing's flagged.
  if(!rows || !rows.length) return "";
  const rank={overdue:0, unknown:1, ok:2};
  const fmt=(d)=> d ? esc(String(d).slice(0,10)) : '&mdash;';
  const badge=(s)=>{
    const css = (s==='overdue') ? 'background:#c0392b;color:#fff'
              : (s==='unknown') ? 'background:#f59e0b;color:#fff'
              :                   'background:#e5e7eb;color:var(--muted)';
    return '<span style="font-size:10px;font-weight:700;text-transform:uppercase;'+
           'letter-spacing:.04em;padding:2px 7px;border-radius:10px;'+css+'">'+
           esc(s||'?')+'</span>';
  };
  const sortRows=(list)=> list.slice().sort((a,b)=>{
    const oa=rank[a.status]??9, ob=rank[b.status]??9;
    if(oa!==ob) return oa-ob;
    return (b.days_since??-1)-(a.days_since??-1);
  });
  const sectionHtml=(title, list)=>{
    if(!list.length) return '';
    let s='<div class="c-label" style="margin-top:12px">'+esc(title)+'</div>';
    sortRows(list).forEach(r=>{
      s+='<div style="display:flex;justify-content:space-between;align-items:center;'+
         'gap:8px;padding:6px 0;border-bottom:1px solid var(--line,#eee)">'+
         '<div><div style="font-weight:600">'+esc(r.label)+'</div>'+
         '<div style="font-size:11px;color:var(--muted)">'+esc(r.cadence)+
         ' &middot; through '+fmt(r.last_business_date)+'</div></div>'+
         badge(r.status)+'</div>';
    });
    return s;
  };
  const manual=rows.filter(r=>r.category==='manual');
  const auto=rows.filter(r=>r.category==='auto');
  const flagged=rows.filter(r=>r.status!=='ok').length;
  const dataThrough=rows.map(r=>r.last_business_date).filter(Boolean).sort().slice(-1)[0];
  let h='<div class="card"><h3>Manual Reports &mdash; needs attention'+
        (flagged?'<span class="ct">'+flagged+'</span>':'')+'</h3>'+
        '<div class="summary">Pipeline freshness &middot; data through '+fmt(dataThrough)+'</div>';
  if(!flagged) h+='<div class="summary" style="margin-top:4px">&#10003; All feeds current.</div>';
  h+=sectionHtml('Manual feeds — your action', manual);
  h+=sectionHtml('Auto pipeline — health', auto);
  return h+'</div>';
}

function flashHtml(result){
  if(!result) return "";

function renderKeyDates(rows){
  // Promos & Key Dates - upcoming promo windows, price rounds, deadlines and
  // events from calendar_events (next 60 days, scope/role-filtered server-side).
  if(!rows || !rows.length) return "";
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const ymd=(s)=>{ if(!s) return null; const p=String(s).slice(0,10).split("-").map(Number);
                   return new Date(p[0],p[1]-1,p[2]); };
  const fmt=(s)=>{ const d=ymd(s); return d? MON[d.getMonth()]+" "+d.getDate() : ""; };
  const window=(r)=>{ const a=fmt(r.event_date);
    if(r.end_date && String(r.end_date).slice(0,10)!==String(r.event_date).slice(0,10))
      return a+" – "+fmt(r.end_date);
    return a; };
  const kindCss={promo:"background:#16a34a;color:#fff",
                 "price-round":"background:#2563eb;color:#fff",
                 deadline:"background:#c0392b;color:#fff",
                 event:"background:var(--muted);color:#fff"};
  const kindLabel={promo:"Promo","price-round":"Price",deadline:"Deadline",event:"Event"};
  const badge=(k)=> '<span style="font-size:10px;font-weight:700;text-transform:uppercase;'+
    'letter-spacing:.04em;padding:2px 7px;border-radius:10px;'+(kindCss[k]||kindCss.event)+'">'+
    esc(kindLabel[k]||k)+'</span>';
  const t0=today0();
  const DAY=86400000;
  // Two sections: Current Offers = already live (started, still running);
  // Upcoming Offers = not yet started. Within each, sort by urgency first
  // (relevant date within 7 days floats up), then kind tier
  // (deadline > price-round > promo > event), then soonest date, then title.
  const kindRank={deadline:0,"price-round":1,promo:2,event:3};
  const effEnd=(r)=> ymd(r.end_date) || ymd(r.event_date);
  const days=(d)=> d? Math.round((d.getTime()-t0.getTime())/DAY) : null; // whole days from today
  const URGENT=7;
  const current=[], upcoming=[];
  rows.forEach(r=>{ const s=ymd(r.event_date);
    if(s && s<=t0) current.push(r); else upcoming.push(r); });
  const sortSec=(arr,dateOf)=> arr.slice().sort((a,b)=>{
    const ua=days(dateOf(a)), ub=days(dateOf(b));
    const au=(ua!=null&&ua<=URGENT)?0:1, bu=(ub!=null&&ub<=URGENT)?0:1;
    if(au!==bu) return au-bu;
    const ka=kindRank[a.kind]??9, kb=kindRank[b.kind]??9;
    if(ka!==kb) return ka-kb;
    const da=ua==null?1e9:ua, db=ub==null?1e9:ub;
    if(da!==db) return da-db;
    return String(a.title||"").localeCompare(String(b.title||""));
  });
  const cur=sortSec(current, effEnd);
  const up =sortSec(upcoming, r=>ymd(r.event_date));
  const dayWord=(n)=> n<=0?"today": n===1?"tomorrow": ("in "+n+" days");
  const curHint=(r)=>{ const n=days(effEnd(r)); return (n!=null&&n<=URGENT)?"ends "+dayWord(n):""; };
  const upHint =(r)=>{ const n=days(ymd(r.event_date)); return (n!=null&&n<=URGENT)?"starts "+dayWord(n):""; };
  const rowHtml=(r,hint)=>{
    const where = r.store_name ? ' &middot; '+esc(r.store_name)
                : (r.scope==='role' && r.scope_role) ? ' &middot; '+esc(r.scope_role)
                : '';
    return '<div style="display:flex;justify-content:space-between;align-items:flex-start;'+
       'gap:10px;padding:7px 0;border-bottom:1px solid var(--line,#eee)">'+
       '<div style="min-width:0">'+
       '<div style="font-weight:600">'+esc(r.title||"")+'</div>'+
       '<div style="font-size:11px;color:var(--muted)">'+esc(window(r))+
       (hint?' &middot; <span style="color:#c0392b;font-weight:600">'+esc(hint)+'</span>':'')+
       where+
       (r.notes?' &middot; '+esc(String(r.notes)):'')+'</div></div>'+
       badge(r.kind)+'</div>';
  };
  const section=(label,arr,hintFn)=> !arr.length?"":
    '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;'+
    'color:var(--muted);margin:11px 0 1px">'+esc(label)+
    ' <span style="opacity:.6">('+arr.length+')</span></div>'+
    arr.map(r=>rowHtml(r,hintFn(r))).join("");
  const now=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
  let h='<div class="card"><h3>Promos &amp; Key Dates<span class="ct">'+rows.length+'</span></h3>'+
        '<div class="summary">Next 60 days (as of '+esc(now)+')</div>';
  h+=section("Current Offers", cur, curHint);
  h+=section("Upcoming Offers", up, upHint);
  return h+'</div>';
}

function monthLabel(iso){
  if(!iso) return "";
  const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const p=String(iso).slice(0,7).split("-");
  return p.length===2 ? (m[+p[1]-1]+" "+p[0]) : String(iso);
}

async function callApiForm(fd){
  const r=await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN), { method:"POST", body: fd });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function submitCampaignUpload(input, campaignId){
  if(!input.files || !input.files.length) return;
  const fd=new FormData();
  fd.append("action","campaign_upload");
  fd.append("campaign_id", String(campaignId));
  for(const f of input.files) fd.append("files", f);
  input.disabled=true;
  try{ const res=await callApiForm(fd); setBoard(res); }
  catch(e){ input.disabled=false; alert("Upload failed: " + (e && e.message)); }
}
function lb(url){
  let o=document.getElementById('lbox');
  if(!o){
    o=document.createElement('div'); o.id='lbox';
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px';
    o.onclick=function(){ o.style.display='none'; };
    o.innerHTML='<img id="lboxImg" style="max-width:100%;max-height:100%;border-radius:8px">';
    document.body.appendChild(o);
  }
  document.getElementById('lboxImg').src=url; o.style.display='flex';
}
function openNewCampaignForm(){ const m=document.getElementById('campNewMount'); if(m) m.innerHTML=campaignFormHtml(); }
async function saveCampaign(ev, btn){
  ev.stopPropagation();
  const form=btn.closest(".form");
  const title=form.querySelector('[name=title]').value.trim();
  if(!title){ alert("Title is required."); return; }
  const payload={ action:"campaign_create", title,
    prompt: form.querySelector('[name=prompt]').value.trim(),
    campaign_type: form.querySelector('[name=campaign_type]').value,
    due_at: form.querySelector('[name=due_at]').value,
    target_store_ids: "all" };
  form.classList.add("busy");
  try{ const res=await callApi(payload); setBoard(res); }
  catch(e){ form.classList.remove("busy"); alert("Create failed: " + (e && e.message)); }
}
async function closeCampaign(ev, btn, id){
  ev.stopPropagation();
  if(!confirm("Close this campaign? It will stop accepting uploads.")) return;
  btn.disabled=true;
  try{ const res=await callApi({ action:"campaign_close", campaign_id:id }); setBoard(res); }
  catch(e){ btn.disabled=false; alert("Close failed: " + (e && e.message)); }
}

// ---- Sales & Guests comps — daily YoY pulse + MTD chart -------------
// Driven by data.sales_comps (Edge Fn v33): { data_through, mtd:{sales,
// sales_yoy,gc,gc_yoy}, series:[{date,sales,sales_yoy,gc,gc_yoy}] }. Scoped
// per role server-side (Owner=all 12, Sup=patch, GM=their store). Sales-
// weighted YoY for $, GC-weighted YoY for guests — mirrors the sales_summary
// view math. Pinned near the top of the board.
function renderSalesComps(sc){
  if(!sc || !Array.isArray(sc.series) || !sc.series.length) return "";
  const series=sc.series, mtd=sc.mtd||{}, last=series[series.length-1]||{};
  const fmtK=n=>{ if(n==null) return '&mdash;'; const a=Math.abs(n);
    if(a>=1e6) return '$'+(n/1e6).toFixed(2)+'M'; if(a>=1e3) return '$'+Math.round(n/1e3)+'K'; return '$'+Math.round(n); };
  const fmtKn=n=>{ if(n==null) return '&mdash;'; return n>=1e3? (n/1e3).toFixed(1)+'K' : String(Math.round(n)); };
  const pctTxt=v=> v==null?'&mdash;':(v>0?'+':'')+Number(v).toFixed(1)+'%';
  const cls=v=> v==null?'':(v>0?'up':(v<0?'dn':''));

  // ---- dual-line SVG chart (sales YoY gold, guests YoY blue), zero baseline
  const W=300,H=118,L=10,Rp=10,T=10,B=20;
  const sV=series.map(p=>p.sales_yoy), gV=series.map(p=>p.gc_yoy);
  const all=sV.concat(gV).filter(v=>v!=null);
  let lo=Math.min(0,...all), hi=Math.max(0,...all);
  if(lo===hi){lo-=1;hi+=1;}
  const padv=(hi-lo)*0.14||1; lo-=padv; hi+=padv;
  const x=i=> series.length<=1 ? (L+(W-L-Rp)/2) : (L + i*(W-L-Rp)/(series.length-1));
  const y=v=> T + (H-T-B)*(1-(v-lo)/(hi-lo));
  const line=(vals,color)=>{
    const pts=vals.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    if(!pts.length) return '';
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const dots=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.1" fill="'+color+'"/>').join('');
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots;
  };
  const SALES='var(--accent)', GUESTS='#3b82f6';
  const zeroY=y(0).toFixed(1);
  const dayLbl=iso=>String(iso).slice(8,10).replace(/^0/,'');
  const svg='<svg class="comp-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<line x1="'+L+'" y1="'+zeroY+'" x2="'+(W-Rp)+'" y2="'+zeroY+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>'+
    '<text x="'+L+'" y="'+(T+7)+'" font-size="9" fill="var(--muted)">'+pctTxt(Math.round(hi))+'</text>'+
    '<text x="'+L+'" y="'+(H-B+13)+'" font-size="9" fill="var(--muted)">'+pctTxt(Math.round(lo))+'</text>'+
    '<text x="'+L+'" y="'+(H-3)+'" font-size="9" fill="var(--muted)">'+dayLbl(series[0].date)+'</text>'+
    '<text x="'+(W-Rp)+'" y="'+(H-3)+'" font-size="9" fill="var(--muted)" text-anchor="end">'+dayLbl(last.date)+'</text>'+
    line(gV,GUESTS)+line(sV,SALES)+'</svg>';

  return '<div class="comps sec" id="sec-sales-card"><h3>Sales &amp; Guests &mdash; YoY'+
    '<span class="meta">MTD through '+esc(fmtDate(vdate(sc.data_through)))+'</span></h3>'+
    '<div class="comp-nums">'+
      '<div class="comp"><div class="l">Sales YoY</div>'+
        '<div class="v '+cls(mtd.sales_yoy)+'">'+pctTxt(mtd.sales_yoy)+'</div>'+
        '<div class="s">'+fmtK(mtd.sales)+' MTD &middot; latest '+pctTxt(last.sales_yoy)+'</div></div>'+
      '<div class="comp"><div class="l">Guests YoY</div>'+
        '<div class="v '+cls(mtd.gc_yoy)+'">'+pctTxt(mtd.gc_yoy)+'</div>'+
        '<div class="s">'+fmtKn(mtd.gc)+' MTD &middot; latest '+pctTxt(last.gc_yoy)+'</div></div>'+
    '</div>'+svg+
    '<div class="comp-legend"><span><i style="border-color:var(--accent)"></i>Sales YoY</span>'+
      '<span><i style="border-color:#3b82f6"></i>Guests YoY</span></div>'+
    '</div>';
}

// ---- Top-5 tasks widget + expandable detail ------------------------
const PRANK={urgent:0,high:1,normal:2,low:3};
function topTasks(tasks,n){
  return tasks.slice().sort((a,b)=>{
    const pa=PRANK[a.priority]??2, pb=PRANK[b.priority]??2;
    if(pa!==pb) return pa-pb;
    const ad=a.due_at?vdate(a.due_at).getTime():Infinity;
    const bd=b.due_at?vdate(b.due_at).getTime():Infinity;
    return ad-bd;
  }).slice(0,n);
}
function renderTasksBlock(tasks, stores){
  // Full breakdown (Hot / per-store / Cross-store) — same grouping as before.
  const hot=tasks.filter(t=>t.priority==="urgent"||t.priority==="high")
    .sort((a,b)=>{const ad=a.due_at?vdate(a.due_at).getTime():Infinity;
      const bd=b.due_at?vdate(b.due_at).getTime():Infinity;return ad-bd;});
  let d=section("Hot — high priority", hot, "Across all your stores.");
  stores.forEach(store=>{
    const list=tasks.filter(t=>t.store_id===store.id && t.priority!=="urgent" && t.priority!=="high");
    d+=section(store.name, list);
  });
  const cross=tasks.filter(t=>!t.store_id && t.priority!=="urgent" && t.priority!=="high");
  d+=section("Cross-store / Org", cross);

  if(tasks.length<=5) return d;            // few enough: show the full breakdown directly
  const top=topTasks(tasks,5);
  let h=section("Your top tasks", top, "Highest priority &amp; soonest due.");
  h+='<button class="seeall" onclick="toggleDetail(this)">'+
     '<span class="more">See all '+tasks.length+' tasks &#9662;</span>'+
     '<span class="less" style="display:none">Show less &#9652;</span></button>';
  h+='<div class="task-detail">'+d+'</div>';
  return h;
}
function toggleDetail(btn){
  const d=btn.nextElementSibling; if(!d) return;
  const open=d.classList.toggle("open");
  const m=btn.querySelector(".more"), l=btn.querySelector(".less");
  if(m) m.style.display=open?"none":""; if(l) l.style.display=open?"":"none";
}

// ---- Supervisor Meeting (Owner Hub tool #3) — owner-only agenda + editor ----
// Light Markdown -> HTML: #/##/### headings, **bold**, - lists, | tables |, ---.
function mdToHtml(md){
  const lines=String(md||"").replace(/\r/g,"").split("\n");
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let h="", i=0;
  while(i<lines.length){
    if(/^\s*\|/.test(lines[i])){
      const rows=[]; while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cellsOf=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let body=''; rows.forEach((r,ri)=>{ if(/^[\s|:\-]+$/.test(r)) return; const cs=cellsOf(r); const tag=ri===0?'th':'td';
        body+='<tr>'+cs.map(c=>'<'+tag+' style="border:1px solid var(--line);padding:4px 6px;font-size:11px;text-align:left">'+inline(c)+'</'+tag+'>').join('')+'</tr>'; });
      h+='<table style="border-collapse:collapse;width:100%;margin:6px 0">'+body+'</table>'; continue;
    }
    if(/^\s*-\s+/.test(lines[i])){
      let items=''; while(i<lines.length && /^\s*-\s+/.test(lines[i])){ items+='<li style="margin:2px 0">'+inline(lines[i].replace(/^\s*-\s+/,''))+'</li>'; i++; }
      h+='<ul style="margin:4px 0 4px 18px;padding:0">'+items+'</ul>'; continue;
    }
    const ln=lines[i]; i++;
    if(/^\s*###\s+/.test(ln)) h+='<div style="font-weight:700;font-size:13px;margin:10px 2px 2px">'+inline(ln.replace(/^\s*###\s+/,''))+'</div>';
    else if(/^\s*##\s+/.test(ln)) h+='<div style="font-weight:800;font-size:15px;margin:13px 2px 3px;color:var(--accent)">'+inline(ln.replace(/^\s*##\s+/,''))+'</div>';
    else if(/^\s*#\s+/.test(ln)) h+='<div style="font-weight:800;font-size:18px;margin:6px 2px 4px">'+inline(ln.replace(/^\s*#\s+/,''))+'</div>';
    else if(/^\s*---\s*$/.test(ln)) h+='<hr style="border:0;border-top:1px solid var(--line);margin:8px 0">';
    else if(/^\s*$/.test(ln)) {}
    else h+='<div style="font-size:13px;margin:3px 2px;line-height:1.45">'+inline(ln)+'</div>';
  }
  return h;
}

function wireChrome(){
  const bar=document.getElementById("tabbar"); if(!bar) return;
  const tabs=Array.prototype.slice.call(bar.querySelectorAll(".tab"));
  let anyVisible=false;
  const present={};
  tabs.forEach(t=>{
    const el=document.getElementById(t.getAttribute("data-t"));
    if(el){ t.style.display=""; present[t.getAttribute("data-t")]=t; anyVisible=true; }
    else t.style.display="none";
  });
  bar.style.display = anyVisible ? "" : "none";
  if(!anyVisible || !("IntersectionObserver" in window)) return;
  const obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        tabs.forEach(b=>b.classList.remove("active"));
        const t=present[e.target.id]; if(t) t.classList.add("active");
      }
    });
  }, { rootMargin:"-45% 0px -50% 0px", threshold:0 });
  Object.keys(present).forEach(id=>{ const el=document.getElementById(id); if(el) obs.observe(el); });
  if(tabs.length){ const first=tabs.find(t=>t.style.display!=="none"); if(first) first.classList.add("active"); }
}

// ---- Business Advisor briefing (Owner-only, top of board) ----------
// data.advisor_briefing = {generated_at, data_through, headline, interrupts[],
// metrics{totals,per_store}, body_md}. Null until build_advisor_briefing.py
// writes a row — renders nothing when empty.
function mdLite(s){
  if(!s) return "";
  const lines=esc(String(s)).split(/\n/);
  let out="", inList=false;
  lines.forEach(ln=>{
    const b=ln.match(/^\s*[-*]\s+(.+)$/);
    const hd=ln.match(/^#{1,3}\s+(.+)$/);
    if(b){ if(!inList){out+='<ul class="md-ul">';inList=true;} out+='<li>'+b[1].replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')+'</li>'; return; }
    if(inList){ out+='</ul>'; inList=false; }
    if(hd){ out+='<div class="md-h">'+hd[1].replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')+'</div>'; return; }
    if(ln.trim()) out+='<p>'+ln.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')+'</p>';
  });
  if(inList) out+='</ul>';
  return out;
}
function renderAdvisorBriefing(ab){
  if(!ab || (!ab.headline && !ab.body_md)) return "";
  const sevColor={high:'var(--urgent)',medium:'var(--high)',low:'var(--muted)'};
  const ints=Array.isArray(ab.interrupts)?ab.interrupts:[];
  let h='<div class="advisor" id="advisor"><div class="advisor-tag">&#9889; Business Advisor</div>';
  if(ab.headline) h+='<div class="advisor-head">'+esc(ab.headline)+'</div>';
  if(ints.length){
    h+='<div class="advisor-ints">';
    ints.slice(0,5).forEach(it=>{
      const sev=String(it.severity||'').toLowerCase();
      h+='<div class="aint"><span class="adot" style="background:'+(sevColor[sev]||'var(--muted)')+'"></span>'+
         '<span class="atxt">'+esc(it.label||it.type||'')+(it.store?' &middot; '+esc(it.store):'')+
         (it.hours_over!=null?' &middot; '+Math.round(it.hours_over)+'h over':'')+'</span></div>';
    });
    h+='</div>';
  }
  if(ab.body_md) h+='<div class="advisor-body">'+mdLite(ab.body_md)+'</div>';
  const dt=ab.data_through?(' &middot; data through '+esc(fmtDate(vdate(ab.data_through)))):'';
  return h+'<div class="advisor-foot">Biweekly brief'+dt+'</div></div>';
}

// data.owner_pulse: complaints + onboarding + intakes snapshot. Shows only

function renderOwnerPulse(op){
  if(!op) return "";
  const age = op.complaints_oldest_at
    ? Math.floor((Date.now()-new Date(op.complaints_oldest_at).getTime())/864e5) : null;
  const cell=(n,l,cls)=> '<div class="pcell'+(cls?' '+cls:'')+'"><div class="pn">'+n+'</div><div class="pl">'+l+'</div></div>';
  let h='<div class="pulse"><div class="pulse-h">Owner pulse</div><div class="pulse-row">';
  h+=cell(op.complaints_open||0,'Complaints',op.complaints_open>0?'warn':'');
  h+=cell(op.complaints_overdue||0,'SLA over',op.complaints_overdue>0?'bad':'');
  if(age!=null) h+=cell(age+'d','Oldest',age>3?'bad':'');
  h+=cell((op.onb_opened||0)+'/'+(op.onb_total||0),'Onboard');
  h+=cell(op.intakes_today||0,'Intakes today');
  return h+'</div></div>';
}
