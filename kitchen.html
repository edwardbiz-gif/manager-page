<!doctype html>
<!-- kitchen.html v10 (2026-11-13, Eddie: "markedly improve the service and kitchen screens, make it amazing").
     Crew Kitchen TV. Point the Fire Stick at:
       https://edwardbiz-gif.github.io/manager-page/kitchen.html?t=<kitchen-screen token>&store=3444
     v10 is a full redesign on the shared screen kit (assets/screen-kit.css + screen-kit.js):
       * game day frame: the store's team crest and name, live clock, the shift that is on now,
         a progress rail, and the data-through line for the card on screen
       * the race and the board are ONE card: giant rank, what it takes to pass the next store,
         days left in the month, and all 12 stores as animated bars with their crests
       * same for the KVS speed race; Shift Showdown marks the shift that is working right now
       * food variance is a picture (actual vs recipe bars), fed by kitchen-screen fn v14 `foodVariance`
       * numbers refresh in place every 10 minutes (no white reload flash); the last good numbers stay
         up if the store network drops; a new shell is picked up every 30 minutes
       * bilingual EN/ES on every card
     Safety net: if this page fails to start, the TV falls back to kitchen-classic.html (the v9 screen).
     Hand-written cards (kitchen_screen_cards): lines split on //, Spanish after " | ", bold lead-in before " — ".
     Test hooks: &src=_fx/<file>.json &card=<id> &speed=<n> &hour=<0-23> &lite=1 (see screen-kit.js). -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Quality Race</title>
<script>
// Safety net: a script error before the first card, or nothing alive after 25 s, sends the TV to the classic screen.
var __ok = false;
function __classic() {
  if (__ok || /[?&]nf=1/.test(location.search)) return;
  location.replace("kitchen-classic.html" + (location.search ? location.search + "&nf=1" : "?nf=1"));
}
window.onerror = function () { __classic(); };
setTimeout(__classic, 25000);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/screen-kit.css?v=1">
</head><body>
<script src="assets/screen-kit.js?v=1"></script>
<script>
(function () {
  var E = TV.esc, F = TV.fmt;

  function raceCard(d, ctx) {
    if (!d.standings || !d.standings.length) return null;
    var mtd = d.isCurrentMonth !== false;
    var rows = d.standings.map(function (r) { return { nsn: r.store_number, name: r.location_name, v: r.score, me: r.store_number === d.store }; });
    var i = rows.findIndex(function (r) { return r.me; });
    var yr = new Date().getFullYear();
    return { id: "race", dur: 18, html:
      '<div class="split"><div class="col-hero">' +
        TV.head({ eb: "Kitchen Quality Race · " + E(d.monthName) + (mtd ? "" : " final"),
          ebEs: "Carrera de calidad · " + E(TV.mes(d.monthName)), h: "Food quality", hEs: "Calidad de comida" }) +
        TV.rankBlock(d.rank, d.total) +
        TV.coach(rows, i, { dec: 1, unitEn: "pts", unitEs: "pts" }) +
        TV.movement("quality", d.rank) +
        '<div class="stats a" style="--i:6">' +
          (d.score != null ? TV.stat("Our score", "Puntuación", TV.cu(d.score, 1), "gold") : "") +
          (d.qualityYtd != null ? TV.stat(yr + " YTD", "Año a la fecha", TV.cu(d.qualityYtd, 1)) : "") +
          (mtd ? TV.stat("Days left", "Días restantes", TV.cu(ctx.daysLeft, 0)) : "") +
        "</div>" +
      '</div><div class="col-main">' + TV.ladder(rows, { dec: 1 }) + "</div></div>",
      foot: "Food quality rated by our guests (SMG VOICE) · " + E(d.monthName) + (mtd ? " month to date" : " final") +
        (d.scoresUpdated ? ", updated " + E(d.scoresUpdated) : "") + " · higher is better" +
        (d.seeded ? " · seeded from last month until surveys land" : "") };
  }

  function kvsCard(d, ctx) {
    var k = d.kvs;
    if (!k || !k.standings || !k.standings.length) return null;
    var rows = k.standings.map(function (r) { return { nsn: r.store_number, name: r.location_name, v: r.kvs_s, me: r.me }; });
    var i = rows.findIndex(function (r) { return r.me; });
    return { id: "kvs", dur: 18, html:
      '<div class="split"><div class="col-hero">' +
        TV.head({ eb: "KVS Speed Race · " + E(k.month), ebEs: "Carrera KVS · " + E(TV.mes(k.month)), h: "Kitchen speed", hEs: "Velocidad de cocina" }) +
        TV.rankBlock(k.rank, k.total) +
        TV.coach(rows, i, { dec: 0, unitEn: "sec", unitEs: "seg", lower: true }) +
        TV.movement("kvs", k.rank) +
        '<div class="stats a" style="--i:6">' +
          (k.mine_s != null ? TV.stat("Our KVS", "Nuestro KVS", TV.cu(k.mine_s, 0) + '<span class="u">s</span>', "gold") : "") +
          TV.stat("Fastest", "El más rápido", F(rows[0].v, 0) + '<span class="u">s</span>') +
          TV.stat("Days left", "Días restantes", TV.cu(ctx.daysLeft, 0)) +
        "</div>" +
      '</div><div class="col-main">' + TV.ladder(rows, { dec: 0, unit: "s" }) + "</div></div>",
      foot: "KVS = seconds per order on the make line (calibrated to QSRSoft) · " + E(k.month) + " through " +
        E(TV.isoLabel(k.through)) + " · " + E(k.days) + " days · faster is better" };
  }

  function trendCard(d) {
    var T = d.trend;
    if (!T || T.length < 2) return null;
    var vals = T.map(function (t) { return +t.v; }), best = Math.max.apply(null, vals), bi = vals.lastIndexOf(best), li = T.length - 1;
    var nowMonth = new Date().toLocaleString("en-US", { month: "long", timeZone: "America/Chicago" });
    var soFar = TV.mon(d.qualityThrough) === nowMonth;
    var gap = Math.round((best - vals[li]) * 10) / 10;
    var msg = bi === li
      ? "Best month yet: <b>" + F(best, 1) + '</b>. Keep it there!<span class="es">Nuestro mejor mes: ' + F(best, 1) + ". ¡A mantenerlo!</span>"
      : "<b>" + F(gap, 1) + " pts</b> to beat our best (" + E(T[bi].m) + " " + F(best, 1) + ')<span class="es">A ' + F(gap, 1) + " pts de nuestro mejor mes (" + E(TV.mes(T[bi].m)) + " " + F(best, 1) + ")</span>";
    return { id: "trend", dur: 14, html:
      TV.head({ eb: "Our quality trend · last " + T.length + " months", ebEs: "Nuestra tendencia de calidad", h: "Beat our best", hEs: "A superar nuestro mejor mes" }) +
      '<div class="msg a" style="--i:2">' + msg + "</div>" +
      TV.lineChart(T, { dec: 1, ref: d.qualityYtd != null ? { v: d.qualityYtd, label: "YTD" } : null, lastNote: soFar ? "(so far)" : "" }),
      foot: "Food quality by month, top box % (SMG VOICE)" + (d.qualityThrough ? " · through " + E(d.qualityThrough) + (soFar ? ", month to date" : "") : "") +
        (d.qualityYtd != null ? " · dashed = year to date " + F(d.qualityYtd, 1) : "") };
  }

  // Food variance as a picture: actual food % vs the recipe (theoretical) %, per month.
  function varianceCard(d) {
    var fv = d.foodVariance;
    if (!fv || !fv.length) return null;
    var usd = function (n) { return "$" + TV.commas(Math.abs(n)); };
    var panels = fv.map(function (m, k) {
      var tag = m.isMtd ? "month to date · mes en curso" : (m.prelim ? "preliminary · preliminar" : "final");
      var h = '<div class="fv a" style="--i:' + (k + 3) + '"><div class="mo">' + E(m.month) + ' <span class="es">· ' + E(TV.mes(m.month)) + '</span><span class="tag">' + tag + "</span></div>";
      if (m.empty) return h + '<div class="delta open">' + E(m.noteEn) + "<span>" + E(m.noteEs) + "</span></div></div>";
      var top = Math.max(m.actualPct || 0, m.theoPct || 0) * 1.12 || 1;
      h += '<div class="pair">' +
        (m.actualPct != null ? '<div class="pr"><span class="nm">Actual<span>Real</span></span><span class="tr"><span class="fl act" style="display:block;width:' + (100 * m.actualPct / top).toFixed(1) + '%"></span></span><span class="vl num">' + F(m.actualPct, 1) + "%</span></div>" : "") +
        (m.theoPct != null ? '<div class="pr"><span class="nm">Recipe<span>Receta</span></span><span class="tr"><span class="fl" style="display:block;width:' + (100 * m.theoPct / top).toFixed(1) + '%"></span></span><span class="vl num">' + F(m.theoPct, 1) + "%</span></div>" : "") + "</div>";
      if (m.varUsd == null) h += '<div class="delta open">Actuals not posted yet<span>Reales aún no registrados</span></div>';
      // Actual far UNDER the recipe while the books are open means invoices are still posting, not a win.
      else if (m.varUsd < 0 && m.prelim && m.varPts != null && m.varPts < -1.5) h += '<div class="delta open">Books still open, not final<span>Libros aún abiertos, no es final</span></div>';
      else if (m.varUsd >= 0) h += '<div class="delta over">' + usd(m.varUsd) + " over recipe<span>" + usd(m.varUsd) + " por encima de la receta</span></div>";
      else h += '<div class="delta under">' + usd(m.varUsd) + " under recipe<span>" + usd(m.varUsd) + " por debajo de la receta</span></div>";
      if (m.items && m.items.length) {
        h += '<div class="items"><div class="ptitle">Biggest food costs <span class="es">· Lo que más cuesta</span></div>' +
          m.items.map(function (it, n) {
            return '<div class="it"><span>' + (n + 1) + ". " + E(it.name) + '</span><span><b>' + usd(it.usd) + '</b> <span class="q">· ' + TV.commas(it.qty) + " " + E(it.unit) + "</span></span></div>";
          }).join("") + "</div>";
      }
      return h + "</div>";
    }).join("");
    var last = fv[fv.length - 1], first = fv[0];
    return { id: "variance", dur: 18, html:
      TV.head({ eb: "Food cost · actual vs recipe", ebEs: "Costo de comida · real vs receta", h: "Food variance", hEs: "Variación de comida" }) +
      '<div class="duo" style="gap:2vw">' + panels + "</div>",
      foot: "Actual food cost % vs what the recipes call for · through " + E(TV.isoLabel(last.thru || first.thru)) +
        " · about " + F(last.covPct != null ? last.covPct : first.covPct, 0) + "% of sales covered · costs are estimates" };
  }

  TV.boot({
    kind: "kitchen", label: "Kitchen", labelEs: "Cocina",
    fn: "https://nnsuyrhubsidwmrrsumm.supabase.co/functions/v1/kitchen-screen",
    build: function (d, ctx) {
      var cards = [], safe = function (f) { try { var c = f(); if (c) cards.push(c); } catch (e) { if (window.console) console.error(e); } };
      safe(function () { return raceCard(d, ctx); });
      safe(function () { return kvsCard(d, ctx); });
      safe(function () { return TV.showdownCard(d.shiftShowdown, ctx); });
      (d.feedback || []).forEach(function (g) {
        safe(function () {
          return TV.quotesCard("praise", g.items, { eb: "Crew wins · last 90 days", ebEs: "Victorias del equipo · últimos 90 días",
            h: "Guests love our food", hEs: "A los clientes les encanta nuestra comida",
            foot: "Guest survey comments about our food, last 90 days, in the guest's own words · SMG VOICE" }, ctx);
        });
      });
      var hasFv = d.foodVariance && d.foodVariance.length;
      (d.cards || []).forEach(function (c, i) {
        if (hasFv && /^food variance/i.test(c.section || "")) return; // drawn as a picture below
        safe(function () { return TV.editableCard(c, i); });
      });
      safe(function () { return trendCard(d); });
      safe(function () { return varianceCard(d); });
      return cards;
    }
  });
})();
</script>
</body></html>
