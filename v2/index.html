// MODULE — MTD invoice tracker (posted vs in-flight).
function renderNumbersInvoices(data){
  const fin = data.financials || {};
  if(fin.error) return "";
  const inv = fin.invoices;
  if(!inv || !inv.lines || !inv.lines.length) return card("MTD Invoice Tracker", '<div class="empline">No invoices tracked this month yet.</div>', { icon:"🧾", newBadge:true });
  const pSum = inv.totals.posted||0, fSum = inv.totals.in_flight||0, tot = pSum+fSum;
  const pCnt = inv.lines.reduce((a,l)=>a+(l.posted_count||0),0);
  const fCnt = inv.lines.reduce((a,l)=>a+(l.in_flight_count||0),0);
  const pPct = tot? (pSum/tot*100) : 0, fPct = tot? (fSum/tot*100) : 0;
  const body =
      '<div class="inv-top">'
    + '<div class="inv-tile posted"><div class="il">● Posted</div><div class="iv">'+moneyKD(pSum)+'</div><div class="is">'+pCnt+' invoices in R365</div></div>'
    + '<div class="inv-tile flight"><div class="il">◍ In-flight</div><div class="iv">'+moneyKD(fSum)+'</div><div class="is">'+fCnt+' detected, not yet posted</div></div></div>'
    + '<div class="invbar"><i class="seg-posted" style="width:'+pPct+'%"></i><i class="seg-flight" style="width:'+fPct+'%"></i></div>'
    + '<div class="invbar-leg"><span class="lndots"><span class="dot posted"></span>Posted '+pPct.toFixed(0)+'%</span>'
    + '<span>Total tracked '+moneyKD(tot)+'</span>'
    + '<span class="lndots"><span class="dot flight"></span>In-flight '+fPct.toFixed(0)+'%</span></div>'
    + '<div class="cap">"In-flight" = invoices detected in email/triage but not yet posted in R365 — true MTD spend runs higher than posted. '
    + (data.scope_all||((fin.per_store||[]).length>1) ? "Summed across your in-scope stores. " : "")
    + esc(inv.data_through)+'.</div>';
  return card("MTD Invoice Tracker", body, { icon:"🧾", through: inv.data_through, newBadge:true, drill:{kind:"invoice"} });
}

// MODULE — DoorDash commission rates. Single store = focused q-o-q card; many =
// one row per store. A rate RISE is UNfavorable (red), drop favorable (green).
function renderNumbersDoorDash(data){
  const fin = data.financials || {};
  if(fin.error) return "";
  const dd = fin.doordash;
  if(!dd || !dd.stores || !dd.stores.length) return card("DoorDash rates", '<div class="empline">No commission rates on file for the in-scope store(s).</div>', { icon:"🛵", newBadge:true });
  const single = !(data.scope_all) && dd.stores.length === 1;
  const arrow = (delta, missing) => missing ? {sym:"—",cls:"qflat",word:"no latest qtr"}
    : delta==null ? {sym:"→",cls:"qflat",word:"flat"}
    : delta>0 ? {sym:"↑",cls:"qup",word:"up"}
    : delta<0 ? {sym:"↓",cls:"qdown",word:"down"} : {sym:"→",cls:"qflat",word:"flat"};

  if(single){
    const s = dd.stores[0];
    const cur = s.current, prior = s.prior;
    const a = arrow(s.marketplace_delta_pp, s.latest_on_file_only);
    if(!cur) return card("DoorDash rates", '<div class="empline">No commission rates on file for '+esc(s.store_name)+'.</div>', { icon:"🛵", newBadge:true });
    const body =
        '<div class="dd-qoq">'
      + '<span class="qval qmuted">'+(prior?pct2(prior.marketplace_pct):"—")+'</span>'
      + '<span class="qarrow '+a.cls+'">'+a.sym+'</span>'
      + '<span class="qval '+a.cls+'">'+pct2(cur.marketplace_pct)+'</span>'
      + '<span style="font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-muted)">Marketplace · q-o-q</span></div>'
      + '<div class="dd-cur">'
      + '<div class="dd-tile"><div class="ddl">Marketplace</div><div class="ddv">'+pct2(cur.marketplace_pct)+'</div><div class="dds">of order subtotal</div></div>'
      + '<div class="dd-tile const"><div class="ddl">DashPass</div><div class="ddv">'+pct2(cur.dashpass_pct)+'</div><div class="dds">flat org-wide</div></div>'
      + '<div class="dd-tile"><div class="ddl">ADWT</div><div class="ddv">'+(cur.adwt_min!=null?Number(cur.adwt_min).toFixed(2):"—")+'</div><div class="dds">drives the rate</div></div>'
      + '<div class="dd-tile const"><div class="ddl">Drive base</div><div class="ddv">$'+(cur.drive_base_fee!=null?Number(cur.drive_base_fee).toFixed(2):"—")+'</div><div class="dds">flat / order</div></div></div>'
      + (s.latest_on_file_only?'<div class="dd-misswarn">⚠ Latest-quarter DoorDash email not yet received for '+esc(s.store_name)+' — showing '+esc(String(cur.quarter||"prior quarter"))+'.</div>':"")
      + '<div class="cap">Marketplace % keys off <b>ADWT</b> (avg delivery weight/time, ≈ ≥3.0 → higher tier). DashPass &amp; Drive base are constant across all 12 stores. From <b>doordash_commission_rates</b> ('+esc(String(cur.quarter||""))+').</div>';
    return card("DoorDash rates", body, { icon:"🛵", through: (cur.quarter?esc(String(cur.quarter)):"")+(cur.effective_date?" · eff "+String(cur.effective_date):""), newBadge:true, drill:{kind:"dd", store_id:s.store_id} });
  }

  // owner / sup — one row per store, q-o-q marketplace + trend.
  const rows = dd.stores.filter(s=>s.current).map(s=>{
    const a = arrow(s.marketplace_delta_pp, s.latest_on_file_only);
    const sub = s.latest_on_file_only ? "latest qtr missing"
      : (s.current.adwt_min!=null ? "ADWT "+Number(s.current.adwt_min).toFixed(2) : "");
    return '<div class="ddrow'+(s.latest_on_file_only?" miss":"")+'" data-drill="dd" data-id="'+s.store_id+'" onclick="numbersDrill(this,event)">'
      + '<span class="ddn">'+esc(s.store_name)+'<small>#'+esc(s.nsn)+(sub?" · "+sub:"")+'</small></span>'
      + '<span class="ddmkt"><span class="qmuted" style="font-weight:700">'+(s.prior?pct2(s.prior.marketplace_pct):"—")+'</span> → '+pct2(s.current.marketplace_pct)+'</span>'
      + '<span class="ddtr '+a.cls+'">'+a.sym+'</span></div>';
  }).join("");
  const nUp = dd.stores.filter(s=>s.marketplace_delta_pp!=null && s.marketplace_delta_pp>0).length;
  const nDown = dd.stores.filter(s=>s.marketplace_delta_pp!=null && s.marketplace_delta_pp<0).length;
  const body = '<div class="ddhdr"><span>Store</span><span>prior → current</span><span>±</span></div>'+rows
    + '<div class="cap"><b>'+nDown+'</b> down <span class="qdown">↓</span> · <b>'+nUp+'</b> up <span class="qup">↑</span> · rest flat. Rate keys off <b>ADWT</b>. DashPass &amp; Drive base constant across all 12. From <b>doordash_commission_rates</b>.</div>'
    + (dd.missing_latest_quarter ? '<div class="dd-misswarn">⚠ '+dd.missing_latest_quarter+' store'+(dd.missing_latest_quarter>1?"s":"")+' missing the latest-quarter DoorDash email — those rows show the prior quarter.</div>':"");
  return card("DoorDash rates", body, { icon:"🛵", through: "current vs prior quarter on file", newBadge:true, drill:{kind:"dd"} });
}

// MODULE — LTO leaderboard (org-wide units per 1,000 guests; viewer's stores hi-lit).
function renderNumbersLto(data){
  const fin = data.financials || {};
  if(fin.error) return "";
  const lto = fin.lto;
  if(!lto || !lto.promos || !lto.promos.length) return card("LTO leaderboard", '<div class="empline">No LTO promo rankings posted yet.</div>', { icon:"🏆" });
  const medal = (rnk) => rnk===1?"🥇":rnk===2?"🥈":rnk===3?"🥉":"#"+rnk;
  const body = lto.promos.map(p=>{
    const sorted = (p.standings||[]).slice().sort((a,b)=>(a.rnk||99)-(b.rnk||99));
    const rows = sorted.map(s=>{
      const upk = s.units_per_1k_guests;
      return '<div class="ltorow'+(s.in_scope?" mine":"")+'">'
        + '<span class="lmedal">'+medal(s.rnk)+'</span>'
        + '<span class="lname2">'+esc(s.location_name||("#"+s.nsn))+'<small>#'+esc(s.nsn)+' · '+Number(s.units||0).toLocaleString()+' units</small></span>'
        + '<span class="lval">'+(upk!=null?Number(upk).toFixed(1):"—")+'<small>per 1k guests</small></span></div>';
    }).join("");
    return '<div class="ltoseg">'+esc(p.label)+'</div>'+rows;
  }).join("");
  return card("LTO leaderboard", body + '<div class="cap">Units per 1,000 guests by promo, org-wide. Your store(s) highlighted. From v_datapass_lto_rank.</div>',
    { icon:"🏆", through: lto.data_through ? ("data thru "+lto.data_through) : null, drill:{kind:"lto"} });
}

/* ---- NUMBERS drill: every card opens a detail sheet (plan §10) ---------------
   The card() drill cue calls openNumbersSheet(kind, arg); rollup/dd rows wire
   their own onclick→numbersDrill(el). Detail restates the data-through date and
   never fabricates a number the headline withheld (honesty carries into drills). */
function numbersDrill(el, ev){
  if(ev) ev.stopPropagation();   // a row drill overrides the parent card's drill
  openNumbersSheet(el.getAttribute("data-drill"), { store_id: Number(el.getAttribute("data-id")) });
}
function finStoreById(fin, id){ return (fin.per_store||[]).find(s=>s.store_id===id) || finFocus(fin); }

function openNumbersSheet(kind, arg){
  const data = (STATE && STATE.data) || {};
  const fin = data.financials || {};
  const thru = finThru(fin) || "—";
  let title="Detail", body="", crumb="Numbers";
  const dr = (k,v) => '<div class="drow"><span class="dk">'+k+'</span><span class="dv">'+v+'</span></div>';

  if(kind==="agg"){
    const agg = fin.aggregate, ps = (fin.per_store||[]).filter(s=>s.ytd).sort((a,b)=>(a.ytd.pac_pct??0)-(b.ytd.pac_pct??0));
    title = data.scope_all ? "Portfolio P&L" : "Patch P&L";
    crumb = "Numbers › <b>"+(data.scope_all?"Portfolio":"Patch")+"</b>";
    body = '<div class="crumb">'+crumb+'</div>'
      + (agg? dr("PAC %", '<span class="fav">'+pct2(agg.pac_pct)+'</span>')+dr("PAC $ (YTD)", moneyFull(agg.pac_dollars))+dr("Net sales (YTD)", moneyFull(agg.net_sales))
            + dr("Food %", pct2(agg.food_pct))+dr("Labor %", pct2(agg.labor_pct))+(agg.pac_spread_pp!=null?dr("PAC spread", agg.pac_spread_pp.toFixed(1)+"pp"):"") : "")
      + '<div class="dsub">Stores · worst-PAC-first</div>'
      + ps.map(s=>dr(esc(s.store_name), pct2(s.ytd.pac_pct)+" · "+moneyKD(s.ytd.net_sales))).join("")
      + '<div class="cap">YTD roll thru '+esc(thru)+'. PAC% read from the precomputed column; aggregate %s from summed dollars.</div>';
  } else if(kind==="store"){
    const s = finStoreById(fin, arg&&arg.store_id);
    if(s && s.ytd){
      title = s.store_name+" · P&L"; crumb = "Numbers › <b>"+esc(s.store_name)+"</b>";
      body = '<div class="crumb">'+crumb+'</div>'
        + dr("PAC %", '<span class="'+(s.ytd.pac_pct>=0?"fav":"unfav")+'">'+pct2(s.ytd.pac_pct)+'</span>')
        + dr("PAC $ (YTD)", moneyFull(s.ytd.pac_dollars)) + dr("Net sales (YTD)", moneyFull(s.ytd.net_sales))
        + dr("Food %", pct2(s.ytd.food_pct)) + dr("Labor %", pct2(s.ytd.labor_pct))
        + (s.mtd? '<div class="dsub">Current month (MTD'+(s.mtd.is_preliminary?" · preliminary":"")+')</div>'
            + dr("MTD net sales", moneyFull(s.mtd.net_sales)) + dr("MTD PAC", moneyFull(s.mtd.pac_dollars)+" · "+pct2(s.mtd.pac_pct)) : "")
        + '<div class="cap">YTD roll thru '+esc(thru)+'. June MTD is preliminary (R365 re-keys open periods).</div>';
    } else { title="P&L"; body='<div class="crumb">Numbers</div><div class="cap">No P&L for this store yet.</div>'; }
  } else if(kind==="pac"){
    const s = finStoreById(fin, arg&&arg.store_id);
    title = (s?s.store_name+" · ":"")+"P&L line detail";
    crumb = "Numbers › "+(s?esc(s.store_name)+" › ":"")+"<b>P&L line detail</b>";
    // % colored vs the org avg, with the org number shown explicitly (no hover needed).
    const cfp = (my,org,hb)=>{ if(my==null) return ""; let k="neu"; if(org!=null&&Math.abs(my-org)>=0.3) k=((hb?my>org:my<org)?"fav":"unfav"); return ' · <span class="'+k+'">'+pct1(my)+'</span>'+(org!=null?' <span style="color:var(--ink-muted);font-size:10px">vs org '+pct1(org)+'</span>':''); };
    const rows = (s&&s.lines||[]).map(l=>{
      const hb=(l.line==="net_sales"||l.line==="pac");
      const proj = l.projection_pending||!l.projection ? "pending"
        : (l.projection.value_type==="dollars"?moneyKD(l.projection.value):Number(l.projection.value).toFixed(1)+"% of sales");
      const tr6 = (l.trend6||[]).map(t=>t.pct).filter(x=>typeof x==="number");
      const sp = tr6.length>=2 ? '<div style="color:var(--ink-muted);font-size:10px;margin-top:2px">6-mo % of sales <span class="drillspark">'+sparkline(tr6,{w:84,h:18})+'</span> '+pct2(tr6[0])+' → '+pct2(tr6[tr6.length-1])+'</div>' : '';
      const val = '<div>MTD '+(l.mtd_dollars==null?"—":moneyFull(l.mtd_dollars))+cfp(l.mtd_pct,l.org_mtd_pct,hb)+'</div>'
        + '<div>YTD '+(l.ytd_dollars==null?"—":moneyFull(l.ytd_dollars))+cfp(l.ytd_pct,l.org_ytd_pct,hb)+'</div>'
        + '<div style="color:var(--proj)">'+proj+' proj</div>' + sp;
      return dr(esc(l.label), val);
    }).join("");
    body = '<div class="crumb">'+crumb+'</div><div class="dsub">Each line: MTD · YTD actual ($ and % of sales, colored vs the org avg) · projection</div>'+rows
      + '<div class="dsub">Projection workflow (§9)</div>'
      + dr("Status", (s&&s.lines||[]).some(l=>l.projection&&l.projection.locked)?"🔒 Locked":"✏️ Pending / open")
      + '<div class="cap">Revenue &amp; PAC projected in dollars; cost lines in % of sales (pnl_projection.value_type). Owner lock makes them immutable. Data thru '+esc(thru)+'.</div>';
  } else if(kind==="waterfall"){
    const s = finStoreById(fin, arg&&arg.store_id); const wf = s&&s.waterfall;
    title = (s?s.store_name+" · ":"")+"Sales → PAC bridge";
    crumb = "Numbers › "+(s?esc(s.store_name)+" › ":"")+"<b>Sales → PAC bridge</b>";
    body = '<div class="crumb">'+crumb+'</div>'+(wf?waterfall([
        {label:"Net Sales",val:wf.net_sales,type:"start"},{label:"COGS",val:-(wf.cogs||0),type:"down"},
        {label:"Labor",val:-(wf.labor||0),type:"down"},{label:"Other Ctrl",val:-(wf.other_controllable||0),type:"down"},
        {label:"PAC",val:wf.pac,type:"end"}]):"")
      + '<div class="dsub">Step-by-step</div>'
      + (wf? dr("Net sales", moneyFull(wf.net_sales)+" · 100%")
           + dr("− COGS", moneyFull(wf.cogs)+(wf.net_sales?" · "+pct1(wf.cogs/wf.net_sales*100):""))
           + dr("− Labor", moneyFull(wf.labor)+(wf.net_sales?" · "+pct1(wf.labor/wf.net_sales*100):""))
           + dr("− Other controllable", moneyFull(wf.other_controllable)+(wf.net_sales?" · "+pct1(wf.other_controllable/wf.net_sales*100):""))
           + dr("= P.A.C.", '<span class="fav">'+moneyFull(wf.pac)+" · "+pct2(wf.pac_pct)+'</span>') : "")
      + '<div class="cap">'+(wf&&wf.basis==="mtd"?"MTD current month":"YTD")+'. PAC from the precomputed column. Data thru '+esc(thru)+'.</div>';
  } else if(kind==="bullets"){
    const s = finStoreById(fin, arg&&arg.store_id); const cl = s&&s.cost_lines||[];
    title = (s?s.store_name+" · ":"")+"Cost discipline";
    crumb = "Numbers › "+(s?esc(s.store_name)+" › ":"")+"<b>Cost lines</b>";
    body = '<div class="crumb">'+crumb+'</div><div class="dsub">YTD level vs org −8% stretch target</div>'
      + cl.map(c=>dr(esc(c.label), pct2(c.pct)+(c.target!=null?' · target ≤ '+pct1(c.target)+'% (org −8%)'+(c.org_pct!=null?' · org '+pct1(c.org_pct)+'%':''):' · target pending'))).join("")
      + '<div class="cap">Target = the 12-store org average −8% (8% better than org); no sourced target column yet (plan §6.4). Data thru '+esc(thru)+'.</div>';
  } else if(kind==="invoice"){
    const inv = fin.invoices; title = "MTD invoices · line breakdown"; crumb = "Numbers › <b>Invoice detail</b>";
    const rows = (inv&&inv.lines||[]).slice().sort((a,b)=>((b.posted+b.in_flight)-(a.posted+a.in_flight))).map(l=>{
      const parts=[];
      if(l.posted) parts.push('<span style="color:var(--good)">'+moneyKD(l.posted)+" posted ("+l.posted_count+")</span>");
      if(l.in_flight) parts.push('<span style="color:var(--warn)">'+moneyKD(l.in_flight)+" in-flight ("+l.in_flight_count+")</span>");
      return dr(esc(l.pnl_line)+(l.pnl_section?" · "+esc(l.pnl_section):""), parts.join(" · ")||"—");
    }).join("");
    body = '<div class="crumb">'+crumb+'</div><div class="dsub">Every line · posted vs in-flight</div>'+rows
      + '<div class="cap">In-flight = detected in email/triage, not yet posted to R365. From v_invoice_tracker_mtd. '+esc(inv?inv.data_through:"")+'.</div>';
  } else if(kind==="dd"){
    const dd = fin.doordash;
    if(arg && arg.store_id){
      const s = (dd.stores||[]).find(x=>x.store_id===arg.store_id);
      title = (s?s.store_name+" · ":"")+"DoorDash rate history"; crumb = "Numbers › "+(s?esc(s.store_name)+" › ":"")+"<b>DoorDash history</b>";
      const hist = (s&&s.history||[]).map(h=>dr(esc(String(h.quarter))+(h.adwt_min!=null?" · ADWT "+Number(h.adwt_min).toFixed(2):"")+(h.effective_date?" · eff "+String(h.effective_date):""),
        "Mkt <b>"+pct2(h.marketplace_pct)+"</b> · DashPass "+pct2(h.dashpass_pct)+" · $"+(h.drive_base_fee!=null?Number(h.drive_base_fee).toFixed(2):"—"))).join("");
      body = '<div class="crumb">'+crumb+'</div><div class="dsub">Quarter-by-quarter (doordash_commission_rates)</div>'+hist
        + (s&&s.marketplace_delta_pp!=null?'<div class="dsub">Quarter-over-quarter</div>'+dr("Marketplace Δ", (s.marketplace_delta_pp>0?'<span class="qup">+'+s.marketplace_delta_pp.toFixed(2)+"pp (up, unfavorable)</span>":s.marketplace_delta_pp<0?'<span class="qdown">'+s.marketplace_delta_pp.toFixed(2)+"pp (down, favorable)</span>":"flat")):"")
        + '<div class="cap">Marketplace % keys off ADWT. DashPass &amp; Drive base are constant.'+(s&&s.latest_on_file_only?' <b style="color:var(--warn)">Latest-quarter email still missing for this store.</b>':"")+'</div>';

   GUESTS LANE (Pass 2 — feedback · complaints SLA · polarity-aware voice)
   ADDED ADDITIVELY: render fns + a lane drill sheet + MANIFEST rows. Reads
   data.customer_feedback / data.complaints / data.voice_trend — exactly the
   shapes the Edge Fn gatherData returns. Lazy-loaded on first GUESTS open.
     • FEEDBACK — unified v_customer_feedback, needs-response weighted to top.
     • COMPLAINTS — SLA-sorted resolve list + inline Resolve (reuses the TODAY
       complaint action spine; one render path, two lanes).
     • VOICE — voice_scores pivot with daypart toggles + polarity-aware B2B
       (lower=better) vs the CHICAGO-MOCNI BU benchmark + org rank.

// small relative-time + scored-cell helpers (GUESTS-local).
function fbAge(ts){ return ageSince(ts); }
function vvDeltaTxt(c){
  if(c.delta==null) return '<span class="flat">→ flat</span>';
  // favorability, not direction: for lower_better metrics a rise is bad.
  const good = c.lower_better ? c.delta < 0 : c.delta > 0;
  const cls = c.delta===0 ? "flat" : good ? "up" : "down";
  const sym = c.delta>0 ? "+" : "";
  return '<span class="'+cls+'">'+sym+Number(c.delta).toFixed(1)+' MoM</span>';
}
function vvBuTxt(c){
  if(c.june==null || c.bu==null) return "";
  const diff = c.june - c.bu;
  const good = c.lower_better ? diff < 0 : diff > 0;
  return '<span class="'+(diff===0?"flat":good?"up":"down")+'">'+(diff>0?"+":"")+diff.toFixed(1)+' vs BU</span>';
}

// MODULE — voice trend: daypart toggle + polarity-aware cells vs BU + rank.
let VOICE_DAYPART = "all";  // GUESTS-local toggle state
function renderGuestsVoice(data){
  const vt = data.voice_trend;
  if(!vt || !vt.entities || !vt.entities.length){
    return card("Voice / SMG trend", '<div class="empline">No VOICE scores posted for your scope yet.</div>', { icon:"📈" });
  }
  // pick the focal entity (GM = its one store; sup/owner = the first / Combined).
  const ent = vt.entities[0];
  // resolve the cell set for the active daypart.
  let cells = ent.cells, dpLabel = "All day", thru = vt.data_through;
  if(VOICE_DAYPART !== "all" && Array.isArray(vt.dayparts)){
    const dp = vt.dayparts.find(d=>d.key===VOICE_DAYPART);
    if(dp){
      const de = (dp.entities||[]).find(e=>e.id===ent.id) || (dp.entities||[])[0];
      if(de){ cells = de.cells; dpLabel = dp.label; thru = dp.data_through || thru; }
    }
  }
  // segmented toggle (All + each daypart present).
  const dpDefs = [{key:"all",label:"All day"}].concat((vt.dayparts||[]).map(d=>({key:d.key,label:d.label})));
  const toggle = '<div class="segtog">'+dpDefs.map(d=>
    '<button class="segb'+(d.key===VOICE_DAYPART?" on":"")+'" onclick="setVoiceDaypart(\''+d.key+'\')">'+esc(d.label)+'</button>').join("")+'</div>';
  // OSAT + QSC + B2B groups (polarity-aware). Show the metrics present in cells.
  const groups = vt.groups || {};
  const order = (groups.osat||[]).concat(groups.qsc||[], groups.b2b||[]);
  const seen = new Set();
  const mcells = order.filter(m=>!seen.has(m) && (seen.add(m), cells[m] && cells[m].june!=null)).slice(0,8).map(m=>{
    const c = cells[m];
    const rank = (c.rank!=null && c.rank_of!=null) ? '<span class="mb">rank '+c.rank+'/'+c.rank_of+(c.n!=null?" · n="+c.n:"")+'</span>' : (c.n!=null?'<span class="mb">n='+c.n+'</span>':'');
    return '<div class="mcell"><div class="ml">'+esc(c.label||m)+(c.lower_better?' ↓':'')+'</div>'
      + '<div class="mv">'+Number(c.june).toFixed(1)+'</div>'
      + '<div class="md">'+vvDeltaTxt(c)+' · '+vvBuTxt(c)+'</div>'+rank+'</div>';
  }).join("");
  const watch = ent.watch ? '<div class="cap" style="margin-top:9px"><b>Watch:</b> '+esc(vt.labels&&vt.labels[ent.watch]||ent.watch)+(ent.watch_reason?' — '+esc(ent.watch_reason):'')+'</div>' : '';
  const body = toggle + '<div class="mgrid">'+(mcells||'<div class="empline" style="grid-column:1/-1">No scored metrics for this daypart.</div>')+'</div>'
    + watch
    + '<div class="cap">'+esc(dpLabel)+' · score + MoM (favorability-aware: ↓ metrics are lower-is-better) + vs CHICAGO-MOCNI BU + org rank. From voice_scores ('+esc(ent.name||"")+').</div>';
  return card("Voice / SMG trend", body, { icon:"📈", through: thru?("VOICE · "+esc(thru)):null, drill:{kind:"gvoice"} });
}
function setVoiceDaypart(k){ VOICE_DAYPART = k; renderBoard(); }
window.setVoiceDaypart = setVoiceDaypart;

    + '<div class="optile"><div class="opl">Pre-shift MTD</div><div class="opv '+((op.completion_rate_mtd_pct||0)>=80?"fav":(op.completion_rate_mtd_pct||0)>=50?"warn":"unfav")+'">'+(op.completion_rate_mtd_pct!=null?Number(op.completion_rate_mtd_pct).toFixed(0)+"%":"—")+'</div><div class="ops">'+(op.preshift_done_mtd||0)+'/'+(op.preshift_assigned_mtd||0)+'</div></div>';
  // sensor health roll-up.
  const sens = op.sensors||[];
  const sFunc = sens.reduce((a,s)=>a+(s.sensors_functioning||0),0), sTot = sens.reduce((a,s)=>a+(s.sensors_total||0),0);
  body += '<div class="optile"><div class="opl">Sensors OK</div><div class="opv '+(sTot&&sFunc<sTot?"warn":"fav")+'">'+sFunc+'/'+sTot+'</div><div class="ops">functioning</div></div>';
  // grill min-temps headline (count of products read).
  const grill = op.grill_temps||[];
  body += '<div class="optile"><div class="opl">Grill products</div><div class="opv">'+grill.length+'</div><div class="ops">min-temp logged</div></div></div>';
  // latest pre-shift per daypart.
  const ps = (op.preshift_latest||[]).slice().sort((a,b)=>String(a.daypart).localeCompare(String(b.daypart)));
  if(ps.length){
    body += ps.map(p=>'<div class="dprow"><span class="dpn">'+esc(p.daypart)+(op.multi_store?'<small>'+esc(p.store_name||"")+'</small>':'')+'</span>'
      + '<span class="dprate">'+(p.submit_person?esc(p.submit_person):(p.completed?"done":"—"))+'</span>'
      + '<span class="statedot '+(p.completed?(p.on_time===false?"sd-miss":"sd-ok"):"sd-miss")+'">'+(p.completed?(p.on_time===false?"late":"on time"):"missed")+'</span></div>').join("");
  }
  body += '<div class="cap">Pre-shift checklist completion + sensor health + grill min-cook temps. '+esc(op.sensor_note||"")+' Tap for product temps + sensor problem list. From the Jolt feed.</div>';
  return card("Operations (Jolt)", body, { icon:"✅", through: op.data_through?fmtDate(op.data_through):null, newBadge:true, drill:{kind:"operations"} });
}

// MODULE — waste-count compliance (X/N stores filed raw waste).
function renderTeamWaste(data){
  const wc = data.waste_compliance;
  if(!wc){
    return card("Waste compliance", '<div class="empline">No raw-waste compliance data for your scope yet.</div>', { icon:"🗑️" });
  }
  if(wc.thin_enabled === false && (wc.expected_stores||0) <= 1){
    // single store: report whether it counted.
    const ok = (wc.missed_stores||0) === 0;
    return card("Waste compliance",
      '<div class="contest"><div class="medal '+(ok?"win":"miss")+'">'+(ok?"✓":"✗")+'</div>'
      + '<div class="contestmain"><div class="contesthd">'+(ok?"Raw waste logged":"Raw waste NOT logged")+'</div>'
      + '<div class="contestsub">For the latest settled day. Baseline: '+(wc.baseline_settled_days||0)+' settled days.</div></div></div>'
      + '<div class="cap">Did the store file its raw-waste count for the last settled day? From v_datapass_waste_compliance_day.</div>',
      { icon:"🗑️", through: wc.data_through?fmtDate(wc.data_through):null });
  }
  const counted = wc.counted_stores||0, exp = wc.expected_stores||0;
  let body = '<div class="opbar"><div class="optile"><div class="opl">Counted</div><div class="opv '+(counted>=exp?"fav":"warn")+'">'+counted+'/'+exp+'</div><div class="ops">stores</div></div>'
    + '<div class="optile"><div class="opl">Missed</div><div class="opv '+((wc.missed_stores||0)?"unfav":"fav")+'">'+(wc.missed_stores||0)+'</div><div class="ops">stores</div></div></div>';
  if((wc.missed||[]).length){
    body += (wc.missed||[]).map(m=>'<div class="dprow"><span class="dpn">'+esc(m.location_name||m.store_number||"")+'<small>closing leader '+esc(m.leader||m.leader_geid||"?")+'</small></span>'
      + '<span class="statedot sd-miss">missed</span><span></span></div>').join("");
  }
  body += '<div class="cap">X of N in-scope stores that logged raw waste for the last settled day, with the closing leader on misses. From v_datapass_waste_compliance_day.</div>';
  return card("Waste compliance", body, { icon:"🗑️", through: wc.data_through?fmtDate(wc.data_through):null });
}

// MODULE — submission campaigns (GM sees their store's upload status).
function renderMoreCampaigns(data){
  const cs = data.campaigns || [];
  if(!cs.length){
    return card("Submission campaigns", '<div class="empline">No open campaigns right now.</div>', { icon:"📸" });
  }
  const body = cs.map(c=>{
    const mine = (c.stores||[]).filter(s=>true);
    const total = c.total||mine.length, done = c.done||mine.filter(s=>s.done).length;
    const pct = total? Math.round(done/total*100) : 0;
    // GM single-store "you" line.
    const myStore = (c.stores||[])[0];
    const meLine = myStore
      ? (myStore.done ? '<div class="campme done">✓ Your store submitted.</div>'
                      : '<div class="campme todo">⬆ Your store still needs to submit'+(c.can_upload?" — upload from the live board.":"."))+'</div>'
      : "";
    return '<div class="camp"><div class="camphd"><span class="camptt">'+esc(c.title)+'</span>'
      + (c.due_at?'<span class="campdue">due '+esc(fmtDate(c.due_at))+'</span>':'')+'</div>'
      + (c.prompt?'<div class="campp">'+esc(c.prompt)+'</div>':'')
      + '<div class="campprog"><div class="cpbar"><i style="width:'+pct+'%"></i></div><span class="cpn">'+done+'/'+total+' stores</span></div>'
      + meLine + '</div>';
  }).join("");
  return card("Submission campaigns", body
    + '<div class="cap">Owner/sup track all stores here; a GM uploads their store’s photo/file from the live board. From campaigns.</div>',
    { icon:"📸", through: null, newBadge:true });
}

// MODULE — RGR prep checklist (GM-relevant; shown only in the visit window).
function renderMoreRgr(data){
  const runs = data.rgr || [];
  if(!runs.length){
    return card("RGR prep checklist", '<div class="empline">No RGR visit in the prep window (D-30 to D+3) for your store.</div>', { icon:"📋" });
  }
  const body = runs.map(run=>{
    const items = run.items || run.entries || [];
    const done = items.filter(i=>i.checked||i.done).length;
    const head = '<div class="camphd"><span class="camptt">'+esc(run.store_name||run.location_name||"RGR visit")+'</span>'
      + (run.visit_date?'<span class="campdue">visit '+esc(fmtDate(run.visit_date))+'</span>':'')+'</div>';
    const rows = items.slice(0,12).map(i=>{
      const d = i.checked||i.done;
      return '<div class="ckrow"><span class="ckbox'+(d?" on":"")+'">'+(d?"✓":"")+'</span>'
        + '<span class="cklab'+(d?" done":"")+'">'+esc(i.label||i.item||"")+'</span></div>';
    }).join("");
    return head + (items.length?'<div class="campprog"><div class="cpbar"><i style="width:'+(items.length?Math.round(done/items.length*100):0)+'%"></i></div><span class="cpn">'+done+'/'+items.length+'</span></div>'+rows
      : '<div class="empline">Checklist template loads on the live board.</div>');
  }).join('<div style="height:11px"></div>');
  return card("RGR prep checklist", body
    + '<div class="cap">Restaurant General Review prep — tick items + attach photos from the live board. From the RGR checklist runs.</div>',
    { icon:"📋", through: null });
}

// MODULE — Portfolio P&L roundup (Owner home): org MTD/YTD net sales + PAC, then the
// 12 stores ranked by MTD PAC%. Owner/portfolio scope only; "" otherwise.
function renderHomeRoundup(data){
  const fin = data.financials || {};
  const ps = (fin.per_store || []).filter(s=>s.mtd);
  if(!data.scope_all || fin.error || ps.length < 2) return "";
  let mNs=0,mPac=0,yNs=0,yPac=0;
  for(const s of ps){ mNs+=(s.mtd.net_sales||0); mPac+=(s.mtd.pac_dollars||0); if(s.ytd){ yNs+=(s.ytd.net_sales||0); yPac+=(s.ytd.pac_dollars||0); } }
  const mPacPct = mNs? mPac/mNs*100 : null, yPacPct = yNs? yPac/yNs*100 : null;
  const ranked = ps.slice().sort((a,b)=>((b.mtd.pac_pct??-999)-(a.mtd.pac_pct??-999)));
  const rows = ranked.map((s,i)=>
    '<div class="rkrow"><span class="rkn">'+(i+1)+'</span>'
    + '<span class="rknm">'+esc(s.store_name)+'</span>'
    + '<span class="rkv">'+moneyFull(s.mtd.net_sales)+'<span class="rks">MTD sales</span></span>'
    + '<span class="rkv '+(s.mtd.pac_pct!=null&&mPacPct!=null?(s.mtd.pac_pct>=mPacPct?"fav":"unfav"):"")+'">'+pct2(s.mtd.pac_pct)+'<span class="rks">PAC</span></span>'
    + '<span class="rkv">'+pct2(s.ytd&&s.ytd.pac_pct)+'<span class="rks">YTD PAC</span></span></div>').join("");
  const head = glanceTrio([
    {label:"MTD net sales", value:moneyFull(mNs)},
    {label:"MTD PAC", value:pct2(mPacPct)},

// MODULE — PAC% 6-month trend (top of the NUMBERS / projection screen). Scope-aggregate
// (org for owner, the store for a GM), last 6 months including the current MTD.
function renderNumbersPacTrend(data){

  const moAbbr = (m)=>{ const d=new Date(m+"T00:00:00Z"); return d.toLocaleString("en-US",{month:"short",timeZone:"UTC"}); };

  const sub = '<b>'+pct2(cur)+'</b> this month (MTD)'+(delta!=null?' · <span class="'+(delta>=0?"fav":"unfav")+'">'+(delta>0?"+":"")+delta.toFixed(2)+'pp vs '+moAbbr(t[0].month)+'</span>':'')+' · 6-mo range '+pct2(lo)+'–'+pct2(hi);

// MODULE — Voice (Owner/GM home): the prod GM-view VOICE module, CURRENT-MONTH (MTD)
// only. Four SMG KPIs — OSAT / Accuracy / Digital %EAD / Cleanliness — for the Combined
// org (owner) or the store (GM). The edge fn gates KPIs to the current month, so this
// never shows last month; an unreported metric shows "—". From voice_view.kpis[0].
function renderHomeVoice(data){
  const vv = data.voice_view;
  if(!vv || !vv.kpis || !vv.kpis.length) return "";
  const k = vv.kpis[0];
  if(k.osat==null && k.accuracy==null && k.cleanliness==null && k.digital_ead==null) return "";
  const f1 = (x)=> x!=null ? Number(x).toFixed(1)+"%" : "—";
  // month label from the data-through period (e.g. 2026-06-01 -> "June")
  const moName = vv.data_through ? new Date(vv.data_through+"T00:00:00Z").toLocaleString("en-US",{month:"long",timeZone:"UTC"}) : "";
  const org = vv.org || {};
  // conditional-format each metric vs the org/portfolio benchmark (all 5 higher=better).
  // green = above org, red = below, neutral within a ±0.3pp dead-band / no benchmark.
  const fmtVs = (val, bench)=>{
    if(val==null) return {v:"—", cls:""};
    if(bench==null) return {v:f1(val), cls:""};
    const d = val - bench;
    return {v:f1(val), cls: (Math.abs(d) <= 0.3 ? "" : (d > 0 ? "fav" : "unfav"))};
  };
  const metrics = [
    {l:"OSAT", val:k.osat, b:org.osat},
    {l:"Accuracy", val:k.accuracy, b:org.accuracy},
    {l:"Digital %EAD", val:k.digital_ead, b:org.digital_ead},
    {l:"Cleanliness", val:k.cleanliness, b:org.cleanliness},
    {l:"Exec. as Designed", val:k.executed_as_designed, b:org.executed_as_designed},
  ];
  const tiles = '<div class="trio voicewrap">'+metrics.map(m=>{ const f=fmtVs(m.val,m.b);
    return '<div class="gtile"><div class="gl">'+m.l+'</div><div class="gv '+f.cls+'">'+f.v+'</div>'
      +(m.b!=null?'<div class="gs">org '+f1(m.b)+'</div>':'')+'</div>';
  }).join("")+'</div>';
  const foot = '<div class="cap">'+(k.n!=null?'n='+k.n+' surveys · ':'')+'green/red vs portfolio · '
    +(vv.sources&&vv.sources.length?esc(vv.sources.join(' / ')):'SMG VOICE')+'</div>';
  return card("Voice — "+(moName?esc(moName)+" ":"")+"MTD", tiles + foot,
    { icon:"⭐", info: (vv.data_through?"VOICE thru "+fmtDate(vv.data_through):"VOICE")+(k.store_name&&k.store_name!=="Combined"?" · "+esc(k.store_name):" · portfolio"), newBadge:true });
}

/* =========================================================================
   renderBoard(payload) — the generic manifest walker. Filters the manifest by
   ACTIVE_LANE, calls each module's render() (sect-isolated), paints #app.
   Exposed on window for the smoke test + future drill code.
   ========================================================================= */
function renderBoard(payload){
  STATE = payload || STATE;
  // A full payload (e.g. a POST repaint, no ?lane=) carries every lane's data —
  // mark any heavy lane whose keys arrived as loaded so we don't refetch it.
  if(payload && payload.data){
    for(const ln of Object.keys(LANE_DISTINCTIVE)){
      if(laneDataPresent(payload.data, ln)) LOADED_LANES.add(ln);
    }
  }
  const data = (STATE && STATE.data) || {};
  const app = document.getElementById("app");
  const mods = MANIFEST.filter(m => m.lane === ACTIVE_LANE);
  let html = "";
  // TODAY leads with the verdict zone (BLUF, plan §3.1 Zone 1): store name +
  // data-through + one honest sentence. Calm-green when nothing is flagged,
  // amber when the priorities feed has items. The big number is the real count.
  if(ACTIVE_LANE === "TODAY"){
    const thru = todayThru(data) || "—";
    const who = data.scope_all ? "Portfolio" : ((data.stores && data.stores[0] && data.stores[0].name) || "Your store");
    let n = 0; try { n = computeTodayPriorities(data).length; } catch(_e){ n = 0; }
    const sub = n
      ? '<b>'+esc(who)+'</b> · '+n+' thing'+(n===1?"":"s")+' need'+(n===1?"s":"")+' you · data thru <b>'+esc(thru)+'</b>'
      : '<b>'+esc(who)+'</b> · all clear right now · data thru <b>'+esc(thru)+'</b>';
    html += verdict(String(n), n===1?"thing needs you":"things need you", sub, n? "warn":"good");
  }
  for(const m of mods){ html += sect(()=>m.render(data, {})); }
  if(!html) html = card("Nothing here yet", '<div class="cbody">No modules registered for this lane.</div>', {});
  app.innerHTML = html;
  // Delegated card-drill handler (plan §10) — bound ONCE on #app. A card with
  // data-card-drill opens its detail sheet; rows/buttons inside that stop
  // propagation (numbersDrill / the action buttons) fire their own behavior.
  if(!app.dataset.drillBound){
    app.dataset.drillBound = "1";
    app.addEventListener("click", (e)=>{
      const c = e.target.closest("[data-card-drill]");
      if(!c) return;
      const kind = c.getAttribute("data-card-drill");
      const id = c.getAttribute("data-card-id");
      try{
        // NUMBERS drills go to openNumbersSheet; GUESTS/TEAM drills to openLaneSheet.
        if(LANE_DRILL_KINDS.has(kind)) openLaneSheet(kind, id!=null ? { store_id: Number(id) } : {});
        else openNumbersSheet(kind, id!=null ? { store_id: Number(id) } : {});
      }
      catch(err){ console.error("drill failed:", err); }
    });
  }
  paintChrome();
}
window.renderBoard = renderBoard;

/* =========================================================================
   TODAY-lane POST ACTION WIRING (Phase 1) — the audited write spine.
   v2CallApi POSTs {action,...} to the SAME v2 Edge Fn + token, which returns
   the re-gathered {result, data} envelope; we repaint via renderBoard so the
   verdict recounts and the closed row drops out (plan §3.1 act→done loop).
   RO/view-as tokens are rejected server-side before dispatch (plan §7) — the
   Edge Fn returns the error in result, surfaced here. No new endpoint.
   ========================================================================= */
async function v2CallApi(body){
  const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if(r.status === 401) throw new Error("link expired");
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function v2FindRow(el, cls){ while(el && !el.classList.contains(cls)) el=el.parentElement; return el; }

// Mark a task done (action:"close"). Confirm-gated; re-fetches + repaints.
async function v2CloseTask(ev, btn){
  ev.stopPropagation();
  const row = v2FindRow(btn, "t-row"); if(!row) return;
  const id = Number(row.dataset.id);
  if(!confirm("Mark task #"+id+" done?")) return;
  row.classList.add("busy"); btn.disabled = true;
  try{
    const payload = await v2CallApi({ action:"close", id, to_status:"done" });
    if(payload && payload.result && payload.result.ok === false){
      row.classList.remove("busy"); btn.disabled = false;
      alert(payload.result.msg || "Could not close that task."); return;
    }
    renderBoard(payload);
  }catch(e){
    row.classList.remove("busy"); btn.disabled = false;
    alert("Mark done failed: " + (e && e.message));
  }
}

// Resolve a complaint (action:"resolve_complaint"). Closes the linked task too.
async function v2ResolveComplaint(ev, btn){
  ev.stopPropagation();
  const row = v2FindRow(btn, "c-row"); if(!row) return;
  const id = Number(row.dataset.id);
  if(!confirm("Mark this complaint resolved?\n\nThis closes the linked task and stamps it handled. You can't undo this from the page.")) return;
  row.classList.add("busy"); btn.disabled = true;
  try{
    const payload = await v2CallApi({ action:"resolve_complaint", id });
    if(payload && payload.result && payload.result.ok === false){
      row.classList.remove("busy"); btn.disabled = false;
      alert(payload.result.msg || "Could not resolve that complaint."); return;
    }
    renderBoard(payload);
  }catch(e){
    row.classList.remove("busy"); btn.disabled = false;
    alert("Resolve failed: " + (e && e.message));
  }
}

/* =========================================================================
   EDITABLE P&L PROJECTIONS (plan §9.2) — GM/Sup/Owner pencil a projection per
   line as EITHER $ or % of sales; the other unit mirrors live from projected
   net sales (the same derivation v_pnl_projection_state does server-side). Save
   POSTs action:"projection_save"; the Edge Fn re-gathers + we repaint. RO/guest
   tokens are rejected server-side; the owner LOCK freezes the month (projection_
   save raises P0001 → surfaced as "locked"). All writes audited (manager_page_audit).
   ========================================================================= */

// derive the counterpart (the unit the operator did NOT type) vs projected net
// sales. dollars↔pct_of_sales. Returns {text, ok} for the live mirror.
function projDerive(value, valueType, netSales){
  if(value==null || isNaN(value)) return { text:"—", ok:false };
  if(netSales==null || isNaN(netSales) || netSales<=0)
    return { text:"net-sales projection needed to show the other unit", ok:false };
  if(valueType==="dollars"){
    return { text:(value/netSales*100).toFixed(1)+"% of sales", ok:true };
  }
  return { text:moneyKD(netSales*value/100)+" dollars", ok:true };
}

// the projected-net-sales denominator stashed on the editor container.
function __pjNs(){ const e=document.getElementById("pjEdit"); const v=e?e.getAttribute("data-ns"):""; return (v==null||v==="")?null:Number(v); }

// live mirror: show the derived counterpart as the user types / toggles.
function v2ProjMirror(ns){
  const mir = document.getElementById("pjMirror"); if(!mir) return;
  const raw = (document.getElementById("pjVal").value||"").trim();
  const val = raw==="" ? null : Number(raw);
  if(val==null || isNaN(val)){ mir.className="pjmirror muted"; mir.textContent="enter a value"; return; }
  const t = v2ProjType();
  const d = projDerive(val, t, ns);
  mir.className = "pjmirror"+(d.ok?"":" muted");
  mir.innerHTML = d.ok ? '= <b>'+esc(d.text)+'</b>' : esc(d.text);
}

async function v2ProjSave(btn, store, line, month, ns){
  const errEl = document.getElementById("pjErr");
  const raw = (document.getElementById("pjVal").value||"").trim();
  const val = raw==="" ? NaN : Number(raw);
  errEl.classList.remove("show");
  if(isNaN(val) || val<0){ errEl.textContent="Enter a non-negative number."; errEl.classList.add("show"); return; }
  const value_type = v2ProjType();
  btn.disabled = true; btn.textContent = "Saving…";
  try{
    const payload = await v2CallApi({ action:"projection_save", store_id:store, period_month:month, pnl_line:line, value:String(val), value_type });
    if(payload && payload.result && payload.result.ok===false){
      btn.disabled=false; btn.textContent="Save projection";
      errEl.textContent = payload.result.msg || "Could not save."; errEl.classList.add("show"); return;
    }
    closeSheet();
    renderBoard(payload);   // repaint with the fresh derived counterpart + state
  }catch(e){
    btn.disabled=false; btn.textContent="Save projection";
    errEl.textContent = "Save failed: "+(e&&e.message); errEl.classList.add("show");
  }
}
window.v2ProjSave = v2ProjSave;

// OWNER-only: lock / unlock the whole store-month projection. Once locked the
// cells render read-only and projection_save rejects writes (server-enforced).
async function v2ProjectionLock(ev, lock, store, month){
  if(ev) ev.stopPropagation();
  const verb = lock ? "Lock" : "Unlock";
  if(!confirm(verb+" the "+(month?month.slice(0,7):"current")+" projection for this store?"
      + (lock?"\n\nOnce locked, GMs and supervisors can no longer edit these projection cells until you unlock.":""))) return;
  try{
    const payload = await v2CallApi({ action: lock?"projection_lock":"projection_unlock", store_id:store, period_month:month });
    if(payload && payload.result && payload.result.ok===false){
      alert(payload.result.msg || (verb+" failed.")); return;
    }
    renderBoard(payload);
  }catch(e){ alert(verb+" failed: "+(e&&e.message)); }
}
window.v2ProjectionLock = v2ProjectionLock;

/* paint the chrome: version stamp, scope label, tabline */
function paintChrome(){
  const data = (STATE && STATE.data) || {};
  const fnv = data.fn_version || "?";
  const vs = document.getElementById("vstamp");
  vs.textContent = "api "+fnv+" · shell "+SHELL_VERSION;
  vs.classList.toggle("mismatch", fnv !== SHELL_VERSION);
  const scope = data.scope_all ? "Portfolio — all stores"
    : ((data.stores && data.stores.length===1) ? data.stores[0].name
      : ((data.stores ? data.stores.length : 0)+" stores"));
  document.getElementById("scopeLabel").textContent = scope;
  const lane = LANES.find(l=>l.id===ACTIVE_LANE);
  document.getElementById("tabline").innerHTML = esc(lane?lane.label:ACTIVE_LANE)+' · <b id="scopeLabel">'+esc(scope)+'</b>';
  const foot = document.getElementById("foot");
  foot.textContent = "manager-page-v2 · Field-First redesign scaffold · "+(data.scope_all?"portfolio":"single-store")+" scope.";
}

/* =========================================================================
   tab bar — render the five fixed lanes; tap switches ACTIVE_LANE + repaints.
   ========================================================================= */
function buildTabBar(){
  const bar = document.getElementById("tabbar");
  bar.innerHTML = LANES.map(l =>
    '<button class="tab'+(l.id===ACTIVE_LANE?" on":"")+'" data-lane="'+l.id+'">'
    + '<span class="ti">'+l.icon+'</span>'+esc(l.label)+'</button>').join("");
  bar.querySelectorAll(".tab").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const lane = b.getAttribute("data-lane");
      ACTIVE_LANE = lane;
      bar.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x===b));
      if(LOADED_LANES.has(lane) || !LANE_KEYS[lane]){
        renderBoard();                       // data already in memory — instant
      } else {
        paintSkeleton();                     // per-lane skeleton while it loads
        paintChrome();
        await ensureLane(lane);
        if(ACTIVE_LANE === lane) renderBoard();  // user may have tabbed away mid-fetch
      }
      document.getElementById("app").scrollIntoView({block:"start"});
    });
  });
}

/* skeleton paint (sized to final layout, no spinner) */
function paintSkeleton(){
  const app = document.getElementById("app");
  let s = "";
  for(let i=0;i<3;i++){
    s += '<div class="skel"><div class="sl w40"></div><div class="sl w90"></div><div class="sl w70"></div><div class="sl tall"></div></div>';
  }
  app.innerHTML = s;
}

/* error panel */
function showError(msg){
  document.getElementById("app").innerHTML = '<div class="errbox">'+esc(msg)+'</div>';
  const foot = document.getElementById("foot"); if(foot) foot.textContent="";
}

/* theme: persisted toggle + auto arches after Chicago sunset is a later refinement */
function initTheme(){
  const saved = localStorage.getItem("mp2-theme");
  if(saved) document.body.dataset.theme = saved;
  document.getElementById("themebtn").addEventListener("click", ()=>{
    const next = document.body.dataset.theme==="arches" ? "" : "arches";
    document.body.dataset.theme = next;
    localStorage.setItem("mp2-theme", next);
  });
}

/* =========================================================================
   init() — token auth + fetch the deployed v2 Edge Fn + skeleton->data paint.
   ========================================================================= */
async function init(){
  initTheme();
  buildTabBar();
  if(!TOKEN){
    showError("Missing token. This link should include ?t=<token>.");
    return;
  }
  paintSkeleton();
  try{
    // LEAN first paint (plan §6.2): TODAY + NUMBERS only. Heavy lanes lazy-load
    // on first tab open. ?lane= is honored by the Edge Fn (v2-0.2); an older Fn
    // ignores the param and returns the full payload — still correct, just not
    // lean — so this is back-compatible.
    const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN) + "&lane=TODAY,NUMBERS");
    if(r.status === 401){ showError("This link has expired or is invalid. Text Eddie for a fresh one."); return; }
    if(!r.ok) throw new Error("HTTP " + r.status);
    const payload = await r.json();
    // If the Fn ignored ?lane= (older version) and returned a heavy lane's data,
    // mark those lanes loaded so we don't needlessly refetch them.
    if(payload && payload.data){
      for(const ln of ["GUESTS","TEAM","MORE"]){
        if(laneDataPresent(payload.data, ln)) LOADED_LANES.add(ln);
      }
    }
    renderBoard(payload);
  }catch(e){
    showError("Could not load board: " + (e && e.message));
  }
}

/* =========================================================================
   ensureLane(lane) — lazy-load a heavy lane's data on first open. Shows a
   per-lane skeleton, fetches ?lane=<lane>, merges ONLY that lane's keys into
   STATE.data (so it can't clobber other lanes), marks it loaded, repaints.
   Returns true once the lane's data is present (already-loaded = instant true).
   ========================================================================= */
// MONTH SELECTOR (NUMBERS P&L): re-fetch financials for the chosen month (incl. a future
// month to project) and repaint. Swaps only the financials slice in STATE.data.
async function v2SelectFinMonth(month){
  try{
    const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN) + "&lane=TODAY,NUMBERS&fin_month=" + encodeURIComponent(month));
    if(!r.ok) throw new Error("HTTP " + r.status);
    const payload = await r.json();
    const incoming = (payload && payload.data) || {};
    if(STATE && STATE.data && incoming.financials){ STATE.data.financials = incoming.financials; }
    renderBoard();
  }catch(e){ console.error("fin month switch failed:", e && (e.message||e)); }
}

async function ensureLane(lane){
  if(LOADED_LANES.has(lane) || !LANE_KEYS[lane]) return true;
  if(LANE_INFLIGHT[lane]){ return LANE_INFLIGHT[lane]; }
  const p = (async () => {
    try{
      const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN) + "&lane=" + encodeURIComponent(lane));
      if(!r.ok) throw new Error("HTTP " + r.status);
      const payload = await r.json();
      const incoming = (payload && payload.data) || {};
      if(STATE && STATE.data){
        // Merge ONLY this lane's keys (the Fn returns null/[] for un-asked lanes;
        // copying just LANE_KEYS[lane] prevents clobbering already-loaded lanes).
        for(const k of LANE_KEYS[lane]){
          if(k in incoming) STATE.data[k] = incoming[k];
        }
        if(incoming.fn_version) STATE.data.fn_version = incoming.fn_version;
      } else {
        STATE = payload;
      }
      LOADED_LANES.add(lane);
      return true;
    }catch(e){
      console.error("lazy lane load failed (" + lane + "):", e && (e.message||e));
      LOADED_LANES.add(lane);   // render the honest empty/error states rather than spin
      return false;
    } finally {
      delete LANE_INFLIGHT[lane];
    }
  })();
  LANE_INFLIGHT[lane] = p;
  return p;
}
window.ensureLane = ensureLane;
init();
</script>
