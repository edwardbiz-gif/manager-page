  if(!b || !(b.items||[]).length) return "";
  const rows = b.items.slice(0,3).map(function(it){
    const sc = brainSev(it.severity);
    return '<div class="exrow '+sc+'" style="cursor:default">'
      + '<div><span class="exsev '+sc+'">'+esc(String(it.severity||"info").toUpperCase())+'</span> '
      + '<b>'+esc(it.headline||"")+'</b></div>'
      + (it.why?'<div class="mut" style="font-size:12px;margin-top:2px">'+esc(it.why)+'</div>':'')
      + (it.lever?'<div style="font-size:12px;margin-top:2px">Do: <b>'+esc(it.lever)+'</b></div>':'')
      + (it.citation?'<div class="mut" style="font-size:11px;margin-top:2px">source: '+esc(it.citation)+'</div>':'')
      + '</div>';
  }).join("");
  return card("Today’s Brief", rows
    + '<div class="cap">Top 3 for your scope from the operator brief engine. Every item cites its source.</div>',
    { icon:"🧠", through: b.data_through || b.brief_date || undefined, newBadge:true });
}

// MODULE — Temp watch (TODAY, Owner/Sup/GM): open refrigeration excursions
// from the temp_watch state, worst first, + an explicit all-clear. EVERY
// reading is an INFERRED product temp (TEMPERATURE_SIMULATED) and is labeled
// "inferred" — the same convention the grill tile uses to distinguish real
// probe reads. Inferred readings never page; this is a watch surface.
function renderTempWatch(data){
  const tw = data.temp_watch;
  if(!tw) return "";
  const open = tw.open||[];
  let body;
  if(!open.length){
    body = '<div class="vflags"><span class="flag good">all clear — no open temp excursions</span></div>';
  } else {
    body = open.map(function(r){
      const sc = (r.band==="critical"||r.kind==="silent") ? "sev-bad" : "sev-warn";
      const lab = r.kind==="silent" ? "SILENT" : String(r.band||"watch").toUpperCase();
      return '<div class="exrow '+sc+'" style="cursor:default">'
        + '<div><span class="exsev '+sc+'">'+lab+'</span> <b>'+esc(r.store_name)+'</b> · '+esc(r.sensor_name||"sensor")
        + (r.unit_kind?' <span class="mut">('+esc(r.unit_kind)+')</span>':'')+'</div>'
        + '<div style="font-size:12px;margin-top:2px">'
        + (r.reading_f!=null
            ? '<b>'+Number(r.reading_f).toFixed(1)+'&deg;F</b> <span class="flag warn" style="font-size:9px;padding:1px 5px">inferred</span> at '+esc(fmtCT(r.reading_ts))
            : 'sensor stopped reporting')
        + (r.open_hours!=null?' <span class="mut">· open '+esc(r.open_hours)+'h</span>':'')
        + '</div>'
        + (r.threshold_note?'<div class="mut" style="font-size:11px;margin-top:2px">'+esc(r.threshold_note)+'</div>':'')
        + '</div>';
    }).join("");
  }
  body += '<div class="cap">'+esc(tw.source_note||"")+'</div>';
  return card("Temp watch", body,
    { icon:"🌡️", through: tw.data_through ? fmtCT(tw.data_through) : undefined, newBadge:true });
}

// MODULE — Food Cost AvT (NUMBERS, Owner/Sup/GM): actual vs theoretical food %
// per store, ranked worst variance first (server-sorted). Honest about the
// two big caveats: actual is the PRELIMINARY open-month R365 %, and every
// ingredient cost in the theoretical is an estimate.
function renderAvtFoodCost(data){
  const av = data.food_cost_avt;
  if(!av || !(av.stores||[]).length) return "";
  const pf = function(v){ return v==null ? "—" : Number(v).toFixed(1)+"%"; };
  const money = function(v){ return v==null ? "—" : "$"+Math.round(Math.abs(Number(v))).toLocaleString(); };
  const vTxt = function(v){ return v==null ? "—" : (v>0?"+":"")+Number(v).toFixed(1); };
  let body = "";
  if(av.multi_store){
    body += av.stores.map(function(s){
      const spark = sparkline((s.trend||[]).map(function(t){ return t.pts; }), {w:84,h:18});
      return '<div class="row"><span class="nm">'+esc(s.store_name)
        + (s.actual_is_preliminary?' <span class="flag prelim" style="font-size:9px;padding:1px 5px">prelim</span>':'')+'</span>'
        + '<span class="vl">'+vTxt(s.variance_pct)+'<span class="un"> pt</span></span>'
        + '<span class="mut" style="font-size:11px;margin-left:8px">'+pf(s.theoretical_food_pct)+' theo → '+pf(s.actual_food_pct)+' act · '
        + money(s.variance_usd)+'/day · cov '+pf(s.coverage_pct)+'</span>'
        + (spark?'<span style="margin-left:auto">'+spark+'</span>':'')
        + '</div>';
    }).join("");
    body = '<div class="board">'+body+'</div>'
      + '<div class="cap">Worst variance first. “prelim” = the actual % is the open R365 month.</div>';
  } else {
    const s = av.stores[0];
    body += glanceTrio([
      { label:"Theoretical", value: pf(s.theoretical_food_pct) },
      { label:"Actual"+(s.actual_is_preliminary?" (prelim)":""), value: pf(s.actual_food_pct) },
      { label:"Variance", value: vTxt(s.variance_pct)+"pt", cls:(s.variance_pct!=null && s.variance_pct>=3?"bad":"") },
    ]);
    const spark = sparkline((s.trend||[]).map(function(t){ return t.pts; }), {w:160,h:24});
    body += '<div class="row"><span class="mut" style="font-size:12px">'+money(s.variance_usd)+'/day est. variance · map covers '+pf(s.coverage_pct)+' of product sales</span>'
      + (spark?'<span style="margin-left:auto">'+spark+'</span>':'')+'</div>';
  }
  body += '<div class="cap">'+esc(av.footnote||"All ingredient costs are estimates.")+'</div>';
  return card("Food Cost AvT", body,
    { icon:"🍔", through: av.data_through || undefined, newBadge:true });
}

// MODULE — Crew flight risk (TEAM, Owner/Sup/GM; fn never sends it to RO/
// guest tokens): forward-looking attrition risk. High/watch counts + the
// probability-weighted forward $ exposure per store, then the top at-risk
// crew ("First L." labels only — GEIDs never reach the client) with each
// person's top risk driver.
function renderFlightRisk(data){
  const fr = data.flight_risk;
  if(!fr || !(fr.stores||[]).length) return "";
  const money = function(v){ return v==null ? "—" : "$"+Math.round(Number(v)).toLocaleString(); };
  let body = "";
  const hero = fr.org || (fr.stores.length===1 ? {
    high_count: fr.stores[0].high_count, watch_count: fr.stores[0].watch_count,
    forward_exposure_usd: fr.stores[0].forward_exposure_usd,
  } : null);
  if(hero){
    body += '<div class="vflags">'
      + (Number(hero.high_count)? '<span class="flag warn">'+esc(hero.high_count)+' high risk</span>':'')
      + (Number(hero.watch_count)? '<span class="flag warn">'+esc(hero.watch_count)+' watch</span>':'')
      + ((!Number(hero.high_count) && !Number(hero.watch_count))? '<span class="flag good">no crew flagged</span>':'')
      + '<span class="flag recon">'+money(hero.forward_exposure_usd)+' forward exposure</span>'
      + '</div>';
  }
  if(fr.multi_store){
    body += '<div class="board">'+fr.stores.map(function(s){
      return '<div class="row"><span class="nm">'+esc(s.store_name)+'</span>'
        + '<span class="vl">'+esc(s.high_count||0)+'<span class="un"> high</span></span>'
        + '<span class="mut" style="font-size:11px;margin-left:8px">'+esc(s.watch_count||0)+' watch · '
        + money(s.forward_exposure_usd)+' exposure · '+esc(s.scored||0)+' scored</span></div>';
    }).join("")+'</div>';
  }
  const tc = fr.top_crew||[];
  if(tc.length){
    body += '<div class="mut" style="font-size:11px;font-weight:700;margin:8px 0 4px;text-transform:uppercase;letter-spacing:.04em">Top at-risk crew</div>'
      + tc.map(function(c){
          const sc = c.risk_band==="high" ? "sev-bad" : "sev-warn";
          return '<div class="exrow '+sc+'" style="cursor:default">'
            + '<div><span class="exsev '+sc+'">'+esc(String(c.risk_band||"").toUpperCase())+'</span> <b>'+esc(c.crew_label)+'</b> '
            + '<span class="mut" style="font-size:11px">'+esc(c.store_name)
            + (c.tenure_days!=null?' · day '+esc(c.tenure_days):'')
            + (c.risk_score!=null?' · score '+esc(Math.round(Number(c.risk_score))):'')+'</span></div>'
            + (c.top_signal_detail?'<div class="mut" style="font-size:11px;margin-top:2px">'+esc(c.top_signal_detail)+'</div>':'')
            + '</div>';
        }).join("");
  }
  body += '<div class="cap">Forward exposure = '+esc(fr.exposure_basis||"high + probability-weighted watch")
    + ' at '+money(fr.cost_per_exit_usd)+' per exit. '+esc(fr.coverage_note||"")
    + ' Names show as first name + last initial.</div>';
  return card("Crew flight risk", body,
    { icon:"🚪", through: fr.data_through || undefined, newBadge:true });
}

/* =========================================================================
   v2-0.48 NEW TASK / TICKET page (task_form) — the create form, on the page
   framework (one gather server-side, one render module here). Two modes:
   CREATE TASK (title/desc/store/priority/due date + assignee picker) and
   CREATE TICKET (Technology + Maintenance shown DISABLED "coming soon" —
   deliberately visible; Petra enabled). POSTs task_create / ticket_create via
   v2CallApi (the audited write spine; the fn rejects RO tokens + disabled
   ticket types server-side — everything here is UX, not the gate).
   ========================================================================= */
const TF = { page:null, mode:"task", ticketType:null };

function tfStoreOptions(page, selId, curVal){
  const cps = page.can_pick_store === true;
  const stores = page.stores || [];
  if(!cps){
    const st = stores.filter(s=>s.id===page.default_store_id)[0];
    return '<div class="tf-inp" style="opacity:.75">'+esc(st ? st.name : "Org-wide")+'</div>';
  }
  let h = '<select id="'+esc(selId)+'" class="tf-sel"'+(selId==="tfStore"?' onchange="tfStoreChanged()"':'')+'>';
  h += '<option value=""'+(curVal==null?' selected':'')+'>Org — no single store</option>';
  for(const s of stores){
    h += '<option value="'+s.id+'"'+(curVal===s.id?' selected':'')+'>'+esc(s.name)+'</option>';
  }
  return h+'</select>';
}

function tfPrioOptions(selId){
  return '<select id="'+esc(selId)+'" class="tf-sel">'
    + '<option value="low">Low</option>'
    + '<option value="normal" selected>Normal</option>'
    + '<option value="high">High</option>'
    + '<option value="urgent">Urgent</option></select>';
}

// Assignable people for the picked store: the store team, that store's
// supervisor (supervisor_stores), then org roles — the same routing vocabulary
// the fn built the list from. No store picked = supervisors + org only.
function tfAssigneeGroups(page, storeId){
  const A = page.assignees || [];
  const groups = [];
  if(storeId != null){
    const team = A.filter(a=>a.store_id===storeId);
    if(team.length) groups.push(["This store", team]);
    const sups = A.filter(a=>(a.sup_store_ids||[]).indexOf(storeId)>=0);
    if(sups.length) groups.push(["Store supervisor", sups]);
  } else {
    const sups = A.filter(a=>(a.sup_store_ids||[]).length);
    if(sups.length) groups.push(["Supervisors", sups]);
  }
  const org = A.filter(a=>a.store_id==null && !(a.sup_store_ids||[]).length);
  if(org.length) groups.push(["Org", org]);
  return groups;
}

function tfAssigneeListHtml(page, storeId){
  const groups = tfAssigneeGroups(page, storeId);
  if(!groups.length) return '<div class="empline">Nobody assignable in the directory for this pick.</div>';
  let h = "";
  for(const g of groups){
    h += '<div class="tf-agh">'+esc(g[0])+'</div>';
    for(const a of g[1]){
      h += '<label class="tf-arow"><input type="checkbox" value="'+a.id+'">'
        + '<span class="tf-anm">'+esc(a.name)+'</span><span class="tf-arl">'+esc(a.role)+'</span></label>';
    }
  }
  return h;
}

function tfSelectedStore(selId, page){
  if(page.can_pick_store !== true) return page.default_store_id;
  const sel = document.getElementById(selId);
  if(!sel) return page.default_store_id;
  return sel.value === "" ? null : Number(sel.value);
}

function tfStoreChanged(){
  const page = TF.page; if(!page) return;
  const box = document.getElementById("tfAsg");
  if(box) box.innerHTML = tfAssigneeListHtml(page, tfSelectedStore("tfStore", page));
}
window.tfStoreChanged = tfStoreChanged;

function tfShowMode(mode){
  TF.mode = mode;
  const t = document.getElementById("tfTask"), k = document.getElementById("tfTicket");
  if(t) t.style.display = mode==="task" ? "" : "none";
  if(k) k.style.display = mode==="ticket" ? "" : "none";
  const bt = document.getElementById("tfTabTask"), bk = document.getElementById("tfTabTicket");
  if(bt) bt.classList.toggle("on", mode==="task");
  if(bk) bk.classList.toggle("on", mode==="ticket");
}
window.tfShowMode = tfShowMode;

function tfPickType(key, btn){
  TF.ticketType = key;
  document.querySelectorAll(".tf-tkbtn").forEach(b=>b.classList.remove("on"));
  if(btn) btn.classList.add("on");
  const f = document.getElementById("tfTkForm");
  if(f) f.style.display = "";
}
window.tfPickType = tfPickType;

function tfMsg(id, ok, text){
  const el = document.getElementById(id);
  if(el) el.innerHTML = '<div class="'+(ok?"tf-ok":"tf-err")+'">'+esc(text)+'</div>';
}

async function tfSubmitTask(btn){
  const page = TF.page; if(!page) return;
  const title = (document.getElementById("tfTitle")||{}).value || "";
  if(!title.trim()){ tfMsg("tfTaskMsg", false, "A title is required."); return; }
  const ids = [];
  document.querySelectorAll("#tfAsg input[type=checkbox]:checked").forEach(c=>ids.push(Number(c.value)));
  const body = {
    action: "task_create",
    title: title.trim(),
    description: ((document.getElementById("tfDesc")||{}).value || "").trim(),
    store_id: tfSelectedStore("tfStore", page),
    priority: (document.getElementById("tfPrio")||{}).value || "normal",
    due_at: (document.getElementById("tfDue")||{}).value || "",
    assignees: ids.join(","),
  };
  if(btn) btn.disabled = true;
  try{
    const payload = await v2CallApi(body);
    if(payload && payload.result && payload.result.ok === false){
      tfMsg("tfTaskMsg", false, payload.result.msg || "Could not create the task.");
    } else {
      tfMsg("tfTaskMsg", true, (payload && payload.result && payload.result.msg) || "Task created.");
      ["tfTitle","tfDesc","tfDue"].forEach(i=>{ const el=document.getElementById(i); if(el) el.value=""; });
      document.querySelectorAll("#tfAsg input[type=checkbox]:checked").forEach(c=>{ c.checked=false; });
      if(BOARD_BOOTED) renderBoard(payload);   // the Your-tasks card behind the page recounts
    }
  }catch(e){ tfMsg("tfTaskMsg", false, "Create failed: "+(e && e.message)); }
  if(btn) btn.disabled = false;
}
window.tfSubmitTask = tfSubmitTask;

async function tfSubmitTicket(btn){
  const page = TF.page; if(!page) return;
  if(TF.ticketType !== "petra"){ tfMsg("tfTkMsg", false, "Pick a ticket type first."); return; }
  const desc = ((document.getElementById("tfTkDesc")||{}).value || "").trim();
  if(!desc){ tfMsg("tfTkMsg", false, "Describe what you need."); return; }
  const body = {
    action: "ticket_create",
    ticket_type: "petra",
    description: desc,
    store_id: tfSelectedStore("tfTkStore", page),
    priority: (document.getElementById("tfTkPrio")||{}).value || "normal",
  };
  if(btn) btn.disabled = true;
  try{
    const payload = await v2CallApi(body);
    if(payload && payload.result && payload.result.ok === false){
      tfMsg("tfTkMsg", false, payload.result.msg || "Could not send the ticket.");
    } else {
      tfMsg("tfTkMsg", true, (payload && payload.result && payload.result.msg) || "Sent to Petra.");
      const el = document.getElementById("tfTkDesc"); if(el) el.value = "";
      if(BOARD_BOOTED) renderBoard(payload);
    }
  }catch(e){ tfMsg("tfTkMsg", false, "Send failed: "+(e && e.message)); }
  if(btn) btn.disabled = false;
}
window.tfSubmitTicket = tfSubmitTicket;

    +   '<label class="tf-lab" for="tfDesc">Description (optional)</label>'
    +   '<textarea id="tfDesc" class="tf-txa" placeholder="Any detail the assignee needs"></textarea>'

    +   tfStoreOptions(page, "tfStore", page.default_store_id)
    +   '<label class="tf-lab">Priority</label>'
    +   tfPrioOptions("tfPrio")
    +   '<label class="tf-lab" for="tfDue">Due date (optional)</label>'
    +   '<input id="tfDue" type="date" class="tf-inp">'
    +   '<label class="tf-lab">Assign to (optional — pick anyone who should own or help)</label>'
    +   '<div id="tfAsg" class="tf-asg"></div>'
    +   '<div class="cap" style="margin-top:6px">First pick becomes the task owner; the rest join as collaborators. You stay on the task either way. No pick = it lands on your own board as new.</div>'
    +   '<button type="button" class="tf-sub" onclick="tfSubmitTask(this)">Create task</button>'

    +     '<div id="tfTkMsg"></div>'

/* ===== Owner Priorities page (learning-loop spec 03) — owner-only ranking
   weights. The fn 403s non-owners; this surface just reads/edits the small
   business_priorities table. ===== */
const PR = { page:null };
function prStoreName(sid){
  const s = (PR.page && (PR.page.stores||[]).find(function(x){ return x.id===sid; }));
  return s ? (s.store_number + " " + s.location_name) : ("store #" + sid);
}

  const page = (payload && payload.page) || {};

        ? (" · " + (r.window_start || "…") + " to " + (r.window_end || "…")) : "";

        + (r.note ? '<div class="cap">' + esc(r.note) + '</div>' : "")
        + '</div>'
        + '<select class="tf-inp" style="width:64px" data-id="' + r.id + '" onchange="prSaveWeight(this)">' + wOptions(r.weight) + '</select>'
        + '<button type="button" class="tf-tab" data-id="' + r.id + '" onclick="prDelete(this)" title="remove">✕</button>'

    }
    tbl += '</div>';
  }
  const metOpts = vocab.map(function(m){ return '<option value="' + esc(m) + '">' + esc(m) + '</option>'; }).join("");
  const storeOpts = (page.stores || []).map(function(s){ return '<option value="' + s.id + '">' + esc(s.store_number + " " + s.location_name) + '</option>'; }).join("");
  const add = '<div style="margin-top:6px">'

    + '<label class="tf-lab">Weight (0 = last, 1 = neutral, 3 = top)</label><select id="prWeight" class="tf-inp">' + wOptions(1) + '</select>'
    + '<label class="tf-lab">Season window (optional)</label>'
    + '<div style="display:flex;gap:8px"><input id="prWinStart" type="date" class="tf-inp"><input id="prWinEnd" type="date" class="tf-inp"></div>'
    + '<label class="tf-lab">Note (optional)</label><input id="prNote" class="tf-inp" maxlength="200" placeholder="why this weight">'
    + '<button type="button" class="tf-sub" onclick="prAdd(this)">Add priority</button>'

   renderBoard(payload) — the generic manifest walker. Filters the manifest by
   ACTIVE_LANE, calls each module's render() (sect-isolated), paints #app.

// ── STORE INCIDENT BANNER (v2-0.57) — the flashing top-of-home alert for an open
// store_incidents row. EXPLAINS the signal in plain language (what an inferred over-
// temp reading means, why it matters, what to do), links the incident task, and shows
// the team's live reply thread UNDER it so the whole store (sup-and-below, incl. RO)
// can follow. RO tokens see the banner + read the thread; the Reply write is hidden
// for them (server rejects it anyway). Renders "over-then-SILENT" distinctly (worse).
function ibWhen(ts){
  if(!ts) return "";
  try{ return new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
  catch(_e){ return String(ts).slice(0,16); }
}
function renderIncidentBanner(data){
  var incs = (data && data.incidents) || [];
  if(!incs.length) return "";
  var ro = data && data.read_only === true;
  return incs.map(function(inc){
    var units = inc.units || [];
    var anySilent = inc.has_silent === true;
    var allSilent = inc.all_silent === true;
    var unitRows = units.map(function(u){
      var rf = (u.reading_f==null? "—" : u.reading_f+"°F");
      if(u.silent){
        return '<li><b>'+esc(u.sensor_name)+'</b> — last read <b>'+esc(rf)+'</b>, then the sensor went <b>SILENT</b> (no data since '+esc(u.data_through||"?")+'). Treat it as failing and unmonitored.</li>';
      }
      return '<li><b>'+esc(u.sensor_name)+'</b> — running <b>'+esc(rf)+'</b>, over the 40°F fridge / 0°F freezer limit.</li>';
    }).join("");
    var explain = anySilent
      ? 'A refrigeration sensor read over the safe limit and then STOPPED REPORTING. A unit that was too warm and is now blind is worse, not better — treat it as failing until a probe proves otherwise. These are Jolt INFERRED product temps, so confirm with a real probe thermometer.'
      : 'One or more refrigeration units have read over the safe temperature for a day or more — a new pattern. These are Jolt INFERRED product temps (the sensor estimates how cold the food is from air-temp trends), so a probe confirms it — but a new, sustained over-limit reading usually means a real problem worth checking now.';
    var taskId = inc.linked_task_id;
    var thread = inc.thread || [];
    var threadHtml = thread.length
      ? '<div class="ib-thread"><div class="ib-thread-h">Updates from the team ('+thread.length+')</div>'
        + thread.map(function(t){ return '<div class="ib-msg"><span class="ib-au">'+esc(t.author||"Team")+'</span><span class="ib-at">'+esc(ibWhen(t.at))+'</span><div class="ib-bd">'+esc(t.body||"")+'</div></div>'; }).join("")
        + '</div>'
      : '<div class="ib-thread ib-empty">No updates yet — be the first to post what you find.</div>';
    var replyBtn = (!ro && taskId!=null)
      ? '<button class="ib-reply" onclick="v2IncidentReply(event,this,'+taskId+')">Reply with probe reading / update</button>'
      : '';
    var ticket = inc.ticket_ref ? '<div class="ib-ticket">Ticket '+esc(inc.ticket_ref)+'</div>' : '';
    return '<div class="incident-banner'+(allSilent?" ib-silent":"")+'" role="alert" aria-live="assertive">'
      + '<span class="ib-flag">'+(anySilent?"SENSOR SILENT · OVER TEMP":"REFRIGERATION OVER TEMP")+'</span>'
      + '<div class="ib-title">'+esc(inc.title||"Refrigeration incident")+'</div>'
      + '<div class="ib-explain">'+explain+'</div>'
      + '<ul class="ib-units">'+unitRows+'</ul>'
      + '<div class="ib-do"><b>What to do now:</b> verify each unit with a probe thermometer. If it reads over 41°F, move the product to a working cooler and call refrigeration service. Then post what you find below so your supervisor and the whole team can follow.</div>'
      + '<div class="ib-meta">Data through <b>'+esc(inc.data_through||"?")+'</b> · '+esc(inc.source||"Jolt inferred product temps")+(taskId!=null?(' · task #'+taskId):'')+'</div>'
      + ticket
      + replyBtn
      + threadHtml
      + '</div>';
  }).join("");
}
// Banner Reply — reuses the exact C-1 gated path (v2ReplySend keys off .t-reply-sheet
// / .trBody). RO tokens never see this button; the server rejects the write regardless.
function v2IncidentReply(ev, btn, id){
  ev.stopPropagation();
  var banner = btn.closest(".incident-banner"); if(!banner) return;
  var open = banner.querySelector(".t-reply-sheet");
  if(open){ open.remove(); return; }
  var sheet = document.createElement("div");
  sheet.className = "lb-form t-reply-sheet";
  sheet.style.marginTop = "10px";
  sheet.innerHTML = '<b>Post an update to #'+id+'</b>'
    +'<textarea class="trBody" rows="3" placeholder="e.g. probed McCafe cooler at 43°F, moved milk to the walk-in, called service — tech ETA 2pm" style="width:100%"></textarea>'
    +'<div class="lb-actions"><button class="lb-btn go" onclick="v2ReplySend(event,this,'+id+')">Send</button>'
    +'<button class="lb-btn" onclick="event.stopPropagation();this.closest(\'.t-reply-sheet\').remove()">cancel</button></div>'
    +'<div class="trMsg actsub"></div>';
  sheet.addEventListener("click", function(e){ e.stopPropagation(); });
  banner.appendChild(sheet);
  var ta = sheet.querySelector(".trBody"); if(ta) ta.focus();
}
window.v2IncidentReply = v2IncidentReply;

function renderBoard(payload){
  STATE = payload || STATE;
  // A full payload (e.g. a POST repaint, no ?lane=) carries every lane's data —
  // mark any heavy lane whose keys arrived as loaded so we don't refetch it.
  if(payload && payload.data){
    for(const ln of Object.keys(LANE_DISTINCTIVE)){
      if(laneDataPresent(payload.data, ln)) LOADED_LANES.add(ln);
    }
  }
  const data = (STATE && STATE.data) || {};
  const app = document.getElementById("app");
  const mods = MANIFEST.filter(m => m.lane === ACTIVE_LANE);
  let html = "";
  // TODAY leads with the verdict zone (BLUF, plan §3.1 Zone 1): store name +
  // data-through + one honest sentence. Calm-green when nothing is flagged,
  // amber when the priorities feed has items. The big number is the real count.
  if(ACTIVE_LANE === "TODAY"){
    // Flashing incident banner FIRST — above the verdict (Eddie's over-temp directive).
    try { html += renderIncidentBanner(data); } catch(_e){ /* a banner failure never blanks the board */ }
    const thru = todayThru(data) || "—";
    const who = data.scope_all ? "Portfolio" : ((data.stores && data.stores[0] && data.stores[0].name) || "Your store");
    let n = 0; try { n = computeTodayPriorities(data).length; } catch(_e){ n = 0; }
    const sub = n
      ? '<b>'+esc(who)+'</b> · '+n+' thing'+(n===1?"":"s")+' need'+(n===1?"s":"")+' you · data thru <b>'+esc(thru)+'</b>'
      : '<b>'+esc(who)+'</b> · all clear right now · data thru <b>'+esc(thru)+'</b>';
    html += verdict(String(n), n===1?"thing needs you":"things need you", sub, n? "warn":"good");
  }
  for(const m of mods){ html += sect(()=>m.render(data, {})); }
  if(!html) html = card("Nothing here yet", '<div class="cbody">No modules registered for this lane.</div>', {});
  app.innerHTML = html;
  // Delegated card-drill handler (plan §10) — bound ONCE on #app. A card with
  // data-card-drill opens its detail sheet; rows/buttons inside that stop
  // propagation (numbersDrill / the action buttons) fire their own behavior.
  if(!app.dataset.drillBound){
    app.dataset.drillBound = "1";
    app.addEventListener("click", (e)=>{
      const c = e.target.closest("[data-card-drill]");
      if(!c) return;
      const kind = c.getAttribute("data-card-drill");
      const id = c.getAttribute("data-card-id");
      try{
        // v2-0.36: "page:<id>" drills route to the page framework (full-screen
        // page layer), everything else keeps the sheet behavior unchanged.
        if(kind && kind.indexOf("page:") === 0){ openPage(kind.slice(5)); return; }
        // NUMBERS drills go to openNumbersSheet; GUESTS/TEAM drills to openLaneSheet.
        if(LANE_DRILL_KINDS.has(kind)) openLaneSheet(kind, id!=null ? { store_id: Number(id) } : {});
        else openNumbersSheet(kind, id!=null ? { store_id: Number(id) } : {});
      }
      catch(err){ console.error("drill failed:", err); }
    });
  }
  paintChrome();
}
window.renderBoard = renderBoard;

   ========================================================================= */
/* v2-0.36: LANE-SCOPED POST repaint (the single biggest measured win — a full
   no-lane POST re-gather ran ~17s on an owner token; the lean lanes run ~1.7s).
   The Edge Fn has honored ?lane= on POST since v2-0.2; only the shell never sent
   it. We ask for TODAY,NUMBERS (the verdict + financials always repaint — a
   projection save needs fresh financials) plus the ACTIVE lane so the slice the
   user is looking at (and just wrote to) refreshes. The response is then merged
   through mergePostPayload — NEVER a wholesale STATE swap, which would null
   every loaded lane the lane-scoped response did not carry. */
const ALWAYS_MERGE_KEYS = ["fn_version","manager","stores","scope_all","tasks","complaints",
                           "financials","cleanliness_race","osat_incentive","bonus_home","sl_oepe_home",
                           "grill_temps_home","check_in","_meta",
                           // v2-0.47 brain slices that ride the lean TODAY/NUMBERS gather:
                           "todays_brief","temp_watch","food_cost_avt",
                           // v2-0.57 open store incidents → the flashing banner:
                           "incidents",
                           // v2-0.58 board prompts + owner responses + logging contest:
                           "board_prompts","prompt_responses","food_contest",
                           // v2-0.48 top-level RO flag (gates the New Task / Ticket tile):
                           "read_only"];
function mergePostPayload(payload, askedLanes){
  if(!STATE || !STATE.data){ STATE = payload; return STATE; }
  const incoming = (payload && payload.data) || {};
  const keys = new Set(ALWAYS_MERGE_KEYS);
  for(const ln of (askedLanes || [])){ for(const k of (LANE_KEYS[ln] || [])) keys.add(k); }
  for(const k of keys){ if(k in incoming) STATE.data[k] = incoming[k]; }
  STATE.result = payload ? payload.result : null;
  return { result: STATE.result, data: STATE.data };
}
async function v2CallApi(body){
  const lanes = ["TODAY","NUMBERS"];
  if(LANE_KEYS[ACTIVE_LANE] && lanes.indexOf(ACTIVE_LANE) < 0) lanes.push(ACTIVE_LANE);
  const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN) + "&lane=" + lanes.join(","), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if(r.status === 401) throw new Error("link expired");
  if(!r.ok) throw new Error("HTTP " + r.status);
  const payload = await r.json();
  const merged = mergePostPayload(payload, lanes);
  saveSnapshot();
  return merged;
}

async function v2ReplySend(ev, btn, id){
  ev.stopPropagation();
  const sheet = btn.closest(".t-reply-sheet"); if(!sheet) return;
  const body = ((sheet.querySelector(".trBody")||{}).value || "").trim();

  btn.disabled = true; if(msgEl) msgEl.textContent = "Sending…";
  try{
    const payload = await v2CallApi({ action:"reply", id, reply_body: body });
    const res = payload && payload.result;
    // result.msg is a fixed server string — render as TEXT (textContent), never HTML.
    if(msgEl) msgEl.textContent = (res && res.msg) ? res.msg : "Filed.";
    if(res && res.ok){ const ta = sheet.querySelector(".trBody"); if(ta){ ta.value=""; ta.disabled=true; } }
    else { btn.disabled = false; }
  }catch(e){
    btn.disabled = false;
    if(msgEl) msgEl.textContent = "Could not send: " + (e && e.message ? e.message : e);
  }
}

/* =========================================================================
   EDITABLE P&L PROJECTIONS (plan §9.2) — GM/Sup/Owner pencil a projection per
   line as EITHER $ or % of sales; the other unit mirrors live from projected
   net sales (the same derivation v_pnl_projection_state does server-side). Save
   POSTs action:"projection_save"; the Edge Fn re-gathers + we repaint. RO/guest
   tokens are rejected server-side; the owner LOCK freezes the month (projection_
   save raises P0001 → surfaced as "locked"). All writes audited (manager_page_audit).
   ========================================================================= */

// derive the counterpart (the unit the operator did NOT type) vs projected net
// sales. dollars↔pct_of_sales. Returns {text, ok} for the live mirror.
function projDerive(value, valueType, netSales){
  if(value==null || isNaN(value)) return { text:"—", ok:false };
  if(netSales==null || isNaN(netSales) || netSales<=0)
    return { text:"net-sales projection needed to show the other unit", ok:false };
  if(valueType==="dollars"){
    return { text:(value/netSales*100).toFixed(1)+"% of sales", ok:true };
  }
  return { text:moneyKD(netSales*value/100)+" dollars", ok:true };
}

// open the inline editor (in the drill sheet) for one projection line.

  const curVal = d.pjValue!=="" ? Number(d.pjValue) : null;
  let curType = d.pjValuetype || d.pjDefaulttype || "dollars";

    + '<div><div class="pjline">'+esc(label)+'</div>'
      + '<div class="pjsub">Enter EITHER a dollar amount OR a % of sales — the other computes from your projected net sales'
      + (ns!=null?' ('+moneyKD(ns)+')':' (set Net Sales first to mirror the other unit)')+'.</div></div>'
    + '<div class="pjtog">'
      + '<button type="button" class="pjt'+(curType==="dollars"?" on":"")+'" data-type="dollars" onclick="v2ProjSetType(this)">$ Dollars</button>'
      + '<button type="button" class="pjt'+(curType==="pct_of_sales"?" on":"")+'" data-type="pct_of_sales" onclick="v2ProjSetType(this)">% of sales</button>'
    + '</div>'
    + '<div class="pjfield"><span class="pjpre" id="pjPre">'+(curType==="dollars"?"$":"")+'</span>'
      + '<input id="pjVal" type="text" inputmode="decimal" autocomplete="off" placeholder="0"'
      + (curVal!=null?' value="'+esc(curVal)+'"':'')+'>'
      + '<span class="pjpost" id="pjPost">'+(curType==="dollars"?"":"%")+'</span></div>'
    + '<div class="pjmirror muted" id="pjMirror">enter a value</div>'

  inp.addEventListener("input", ()=>v2ProjMirror(ns));

function v2ProjType(){ const on=document.querySelector(".pjtog .pjt.on"); return on?on.getAttribute("data-type"):"dollars"; }

  document.querySelectorAll(".pjtog .pjt").forEach(b=>b.classList.toggle("on", b===btn));

// the projected-net-sales denominator stashed on the editor container.

// live mirror: show the derived counterpart as the user types / toggles.
function v2ProjMirror(ns){
  const mir = document.getElementById("pjMirror"); if(!mir) return;
  const raw = (document.getElementById("pjVal").value||"").trim();
  const val = raw==="" ? null : Number(raw);
  if(val==null || isNaN(val)){ mir.className="pjmirror muted"; mir.textContent="enter a value"; return; }
  const t = v2ProjType();
  const d = projDerive(val, t, ns);
  mir.className = "pjmirror"+(d.ok?"":" muted");
  mir.innerHTML = d.ok ? '= <b>'+esc(d.text)+'</b>' : esc(d.text);

async function v2ProjSave(btn, store, line, month, ns){
  const errEl = document.getElementById("pjErr");

  const value_type = v2ProjType();
  btn.disabled = true; btn.textContent = "Saving…";
  try{
    const payload = await v2CallApi({ action:"projection_save", store_id:store, period_month:month, pnl_line:line, value:String(val), value_type });

    btn.disabled=false; btn.textContent="Save projection";

}

function buildTabBar(){
  const bar = document.getElementById("tabbar");

    '<button class="tab'+(l.id===ACTIVE_LANE?" on":"")+'" data-lane="'+l.id+'">'
    + '<span class="ti">'+l.icon+'</span>'+esc(l.label)+'</button>').join("");
  bar.querySelectorAll(".tab").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const lane = b.getAttribute("data-lane");
      ACTIVE_LANE = lane;
      telemetrySee("lane_" + lane.toLowerCase());   // usage telemetry (spec 02)
      bar.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x===b));
      if(LOADED_LANES.has(lane) || !LANE_KEYS[lane]){
        renderBoard();                       // data already in memory — instant
      } else {
        paintSkeleton();                     // per-lane skeleton while it loads
        paintChrome();
        await ensureLane(lane);
        if(ACTIVE_LANE === lane) renderBoard();  // user may have tabbed away mid-fetch
      }
      // v2-0.32: jump to the top of the new lane WITHOUT scrollIntoView. The
      // .phone frame is overflow:hidden yet still programmatically scrollable
      // (the off-screen drill sheet hangs past its bottom edge), so
      // scrollIntoView silently scrolled .phone by the chrome's height (~82px);
      // the sticky chrome then STUCK over every lane's first card ("PAC% trend
      // starts mid-chart") with no scrollbar for the user to recover. Reset any
      // stray inner scroll + scroll the window to the top instead.
      const ph = document.querySelector(".phone");
      if(ph) ph.scrollTop = 0;
      window.scrollTo(0, 0);
    });
  });
}

/* =========================================================================
   init() — token auth + fetch the deployed v2 Edge Fn + skeleton->data paint.
   v2-0.36: (a) PAGE-FIRST deep links: &p=<route> (alias &view=) boots the page
   alone; the board is not fetched until the page closes. (b) sessionStorage
   STALE-WHILE-REVALIDATE: a <10-min snapshot paints instantly, then the fresh
   fetch MERGES over it (never a wholesale swap, which would null the
   snapshot's loaded lanes) and repaints.
   ========================================================================= */
const SNAP_KEY = "mp2-snap-" + (TOKEN ? TOKEN.slice(0, 10) : "anon");
const SNAP_TTL_MS = 10 * 60 * 1000;
function saveSnapshot(){
  try{
    if(!STATE || !STATE.data) return;
    sessionStorage.setItem(SNAP_KEY, JSON.stringify({
      shell: SHELL_VERSION, at: Date.now(),
      lanes: Array.from(LOADED_LANES), data: STATE.data,
    }));
  }catch(_e){ /* quota or private mode — snapshotting is best-effort */ }
}
function readSnapshot(){
  try{
    const raw = sessionStorage.getItem(SNAP_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || s.shell !== SHELL_VERSION || !s.data) return null;          // version-keyed
    if((Date.now() - (s.at || 0)) > SNAP_TTL_MS) return null;            // 10-min TTL
    return s;
  }catch(_e){ return null; }
}

async function init(){
  initTheme();
  buildTabBar();
  if(!TOKEN){
    showError("Missing token. This link should include ?t=<token>.");
    return;
  }
  // PAGE-FIRST boot for deep links (&p=ranker; &view= accepted as the v1-style alias).
  const pRoute = QS.get("p") || QS.get("view");
  const pid = pRoute && PAGE_BY_ROUTE[pRoute];
  if(pid){ openPage(pid, { deeplink: true }); return; }   // board boots on first close
  bootBoard();
}

async function bootBoard(){
  if(BOARD_BOOTED) return;
  BOARD_BOOTED = true;
  paintSkeleton();
  // stale-while-revalidate: instant paint from a recent same-session snapshot.
  const snap = readSnapshot();
  if(snap){
    STATE = { result: null, data: snap.data };
    for(const l of (snap.lanes || [])) LOADED_LANES.add(l);
    renderBoard();
  }
  try{
    // LEAN first paint (plan §6.2): TODAY + NUMBERS only. Heavy lanes lazy-load
    // on first tab open. ?lane= is honored by the Edge Fn (v2-0.2); an older Fn
    // ignores the param and returns the full payload — still correct, just not
    // lean — so this is back-compatible.
    const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN) + "&lane=TODAY,NUMBERS");
    if(r.status === 401){ showError("This link has expired or is invalid. Text Eddie for a fresh one."); return; }
    if(!r.ok) throw new Error("HTTP " + r.status);
    const payload = await r.json();
    // If the Fn ignored ?lane= (older version) and returned a heavy lane's data,
    // mark those lanes loaded so we don't needlessly refetch them.
    if(payload && payload.data){
      for(const ln of ["GUESTS","TEAM","MORE"]){
        if(laneDataPresent(payload.data, ln)) LOADED_LANES.add(ln);
      }
    }
    if(STATE && STATE.data){
      renderBoard(mergePostPayload(payload, ["TODAY","NUMBERS"]));   // snapshot painted: merge fresh over it
    } else {
      renderBoard(payload);
    }
    saveSnapshot();
  }catch(e){
    if(STATE && STATE.data){ console.error("board refresh failed (stale snapshot kept):", e && (e.message||e)); }
    else showError("Could not load board: " + (e && e.message));
  }
}

/* =========================================================================
   ensureLane(lane) — lazy-load a heavy lane's data on first open. Shows a
   per-lane skeleton, fetches ?lane=<lane>, merges ONLY that lane's keys into
   STATE.data (so it can't clobber other lanes), marks it loaded, repaints.
   Returns true once the lane's data is present (already-loaded = instant true).
   ========================================================================= */
// MONTH SELECTOR (NUMBERS P&L): re-fetch financials for the chosen month (incl. a future
// month to project) and repaint. Swaps only the financials slice in STATE.data.
// Fix #2 (task #22): ONE fetch in flight at a time — while a switch is pending,
// further picks are QUEUED (latest wins) instead of racing, and the ledger card
// paints a loading skeleton (FIN_MONTH_LOADING → renderPacLedger). Fast clicking
// can no longer double-paint or land an out-of-order (stale) month.
let FIN_MONTH_INFLIGHT = false;   // a fetch is pending
let FIN_MONTH_PENDING = null;     // the newest pick queued while in flight
let FIN_MONTH_REQUESTED = null;   // what the skeleton's selector should show
async function v2SelectFinMonth(month){
  FIN_MONTH_REQUESTED = month;
  if(FIN_MONTH_INFLIGHT){ FIN_MONTH_PENDING = month; return; }   // queue, don't race
  FIN_MONTH_INFLIGHT = true;
  FIN_MONTH_LOADING = true;
  renderBoard();                                                 // immediate skeleton
  try{
    const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN) + "&lane=TODAY,NUMBERS&fin_month=" + encodeURIComponent(month));
    if(!r.ok) throw new Error("HTTP " + r.status);
    const payload = await r.json();
    const incoming = (payload && payload.data) || {};
    if(STATE && STATE.data && incoming.financials){ STATE.data.financials = incoming.financials; }
  }catch(e){ console.error("fin month switch failed:", e && (e.message||e)); }
  finally{
    FIN_MONTH_INFLIGHT = false;
    const next = FIN_MONTH_PENDING; FIN_MONTH_PENDING = null;
    if(next != null && next !== month){ v2SelectFinMonth(next); return; }  // run the queued pick (skeleton stays up)
    FIN_MONTH_LOADING = false;
    FIN_MONTH_REQUESTED = null;
    renderBoard();
  }
}

async function ensureLane(lane){
  if(LOADED_LANES.has(lane) || !LANE_KEYS[lane]) return true;
  if(LANE_INFLIGHT[lane]){ return LANE_INFLIGHT[lane]; }
  const p = (async () => {
    try{
      const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN) + "&lane=" + encodeURIComponent(lane));
      if(!r.ok) throw new Error("HTTP " + r.status);
      const payload = await r.json();
      const incoming = (payload && payload.data) || {};
      if(STATE && STATE.data){
        // Merge ONLY this lane's keys (the Fn returns null/[] for un-asked lanes;
        // copying just LANE_KEYS[lane] prevents clobbering already-loaded lanes).
        for(const k of LANE_KEYS[lane]){
          if(k in incoming) STATE.data[k] = incoming[k];
        }
        if(incoming.fn_version) STATE.data.fn_version = incoming.fn_version;
      } else {
        STATE = payload;
      }
      LOADED_LANES.add(lane);
      saveSnapshot();   // v2-0.36: keep the stale-while-revalidate snapshot current
      return true;
    }catch(e){
      console.error("lazy lane load failed (" + lane + "):", e && (e.message||e));
      LOADED_LANES.add(lane);   // render the honest empty/error states rather than spin
      return false;
    } finally {
      delete LANE_INFLIGHT[lane];
    }
  })();
  LANE_INFLIGHT[lane] = p;
  return p;
}
window.ensureLane = ensureLane;
init();
</script>
