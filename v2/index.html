// shared contest body — finds the viewer's store(s) in the standings and shows
// rank + an honest gap (to the podium for the race / to the 72% line for OSAT).
function contestBody(c, data, opts){
  const stores = data.stores || [];
  const myIds = new Set(data.scope_all ? [] : stores.map(s=>s.id));
  const standings = c.standings;
  const mine = standings.filter(s=>myIds.has(s.store_id));
  const note = c.note ? '<div class="contestsub" style="margin-top:9px">'+esc(c.note)+'</div>' : '';
  const fullStandings = contestStandings(c, myIds, opts);

  if(!mine.length){
    // Owner/portfolio scope — show the leader + qualifying summary instead.
    const leader = standings[0];
    const lead = leader ? '<div class="contestsub">Leading: <b>'+esc(leader.store_name)+'</b> at '+leader.score.toFixed(1)+'%</div>' : '';
    const sum = opts.kind==="osat"
      ? (opts.tiers
        ? '<div class="contestsub"><b>'+(c.qualifying||0)+'</b> of <b>'+(c.total||standings.length)+'</b> stores '
          +(opts.status==="mtd"?"earning":"earned")+' · '
          +opts.tiers.map(t=>esc(t.amount)+' ≥'+t.threshold+'%').join(' · ')+'</div>'
        : '<div class="contestsub"><b>'+(c.qualifying||0)+'</b> of <b>'+(c.total||standings.length)+'</b> stores ≥ '+opts.threshold+'% '+opts.amount+'</div>')
      : '<div class="contestsub">Top 3 win '+(opts.prizes||[]).join(" / ")+'</div>';
    return '<div>'+lead+sum+'</div>'+note+fullStandings;
  }

  return mine.map(s => {
    let medalCls = "", medalTxt = "#"+s.rank, line = "", barPct = 0, barCol = "var(--accent)";
    if(opts.kind==="osat"){
      const graduated = !!opts.tiers;
      const earned = graduated ? (s.earned||null) : null;
      const inMoney = graduated ? !!earned
        : (opts.threshold!=null ? s.score >= opts.threshold : !!s.in_money);
      medalCls = inMoney ? "win" : "miss"; medalTxt = inMoney ? "✓" : "✗";
      barCol = inMoney ? "var(--good)" : "var(--bad)";
      // Graduated bar runs to the TOP tier (74) so a $50 store still sees headroom.
      const barThr = graduated ? opts.tiers[opts.tiers.length-1].threshold : opts.threshold;
      barPct = barThr ? Math.max(4, Math.min(100, (s.score/barThr)*100)) : 0;
      if(graduated){
        const mtd = opts.status==="mtd";
        const at = (mtd ? esc(opts.monthLabel||"")+' MTD at ' : 'Finished at ')
          +'<b>'+s.score.toFixed(1)+'%</b>';
        line = inMoney
          ? '<div class="contestsub">'+at+' — '+(mtd?'earning':'earned')+' <span class="prizepill">'+esc(earned)+'</span>'
            +(s.next_amount ? ' · <b>'+Number(s.next_gap).toFixed(1)+' pts</b> to '+esc(s.next_amount) : ' — top tier')+'.</div>'
          : '<div class="contestsub">'+at+' — <b>'+(opts.threshold - s.score).toFixed(1)+' pts</b> under the '
            +opts.threshold+'% line'+(mtd?' — no OSAT bonus yet.':' — missed the OSAT bonus.')+'</div>';
      } else {
        line = inMoney
          ? '<div class="contestsub">Finished at <b>'+s.score.toFixed(1)+'%</b> — earned the <span class="prizepill">'+esc(opts.amount)+'</span> for June.</div>'
          : '<div class="contestsub">Finished <b>'+(opts.threshold - s.score).toFixed(1)+' pts</b> under the '+opts.threshold+'% line ('+s.score.toFixed(1)+'%) — missed the '+esc(opts.amount)+' for June.</div>';
      }
    } else {
      const podium = s.rank <= 3;
      medalCls = podium ? "win" : ""; medalTxt = podium ? (s.rank===1?"🥇":s.rank===2?"🥈":"🥉") : "#"+s.rank;
      const leadScore = standings[0] ? standings[0].score : s.score;
      barPct = leadScore>0 ? Math.max(4, Math.min(100, (s.score/leadScore)*100)) : 0;
      barCol = podium ? "var(--good)" : "var(--accent)";
      if(podium){
        line = '<div class="contestsub">In the money at <b>'+s.score.toFixed(1)+'%</b> — '
          + '<span class="prizepill">'+esc((opts.prizes||[])[s.rank-1]||"prize")+'</span> spot.</div>';
      } else {
        const third = standings[2];
        const gap = third ? (third.score - s.score) : null;
        line = '<div class="contestsub">'+s.score.toFixed(1)+'% — finished #'+s.rank+' of '+standings.length
          + (gap!=null && gap>0 ? ', <b>'+gap.toFixed(1)+' pts</b> outside the top 3.' : '.')+'</div>';
      }
    }
    return '<div class="contest">'
      + '<div class="medal '+medalCls+'">'+medalTxt+'</div>'
      + '<div class="contestmain"><div class="contesthd">'+esc(s.store_name)+'</div>'+line
      + '<div class="gapbar"><i style="width:'+barPct.toFixed(0)+'%;background:'+barCol+'"></i></div></div>'
      + '</div>';
  }).join('<div style="height:10px"></div>') + note + fullStandings;
}

// Expandable FULL 12-store standings table for the race / OSAT contest cards
// (ports prod renderCleanlinessRace / renderOsatIncentive "See all standings").
// Native <details> — no JS wiring. Highlights the viewer's own store(s); OSAT rows
// mark the >=threshold in-money stores green. Store-level only (no PII).
function contestStandings(c, myIds, opts){
  const st = c.standings || [];
  if(st.length < 2) return "";
  const num = v => v==null ? "—" : (Math.round(Number(v)*10)/10).toFixed(1)+"%";
  const isOsat = opts.kind==="osat";
  const thr = opts.threshold;
  const graduated = isOsat && !!opts.tiers;   // v2-0.38: per-store earned $ column
  const head = '<tr><th>#</th><th>Store</th><th class="num">'+(isOsat?"OSAT":"Score")+'</th>'
    + (graduated ? '<th class="num">Bonus</th>'
       : isOsat ? '<th class="num">'+(thr!=null?thr:72)+'%+</th>' : '<th class="num">Rank</th>')+'</tr>';
  const rows = st.map(s=>{
    const mine = myIds.has(s.store_id);
    const inMoney = isOsat ? (graduated ? !!s.earned : (thr!=null ? s.score>=thr : !!s.in_money)) : false;
    const cls = mine ? "you" : (inMoney ? "win" : "");
    const last = graduated
      ? (s.earned ? '<span class="slwin">'+esc(s.earned)+'</span>'
                  : (thr!=null ? '+'+(thr-s.score).toFixed(1) : ''))
      : isOsat
      ? (inMoney ? '<span class="slwin">$</span>' : (thr!=null ? '+'+(thr-s.score).toFixed(1) : ''))
      : '#'+s.rank;
    return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+s.rank+'</td>'
      + '<td>'+esc(s.store_name)+(mine?' ←':'')+'</td>'
      + '<td class="num">'+num(s.score)+'</td>'
      + '<td class="num">'+last+'</td></tr>';
  }).join("");
  return '<details class="stexp"><summary>'+(isOsat?"See all stores":"See all standings")
    + ' · '+esc(contestVoiceLabel(c))+'</summary>'
    + '<table class="sttbl"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></details>';
}

/* ---- small TODAY-lane formatters (local; no global helper touched) ---- */
function fmtDate(ts){
  if(!ts) return "";
  try{ return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
  catch(_e){ return String(ts).slice(0,10); }
}
// VOICE/SMG monthly feeds carry period_start = month-START (e.g. 2026-06-01) and
// represent the WHOLE current month month-to-date. So the honest label is
// "<Month> MTD", NOT "data thru 2026-06-01" (which reads as "only through Jun 1")
// and NOT fmtDate's "May 31" (a UTC-parse-then-local-display off-by-one). Parse in
// UTC so the month never shifts.
function voiceMtdLabel(iso){
  if(!iso) return "VOICE";
  try{ return new Date(iso+"T00:00:00Z").toLocaleString("en-US",{month:"long",timeZone:"UTC"})+" MTD"; }
  catch(_e){ return "VOICE"; }
}
// Contest label: a CLOSED (status==='final') contest reads "<Month> final", not "<Month> MTD".
function contestVoiceLabel(c){
  const base = voiceMtdLabel(c && c.data_through);
  return (c && c.status === "final") ? base.replace(/ MTD$/, " final") : base;
}
function ageSince(ts){
  if(!ts) return "";
  const ms=_now()-new Date(ts).getTime();
  const h=Math.floor(ms/3600000);
  if(h < 1) return "just now";
  if(h < 24) return h+"h ago";
  return Math.floor(h/24)+"d ago";
}
/* ---- Jolt helpers (v2-0.30) ---- */
// "Jolt data thru 6:20 PM CT" — a TIME, not just a date: the pull is twice
// daily so the hour matters (spec: docs/plans/jolt-v2-cards/plan-spec.md).
function fmtCT(ts){
  if(!ts) return "—";
  try{
    return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",
      month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}).format(new Date(ts))+" CT";
  }catch(_e){ return String(ts).slice(0,16); }
}
function fmtCTTime(ts){
  if(!ts) return "—";
  try{
    return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",
      hour:"numeric",minute:"2-digit"}).format(new Date(ts));
  }catch(_e){ return String(ts).slice(11,16); }
}
// minute-grained reading age ("12m ago") — sensor readings can be minutes old.
function joltAge(min){
  if(min==null) return "";
  if(min < 60) return min+"m ago";
  if(min < 2880) return Math.round(min/60)+"h ago";
  return Math.round(min/1440)+"d ago";
}
// programmatic lane switch (the TODAY Jolt alert rows link to the TEAM cards);
// clicking the real tab button reuses the lazy-load + repaint path.
function gotoLane(id){
  const btn = document.querySelector('.tab[data-lane="'+id+'"]');
  if(btn) btn.click();
}
window.gotoLane = gotoLane;
// "today"/"tomorrow" buckets are AMERICA/CHICAGO calendar days (fix #5, task #22),
// not rolling 24h/48h windows off the viewer's clock — a complaint due 11pm CT
// tonight is "due today" even for a viewer in another timezone.
function dueChip(due_at){
  if(!due_at) return "";
  const d=new Date(due_at).getTime();
  if(d < _now()) return '<span class="duechip over">overdue</span>';
  if(ctDay(d) === ctDay()) return '<span class="duechip today">due today</span>';
  return '<span class="duechip">due '+esc(fmtDate(due_at))+'</span>';
}
function v2Sla(due_at){
  if(!due_at) return { key:"ok", label:"Within SLA" };
  const d = new Date(due_at).getTime();
  if(d < _now()) return { key:"over", label:"Overdue" };
  const day = ctDay(d);
  if(day === ctDay()) return { key:"today", label:"Due today" };
  if(day === ctDayPlus(1)) return { key:"tom", label:"Due tomorrow" };
  return { key:"ok", label:"Within SLA" };
}

/* =========================================================================
   NUMBERS LANE (Phase 2 — the P&L / money tab, plan §3 / §5 / §9 / §10 / §11)
   ADDED ADDITIVELY: render fns below + MANIFEST rows. No other module's code is
   touched. Consumes data.financials EXACTLY as gatherFinancials() returns it
   (mtd / ytd / per_store / aggregate / lines / invoices / doordash / lto), so
   no Edge Fn change is needed and SHELL_VERSION stays matched.

   Honesty rules wired in (plan §4 / docs/conventions.md):
     • Every card states its data-through date (June is PRELIMINARY — surfaced).
     • PAC% / cost-% read ONLY from the precomputed _pct fields the slice carries
       — never recomputed from dollars (§6.1 hard rule).
     • Projections render "pending" (the pnl_projection table is empty until the
       monthly meeting, §9) + reflect the per-line owner-LOCK state when present.
     • Bullet bars show the LEVEL only with "target pending source" — no fabricated
       target (no pac_target column yet, §6.4).
     • DoorDash: a rate RISE is UNfavorable (red), drop favorable (green); a store
       missing its latest quarter falls back to prior + an amber warning (§11.5).
   Role-scope comes straight from the slice (GM = 1 store, Sup = patch, Owner =
   all); the shell never re-scopes — gatherFinancials already filtered.
   ========================================================================= */

// --- money / pct formatters (NUMBERS-local; no global helper touched) ---------
function moneyFull(n){ if(n==null||isNaN(n)) return "—"; return (n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString(); }
// dollar-prefixed compact money for NUMBERS card figures (the shell's shared
// moneyK is bare for in-SVG chart labels; card cells want the explicit "$").
function moneyKD(n){ if(n==null||isNaN(n)) return "—"; const s=n<0?"-":""; return s+"$"+moneyK(Math.abs(n)); }
function pctSigned(p){ return (p==null||isNaN(p)) ? "—" : (p>=0?"+":"")+Number(p).toFixed(2)+"%"; }
function pct1(p){ return (p==null||isNaN(p)) ? "—" : Number(p).toFixed(1)+"%"; }
function pct2(p){ return (p==null||isNaN(p)) ? "—" : Number(p).toFixed(2)+"%"; }

// resolve the focal store the single-store cards (ledger/waterfall/bullets) draw:
// the only in-scope store for a GM, else the largest by net sales (best signal).
function finFocus(fin){
  const ps = fin.per_store || [];
  if(!ps.length) return null;
  if(ps.length === 1) return ps[0];
  return ps.slice().sort((a,b)=>((b.ytd&&b.ytd.net_sales)||0)-((a.ytd&&a.ytd.net_sales)||0))[0];
}
// the data-through line shared across NUMBERS cards (YTD roll is the hard date).
function finThru(fin){
  const y = fin.ytd && fin.ytd.data_through, m = fin.mtd && fin.mtd.data_through;
  return y || m || null;
}
function finPrelim(fin){
  return (fin.ytd && fin.ytd.is_preliminary_any) || (fin.mtd && fin.mtd.is_preliminary) || false;
}

// ---- v2-0.33 verdict helpers: MTD PAC% + the penciled-projection compare ----
// MTD PAC% for a per_store entry: prefer the store's pac_trend6 LAST point when
// it IS the selected month — that point is placeholder-adjusted (not-yet-posted
// costs estimated in), the same figure the PAC% trend card shows, so the two
// NUMBERS cards agree. Falls back to the precomputed mtd.pac_pct column (§6.1).
function mtdPacPct(fin, f){
  const t = f.pac_trend6 || [];
  const last = t.length ? t[t.length-1] : null;
  if(last && last.pac_pct!=null && fin.selected_month && last.month===fin.selected_month) return last.pac_pct;
  return f.mtd ? f.mtd.pac_pct : null;
}
// The store's penciled PAC projection (pnl_projection line 'pac', selected month)
// as a % of sales: the entered % directly, or the server-derived % when entered
// in dollars (v_pnl_projection_state derives it vs the penciled net-sales
// projection; null until net sales is penciled — honest n/a, never fabricated).
// Returns null when NO PAC row exists for the store+month.
function pacProjPct(f){
  const pl = (f.lines||[]).find(l=>l.line==="pac");
  const p = pl && pl.projection;
  if(!p || (pl && pl.projection_pending)) return null;
  const pct = p.value_type==="pct_of_sales" ? p.value
    : (p.derived_type==="pct_of_sales" ? p.derived_value : null);
  return { pct:(pct!=null && !isNaN(pct))?Number(pct):null,
           dollars: p.value_type==="dollars" ? p.value : (p.derived_type==="dollars"?p.derived_value:null) };
}
// The projection-compare line under the verdict sub. When a PAC projection
// exists and a % is derivable: signed pp delta vs it (PAC higher = better).
// When none exists: a neutral hint — tappable straight into the pencil editor
// (the mounted projection-edit path) for a GM/Sup/Owner on a writable month.
function pacProjLine(fin, f, m, moName){
  const proj = pacProjPct(f);
  if(proj && proj.pct!=null && m!=null){
    const d = m - proj.pct;
    return { cls:(d>=0?"fav":"unfav"),
      html:'<div class="vproj '+(d>=0?"fav":"unfav")+'">'+(d>=0?"+":"")+d.toFixed(1)+'pp vs proj '+Number(proj.pct).toFixed(1)+'% ('+esc(moName)+')</div>' };
  }
  if(proj){  // entered in $ but no penciled net sales yet, so no % to compare
    return { cls:"", html:'<div class="vproj neu">PAC projection entered ('+moneyKD(proj.dollars)+'). Pencil a net sales projection in the P&amp;L below to compare in points.</div>' };
  }
  const role = (data_roleForProj());
  const meta = f.projection_meta || {};
  const projMonth = fin.projection_target_month || meta.period_month || fin.projection_month || "";
  const canPencil = (role==="GM"||role==="Supervisor"||role==="Owner") && !fin.read_only && meta.locked!==true && projMonth;
  if(!canPencil) return { cls:"", html:'<div class="vproj neu">No '+esc(moName)+' PAC projection entered</div>' };
  // projected net sales denominator for the editor mirror (same fallback chain
  // as the ledger: penciled proj net sales, else YTD per-month run rate, MTD, YTD).
  const nsL = (f.lines||[]).find(l=>l.line==="net_sales");
  const nsProj = (meta.proj_net_sales!=null) ? meta.proj_net_sales
    : (nsL && nsL.projection && nsL.projection.value_type==="dollars" ? nsL.projection.value
      : (nsL ? (nsL.ytd_avg_month_dollars ?? nsL.mtd_dollars ?? nsL.ytd_dollars) : null));
  return { cls:"", html:'<div class="vproj hint"'
    + ' data-pj-store="'+f.store_id+'" data-pj-line="pac"'
    + ' data-pj-label="Profit After controllables (PAC)"'
    + ' data-pj-month="'+esc(projMonth)+'" data-pj-defaulttype="pct_of_sales"'
    + ' data-pj-value="" data-pj-valuetype=""'
    + ' data-pj-ns="'+(nsProj!=null?esc(nsProj):"")+'"'
    + ' onclick="v2EditProjection(this,event)">No '+esc(moName)+' PAC projection entered. Tap to pencil one ✎</div>' };
}
// the viewer's role (for the pencil gate) — read from the global STATE payload.
function data_roleForProj(){ const d=(STATE&&STATE.data)||{}; return (d.manager&&d.manager.role)||""; }

// MODULE — VERDICT/glance: the money BLUF. Owner/sup lead with the portfolio PAC
// + the genuine spread insight (§6.3); GM leads with their store's PAC level.
// v2-0.33: MTD PAC% shown LEFT of the YTD figure (both labeled); the MTD figure
// conditional-formats vs the penciled pnl_projection PAC target when one exists
// (delta in points), neutral + a pencil hint when none does. YTD keeps its level
// coloring only — there is no sensible YTD projection aggregate to compare to.
function renderNumbersVerdict(data){
  const fin = data.financials || {};
  if(fin.error) return card("Numbers — financials", '<div class="empline">Financials are temporarily unavailable. The rest of the board is unaffected.</div>', { icon:"📊" });
  const thru = finThru(fin), prelim = finPrelim(fin);
  const agg = fin.aggregate, ps = fin.per_store || [];
  const moName = (fin.selected_month_label||"").split(" ")[0] || "MTD";
  const flags = (prelim ? '<span class="flag prelim">⚠ '+esc(moName)+' preliminary</span>' : '')
    + '<span class="flag recon">YTD roll · pre-Withum</span>';
  // data-through honesty for BOTH figures: state each side's date when they
  // differ, one shared date when they match (the usual case — same txn roll).
  const mThru = (fin.mtd && fin.mtd.data_through) || null;
  const yThru = (fin.ytd && fin.ytd.data_through) || null;
  const thruTxt = (mThru && yThru && mThru !== yThru)
    ? 'MTD thru <b>'+esc(mThru)+'</b> · YTD thru <b>'+esc(yThru)+'</b>'
    : 'data thru <b>'+esc(thru||"—")+'</b>';

  if(data.scope_all || ps.length > 1){
    // Owner/Supervisor — portfolio/patch verdict + spread. MTD aggregate PAC% =
    // the scope-aggregate pac_trend6 last point (placeholder-adjusted, matches
    // the trend card) else summed dollars (renderHomeRoundup convention).
    if(!agg) return card("Numbers — financials", '<div class="empline">No in-scope financials yet.</div>', { icon:"📊", through: thru });
    let mNs=0, mPac=0, mAny=false;
    for(const s of ps){ if(s.mtd && s.mtd.net_sales!=null){ mNs+=(s.mtd.net_sales||0); mPac+=(s.mtd.pac_dollars||0); mAny=true; } }
    let mPct = (mAny && mNs) ? mPac/mNs*100 : null;
    const at = fin.pac_trend6||[], atLast = at.length?at[at.length-1]:null;
    if(atLast && atLast.pac_pct!=null && atLast.month===fin.selected_month) mPct = atLast.pac_pct;
    const pos = ps.filter(s=>s.ytd && s.ytd.pac_pct!=null && s.ytd.pac_pct>=0).length;
    const pacs = ps.map(s=>s.ytd&&s.ytd.pac_pct).filter(x=>x!=null);
    const lo = pacs.length?Math.min(...pacs):null, hi = pacs.length?Math.max(...pacs):null;
    const who = data.scope_all ? "Portfolio" : ((data.stores&&data.stores.length)+" stores");
    const sub = '<b>'+esc(who)+' · '+pos+' of '+ps.length+' PAC-positive'
      + (lo!=null?' ('+lo.toFixed(0)+'–'+hi.toFixed(0)+'%)':'')+'.</b> '
      + (agg.pac_spread_pp!=null?'The story is the <b>'+agg.pac_spread_pp.toFixed(1)+'pp spread</b> — labor is the swing factor. ':'')
      + thruTxt;
    // Projections are penciled PER STORE — no invented org aggregate (§ ship
    // note 3). Surface how many stores have one; per-store compare lives in the
    // store drill + the P&L ledger.
    const withProj = ps.filter(s=>pacProjPct(s)).length;
    const projLine = withProj
      ? '<div class="vproj neu">'+withProj+' of '+ps.length+' stores have a '+esc(moName)+' PAC projection. Per store compare in the store drill.</div>'
      : '<div class="vproj neu">No '+esc(moName)+' PAC projections entered yet</div>';
    const body = '<div class="verdict" style="background:linear-gradient(180deg,var(--good-bg),var(--surface) 80%);margin:0;box-shadow:none;border:0;padding:0">'
      + '<div class="vk">'+(data.scope_all?"Portfolio verdict":"Patch verdict")+' · MTD + YTD '+(prelim?"("+esc(moName)+" preliminary)":"")+'</div>'
      + '<div class="vhero vduo">'
      +   '<span class="vfig"><span class="vnum countup">'+pct2(mPct)+'</span><span class="vfl">MTD PAC · '+esc(moName)+'</span></span>'
      +   '<span class="vfig"><span class="vnum countup fav">'+pct2(agg.pac_pct)+'</span><span class="vfl">YTD PAC</span></span>'
      + '</div>'
      + '<div class="vsub">'+sub+'</div>'+projLine
      + '<div class="vflags"><span class="flag good">✓ '+pos+'/'+ps.length+' above water</span>'+flags+'</div></div>';
    return card("Numbers — financials", body, { icon:"📊", through: thru, newBadge:true, drill:{kind:"agg"} });
  }

  // GM — single store verdict (level + how it sits vs the book leaders).
  const f = finFocus(fin);
  if(!f || !f.ytd) return card("Numbers — financials", '<div class="empline">No P&L posted for your store yet.</div>', { icon:"📊", through: thru });
  const y = f.ytd;
  const m = mtdPacPct(fin, f);
  const pj = pacProjLine(fin, f, m, moName);
  // MTD colors ONLY vs the penciled projection (neutral when none exists);
  // YTD keeps its level coloring.
  const mtdCls = pj.cls || "";
  const sub = '<b class="fav">Solidly profitable.</b> Labor at <b>'+pct1(y.labor_pct)+'</b> of sales · food <b>'+pct1(y.food_pct)+'</b> · '+thruTxt;
  const body = '<div class="verdict" style="background:linear-gradient(180deg,var(--good-bg),var(--surface) 80%);margin:0;box-shadow:none;border:0;padding:0">'
    + '<div class="vk">'+esc(f.store_name)+' · MTD + YTD '+(prelim?"("+esc(moName)+" preliminary)":"")+'</div>'
    + '<div class="vhero vduo">'
    +   '<span class="vfig"><span class="vnum countup '+mtdCls+'">'+pct2(m)+'</span><span class="vfl">MTD PAC · '+esc(moName)+'</span></span>'
    +   '<span class="vfig"><span class="vnum countup '+(y.pac_pct>=0?"fav":"unfav")+'">'+pct2(y.pac_pct)+'</span><span class="vfl">YTD PAC</span></span>'
    + '</div>'
    + '<div class="vsub">'+sub+'</div>'+pj.html
    + '<div class="vflags">'+flags+'</div></div>';
  return card("Numbers — financials", body, { icon:"📊", through: thru, newBadge:true, drill:{kind:"store", store_id:f.store_id} });
}

// MODULE — owner/sup per-store rollup rows (worst-PAC-first; each drills).
function renderNumbersRollup(data){
  const fin = data.financials || {};
  if(fin.error) return "";
  const ps = (fin.per_store||[]).filter(s=>s.ytd);
  if(data.scope_all===false && ps.length<=1) return "";   // GM: no rollup
  if(ps.length<=1) return "";
  const thru = finThru(fin);
  const rows = ps.slice().sort((a,b)=>(a.ytd.pac_pct??0)-(b.ytd.pac_pct??0)).map((s,i)=>{
    const pac = s.ytd.pac_pct;
    const fill = Math.max(4, Math.min(100, ((pac??0)/40)*100));
    return '<div class="prow" data-drill="store" data-id="'+s.store_id+'" onclick="numbersDrill(this,event)">'
      + '<div><span class="rank">#'+(i+1)+'</span><span class="pn">'+esc(s.store_name)+'</span>'
      + '<div class="pmeta">'+moneyKD(s.ytd.net_sales)+' net · labor '+pct1(s.ytd.labor_pct)+'</div></div>'
      + '<div><div class="ppac '+(pac>=0?"fav":"unfav")+'">'+pct2(pac)+'</div><div class="pds">'+moneyKD(s.ytd.pac_dollars)+' PAC · tap ›</div></div>'
      + '<div class="miniwf"><i style="width:'+fill.toFixed(0)+'%;background:'+(pac>=0?"var(--good)":"var(--bad)")+'"></i></div></div>';
  }).join("");
  return card(data.scope_all?"By store":"Stores in patch",
    rows + '<div class="cap">Worst-PAC-first. All read the precomputed pac_pct level (never recomputed). Tap a store for its line detail.</div>',
    { icon:"🏪", through: thru ? ("YTD · thru "+thru) : "YTD" });
}

// MODULE — the up-to-PAC ledger: MTD actual · YTD actual · monthly projection.
// Projection cells reflect pnl_projection (pending until the meeting; lock state
// when present). %s come from the precomputed _pct fields, never recomputed.
let FIN_MONTH_LOADING = false;  // NUMBERS-local: a month switch is in flight (fix #2, task #22)
function renderPacLedger(data){
  const fin = data.financials || {};
  if(fin.error) return "";
  const f = finFocus(fin);
  if(!f) return card("Up-to-PAC P&L", '<div class="empline">No P&L lines for the in-scope store(s) yet.</div>', { icon:"📐", newBadge:true });
  // month switch in flight → paint the selector (kept live so further picks queue)
  // + a loading skeleton in place of the ledger. No stale numbers mid-switch.
  if(FIN_MONTH_LOADING){
    const moL = f.available_months || fin.available_months || [];
    const selL = FIN_MONTH_REQUESTED || f.selected_month || fin.selected_month || "";
    const ctlL = moL.length
      ? '<div class="finmonth"><label>Month</label><select onchange="v2SelectFinMonth(this.value)" aria-busy="true">'
        + moL.map(m=>'<option value="'+esc(m.month)+'"'+(m.month===selL?' selected':'')+'>'+esc(m.label)+(m.is_future?' · project':'')+'</option>').join("")
        + '</select></div>' : '';
    return card("P&L", ctlL
      + '<div class="skel" style="border:0;box-shadow:none;padding:4px 0 0;margin:0" aria-busy="true">'
      + '<div class="sl w40"></div><div class="sl w90"></div><div class="sl w70"></div><div class="sl w90"></div><div class="sl w70"></div><div class="sl tall"></div></div>'
      + '<div class="cap">Loading the selected month…</div>', { icon:"📊", newBadge:true });
  }
  const lines = f.lines || [];
  const lineById = new Map(lines.map(l=>[l.line, l]));
  const thru = finThru(fin), prelim = finPrelim(fin);

  // ── editability (§9.2): GM/Sup/Owner may pencil; RO/guest tokens never (the
  // Edge Fn rejects RO POSTs anyway). The owner LOCK freezes the month read-only
  // for everyone — server-enforced by projection_save (P0001). ──
  const role = (data.manager && data.manager.role) || "";
  const meta = f.projection_meta || {};
  const monthLocked = meta.locked === true;
  const roleMayEdit = role==="GM" || role==="Supervisor" || role==="Owner";
  const canEdit = roleMayEdit && !fin.read_only && !monthLocked;
  // month projections write to: the latest actual month (projection_target_month).
  const projMonth = fin.projection_target_month || meta.period_month || fin.projection_month || "";
  // projected net sales = the $/% derivation denominator. Projections are MONTHLY, so
  // fall back to the YTD AVERAGE-PER-MONTH run rate (ytd_avg_month_dollars), not the
  // cumulative YTD, then MTD actual — so the penciled $/% mirror uses a monthly basis.
  const nsProjLine = lineById.get("net_sales");
  const projNetSales = (meta.proj_net_sales!=null) ? meta.proj_net_sales
    : (nsProjLine && nsProjLine.projection && nsProjLine.projection.value_type==="dollars" ? nsProjLine.projection.value
      : (nsProjLine ? (nsProjLine.ytd_avg_month_dollars ?? nsProjLine.mtd_dollars ?? nsProjLine.ytd_dollars) : null));

  // lock state: any locked projection row drives the card-level lock banner.
  let lockedRow = null, openRow = null;
  for(const l of lines){
    if(l.projection && l.projection.locked) lockedRow = l.projection;
    else if(l.projection) openRow = l.projection;
  }
  const allPending = lines.every(l=>l.projection_pending);
  // OWNER-only lock/unlock control (calls projection_lock / projection_unlock).
  const ownerCtl = (role==="Owner" && !fin.read_only && projMonth)
    ? (monthLocked
        ? '<button class="lockbtn unlock" onclick="v2ProjectionLock(event,false,'+f.store_id+',\''+esc(projMonth)+'\')">Unlock</button>'
        : '<button class="lockbtn" onclick="v2ProjectionLock(event,true,'+f.store_id+',\''+esc(projMonth)+'\')">🔒 Lock month</button>')
    : "";
  const lockBar = monthLocked
    ? '<div class="lockbar locked"><span class="lkic">🔒</span><span class="lkmeta">Projection LOCKED for this month — read-only'
        + ((meta.locked_by||(lockedRow&&lockedRow.locked_by))?'<small>Locked by '+esc(meta.locked_by||lockedRow.locked_by)+((meta.locked_at||(lockedRow&&lockedRow.locked_at))?' · '+esc(String(meta.locked_at||lockedRow.locked_at).slice(0,10)):'')+'</small>':'')+'</span>'+ownerCtl+'</div>'
    : allPending
      ? '<div class="lockbar open"><span class="lkic">✏️</span><span class="lkmeta">Projection PENDING'+(canEdit?' — tap a Projection cell to pencil it':'')+'; owner-locked (~the 20th)<small>'+(canEdit?'Enter $ or % of sales — the other computes from projected net sales.':'The pnl_projection table is empty for this month until the meeting (§9).')+'</small></span>'+ownerCtl+'</div>'
      : '<div class="lockbar open"><span class="lkic">✏️</span><span class="lkmeta">Projection OPEN'+(canEdit?' — tap a cell to edit':'')+'; penciled by GM/sup until the owner locks (~the 20th)'
        + (openRow&&openRow.entered_by?'<small>Penciled by '+esc(openRow.entered_by)+' · awaiting owner lock</small>':'')+'</span>'+ownerCtl+'</div>';

  // data attrs the inline editor reads (store, line, current value+type, derived,
  // projected net sales, label, the month being projected).
  const editAttrs = (l) => {
    const p = l.projection || {};
    return ' data-pj-store="'+f.store_id+'"'
      + ' data-pj-line="'+esc(l.line)+'"'
      + ' data-pj-label="'+esc(l.label)+'"'
      + ' data-pj-month="'+esc(projMonth)+'"'
      + ' data-pj-defaulttype="'+esc(l.value_type||"dollars")+'"'
      + ' data-pj-value="'+(p.value!=null?esc(p.value):"")+'"'
      + ' data-pj-valuetype="'+esc(p.value_type||"")+'"'
      + ' data-pj-ns="'+(projNetSales!=null?esc(projNetSales):"")+'"'
      + ' onclick="v2EditProjection(this,event)"';
  };

  // one projection cell, honoring value_type + pending/locked state + editability.
  const projCell = (l) => {
    if(l.projection_pending || !l.projection){
      if(canEdit){
        return '<span class="pcell pending editable"'+editAttrs(l)+'><span class="pproj">set</span><span class="psub">tap to pencil</span></span>';
      }
      return '<span class="pcell pending"><span class="pproj">pending</span><span class="psub">set at meeting</span></span>';
    }
    const p = l.projection;
    const isDollar = p.value_type === "dollars";
    const shown = isDollar ? moneyFull(p.value) : (p.value!=null?Number(p.value).toFixed(2)+"%":"—");
    const unit = isDollar ? "$ dollars" : "% of sales";
    // the derived counterpart (the $/% the operator did NOT type, computed server-
    // side by v_pnl_projection_state vs projected net sales).
    let deriv = "";
    if(p.derived_value!=null && p.derived_type){
      deriv = '<span class="pderiv">'+(p.derived_type==="dollars"?moneyFull(p.derived_value):(Number(p.derived_value).toFixed(2)+"%"))+'</span>';
    }
    const editable = canEdit && !p.locked;
    return '<span class="pcell'+(p.locked?" locked":"")+(editable?" editable":"")+'"'+(editable?editAttrs(l):"")+'>'
      + '<span class="pproj">'+(p.locked?"🔒 ":"")+esc(shown)+'</span>'
      + '<span class="psub">'+unit+'</span>'+deriv+'</span>';
  };

  // a % sub-line colored vs the 12-store org average (conditional format). hb =
  // higher-is-better (revenue/PAC/gross profit); else lower-is-better (cost lines).
  // 0.3pp tolerance = "in line" (neutral). Org avg shown on tap (title) + the drill.
  const pctCell = (myPct, orgPct, hb) => {
    if(myPct==null) return "";
    let kls = "neu";
    if(orgPct!=null && Math.abs(myPct-orgPct) >= 0.3) kls = ((hb ? myPct>orgPct : myPct<orgPct) ? "fav" : "unfav");
    const tip = orgPct!=null ? ' title="org avg '+pct2(orgPct)+' of sales"' : "";
    return '<span class="lcsub '+kls+'"'+tip+'>'+pct2(myPct)+'</span>';
  };
  // org subtotal % = sum of the component lines' org %s (shared net-sales denominator).
  const sumOrgPct = (ids, field) => { let any=false,t=0; for(const id of ids){ const o=(lineById.get(id)||{})[field]; if(o!=null){any=true;t+=o;} } return any?Math.round(t*10)/10:null; };

  // previous-month context cell (muted $ + %).
  const prevCell = (l) => '<span class="lcell prevc">'+(l.prev_dollars==null?"—":moneyFull(l.prev_dollars))+(l.prev_pct!=null?'<span class="lcsub">'+pct2(l.prev_pct)+'</span>':'')+'</span>';
  // the projection in DOLLARS (whichever unit was typed → the $ form).
  const projDollars = (l) => { const p=l.projection; if(!p||l.projection_pending) return null; return p.value_type==="dollars" ? p.value : (p.derived_type==="dollars" ? p.derived_value : null); };
  // Δ = MTD actual − projection (variance from plan). Colored by favorability: hb (sales/
  // PAC) → actual ABOVE plan is good; cost line → actual BELOW plan is good. "—" until set.
  const deltaCell = (l, hb) => {
    const pj = projDollars(l), act = l.mtd_dollars;
    if(pj==null || act==null) return '<span class="lcell dcell neu">—</span>';
    const d = act - pj;
    const kls = Math.abs(d) < 1 ? "neu" : ((hb ? d>0 : d<0) ? "up" : "dn");
    return '<span class="lcell dcell '+kls+'" title="MTD actual − projection">'+(d>0?"+":"")+moneyFull(d)+'</span>';
  };

  // ledger line: name + Prev + MTD + Projection + Δ (actual − proj). MTD % colored vs org.
  const lr = (l, cls) => {
    const hb = (l.line==="net_sales" || l.line==="pac");
    // data_pending: the R365 actual still lumps into a group column → "—" for prev/MTD,
    // but the PROJECTION is fully editable (the point of listing every Withum line).
    if(l.data_pending){
      const tip = 'Actual rolls into '+esc(l.lump_into||"its group")+' — itemized once the R365 GL detail is wired. Projection is editable.';
      return '<div class="lrow dp'+(cls?" "+cls:"")+'">'
        + '<span class="lname" title="'+tip+'">'+esc(l.label)+'</span>'
        + prevCell(l)
        + '<span class="lcell dpc" title="'+tip+'">—</span>'
        + projCell(l)
        + '<span class="lcell dcell neu">—</span></div>';
    }
    let mtdCell;
    if(l.mtd_placeholder){
      mtdCell = '<span class="lcell ph" title="Placeholder ('+esc(l.mtd_placeholder_basis||"estimate")+') — this line hasn’t posted yet this month">~'
        + (l.mtd_dollars==null?"—":moneyFull(l.mtd_dollars))
        + (l.mtd_pct!=null?'<span class="lcsub ph">~'+pct2(l.mtd_pct)+'</span>':'')+'</span>';
    } else {
      const mtdTxt = l.mtd_dollars==null ? "—" : moneyFull(l.mtd_dollars);
      mtdCell = '<span class="lcell">'+mtdTxt+pctCell(l.mtd_pct, l.org_mtd_pct, hb)+'</span>';
    }
    return '<div class="lrow'+(cls?" "+cls:"")+'">'
      + '<span class="lname">'+esc(l.label)+'</span>'
      + prevCell(l)
      + mtdCell
      + projCell(l)
      + deltaCell(l, hb) + '</div>';
  };
  // subtotal row from PRECOMPUTED columns: name + Prev + MTD + (proj —) + (Δ —).
  // `adj` = the MTD figure is placeholder-adjusted (includes estimates) → amber.
  const subRow = (label, prevV, mtdV, pB, mB, hb, orgM, adj) => {
    const mPct = (mtdV!=null && mB) ? mtdV/mB*100 : null;
    const pPct = (prevV!=null && pB) ? prevV/pB*100 : null;
    const mCell = adj
      ? '<span class="lcell ph" title="Includes ~placeholder estimates for lines not yet posted this month">~'+(mtdV==null?"—":moneyFull(mtdV))+(mPct!=null?'<span class="lcsub ph">~'+pct2(mPct)+'</span>':'')+'</span>'
      : '<span class="lcell">'+(mtdV==null?"—":moneyFull(mtdV))+pctCell(mPct,orgM,hb)+'</span>';
    return '<div class="lrow sub"><span class="lname">'+esc(label)+(adj?' <span class="adjnote">incl. est</span>':'')+'</span>'
      + '<span class="lcell prevc">'+(prevV==null?"—":moneyFull(prevV))+(pPct!=null?'<span class="lcsub">'+pct2(pPct)+'</span>':'')+'</span>'
      + mCell
      + '<span class="lcell" style="color:var(--ink-muted)">—</span>'
      + '<span class="lcell dcell neu">—</span></div>';
  };
  const get = (id) => lineById.get(id) || { line:id, label:id, mtd_dollars:null, ytd_dollars:null, projection_pending:true };
  const nsLine = get("net_sales");
  const subM = (f.subtotals && f.subtotals.mtd) || {}, subP = (f.subtotals && f.subtotals.prev) || {};
  const mtdBase = subM.net_sales!=null ? subM.net_sales : nsLine.mtd_dollars;
  const prevBase = subP.net_sales!=null ? subP.net_sales : null;
  // placeholder total (MTD): costs not yet posted ADD to Total Control + SUBTRACT from PAC.
  let phM = 0, hasPh = false;
  for(const l of lines){ if(l.mtd_placeholder && l.mtd_dollars!=null){ phM += (l.mtd_dollars - (l.mtd_actual_raw||0)); hasPh = true; } }
  const tcM = subM.total_control!=null ? subM.total_control + phM : null;
  const pacM = subM.pac!=null ? subM.pac - phM : null;
  const orgCogsM = sumOrgPct(["food","paper"],"org_mtd_pct");
  const orgGpM = orgCogsM!=null ? Math.round((100-orgCogsM)*10)/10 : null;
  const pacLn = get("pac");
  const gh = (t) => '<div class="lgroup">'+esc(t)+'</div>';
  const cogsLines = lines.filter(l=>l.section==="cogs");
  const ctrlLines = lines.filter(l=>l.section==="controllable");
  const pacRow = '<div class="lrow pac"><span class="lname">Profit After controllables (PAC)'+(hasPh?' <span class="adjnote">incl. est</span>':'')+'</span>'
    + '<span class="lcell prevc">'+(subP.pac==null?"—":moneyFull(subP.pac))+(subP.pac!=null&&prevBase?'<span class="lcsub">'+pct2(subP.pac/prevBase*100)+'</span>':'')+'</span>'
    + (hasPh
        ? '<span class="lcell ph" title="MTD PAC less ~placeholder estimates for costs not yet posted">~'+(pacM==null?"—":moneyFull(pacM))+(pacM!=null&&mtdBase?'<span class="lcsub ph">~'+pct2(pacM/mtdBase*100)+'</span>':'')+'</span>'
        : '<span class="lcell fav">'+(subM.pac==null?"—":moneyFull(subM.pac))+pctCell((subM.pac!=null&&mtdBase?subM.pac/mtdBase*100:null), pacLn.org_mtd_pct, true)+'</span>')
    + projCell(pacLn)
    + deltaCell(pacLn, true) + '</div>';

  const ledger =
      lr(nsLine, "sub")
    + gh("Cost of sales")
    + cogsLines.map(l=>lr(l)).join("")
    + subRow("Total Cost of sales", subP.cogs, subM.cogs, prevBase, mtdBase, false, orgCogsM, false)
    + subRow("Gross Profit", subP.gross_profit, subM.gross_profit, prevBase, mtdBase, true, orgGpM, false)
    + gh("Controllable Operating Expenses")
    + ctrlLines.map(l=>lr(l)).join("")
    + subRow("Total Control Expenses", subP.total_control, tcM, prevBase, mtdBase, false, null, hasPh)
    + pacRow;

  // ── MONTH SELECTOR (incl. the next month forward, for projecting) ──
  // These live at the FIN level (gatherFinancials emits them beside per_store);
  // reading them off the focus row only left the selector unmounted (v2-0.28 fix).
  const moList = f.available_months || fin.available_months || [];
  const selMo = f.selected_month || fin.selected_month || "";
  const monthCtl = (moList.length > 1)
    ? '<div class="finmonth"><label>Month</label><select onchange="v2SelectFinMonth(this.value)">'
      + moList.map(m=>'<option value="'+esc(m.month)+'"'+(m.month===selMo?' selected':'')+'>'+esc(m.label)+(m.is_future?' · project':'')+'</option>').join("")
      + '</select></div>' : '';
  const isFut = (f.is_future_month != null) ? f.is_future_month : fin.is_future_month;
  const selMoLabel = f.selected_month_label || fin.selected_month_label || "";
  const prevMoLabel = f.prev_month_label || fin.prev_month_label || "";
  const orgN = (fin.org && fin.org.store_count) || 12;
  const body = monthCtl + lockBar
    + '<div class="lhdr"><span>Line (Withum)</span><span>Prev</span><span>'+(isFut?"Actual":"MTD")+'</span><span class="hproj">Projection</span><span>Δ vs proj</span></div>'
    + '<div class="ledger">'+ledger+'</div>'
    + '<div class="cap"><b>'+(isFut?"This is a FUTURE month — no actuals yet; pencil your projection.":"<b>"+(prelim?"MTD (preliminary)":"Actual")+"</b> = "+esc(selMoLabel)+" actual"+(prelim?" so far (R365 re-keys open periods)":""))+'</b> · '
      + '<b>Prev</b> = '+esc(prevMoLabel||"prior month")+' actual · <b>Projection</b> = your penciled plan (tap to edit; $ or % of sales) · <b>Δ vs proj</b> = actual − projection (<span style="color:var(--good)">green</span> = favorable). '
      + 'MTD % is <b style="color:var(--good)">colored vs the '+orgN+'-store org average</b>; an <b style="color:var(--warn);font-style:italic">~amber "est"</b> value is a placeholder until a reasonable number posts (the Total Control &amp; PAC totals include estimates). '
      + 'Every <b>Withum line</b> is itemized from the R365 GL detail; YTD avg/month is in the line detail (tap the card). Use <b>Month</b> above to review a prior month or project next month.</div>';
  const title = (selMoLabel ? selMoLabel + " P&L" : "P&L");
  return card(title, body, { icon:"📊", through: f.store_name, newBadge:true, drill:{kind:"pac", store_id:f.store_id} });
}

// MODULE — Sales→PAC waterfall (precomputed columns; never recompute PAC).
function renderNumbersWaterfall(data){
  const fin = data.financials || {};
  if(fin.error) return "";
  const f = finFocus(fin);
  const wf = f && f.waterfall;
  if(!wf || wf.net_sales==null) return card("Sales → PAC", '<div class="empline">No current-month P&L to bridge yet.</div>', { icon:"💧" });
  const steps = [
    { label:"Net Sales", val: wf.net_sales, type:"start" },
    { label:"COGS",      val: -(wf.cogs||0), type:"down" },
    { label:"Labor",     val: -(wf.labor||0), type:"down" },
    { label:"Other Ctrl",val: -(wf.other_controllable||0), type:"down" },
    { label:"PAC",       val: wf.pac, type:"end" },
  ];
  const laborPct = (wf.net_sales && wf.labor!=null) ? (wf.labor/wf.net_sales*100).toFixed(1)+"%" : "—";
  const body = waterfall(steps)
    + '<div class="cap">Where every sales dollar goes ('+(wf.basis==="mtd"?"MTD current month":"YTD")+'). Labor is the dominant controllable ('+laborPct+' of sales). '
    + 'Green/red reserved for the PAC outcome only (IBCS). PAC read from the precomputed column.</div>';
  return card("Sales → PAC", body, { icon:"💧", through: f.store_name+" · "+(wf.basis==="mtd"?"MTD":"YTD")+(finThru(fin)?" thru "+finThru(fin):""), drill:{kind:"waterfall", store_id:f.store_id} });
}

// MODULE — MTD invoice tracker (posted vs in-flight).
function renderNumbersInvoices(data){
  const fin = data.financials || {};
  if(fin.error) return "";
  const inv = fin.invoices;
  // v2-0.48: Owner/Sup only — the fn sends invoices:null to every other role
  // (and to RO/guest via role), so the card self-removes instead of rendering
  // an empty shell on GM/DM boards.
  if(!inv) return "";
  if(!inv.lines || !inv.lines.length) return card("MTD Invoice Tracker", '<div class="empline">No invoices tracked this month yet.</div>', { icon:"🧾", newBadge:true });
  const pSum = inv.totals.posted||0, fSum = inv.totals.in_flight||0, tot = pSum+fSum;
  const pCnt = inv.lines.reduce((a,l)=>a+(l.posted_count||0),0);
  const fCnt = inv.lines.reduce((a,l)=>a+(l.in_flight_count||0),0);
  const pPct = tot? (pSum/tot*100) : 0, fPct = tot? (fSum/tot*100) : 0;
  const body =
      '<div class="inv-top">'
    + '<div class="inv-tile posted"><div class="il">● Posted</div><div class="iv">'+moneyKD(pSum)+'</div><div class="is">'+pCnt+' invoices in R365</div></div>'
    + '<div class="inv-tile flight"><div class="il">◍ In-flight</div><div class="iv">'+moneyKD(fSum)+'</div><div class="is">'+fCnt+' detected, not yet posted</div></div></div>'
    + '<div class="invbar"><i class="seg-posted" style="width:'+pPct+'%"></i><i class="seg-flight" style="width:'+fPct+'%"></i></div>'
    + '<div class="invbar-leg"><span class="lndots"><span class="dot posted"></span>Posted '+pPct.toFixed(0)+'%</span>'
    + '<span>Total tracked '+moneyKD(tot)+'</span>'
    + '<span class="lndots"><span class="dot flight"></span>In-flight '+fPct.toFixed(0)+'%</span></div>'
    + '<div class="cap">"In-flight" = invoices detected in email/triage but not yet posted in R365 — true MTD spend runs higher than posted. '
    + (data.scope_all||((fin.per_store||[]).length>1) ? "Summed across your in-scope stores. " : "")
    + esc(inv.data_through)+'.</div>';
  return card("MTD Invoice Tracker", body, { icon:"🧾", through: inv.data_through, newBadge:true, drill:{kind:"invoice"} });
}

// MODULE — DoorDash commission rates. Single store = focused q-o-q card; many =
// one row per store. A rate RISE is UNfavorable (red), drop favorable (green).
function renderNumbersDoorDash(data){
  const fin = data.financials || {};
  if(fin.error) return "";
  const dd = fin.doordash;
  if(!dd || !dd.stores || !dd.stores.length) return card("DoorDash rates", '<div class="empline">No commission rates on file for the in-scope store(s).</div>', { icon:"🛵", newBadge:true });
  const single = !(data.scope_all) && dd.stores.length === 1;
  const arrow = (delta, missing) => missing ? {sym:"—",cls:"qflat",word:"no latest qtr"}
    : delta==null ? {sym:"→",cls:"qflat",word:"flat"}
    : delta>0 ? {sym:"↑",cls:"qup",word:"up"}
    : delta<0 ? {sym:"↓",cls:"qdown",word:"down"} : {sym:"→",cls:"qflat",word:"flat"};

  if(single){
    const s = dd.stores[0];
    const cur = s.current, prior = s.prior;
    const a = arrow(s.marketplace_delta_pp, s.latest_on_file_only);
    if(!cur) return card("DoorDash rates", '<div class="empline">No commission rates on file for '+esc(s.store_name)+'.</div>', { icon:"🛵", newBadge:true });
    const body =
        '<div class="dd-qoq">'
      + '<span class="qval qmuted">'+(prior?pct2(prior.marketplace_pct):"—")+'</span>'
      + '<span class="qarrow '+a.cls+'">'+a.sym+'</span>'
      + '<span class="qval '+a.cls+'">'+pct2(cur.marketplace_pct)+'</span>'
      + '<span style="font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-muted)">Marketplace · q-o-q</span></div>'
      + '<div class="dd-cur">'
      + '<div class="dd-tile"><div class="ddl">Marketplace</div><div class="ddv">'+pct2(cur.marketplace_pct)+'</div><div class="dds">of order subtotal</div></div>'
      + '<div class="dd-tile const"><div class="ddl">DashPass</div><div class="ddv">'+pct2(cur.dashpass_pct)+'</div><div class="dds">flat org-wide</div></div>'
      + '<div class="dd-tile"><div class="ddl">ADWT</div><div class="ddv">'+(cur.adwt_min!=null?Number(cur.adwt_min).toFixed(2):"—")+'</div><div class="dds">drives the rate</div></div>'
      + '<div class="dd-tile const"><div class="ddl">Drive base</div><div class="ddv">$'+(cur.drive_base_fee!=null?Number(cur.drive_base_fee).toFixed(2):"—")+'</div><div class="dds">flat / order</div></div></div>'
      + (s.latest_on_file_only?'<div class="dd-misswarn">⚠ Latest-quarter DoorDash email not yet received for '+esc(s.store_name)+' — showing '+esc(String(cur.quarter||"prior quarter"))+'.</div>':"")
      + '<div class="cap">Marketplace % keys off <b>ADWT</b> (avg delivery weight/time, ≈ ≥3.0 → higher tier). DashPass &amp; Drive base are constant across all 12 stores. From <b>doordash_commission_rates</b> ('+esc(String(cur.quarter||""))+').</div>';
    return card("DoorDash rates", body, { icon:"🛵", through: (cur.quarter?esc(String(cur.quarter)):"")+(cur.effective_date?" · eff "+String(cur.effective_date):""), newBadge:true, drill:{kind:"dd", store_id:s.store_id} });
  }

  // owner / sup — one row per store, q-o-q marketplace + trend.
  const rows = dd.stores.filter(s=>s.current).map(s=>{
    const a = arrow(s.marketplace_delta_pp, s.latest_on_file_only);
    const sub = s.latest_on_file_only ? "latest qtr missing"
      : (s.current.adwt_min!=null ? "ADWT "+Number(s.current.adwt_min).toFixed(2) : "");
    return '<div class="ddrow'+(s.latest_on_file_only?" miss":"")+'" data-drill="dd" data-id="'+s.store_id+'" onclick="numbersDrill(this,event)">'
      + '<span class="ddn">'+esc(s.store_name)+'<small>#'+esc(s.nsn)+(sub?" · "+sub:"")+'</small></span>'
      + '<span class="ddmkt"><span class="qmuted" style="font-weight:700">'+(s.prior?pct2(s.prior.marketplace_pct):"—")+'</span> → '+pct2(s.current.marketplace_pct)+'</span>'
      + '<span class="ddtr '+a.cls+'">'+a.sym+'</span></div>';
  }).join("");
  const nUp = dd.stores.filter(s=>s.marketplace_delta_pp!=null && s.marketplace_delta_pp>0).length;
  const nDown = dd.stores.filter(s=>s.marketplace_delta_pp!=null && s.marketplace_delta_pp<0).length;
  const body = '<div class="ddhdr"><span>Store</span><span>prior → current</span><span>±</span></div>'+rows
    + '<div class="cap"><b>'+nDown+'</b> down <span class="qdown">↓</span> · <b>'+nUp+'</b> up <span class="qup">↑</span> · rest flat. Rate keys off <b>ADWT</b>. DashPass &amp; Drive base constant across all 12. From <b>doordash_commission_rates</b>.</div>'
    + (dd.missing_latest_quarter ? '<div class="dd-misswarn">⚠ '+dd.missing_latest_quarter+' store'+(dd.missing_latest_quarter>1?"s":"")+' missing the latest-quarter DoorDash email — those rows show the prior quarter.</div>':"");
  return card("DoorDash rates", body, { icon:"🛵", through: "current vs prior quarter on file", newBadge:true, drill:{kind:"dd"} });
}

// MODULE — LTO leaderboard (org-wide units per 1,000 guests; viewer's stores hi-lit).
function renderNumbersLto(data){
  const fin = data.financials || {};
  if(fin.error) return "";
  const lto = fin.lto;
  if(!lto || !lto.promos || !lto.promos.length) return card("LTO leaderboard", '<div class="empline">No LTO promo rankings posted yet.</div>', { icon:"🏆" });
  const medal = (rnk) => rnk===1?"🥇":rnk===2?"🥈":rnk===3?"🥉":"#"+rnk;
  const body = lto.promos.map(p=>{
    const sorted = (p.standings||[]).slice().sort((a,b)=>(a.rnk||99)-(b.rnk||99));
    const rows = sorted.map(s=>{
      const upk = s.units_per_1k_guests;
      return '<div class="ltorow'+(s.in_scope?" mine":"")+'">'
        + '<span class="lmedal">'+medal(s.rnk)+'</span>'
        + '<span class="lname2">'+esc(s.location_name||("#"+s.nsn))+'<small>#'+esc(s.nsn)+' · '+Number(s.units||0).toLocaleString()+' units</small></span>'
        + '<span class="lval">'+(upk!=null?Number(upk).toFixed(1):"—")+'<small>per 1k guests</small></span></div>';
    }).join("");
    return '<div class="ltoseg">'+esc(p.label)+'</div>'+rows;
  }).join("");
  return card("LTO leaderboard", body + '<div class="cap">Units per 1,000 guests by promo, org-wide. Your store(s) highlighted. From v_datapass_lto_rank.</div>',
    { icon:"🏆", through: lto.data_through ? ("data thru "+lto.data_through) : null, drill:{kind:"lto"} });
}

/* ---- NUMBERS drill: every card opens a detail sheet (plan §10) ---------------
   The card() drill cue calls openNumbersSheet(kind, arg); rollup/dd rows wire
   their own onclick→numbersDrill(el). Detail restates the data-through date and
   never fabricates a number the headline withheld (honesty carries into drills). */
function numbersDrill(el, ev){
  telemetrySee("drill_" + (el.getAttribute("data-drill") || "row"));   // usage telemetry (spec 02)
  if(ev) ev.stopPropagation();   // a row drill overrides the parent card's drill
  openNumbersSheet(el.getAttribute("data-drill"), { store_id: Number(el.getAttribute("data-id")) });
}
function finStoreById(fin, id){ return (fin.per_store||[]).find(s=>s.store_id===id) || finFocus(fin); }

function openNumbersSheet(kind, arg){
  const data = (STATE && STATE.data) || {};
  const fin = data.financials || {};
  const thru = finThru(fin) || "—";
  let title="Detail", body="", crumb="Numbers";
  const dr = (k,v) => '<div class="drow"><span class="dk">'+k+'</span><span class="dv">'+v+'</span></div>';

  if(kind==="agg"){
    const agg = fin.aggregate, ps = (fin.per_store||[]).filter(s=>s.ytd).sort((a,b)=>(a.ytd.pac_pct??0)-(b.ytd.pac_pct??0));
    title = data.scope_all ? "Portfolio P&L" : "Patch P&L";
    crumb = "Numbers › <b>"+(data.scope_all?"Portfolio":"Patch")+"</b>";
    body = '<div class="crumb">'+crumb+'</div>'
      + (agg? dr("PAC %", '<span class="fav">'+pct2(agg.pac_pct)+'</span>')+dr("PAC $ (YTD)", moneyFull(agg.pac_dollars))+dr("Net sales (YTD)", moneyFull(agg.net_sales))
            + dr("Food %", pct2(agg.food_pct))+dr("Labor %", pct2(agg.labor_pct))+(agg.pac_spread_pp!=null?dr("PAC spread", agg.pac_spread_pp.toFixed(1)+"pp"):"") : "")
      + '<div class="dsub">Stores · worst-PAC-first</div>'
      + ps.map(s=>dr(esc(s.store_name), pct2(s.ytd.pac_pct)+" · "+moneyKD(s.ytd.net_sales))).join("")
      + '<div class="cap">YTD roll thru '+esc(thru)+'. PAC% read from the precomputed column; aggregate %s from summed dollars.</div>';
  } else if(kind==="store"){
    const s = finStoreById(fin, arg&&arg.store_id);
    if(s && s.ytd){
      title = s.store_name+" · P&L"; crumb = "Numbers › <b>"+esc(s.store_name)+"</b>";
      body = '<div class="crumb">'+crumb+'</div>'
        + dr("PAC %", '<span class="'+(s.ytd.pac_pct>=0?"fav":"unfav")+'">'+pct2(s.ytd.pac_pct)+'</span>')
        + dr("PAC $ (YTD)", moneyFull(s.ytd.pac_dollars)) + dr("Net sales (YTD)", moneyFull(s.ytd.net_sales))
        + dr("Food %", pct2(s.ytd.food_pct)) + dr("Labor %", pct2(s.ytd.labor_pct))
        + (s.mtd? '<div class="dsub">Current month (MTD'+(s.mtd.is_preliminary?" · preliminary":"")+')</div>'
            + dr("MTD net sales", moneyFull(s.mtd.net_sales)) + dr("MTD PAC", moneyFull(s.mtd.pac_dollars)+" · "+pct2(s.mtd.pac_pct)) : "")
        + '<div class="cap">YTD roll thru '+esc(thru)+'. June MTD is preliminary (R365 re-keys open periods).</div>';
    } else { title="P&L"; body='<div class="crumb">Numbers</div><div class="cap">No P&L for this store yet.</div>'; }
  } else if(kind==="pac"){
    const s = finStoreById(fin, arg&&arg.store_id);
    title = (s?s.store_name+" · ":"")+"P&L line detail";
    crumb = "Numbers › "+(s?esc(s.store_name)+" › ":"")+"<b>P&L line detail</b>";
    // % colored vs the org avg, with the org number shown explicitly (no hover needed).
    const cfp = (my,org,hb)=>{ if(my==null) return ""; let k="neu"; if(org!=null&&Math.abs(my-org)>=0.3) k=((hb?my>org:my<org)?"fav":"unfav"); return ' · <span class="'+k+'">'+pct1(my)+'</span>'+(org!=null?' <span style="color:var(--ink-muted);font-size:10px">vs org '+pct1(org)+'</span>':''); };
    const rows = (s&&s.lines||[]).map(l=>{
      const hb=(l.line==="net_sales"||l.line==="pac");
      const proj = l.projection_pending||!l.projection ? "pending"
        : (l.projection.value_type==="dollars"?moneyKD(l.projection.value):Number(l.projection.value).toFixed(1)+"% of sales");
      const tr6 = (l.trend6||[]).map(t=>t.pct).filter(x=>typeof x==="number");
      const sp = tr6.length>=2 ? '<div style="color:var(--ink-muted);font-size:10px;margin-top:2px">6-mo % of sales <span class="drillspark">'+sparkline(tr6,{w:84,h:18})+'</span> '+pct2(tr6[0])+' → '+pct2(tr6[tr6.length-1])+'</div>' : '';
      const val = '<div>MTD '+(l.mtd_dollars==null?"—":moneyFull(l.mtd_dollars))+cfp(l.mtd_pct,l.org_mtd_pct,hb)+'</div>'
        + '<div>YTD '+(l.ytd_dollars==null?"—":moneyFull(l.ytd_dollars))+cfp(l.ytd_pct,l.org_ytd_pct,hb)+'</div>'
        + '<div style="color:var(--proj)">'+proj+' proj</div>' + sp;
      return dr(esc(l.label), val);
    }).join("");
    body = '<div class="crumb">'+crumb+'</div><div class="dsub">Each line: MTD · YTD actual ($ and % of sales, colored vs the org avg) · projection</div>'+rows
      + '<div class="dsub">Projection workflow (§9)</div>'
      + dr("Status", (s&&s.lines||[]).some(l=>l.projection&&l.projection.locked)?"🔒 Locked":"✏️ Pending / open")
      + '<div class="cap">Revenue &amp; PAC projected in dollars; cost lines in % of sales (pnl_projection.value_type). Owner lock makes them immutable. Data thru '+esc(thru)+'.</div>';
  } else if(kind==="waterfall"){
    const s = finStoreById(fin, arg&&arg.store_id); const wf = s&&s.waterfall;
    title = (s?s.store_name+" · ":"")+"Sales → PAC bridge";
    crumb = "Numbers › "+(s?esc(s.store_name)+" › ":"")+"<b>Sales → PAC bridge</b>";
    body = '<div class="crumb">'+crumb+'</div>'+(wf?waterfall([
        {label:"Net Sales",val:wf.net_sales,type:"start"},{label:"COGS",val:-(wf.cogs||0),type:"down"},
        {label:"Labor",val:-(wf.labor||0),type:"down"},{label:"Other Ctrl",val:-(wf.other_controllable||0),type:"down"},
        {label:"PAC",val:wf.pac,type:"end"}]):"")
      + '<div class="dsub">Step-by-step</div>'
      + (wf? dr("Net sales", moneyFull(wf.net_sales)+" · 100%")

     • COMPLAINTS — SLA-sorted resolve list + inline Resolve (reuses the TODAY
       complaint action spine; one render path, two lanes).

// small relative-time + scored-cell helpers (GUESTS-local).
function fbAge(ts){ return ageSince(ts); }
function vvDeltaTxt(c){
  if(c.delta==null) return '<span class="flat">→ flat</span>';
  // favorability, not direction: for lower_better metrics a rise is bad.
  const good = c.lower_better ? c.delta < 0 : c.delta > 0;
  const cls = c.delta===0 ? "flat" : good ? "up" : "down";
  const sym = c.delta>0 ? "+" : "";
  return '<span class="'+cls+'">'+sym+Number(c.delta).toFixed(1)+' MoM</span>';
}
function vvBuTxt(c){
  if(c.june==null || c.bu==null) return "";
  const diff = c.june - c.bu;
  const good = c.lower_better ? diff < 0 : diff > 0;
  return '<span class="'+(diff===0?"flat":good?"up":"down")+'">'+(diff>0?"+":"")+diff.toFixed(1)+' vs BU</span>';
}

// MODULE — unified customer feedback (needs-response first).

  }).join("");
  return card("Guest feedback", top + rows,

// MODULE — voice trend: daypart toggle + polarity-aware cells vs BU + rank.
let VOICE_DAYPART = "all";  // GUESTS-local toggle state
function renderGuestsVoice(data){
  const vt = data.voice_trend;
  if(!vt || !vt.entities || !vt.entities.length){
    return card("Voice / SMG trend", '<div class="empline">No VOICE scores posted for your scope yet.</div>', { icon:"📈" });
  }
  // pick the focal entity (GM = its one store; sup/owner = the first / Combined).
  const ent = vt.entities[0];
  // resolve the cell set for the active daypart.
  let cells = ent.cells, dpLabel = "All day", thru = vt.data_through;
  if(VOICE_DAYPART !== "all" && Array.isArray(vt.dayparts)){
    const dp = vt.dayparts.find(d=>d.key===VOICE_DAYPART);
    if(dp){
      const de = (dp.entities||[]).find(e=>e.id===ent.id) || (dp.entities||[])[0];
      if(de){ cells = de.cells; dpLabel = dp.label; thru = dp.data_through || thru; }
    }
  }
  // segmented toggle (All + each daypart present).
  const dpDefs = [{key:"all",label:"All day"}].concat((vt.dayparts||[]).map(d=>({key:d.key,label:d.label})));
  const toggle = '<div class="segtog">'+dpDefs.map(d=>
    '<button class="segb'+(d.key===VOICE_DAYPART?" on":"")+'" onclick="setVoiceDaypart(event,\''+d.key+'\')">'+esc(d.label)+'</button>').join("")+'</div>';
  // OSAT + QSC + B2B groups (polarity-aware). Show the metrics present in cells.
  const groups = vt.groups || {};
  const order = (groups.osat||[]).concat(groups.qsc||[], groups.b2b||[]);
  const seen = new Set();
  const mcells = order.filter(m=>!seen.has(m) && (seen.add(m), cells[m] && cells[m].june!=null)).slice(0,8).map(m=>{
    const c = cells[m];
    const rank = (c.rank!=null && c.rank_of!=null) ? '<span class="mb">rank '+c.rank+'/'+c.rank_of+(c.n!=null?" · n="+c.n:"")+'</span>' : (c.n!=null?'<span class="mb">n='+c.n+'</span>':'');
    return '<div class="mcell"><div class="ml">'+esc(c.label||m)+(c.lower_better?' ↓':'')+'</div>'
      + '<div class="mv">'+Number(c.june).toFixed(1)+'</div>'
      + '<div class="md">'+vvDeltaTxt(c)+' · '+vvBuTxt(c)+'</div>'+rank+'</div>';
  }).join("");
  const watch = ent.watch ? '<div class="cap" style="margin-top:9px"><b>Watch:</b> '+esc(vt.labels&&vt.labels[ent.watch]||ent.watch)+(ent.watch_reason?' — '+esc(ent.watch_reason):'')+'</div>' : '';
  const body = toggle + '<div class="mgrid">'+(mcells||'<div class="empline" style="grid-column:1/-1">No scored metrics for this daypart.</div>')+'</div>'
    + watch
    + '<div class="cap">'+esc(dpLabel)+' · score + MoM (favorability-aware: ↓ metrics are lower-is-better) + vs CHICAGO-MOCNI BU + org rank. From voice_scores ('+esc(ent.name||"")+').</div>';
  return card("Voice / SMG trend", body, { icon:"📈", through: thru?("VOICE · "+esc(thru)):null, drill:{kind:"gvoice"} });
}
// Fix #1 (task #22): the daypart toggle repaints the FULL lane via the manifest
// walker (renderBoard) — and ONLY the lane. stopPropagation is required: the
// toggle lives inside the card's data-card-drill surface, and without it the
// click bubbles on to #app's delegated drill handler (the card is detached by
// the repaint but the propagation path was fixed at dispatch), popping the
// gvoice detail sheet OVER the freshly painted lane.
function setVoiceDaypart(ev, k){
  if(ev && ev.stopPropagation) ev.stopPropagation();
  VOICE_DAYPART = k;
  renderBoard();
}
window.setVoiceDaypart = setVoiceDaypart;

// MODULE — new-hire training (summary + per-employee; tap → per-course drill).
function renderTeamTraining(data){
  const t = data.newHireTraining;
  if(!t){
    return card("New-hire training", '<div class="empline">No tracked training rows for your scope yet.</div>', { icon:"🎓" });
  }
  const missFoot = t.hire_dates_missing ? '<div class="cap">hire date missing ('+t.hire_dates_missing+') — not listed, never counted overdue.</div>' : '';
  if(!t.rows || !t.rows.length){
    return card("New-hire training",
      '<div class="empline">No employees in the new-hire window (hired last 90d or inside hire+14d) right now.</div>'+missFoot,
      { icon:"🎓", through: t.data_through?fmtDate(t.data_through):null });
  }
  const sm = t.summary || {};
  const grid = '<div class="trgrid">'
    + '<div class="trtile"><div class="trl">New hires</div><div class="trv">'+(sm.employees||0)+'</div></div>'
    + '<div class="trtile"><div class="trl">Complete</div><div class="trv '+(sm.complete?"fav":"neu")+'">'+(sm.complete||0)+'</div></div>'
    + '<div class="trtile"><div class="trl">Overdue</div><div class="trv '+(sm.overdue?"unfav":"neu")+'">'+(sm.overdue||0)+'</div></div>'
    + '<div class="trtile"><div class="trl">Due soon</div><div class="trv '+(sm.due_soon?"warn":"neu")+'">'+(sm.due_soon||0)+'</div></div></div>';
  const stOf = (r)=> r.all_complete ? {c:"st-ok",t:"complete"} : r.status==="overdue" ? {c:"st-bad",t:"overdue"}
    : r.status==="due_soon" ? {c:"st-warn",t:"due soon"} : r.status==="no_hire_date" ? {c:"st-na",t:"no hire date"} : {c:"st-na",t:"in progress"};
  // v2-0.50: most-overdue first (days_remaining ascending, unknowns last, completion tiebreak).
  const sorted = t.rows.slice().sort((a,b)=>{
    const ad=a.days_remaining, bd=b.days_remaining;
    if(ad==null && bd==null) return (a.completed/a.total)-(b.completed/b.total);
    if(ad==null) return 1;
    if(bd==null) return -1;
    return (ad-bd) || ((a.completed/a.total)-(b.completed/b.total));
  }).slice(0,8);
  const list = sorted.map(r=>{
    const s=stOf(r);
    const hired = r.hire_date ? (' · hired '+fmtDate(r.hire_date)) : '';
    const days = r.days_remaining==null ? '' : (' · '+(r.days_remaining<0 ? (Math.abs(r.days_remaining)+'d overdue') : (r.days_remaining+'d left')));
    return '<div class="emprow"><div class="empn">'+esc(r.name)+' <small>'+esc(r.store||"")+hired+days+' · '+r.completed+'/'+r.total+'</small></div>'
      + '<span class="empstat '+s.c+'">'+s.t+'</span></div>';
  }).join("");
  return card("New-hire training", grid + '<div style="margin-top:9px">'+list+'</div>' + missFoot
    + '<div class="cap">'+esc(t.tracked_note||"")+'. Deadline = hire + 14 days (PBS). Shows hires from the last 90d or inside their deadline. Names "First L." (PII-gated). Tap for the per-course grid. Current as of '+(t.data_through?fmtDate(t.data_through):"—")+(t.last_completion?(' · last course completion '+fmtDate(t.last_completion)):'')+'.</div>',
    { icon:"🎓", through: t.data_through?fmtDate(t.data_through):null, newBadge:true, drill:{kind:"training"} });

const DP_STATION_LABEL={Grill:"Grill",DriveThru:"Drive-Thru",FrontCounter:"Front Cntr",Fries:"Fries",Floor:"Floor",McCafe:"McCafe"};
function dpHM(b){ // HH:MM from a full timestamp ("...T04:30:00" / "... 04:30:00") OR a time-only string
  var s=String(b||"");
  if(s.length>=16 && (s.charAt(10)==='T'||s.charAt(10)===' ')) return s.slice(11,16);
  var m=s.match(/(\d{1,2}):(\d{2})/);
  return m ? (('0'+m[1]).slice(-2)+':'+m[2]) : s.slice(11,16);
}
function dpSL(s){ return DP_STATION_LABEL[s]||s||"—"; }
function renderTeamFloor(data){
  const dl = data.datapass_labor;
  const ls = dl && dl.labor_summary, lb = dl && dl.labor_bar;
  if(!dl || (!ls && !lb)){
    return card("Floor — who's on now", '<div class="empline">No DataPass schedule/labor data for the selected store yet.</div>', { icon:"🧑‍🍳" });

  const sid=tile?tile.store_id:null, storeName=tile?tile.name:"";

  const who=p=>(p&&p.name)?esc(p.name):idS(p&&p.geid);

  if(ls){

      ? '<span class="lb-fl">'+who(fl)+'</span> <span class="lb-st lb-r'+(fl.role_rank||9)+'">'+esc(fl.role||"")+'</span>'+(others.length?' <span class="lb-id">+ '+others.length+' mgr'+(others.length>1?'s':'')+'</span>':'')

    body += '<div class="ls-bar">'
      + n('Today','<span class="ls-soon">coming soon</span>','live feed')
      + n('Yesterday', pct(ls.yesterday&&ls.yesterday.labor_pct), esc(String((ls.yesterday&&ls.yesterday.date)||'')))
      + n('MTD', pct(ls.mtd&&ls.mtd.labor_pct), (ls.mtd?(ls.mtd.days+'d'):''))
      + n('Overtime', (ot.people||0)+(ot.hours?(' · '+ot.hours+'h'):''), 'wk-to-date')
      + '</div>'
      + '<div class="cap">Today&rsquo;s live labor % is coming soon (needs an intraday feed — likely the LifeLenz API; the in-progress punch number was unreliable). MTD = available feed days ('+esc(String((ls.mtd&&ls.mtd.from)||''))+'–'+esc(String((ls.mtd&&ls.mtd.through)||''))+'). OT = staff 40h+ this week (look-back). Leader is from the schedule.</div>';
  }
  if(lb){
    const c=lb.counts||{};

    const roleBadge=p=>(!p||p.role_rank==null||p.role_rank>=9)?'':'<span class="lb-st '+(ROLE_CLASS[p.role_rank]||'')+'">'+esc(p.role_label||p.role||'')+'</span>';
    const rowCls=p=>p&&p.is_floor_leader?' lb-floor':((p&&p.role_rank!=null&&p.role_rank<9)?' lb-mgr':'');
    const offBtn=p=>canWrite?('<button class="lb-btn warn" onclick="v2LbMarkOff(event,'+sid+',\''+esc(p.geid)+'\')">call off</button>'):'';
    const hrs=p=>(p.week_hours==null)?'':('<span class="lb-hrs'+(p.week_hours>=40?' ot':'')+'">'+p.week_hours+'h</span>');
    // v2-0.48 (Eddie): 🍽 once this person's meal is logged today in the meal
    // tracker (fn joins employee_meal_events on GEID). Informational only.
    const mealIc=p=>(p&&p.meal_logged)?'<span class="lb-meal" title="meal logged today">🍽</span>':'';
    let d='<div class="lb-counts"><span class="lb-pill"><b>'+(c.on_now||0)+'</b> on floor</span><span class="lb-pill"><b>'+(c.up_next||0)+'</b> up next</span><span class="lb-pill"><b>'+(c.called_off||0)+'</b> called off</span><span class="lb-pill"><b>'+(c.bench||0)+'</b> off today</span></div>';
    d+='<div class="cap">&ldquo;On floor&rdquo; is from the <b>schedule</b> as of '+esc(dpHM(lb.as_of))+' (punch actuals lag); the hours pill is <b>actual</b> worked this week (look-back, 40h+ flagged). 🍽 = meal already logged today in the employee-meal tracker.'+(lb.names_shown===false?' Crew shown by ID + station only on this view-only link.':'')+'</div>';
    if((lb.call_offs||[]).length){
      d+='<div class="lb-sub">Called off today</div>';

          +(co.replacement_geid?(' &rarr; cover '+(co.replacement_name?esc(co.replacement_name):idS(co.replacement_geid))):' · <i>needs cover</i>')+'</span>'
          +(canWrite?('<button class="lb-btn" onclick="v2LbCancelOff(event,'+co.id+')">undo</button>'):'')+'</div>';
      });

    if((lb.on_now||[]).length){
      lb.on_now.forEach(p=>{

    if((lb.up_next||[]).length){
      d+='<div class="lb-sub">Up next today ('+lb.up_next.length+')</div>';
      lb.up_next.forEach(p=>{
        d+='<div class="lb-row'+rowCls(p)+'"><span class="lb-st lb-stn">'+esc(dpSL(p.station))+'</span>'+roleBadge(p)+'<span class="lb-who">'+who(p)+mealIc(p)+' <span class="lb-id">'+esc(dpHM(p.shift_start))+'–'+esc(dpHM(p.shift_end))+'</span></span>'+hrs(p)+offBtn(p)+'</div>';

    d+='<div id="lbForm"></div>';
    if(lb.replacement_contact_note) d+='<div class="cap">'+esc(lb.replacement_contact_note)+'</div>';
    body += '<details class="stexp" '+((lb.call_offs||[]).length?'open':'')+'><summary>Who&rsquo;s on the floor · call-offs ('+(c.on_now||0)+' on now'+((c.called_off||0)?(' · '+c.called_off+' off'):'')+')</summary>'+d+'</details>';
  }
  const thru = ls && ls.yesterday && ls.yesterday.date ? ls.yesterday.date : dl.data_through;
  // bare YYYY-MM-DD parses as UTC midnight -> local prior evening; anchor to
  // local midnight so the label matches the date shown in the Yesterday tile.
  const thruLbl = thru ? fmtDate(String(thru).length===10 ? (thru+"T00:00:00") : thru) : null;
  return card("Floor — who's on now"+(storeName?(" · "+storeName):""), body,

// call-off write path (v2-0.27) — POSTs calloff_mark / calloff_resolve via the
// v2 action spine (v2CallApi -> full-payload re-gather -> renderBoard repaint).
// RO tokens are rejected server-side before dispatch; inScope enforced there too.
function v2LbMarkOff(ev, sid, geid){
  if(ev) ev.stopPropagation();
  const dl=(STATE&&STATE.data&&STATE.data.datapass_labor)||{};
  const lb=dl.labor_bar; if(!lb) return;
  const all=[].concat(lb.on_now||[], lb.up_next||[]);
  const p=all.find(x=>String(x.geid)===String(geid))||{geid:geid};
  const seen={}; seen[String(geid)]=1;
  const cands=[].concat(lb.bench||[], (lb.up_next||[]).map(x=>({geid:x.geid,name:x.name,week_hours:x.week_hours,station:x.station})))
    .filter(x=>{ if(seen[String(x.geid)])return false; seen[String(x.geid)]=1; return true; });
  const opts='<option value="">(no replacement yet)</option>'+cands.map(x=>'<option value="'+esc(x.geid)+'">'+(x.name?esc(x.name):'#'+String(x.geid).slice(-4))+(x.week_hours!=null?(' · '+x.week_hours+'h wk'):'')+(x.station?(' · '+esc(dpSL(x.station))):'')+'</option>').join('');
  const f=document.getElementById('lbForm'); if(!f) return;
  f.innerHTML='<div class="lb-form" data-store="'+sid+'" data-geid="'+esc(geid)+'" data-role="'+esc(p.role||"")+'" data-station="'+esc(p.station||"")+'" data-shift="'+esc(p.shift_start||"")+'">'
    +'<b>Call off '+(p&&p.name?esc(p.name):'#'+String(geid).slice(-4))+'</b> <span class="lb-id">'+esc(p.role_label||p.role||"")+' · '+esc(dpSL(p.station))+'</span>'
    +'<label>replacement (by ID)</label><select id="lbRepl">'+opts+'</select>'
    +'<input id="lbReason" placeholder="reason (optional)">'
    +'<div class="lb-actions"><button class="lb-btn warn" onclick="v2LbConfirmOff(event)">Log call-off</button>'
    +'<button class="lb-btn" onclick="event.stopPropagation();document.getElementById(\'lbForm\').innerHTML=\'\'">cancel</button></div>'
    +'<div class="cap" style="margin:4px 0 0">Pick a replacement by ID; get their number from LifeLenz / your contact sheet — crew phones aren&rsquo;t stored here.</div></div>';
  f.scrollIntoView({behavior:'smooth',block:'nearest'});
}
window.v2LbMarkOff = v2LbMarkOff;
async function v2LbConfirmOff(ev){
  if(ev) ev.stopPropagation();
  const f=document.querySelector('#lbForm .lb-form'); if(!f) return;
  const btn=f.querySelector('.lb-btn.warn'); if(btn) btn.disabled=true;
  const repl=(f.querySelector('#lbRepl')||{}).value||"";
  const reason=(f.querySelector('#lbReason')||{}).value||"";
  try{
    const payload=await v2CallApi({action:'calloff_mark', store_id:Number(f.dataset.store), geid:f.dataset.geid,
      role:f.dataset.role, station:f.dataset.station, shift_start:f.dataset.shift,
      replacement_geid:repl, reason:reason});
    if(payload && payload.result && payload.result.ok===false){
      if(btn) btn.disabled=false;
      alert(payload.result.msg || "Could not log that call-off."); return;
    }
    renderBoard(payload);
  }catch(e){ if(btn) btn.disabled=false; alert('Call-off failed: '+(e&&e.message)); }
}
window.v2LbConfirmOff = v2LbConfirmOff;
async function v2LbCancelOff(ev, id){
  if(ev) ev.stopPropagation();
  if(!confirm('Undo this call-off?')) return;
  try{
    const payload=await v2CallApi({action:'calloff_resolve', id:id, status:'cancelled'});
    if(payload && payload.result && payload.result.ok===false){
      alert(payload.result.msg || "Could not undo that call-off."); return;
    }
    renderBoard(payload);
  }catch(e){ alert('Undo failed: '+(e&&e.message)); }
}
window.v2LbCancelOff = v2LbCancelOff;

  }

}

// MODULE — Shift-Leader Scorecard (v80 legacy GM-view, DataPass-only, CALIBRATED
// to QSRSoft). data.shiftLeaderMetrics = {data_through, window, multi_store,
// rows:[{nsn,store,geid,leader,daypart,daypart_ord,shifts,oepe_s,kvs_per_gc,
// labor_pct,park_pct}]}. Grouped by daypart, each daypart ranked by OEPE (lower =
// better). Names PII-gated server-side (RO/guest -> "GEID nnnn"); the shell never
// re-derives a name. Tap -> per-daypart drill sheet. From v_shift_leader_metrics.
function renderShiftLeaderMetrics(data){
  const s = data.shiftLeaderMetrics;
  if(!s || !s.rows || !s.rows.length){
    return card("Shift-leader scorecard", '<div class="empline">No shift-leader metrics for your scope yet.</div>', { icon:"🎖️" });
  }
  const ms = !!s.multi_store;
  const by = {}, ord = {};
  s.rows.forEach(r=>{ (by[r.daypart]=by[r.daypart]||[]).push(r); ord[r.daypart]=r.daypart_ord; });
  const dayparts = Object.keys(by).sort((a,b)=>((ord[a]==null?9:ord[a])-(ord[b]==null?9:ord[b])));
  const secs = ary => (ary==null||isNaN(ary)) ? "—" : Math.round(Number(ary))+"s";
  const kvs = v => (v==null||isNaN(v)) ? "—" : Math.round(Number(v))+"s";
  const pct = v => (v==null||isNaN(v)) ? "—" : Number(v).toFixed(1)+"%";
  const block = dayparts.map(dp=>{
    const list = by[dp].slice().sort((a,b)=>((a.oepe_s==null?1e9:Number(a.oepe_s))-(b.oepe_s==null?1e9:Number(b.oepe_s))));
    const rows = list.map((r,i)=>
      '<tr'+(i===0?' class="win"':'')+'><td>'+(i+1)+'</td>'
      + '<td>'+esc(r.leader)+(ms?' <small style="color:var(--ink-muted)">'+esc(r.store||"")+'</small>':'')+'</td>'
      + '<td class="num">'+(r.shifts!=null?r.shifts:"—")+'</td>'
      + '<td class="num">'+secs(r.oepe_s)+'</td>'
      + '<td class="num">'+kvs(r.kvs_per_gc)+'</td>'
      + '<td class="num">'+pct(r.labor_pct)+'</td>'
      + '<td class="num">'+pct(r.park_pct)+'</td></tr>').join("");
    return '<details class="stexp"'+(dayparts.length===1?' open':'')+'><summary>'+esc(dp)+' · '+list.length+' leader'+(list.length===1?'':'s')+'</summary>'
      + '<table class="sttbl"><thead><tr><th>#</th><th>Leader</th><th class="num">Sh</th>'
      + '<th class="num">OEPE</th><th class="num">KVS</th><th class="num">Lab%</th><th class="num">Park%</th></tr></thead>'
      + '<tbody>'+rows+'</tbody></table></details>';
  }).join("");
  return card("Shift-leader scorecard", block
    + '<div class="cap">Each leader’s dominant-daypart shifts over the last 30 days, DataPass-only, <b>calibrated to QSRSoft</b> (OEPE &amp; KVS within ~8%). Ranked by OEPE (order-to-present w/o parked; lower = better). KVS = kitchen sec/guest. Lab% = labor$ &divide; sales. Names hidden on guest links. From v_shift_leader_metrics.</div>',
    { icon:"🎖️", through: s.data_through?fmtDate(s.data_through):null,
      info: s.window?esc(s.window):null, newBadge:true, drill:{kind:"shiftmetrics"} });
}

// MODULE — Shift-Leader Scorecard (QSRSoft, v2-0.26 port of v1 renderManagerRank —
// task #24). Eddie's ask: the DESIGNATED shift leaders (all of them, e.g. 11 at
// Lake St — not just GM/AM) with #shifts (30d) · OEPE · KVS · R2P · punched-labor%
// · park%, daypart-grouped, ranked by OEPE ascending (lower = better). Reads
// data.manager_rank = QSRSoft shift_manager_summary — the ONLY source with all
// designated leaders + R2P + punched-labor%. PRIMARY SCORECARD CANDIDATE: the
// SPLH leaderboard + DataPass scorecard below stay mounted until Eddie decides
// swap-vs-keep. CAVEAT the card itself surfaces: the source is a MANUAL QSRSoft
// upload (pull_shift_manager.py, not cron'd) — the card prints its own as_of and
// flags staleness. Names PII-gated SERVER-side (RO/guest tokens get "Leader N").
const QSR_DAYPART_LABEL = {
  "Breakfast(4 AM-11 AM)":"Breakfast (4-11 AM)",
  "Lunch(11 AM-2 PM)":   "Lunch (11 AM-2 PM)",
  "Snack(2 PM-4 PM)":    "Snack (2-4 PM)",
  "Dinner(4 PM-9 PM)":   "Dinner (4-9 PM)",
  "Evening(9 PM-12 AM)": "Evening (9 PM-12 AM)"
};
const QSR_DAYPART_ORDER = ["Breakfast(4 AM-11 AM)","Lunch(11 AM-2 PM)",
  "Snack(2 PM-4 PM)","Dinner(4 PM-9 PM)","Evening(9 PM-12 AM)"];
// "Last, First" -> "First Last" (title-cased); pass-through for anything else
// (e.g. the server's masked "Leader N" labels on read-only links).
function shortMgr(name){
  const s=String(name||"").trim();
  const i=s.indexOf(",");
  if(i<0) return s;
  const last=s.slice(0,i).trim();
  const first=s.slice(i+1).trim();
  const tc=t=>t? t.charAt(0).toUpperCase()+t.slice(1).toLowerCase() : t;
  return (first.split(/\s+/).map(tc).join(" ")+" "+tc(last)).trim();
}
function renderManagerRank(data){
  const rows = data.manager_rank;
  if(!rows || !rows.length){
    return card("Shift-Leader Scorecard (QSRSoft)", '<div class="empline">No QSRSoft shift-manager summary rows for your scope yet. Load one via pull_shift_manager.py.</div>', { icon:"🏆" });
  }
  const by={};
  rows.forEach(r=>{(by[r.time_slice]=by[r.time_slice]||[]).push(r);});
  const asOf = (rows[0]&&rows[0].as_of) ? String(rows[0].as_of).slice(0,10) : null;
  // Staleness flag — this source is a MANUAL QSRSoft upload (not cron'd), so an
  // old as_of means R2P / punched-labor% are behind the DataPass cards.
  let stale="";
  if(asOf){
    const age=Math.floor((Date.now()-new Date(asOf+"T00:00:00").getTime())/86400000);
    if(age>3) stale='<div class="mrstale">⚠ Source data is <b>'+age+' days old</b> — trailing 30 days through <b>'+esc(fmtDate(asOf+"T00:00:00"))+'</b> only. This is a manual QSRSoft upload: re-run <code>pull_shift_manager.py</code> with a fresh "Shift Manager Summary" export to bring R2P / labor% current.</div>';
  }
  const fmtN=v=>(v==null||v===""||isNaN(Number(v)))?"—":String(Math.round(Number(v)));
  const fmtP=v=>(v==null||v===""||isNaN(Number(v)))?"—":Number(v).toFixed(1)+"%";
  let any=false, opened=false, blocks="";
  QSR_DAYPART_ORDER.forEach(slice=>{
    const list=by[slice]; if(!list||!list.length) return; any=true;
    list.sort((a,b)=>a.oepe_wo_park-b.oepe_wo_park);
    const trs=list.map((r,i)=>
      '<tr'+(i===0?' class="win"':'')+'>'
      +'<td>'+esc(shortMgr(r.manager_name))+'</td>'
      +'<td class="num">'+fmtN(r.shifts)+'</td>'
