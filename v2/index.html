.scroll{padding:14px 14px 0;min-height:300px}

/* ---- card kit (the only components) ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);
 padding:14px 14px 15px;margin:0 0 13px;box-shadow:var(--sh-2);
 animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
/* Slide only — NOT opacity. iOS Safari can strand an innerHTML-inserted element
   at an animation's `from` keyframe until a compositing change; if we faded
   opacity, the top 1-2 freshly-mounted cards would stay BLANK until you opened/
   closed a sheet ("top two modules cut off"). Animating transform only means a
   stranded card sits 7px low (imperceptible), never invisible. */
@keyframes rise{from{transform:translateY(7px)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.card,.skel,.countup{animation:none!important}}

 padding:18px 8px 10px;color:var(--ink-muted)}

/* drill cue (plan §10 — every module is a door, wired later) */

 text-transform:uppercase;display:flex;align-items:center;gap:5px;margin-top:10px;
 border-top:1px dashed var(--line);padding-top:8px}

/* verdict (BLUF) zone — top of TODAY */
.verdict{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-tile);
 padding:16px 15px;margin:0 0 13px;box-shadow:var(--sh-2);
 background:linear-gradient(180deg,var(--good-bg),var(--surface) 80%)}

.verdict .vnum{font-size:clamp(28px,8.5vw,38px);font-weight:900;line-height:.98;letter-spacing:-.5px}
.verdict .vsub{font-size:12.5px;color:var(--ink-2);font-weight:600}

/* glance trio */
.trio{display:flex;gap:8px}
.trio.voicewrap{flex-wrap:wrap}.trio.voicewrap .gtile{flex:1 1 28%;min-width:84px}
.gtile{flex:1;min-width:0;text-align:center;background:var(--surface-2);border:1px solid var(--line);

.svgwrap{width:100%;overflow:visible;display:block}
.cap{font-size:9.5px;color:var(--ink-muted);font-weight:600;margin-top:7px;line-height:1.35}

/* error panel (the .errbox the smoke test watches for) */
.errbox{margin:18px 6px;padding:16px;border-radius:14px;background:var(--bad-bg);
 border:1px solid var(--bad);color:var(--bad);font-size:13px;font-weight:600;line-height:1.5}
.loading{text-align:center;color:var(--ink-muted);font-size:13px;padding:60px 0;font-weight:600}

/* skeleton tiles (sized to final layout — no CLS) */
.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);
 padding:14px;margin:0 0 13px;box-shadow:var(--sh-1)}

 background-size:200% 100%;animation:shim 1.3s linear infinite;margin:0 0 9px}

@media(prefers-reduced-motion:reduce){.skel .sl{animation:none}}

/* ============ TODAY LANE (Phase 1 — GM Today: priorities + tasks hub + pinned contests) ============
   Appended additively; no existing rule changed. Uses only semantic tokens so
   both themes flip for free. (plan §3.1 check/act/done · §4 component kit) */

/* EXCEPTION ROW — verdict→why→action, severity left-border (plan §4) */
.exwrap{display:flex;flex-direction:column;gap:9px}
.exrow{position:relative;background:var(--surface-2);border:1px solid var(--line);
 border-left:4px solid var(--svg-prior);border-radius:13px;padding:10px 11px 11px}
.exrow.sev-bad{border-left-color:var(--bad);background:linear-gradient(90deg,var(--bad-bg),var(--surface-2) 42%)}
.exrow.sev-warn{border-left-color:var(--warn);background:linear-gradient(90deg,var(--warn-bg),var(--surface-2) 46%)}

.extitle{font-size:13px;font-weight:800;color:var(--ink);line-height:1.25}

 padding:2px 6px;border-radius:999px;white-space:nowrap}

.exsev.sev-warn{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn)}

/* ACTION-HUB task / complaint rows + buttons (one-handed, ≥44px targets) */
.actrow{display:flex;align-items:flex-start;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.actrow:last-child{border-bottom:0}
.actrow.busy{opacity:.5;pointer-events:none}
.actmain{flex:1;min-width:0}
.acttitle{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3}
.actsub{font-size:9.5px;color:var(--ink-muted);font-weight:700;margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pchip{font-size:8.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;padding:1px 6px;border-radius:999px;white-space:nowrap}
.pchip.urgent{color:var(--bad);background:var(--bad-bg)}
.pchip.high{color:var(--warn);background:var(--warn-bg)}
.pchip.normal{color:var(--ink-muted);background:var(--surface-3)}
.pchip.low{color:var(--ink-muted);background:var(--surface-3)}

 color:var(--ink-2);background:var(--surface-3)}

.actbtn{flex:none;min-height:40px;min-width:64px;padding:0 11px;border-radius:11px;border:1px solid var(--line-2);
 background:var(--surface);color:var(--ink);font-size:11px;font-weight:800;cursor:pointer;box-shadow:var(--sh-1)}
.actbtn:active{transform:translateY(1px)}
.actbtn.go{background:var(--accent);color:var(--on-accent);border-color:transparent}
.empline{font-size:11.5px;color:var(--ink-muted);font-weight:600;padding:8px 2px}

/* PINNED CONTEST cards (cleanliness race / OSAT incentive) */
.contest{display:flex;align-items:center;gap:12px}
.medal{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
 font-size:13px;font-weight:900;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);line-height:1}
.medal.win{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.medal.miss{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.contestmain{flex:1;min-width:0}
.contesthd{font-size:12.5px;font-weight:800;color:var(--ink)}
.contestsub{font-size:10.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
.contestsub b{color:var(--ink)}
.prizepill{font-size:9px;font-weight:900;letter-spacing:.4px;color:var(--mc-green);background:var(--good-bg);
 border:1px solid var(--good);border-radius:999px;padding:1px 7px}
body[data-theme="arches"] .prizepill{color:var(--good)}
.gapbar{height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:7px}
.gapbar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* ============ NUMBERS LANE (Phase 2 — the P&L / money tab) ============
   Appended additively from mockups/redesign/financials.html; no existing rule
   changed. Semantic tokens only → both themes flip free. (plan §4 lab grammar,
   §9 MTD·YTD·Projection ledger + lock, §10 clickable detail, §11 DoorDash) */

/* glance trio data-row footer (YoY) */
.gtile .gd{border-top:1px solid var(--line);margin-top:6px;padding-top:5px;font-size:10px;font-weight:700}

/* verdict flags (preliminary / closed-YTD honesty stamps) */
.vflags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.flag{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.flag.prelim{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.flag.recon{background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--line-2)}
.flag.good{background:var(--good-bg);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.flag.open{background:var(--proj-bg);color:var(--proj);border:1px solid var(--proj-line)}

/* sup/portfolio rollup rows (tap to drill) */
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
 padding:10px 11px;border:1px solid var(--line);border-radius:13px;background:var(--surface);
 margin-bottom:8px;cursor:pointer;transition:.14s;box-shadow:var(--sh-1)}
.prow:active{transform:translateY(1px)} .prow:hover{border-color:var(--accent)}
.prow .pn{font-weight:800;font-size:13px} .prow .pmeta{font-size:10.5px;color:var(--ink-muted);font-weight:600;margin-top:1px}
.prow .ppac{text-align:right;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.prow .pds{font-size:9.5px;color:var(--ink-muted);font-weight:700;text-align:right}
.miniwf{height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:6px;grid-column:1/-1;border:1px solid var(--line)}
.miniwf>i{display:block;height:100%}
.rank{font-size:10px;font-weight:800;color:var(--ink-muted);margin-right:6px}

/* up-to-PAC ledger — MTD · YTD · Projection */
.ledger{margin-top:2px;font-size:12px}
.lhdr{display:grid;grid-template-columns:1.05fr .78fr .82fr .92fr .76fr;gap:5px;font-size:8px;font-weight:800;
 letter-spacing:.3px;text-transform:uppercase;color:var(--ink-muted);padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.lhdr span:not(:first-child){text-align:right} .lhdr .hproj{color:var(--proj)}
.lrow{display:grid;grid-template-columns:1.05fr .78fr .82fr .92fr .76fr;gap:5px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.lrow:last-child{border-bottom:0}
.lrow .lname{font-weight:600;color:var(--ink-2);font-size:10.5px}

.lrow .lcell.prevc{font-weight:700;color:var(--ink-muted)} .lrow .lcell.prevc .lcsub{opacity:.85}
.lrow .lcell.dcell.up{color:var(--good)} .lrow .lcell.dcell.dn{color:var(--bad)} .lrow .lcell.dcell.neu{color:var(--ink-muted)}
.finmonth{display:flex;align-items:center;gap:8px;margin:0 0 11px}
.finmonth label{text-transform:uppercase;font-size:8.5px;letter-spacing:.5px;font-weight:800;color:var(--ink-muted)}
.finmonth select{font:inherit;font-size:12px;font-weight:800;padding:6px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);min-height:34px;cursor:pointer}
/* owner-home rankers (portfolio roundup + sales ranker) */
.rkwrap{margin-top:11px}
.rkrow{display:grid;grid-template-columns:16px .92fr .9fr .6fr .72fr;gap:5px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rkrow:last-child{border-bottom:0}
.rkrow .rkn{font-weight:900;color:var(--ink-muted);font-size:10px;text-align:center}

.rkrow .rkv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:10.5px}
.rkrow .rkv.fav{color:var(--good)} .rkrow .rkv.unfav{color:var(--bad)}
.rkrow .rkv .rks{display:block;font-size:7px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.3px}
/* PAC% 6-month trend (top of NUMBERS) */
.pactrend{margin:4px 0 2px} .pactrend .svgwrap{width:100%;height:48px}
.salestrend .svgwrap{width:100%;height:118px}
.strendleg{display:flex;flex-wrap:wrap;gap:7px 12px;margin-top:7px;font-size:10.5px;color:var(--ink-muted);align-items:center}
.strendleg svg{vertical-align:middle}
.strenddot{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;margin-right:3px}
.pacx{display:flex;justify-content:space-between;gap:3px;margin-top:3px;font-size:7.5px;color:var(--ink-muted)}
.pacx span{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.25} .pacx span b{font-size:9px;color:var(--ink-2);font-weight:800}
.pacx span.cur b{color:var(--good)}
.drillspark{display:inline-block;width:84px;height:18px;vertical-align:middle;margin-left:6px}
/* expandable complaint detail (Today lane) — matches the prod GM view */
.cxrow{display:block;padding:0;border-bottom:1px solid var(--line)} .cxrow:last-child{border-bottom:0}
.cxhead{padding:8px 0;cursor:pointer}
.cxchev{display:inline-block;transition:transform .15s;color:var(--ink-muted);font-weight:900}
.cxrow.open .cxchev{transform:rotate(90deg)}

.cxsec{margin-top:10px}
.cxlab{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cxquote{font-size:12px;line-height:1.45;color:var(--ink-2);background:var(--surface-2);border-radius:9px;padding:9px 11px;white-space:pre-wrap}
.cxquote.draft{font-family:var(--font-mono,monospace);font-size:11px}
.cxcontact{font-size:12px;color:var(--ink-2);line-height:1.8} .cxcontact .ck{display:inline-block;width:46px;font-size:8.5px;font-weight:800;text-transform:uppercase;color:var(--ink-muted)}
.cxcopy{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:9px;font-weight:800;text-transform:uppercase;border-radius:7px;padding:3px 8px;cursor:pointer}
.cxact{margin-top:12px}
/* conditional format of a % cell vs the 12-store org avg (out-specifies .lcsub) */
.lrow .lcell .lcsub.fav{color:var(--good)} .lrow .lcell .lcsub.unfav{color:var(--bad)} .lrow .lcell .lcsub.neu{color:var(--ink-muted)}
.lrow .lcell.ph{color:var(--warn);font-style:italic} .lrow .lcell.ph .lcsub.ph{color:var(--warn);opacity:.85;font-style:italic;font-weight:700}
/* detailed P&L: group headers + data_pending (actual lumped, projection editable) rows */
.lgroup{font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-muted);padding:9px 0 3px;margin-top:2px}
.lrow.dp .lname{color:var(--ink-2);font-weight:500} .lrow.dp .lcell.dpc{color:var(--ink-muted);font-weight:600}
.lname .adjnote{font-size:8px;font-weight:800;color:var(--warn);letter-spacing:.3px;text-transform:uppercase;margin-left:4px}
.lrow .lcell .lcsub .org{font-weight:600;opacity:.7;font-size:7.5px;color:var(--ink-muted)}
.lrow.sub{background:var(--surface-2);margin:0 -14px;padding-left:14px;padding-right:14px}
.lrow.sub .lname{font-weight:800;color:var(--ink);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px}
.lrow.pac{background:linear-gradient(90deg,var(--good-bg),transparent);margin:0 -14px;padding:11px 14px;border-bottom:0;border-top:2px solid var(--line-2)}
.lrow.pac .lname{font-weight:900;color:var(--ink);text-transform:uppercase;letter-spacing:.5px;font-size:12px}
.lrow.pac .lcell{font-size:13px;font-weight:900}
.pcell{text-align:right}
.pcell .pproj{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end;font-variant-numeric:tabular-nums;
 font-weight:800;font-size:11.5px;color:var(--proj);background:var(--proj-bg);border:1px solid var(--proj-line);border-radius:8px;padding:3px 7px}
.pcell.pending .pproj{color:var(--ink-muted);font-style:italic;font-weight:700;background:var(--surface-2);border:1px dashed var(--line-2)}
.pcell.locked .pproj{color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2)}
.pcell .psub{display:block;font-size:8px;font-weight:700;color:var(--ink-muted);margin-top:2px}
.lockbar{display:flex;align-items:center;gap:9px;margin:0 -14px 11px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700}
.lockbar.open{background:var(--proj-bg);color:var(--proj)} .lockbar.locked{background:var(--surface-2);color:var(--ink-2)}
.lockbar .lkic{font-size:15px} .lockbar .lkmeta{flex:1;line-height:1.35}
.lockbar .lkmeta small{display:block;font-weight:600;color:var(--ink-muted);font-size:9.5px;margin-top:1px}
/* owner lock/unlock button on the lock bar */
.lockbtn{flex:none;appearance:none;border:1px solid var(--proj-line);background:var(--surface);color:var(--proj);
 font-weight:800;font-size:10.5px;border-radius:999px;padding:6px 11px;cursor:pointer;min-height:34px;white-space:nowrap;box-shadow:var(--sh-1)}
.lockbtn:active{transform:translateY(1px)}

.pcell.editable .pproj::after{content:"✎";font-size:8.5px;margin-left:3px;opacity:.7}

.pcell .pderiv{display:block;font-size:8px;font-weight:700;color:var(--ink-muted);margin-top:1px}

/* inline projection editor (opens in the drill sheet body) */
.pjedit{display:flex;flex-direction:column;gap:13px}
.pjedit .pjline{font-size:13px;font-weight:800;color:var(--ink)}
.pjedit .pjsub{font-size:10.5px;color:var(--ink-muted);font-weight:600;line-height:1.4}
.pjtog{display:flex;gap:7px}
.pjtog .pjt{flex:1;text-align:center;font-size:12px;font-weight:800;padding:9px 6px;border-radius:11px;
 border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);cursor:pointer}

 background:var(--surface);padding:10px 12px}

 font-variant-numeric:tabular-nums;outline:none;width:100%}
.pjfield .pjpost{font-size:11px;font-weight:800;color:var(--ink-muted);white-space:nowrap}
.pjmirror{font-size:11px;font-weight:700;color:var(--proj);background:var(--proj-bg);border:1px solid var(--proj-line);
 border-radius:10px;padding:8px 11px;text-align:center}
.pjmirror b{font-size:13px}
.pjmirror.muted{color:var(--ink-muted);background:var(--surface-2);border-style:dashed;border-color:var(--line-2);font-style:italic}
.pjsave{appearance:none;border:0;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:14px;
 border-radius:13px;padding:13px;cursor:pointer;min-height:48px}
.pjsave:active{transform:translateY(1px)} .pjsave:disabled{opacity:.55;cursor:default}
.pjerr{font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-bg);border:1px solid var(--bad);
 border-radius:10px;padding:9px 11px;display:none} .pjerr.show{display:block}

/* cost-% bullet rows */
.bset{display:flex;flex-direction:column;gap:11px;margin-top:3px}
.brow .blab{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:700;margin-bottom:4px}
.brow .blab .bname{color:var(--ink-2)} .brow .blab .bval{font-weight:900}
.brow .bnote{font-size:9px;color:var(--ink-muted);font-weight:600;margin-top:3px}

/* invoice tracker */
.inv-top{display:flex;gap:8px;margin-bottom:11px}
.inv-tile{flex:1;border-radius:13px;padding:10px 11px;border:1px solid var(--line)}

.stexp[open]>summary::after{content:" \25b4"}
.sttbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px}
.sttbl th{text-align:left;font-size:8.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.sttbl td{padding:5px 6px;border-bottom:1px solid var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums}
.sttbl tr:last-child td{border-bottom:0}
.sttbl td.num,.sttbl th.num{text-align:right}
.sttbl tr.you td{font-weight:800;color:var(--ink);background:var(--surface-2)}
.sttbl tr.win td{background:var(--good-bg)}
.slwin{color:var(--good);font-weight:900}
.tlist{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.tprod{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;padding:5px 2px;border-bottom:1px solid var(--line)}
.tprod:last-child{border-bottom:0}
.tprod .tpn{color:var(--ink-2);font-weight:700} .tprod .tpv{font-weight:900;font-variant-numeric:tabular-nums}

/* campaign cards */
.camp{padding:10px 11px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);margin-bottom:9px}
.camp:last-child{margin-bottom:0}
.camphd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.camptt{font-size:12.5px;font-weight:800;color:var(--ink)}
.campdue{font-size:9px;font-weight:800;color:var(--ink-muted)}
.campp{font-size:10.5px;color:var(--ink-2);font-weight:600;margin-top:3px;line-height:1.4}
.campprog{display:flex;align-items:center;gap:8px;margin-top:8px}
.campprog .cpbar{flex:1;height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line)}
.campprog .cpbar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.campprog .cpn{font-size:10px;font-weight:800;color:var(--ink-2);white-space:nowrap}
.campme{font-size:10px;font-weight:800;margin-top:7px}
.campme.done{color:var(--good)} .campme.todo{color:var(--warn)}

/* checklist (RGR) rows */
.ckrow{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:11.5px}
.ckrow:last-child{border-bottom:0}
.ckbox{flex:none;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:900}
.ckbox.on{background:var(--good);border-color:var(--good);color:#fff}
.cklab{flex:1;color:var(--ink-2);font-weight:600}
.cklab.done{color:var(--ink-muted);text-decoration:line-through}
/* owner/sup-only dark tool tile (rendered dark for a GM, plan §5) */
.darktool{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px dashed var(--line-2);border-radius:13px;
 background:var(--surface-2);opacity:.72;margin-bottom:9px}
.darktool:last-child{margin-bottom:0}
.darktool .dtic{font-size:18px;flex:none;filter:grayscale(1)}
.darktool .dtmain{flex:1;min-width:0}
.darktool .dth{font-size:11.5px;font-weight:800;color:var(--ink-2)}
.darktool .dts{font-size:9.5px;color:var(--ink-muted);font-weight:600;margin-top:1px}
.darktool .dtlock{font-size:8px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-muted);
 background:var(--surface-3);border:1px solid var(--line);border-radius:999px;padding:2px 7px}

/* contacts directory (VIEW widened to AM+, v2 launch spec §1) */
.ctcfind{width:100%;box-sizing:border-box;margin:2px 0 9px;padding:9px 11px;font:inherit;font-size:12px;font-weight:600;
 color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:11px;outline:none}
.ctcfind::placeholder{color:var(--ink-muted)}
.ctcgrp{margin-bottom:10px} .ctcgrp:last-child{margin-bottom:0}
.ctcgh{font-size:9px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-muted);padding:2px 2px 4px}
.ctcrow{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line)}
.ctcrow:last-child{border-bottom:0}
.ctcmain{flex:1;min-width:0}
.ctcname{font-size:12px;font-weight:800;color:var(--ink)}
.ctcsub{font-size:9.5px;color:var(--ink-muted);font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctcact{display:flex;gap:6px;flex:none}
.ctcbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
 background:var(--surface-2);font-size:14px;text-decoration:none}

/* v2-0.48 contact editor (Owner/Sup) — inline edit panel + repair-vendor toggle */
.ctced{margin:6px 0 10px;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.ctced .tf-lab{margin-top:7px}
.ctced-btns{display:flex;gap:8px;margin-top:10px}
.ctcadd{appearance:none;width:100%;margin:0 0 9px;padding:8px 11px;font:inherit;font-size:11.5px;font-weight:800;
 color:var(--accent);background:transparent;border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);
 border-radius:11px;cursor:pointer}

/* v2-0.48 New Task / Ticket form page (tf-*) */
.tf-tabs{display:flex;gap:8px;margin-bottom:12px}
.tf-tab{flex:1;appearance:none;padding:10px 8px;font:inherit;font-size:12px;font-weight:800;border-radius:11px;cursor:pointer;
 color:var(--ink-muted);background:var(--surface-2);border:1px solid var(--line)}
.tf-tab.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);
 background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tf-lab{display:block;font-size:9px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;
 color:var(--ink-muted);margin:9px 0 4px}
.tf-inp,.tf-sel,.tf-txa{width:100%;box-sizing:border-box;padding:9px 11px;font:inherit;font-size:13px;font-weight:600;
 color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:11px;outline:none}
.tf-txa{min-height:84px;resize:vertical}
.tf-inp::placeholder,.tf-txa::placeholder{color:var(--ink-muted)}
.tf-asg{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);padding:4px 9px}
.tf-agh{font-size:9px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-muted);padding:7px 0 2px}
.tf-arow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tf-arow:last-child{border-bottom:0}
.tf-arow input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.tf-anm{flex:1;font-size:12.5px;font-weight:700;color:var(--ink)}
.tf-arl{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-muted)}
.tf-sub{appearance:none;width:100%;margin-top:13px;padding:12px;font:inherit;font-size:13.5px;font-weight:900;border:0;
 border-radius:12px;cursor:pointer;background:var(--accent);color:#101010}
.tf-sub:disabled{opacity:.5}
.tf-ok{margin-top:11px;padding:11px;border-radius:11px;background:var(--good-bg);font-size:12.5px;font-weight:700;color:var(--ink)}
.tf-err{margin-top:11px;padding:11px;border-radius:11px;background:var(--bad-bg);font-size:12.5px;font-weight:700;color:var(--ink)}
.tf-tkt{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.tf-tkbtn{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
 background:var(--surface-2);cursor:pointer;font:inherit;text-align:left;appearance:none;width:100%}
.tf-tkbtn.on{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tf-tkbtn:disabled{cursor:not-allowed}
.tf-tkbtn:disabled .tf-tkh,.tf-tkbtn:disabled .tf-tks{color:var(--ink-muted)}
.tf-tkbtn:disabled{opacity:.55;background:var(--surface-3)}
.tf-tkic{font-size:18px;flex:none}
.tf-tkmain{flex:1;min-width:0}
.tf-tkh{font-size:12.5px;font-weight:800;color:var(--ink)}
.tf-tks{font-size:10px;font-weight:600;color:var(--ink-muted);margin-top:1px}
.tf-soon{font-size:8px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-muted);
 background:var(--surface-3);border:1px solid var(--line);border-radius:999px;padding:2px 7px;flex:none}

/* ---- bottom tab bar (5 fixed lanes, thumb zone, 48px targets) ---- */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;
 background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
 border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:45}
.tab{flex:1;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.4px;
 color:var(--ink-muted);padding:6px 2px;border-radius:11px;cursor:pointer;
 border:0;background:transparent;min-height:48px}
.tab .ti{font-size:17px;display:block;line-height:1.25}
.tab.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tab:active{transform:translateY(1px)}

/* theme toggle — lives in the sticky top chrome next to the version stamp
   (fix #4, task #22). It used to be a viewport-FIXED bottom-right FAB, which can
   always collide with the PAGE-FLOW tab bar at some width/scroll/page-height
   combination (the bar sits at the phone's bottom edge, not the viewport's).
   In the header it is always visible and the bar is never there. */
.crowr{display:flex;align-items:center;gap:8px;flex:none}
.themebtn{width:34px;height:34px;border-radius:50%;flex:none;padding:0;line-height:1;
 border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-size:15px;cursor:pointer;
 box-shadow:var(--sh-1)}
.themebtn:active{transform:translateY(1px)}

/* v2-0.33: NUMBERS verdict — MTD + YTD duo hero + the projection-compare line.
   MTD sits LEFT of YTD (Eddie), each with its own small-caps label; .vproj is
   the compare line under the sub (good/bad vs the penciled PAC projection,
   neutral hint when none is entered; .hint = tappable, opens the pencil editor). */
.vhero.vduo{gap:18px;align-items:flex-end;flex-wrap:wrap}
.vhero.vduo .vfig{display:flex;flex-direction:column;min-width:0}
.vhero.vduo .vnum{font-size:clamp(23px,6.8vw,31px)}
.vhero.vduo .vfl{font-size:8.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-muted);margin-top:3px;white-space:nowrap}
.vproj{font-size:11px;font-weight:800;margin-top:7px;line-height:1.4}
.vproj.fav{color:var(--good)} .vproj.unfav{color:var(--bad)} .vproj.neu{color:var(--ink-muted);font-weight:600}
.vproj.hint{color:var(--proj);font-weight:700;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}

/* v2-0.34: Jolt Ops full view (home entry module + drill sheet), adapted from
   mockups/redesign/jolt-ops.html: warn flag chip, grill min-temp tiles, sensor
   health ring, pre-shift MTD rate color. Semantic tokens only. */
.flag.warn{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.jgt{border:1px solid var(--line);border-radius:13px;padding:10px 11px;background:var(--surface-2)}
.jgt.g-good{border-left:4px solid var(--good)} .jgt.g-warn{border-left:4px solid var(--warn)} .jgt.g-bad{border-left:4px solid var(--bad)}
.jgt .jgl{font-size:10.5px;font-weight:800;color:var(--ink-2)}
.jgt .jgv{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:3px}
.jgt.g-good .jgv{color:var(--good)} .jgt.g-warn .jgv{color:var(--warn)} .jgt.g-bad .jgv{color:var(--bad)}
.jgt .jdeg{font-size:12px;font-weight:800;color:var(--ink-muted)}
.jgt .jgs{font-size:9px;color:var(--ink-muted);font-weight:700;margin-top:2px}
.shhero{display:flex;align-items:center;gap:13px;padding:4px 2px 8px}
.shbig{font-size:24px;font-weight:900;line-height:1} .shbig small{font-size:12px;font-weight:800;color:var(--ink-muted)}
.shlab{font-size:11px;color:var(--ink-muted);font-weight:700;margin-top:2px}
.allc{font-size:11.5px;font-weight:700;color:var(--good);background:var(--good-bg);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:10px;padding:9px 11px;margin-top:4px}
.dprate.warn{color:var(--warn)} .dprate.fav{color:var(--good)} .dprate.unfav{color:var(--bad)}
.jbar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line);margin:2px 0 8px}
.jbar>i{display:block;height:100%;border-radius:999px}

/* narrow phones (≤380px, fix #3 task #22): step the 5-col NUMBERS ledger down —
   tighter gaps + smaller numerals + shrinkable grid cells (min-width:0) so the
   Prev · MTD · Projection · Δ columns never overflow a 360px viewport. Last in
   the stylesheet so it wins the specificity tie with the base rules above. */
@media(max-width:380px){
  .lhdr,.lrow{grid-template-columns:.98fr .7fr .74fr .9fr .62fr;gap:3px}
  .lhdr{font-size:7px}
  .lhdr span,.lrow>*{min-width:0}
  .lrow .lname{font-size:9.5px;overflow-wrap:anywhere}
  .lrow .lcell{font-size:9.5px}
  .lrow.pac .lcell{font-size:11px}
  .lrow.sub .lname{font-size:9.5px}
  .pcell .pproj{font-size:9.5px;padding:2px 4px;gap:2px}
  .pcell .psub{font-size:7px}
}
.hide{display:none!important}

/* ============ v2-0.36 PAGE LAYER (page framework) ============
   A full-screen self-contained page inside .phone, ABOVE the drill sheet
   (z-70 > sheet z-60 > veil z-50 > tabbar z-45). Its own scroll; the board
   underneath is untouched, so closing repaints nothing. */
.page{position:absolute;inset:0;z-index:70;background:var(--paper);display:none;
 overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:26px}
.page.open{display:block}
.page-hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
 background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:12px 14px}
.pgback{min-height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line-2);
 background:var(--surface);color:var(--ink);font-size:12px;font-weight:800;cursor:pointer;box-shadow:var(--sh-1)}
.pgback:active{transform:translateY(1px)}
.pgtitle{font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent)}
.page-bd{padding:14px 14px calc(24px + env(safe-area-inset-bottom))}

/* ---- Q3 bonus HOME TILE chips ---- */
.bhwm{margin:2px 0 10px;padding:8px 10px;border-radius:9px;background:var(--warn-bg);
 color:var(--warn);border:1px solid var(--warn);font-size:10px;font-weight:900;
 text-transform:uppercase;letter-spacing:.4px;line-height:1.4}
.bhhero{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:2px 0 10px}
.bhhero .bhv{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.bhhero .bhrank{font-size:10px;font-weight:900;letter-spacing:.4px;color:var(--on-accent);
 background:var(--accent);border-radius:999px;padding:3px 9px;white-space:nowrap}
.bhhero .bhsub{font-size:10.5px;color:var(--ink-muted);font-weight:700}
.bhgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bhc{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--line-2);
 border-radius:11px;padding:7px 9px;min-width:0}
.bhc .bhl{font-size:8.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-muted);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhc .bhs{font-size:11.5px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}
.bhc.b-hit{border-left-color:var(--good)} .bhc.b-hit .bhs{color:var(--good)}
.bhc.b-miss{border-left-color:var(--bad)} .bhc.b-miss .bhs{color:var(--bad)}
.bhc.b-held{border-left-color:var(--warn)} .bhc.b-held .bhs{color:var(--warn)}
.bhc.b-pend{border-left-color:var(--line-2)} .bhc.b-pend .bhs{color:var(--ink-muted)}
.bhc .bhw{font-size:8.5px;color:var(--ink-muted);font-weight:600;margin-top:2px;line-height:1.3}
/* v2-0.37 richer bonus tile: earned-of-possible hero + progress bar + status
   pills + target line + tinted chips (stronger conditional formatting) */
.bhhero .bhof{font-size:11px;font-weight:800;color:var(--ink-muted);white-space:nowrap}
.bhbar{height:7px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line);
 overflow:hidden;margin:0 0 7px}
.bhbar i{display:block;height:100%;border-radius:999px;min-width:2px;
 background:linear-gradient(90deg,var(--good),color-mix(in srgb,var(--good) 55%,#fff))}
.bhsub2{font-size:10.5px;color:var(--ink-muted);font-weight:700;margin:0 0 10px;
 font-variant-numeric:tabular-nums}
.bhtop{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.bhpill{font-size:7.5px;font-weight:900;letter-spacing:.5px;border-radius:999px;padding:2px 6px;
 text-transform:uppercase;flex:none;font-variant-numeric:tabular-nums}
.bhpill.b-hit{background:var(--good);color:#fff}
.bhpill.b-miss{background:var(--bad);color:#fff}
.bhpill.b-held{background:var(--warn);color:#fff}
.bhpill.b-pend{background:var(--line-2);color:var(--ink-2)}
.bhc.b-hit{background:color-mix(in srgb,var(--good) 9%,var(--surface-2))}
.bhc.b-miss{background:color-mix(in srgb,var(--bad) 8%,var(--surface-2))}
.bhc.b-held{background:color-mix(in srgb,var(--warn) 9%,var(--surface-2))}
.bhc .bht{font-size:8.5px;color:var(--ink-muted);font-weight:700;margin-top:2px;line-height:1.3;
 font-variant-numeric:tabular-nums}

/* ---- GM BONUS RANKER page (gala aesthetic — self-contained dark, both themes) ---- */
.rkx{position:relative;margin:-14px -14px 0;padding:18px 14px 26px;overflow:hidden;
 color:#eef4fb;min-height:100%;
 background:radial-gradient(900px 520px at 80% -10%, #15314a, #0a0e13 60%) #0a0e13;
 border-radius:0 0 26px 26px;
 --rk-gold:#ffc72c;--rk-line:#243240;--rk-surface:#1b2632;--rk-surface2:#16202b;
 --rk-muted:#8698aa;--rk-good:#43d39e;--rk-bad:#ff6a5e;--rk-warn:#e8a33d;
 font-variant-numeric:tabular-nums}
.rkx .rk-kicker{font-size:9.5px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:var(--rk-gold);text-align:center}
.rkx .rk-title{font-size:22px;font-weight:900;letter-spacing:-.3px;text-align:center;margin-top:4px;line-height:1.15}
.rkx .rk-thru{font-size:9.5px;color:var(--rk-muted);font-weight:700;text-align:center;margin-top:5px;line-height:1.5}
.rkx .rk-wm{margin:12px 0;padding:9px 11px;border-radius:10px;background:#33290a;color:#e8a33d;
 border:1px solid #e8a33d;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;
 line-height:1.45;text-align:center;position:relative;z-index:2}
.rkx .rk-ribbon{position:absolute;left:-40%;top:120px;width:180%;transform:rotate(-22deg);
 pointer-events:none;z-index:0;opacity:.05;font-size:26px;font-weight:900;letter-spacing:4px;
 text-transform:uppercase;color:#e8a33d;line-height:2.1;white-space:normal;word-break:break-word;user-select:none}
.rk-podium{display:flex;gap:8px;align-items:stretch;margin:14px 0 12px;position:relative;z-index:1}
.rk-med{flex:1;min-width:0;text-align:center;background:var(--rk-surface);border:1px solid var(--rk-line);
 border-radius:15px;padding:12px 6px 10px;cursor:pointer;position:relative}
.rk-med .rk-medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:0 auto;
 font-size:13px;font-weight:900;color:#1b1405}
.rk-med.m1 .rk-medal{background:linear-gradient(160deg,#ffe08a,#d4a017)}
.rk-med.m2 .rk-medal{background:linear-gradient(160deg,#e8edf2,#9aa7b4);}
.rk-med.m3 .rk-medal{background:linear-gradient(160deg,#e7ae83,#a05a2c)}
.rk-med.m1{border-color:#d4a017;box-shadow:0 8px 26px rgba(212,160,23,.18)}
.rk-med .rk-store{font-size:10.5px;font-weight:800;margin-top:7px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-med .rk-gm{font-size:9px;color:var(--rk-muted);font-weight:700;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-med .rk-amt{font-size:17px;font-weight:900;margin-top:5px;color:var(--rk-gold)}

<script>
/* =========================================================================
   manager-page-v2 shell — Field-First scaffold
   ========================================================================= */
const SHELL_VERSION = "v2-0.58";
const ENDPOINT = "https://nnsuyrhubsidwmrrsumm.supabase.co/functions/v1/manager-page-v2";

const QS = new URLSearchParams(location.search);
const TOKEN = QS.get("t") || "";

/* global app state */
let STATE = null;             // the full {result, data} payload
let ACTIVE_LANE = "TODAY";    // current bottom tab

/* usage telemetry: one batched cards_viewed POST per session (learning-loop
   spec 02). Records which lanes/drills the user actually opened, once per
   session, on tab-hide (or a 90s fallback). Fire-and-forget keepalive; the
   response is discarded. Known v1 loss modes (accepted): cards opened after
   the single flush are dropped; a hard-killed tab before visibilitychange
   loses that session. Allowed on RO tokens (the fn accepts audit-only writes). */
const SEEN_CARDS = new Set(["lane_today"]);   // default lane counts as seen
const SESSION_T0 = Date.now();
let TELEMETRY_SENT = false;
function telemetrySee(key){ if(!TELEMETRY_SENT) SEEN_CARDS.add(key); }
function flushTelemetry(){
  if(TELEMETRY_SENT || !TOKEN || SEEN_CARDS.size === 0) return;
  TELEMETRY_SENT = true;
  fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN), {
    method: "POST", keepalive: true,
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ action: "cards_viewed",
      cards: Array.from(SEEN_CARDS), session_ms: Date.now() - SESSION_T0 }),
  }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden") flushTelemetry();
});
setTimeout(flushTelemetry, 90000);   // long-session fallback: flush at 90s

/* ---- the five fixed lanes (plan §2) — order = tab order ---- */
const LANES = [
  { id:"TODAY",   label:"Today",   icon:"⚡" },
  { id:"NUMBERS", label:"Numbers", icon:"📊" },
  { id:"GUESTS",  label:"Guests",  icon:"💬" },
  { id:"TEAM",    label:"Team",    icon:"👥" },
  { id:"MORE",    label:"More",    icon:"⋯" },
];

/* =========================================================================
   LAZY-LANE loading (plan §6.2) — the Edge Fn (v2-0.2) gathers only the lanes
   asked for via ?lane=<id>. First paint fetches the LEAN home (TODAY+NUMBERS);
   each heavy tab (GUESTS / TEAM / MORE) lazy-loads its slices on FIRST open
   (per-lane skeleton → fetch ?lane=<id> → merge → repaint). Subsequent opens
   are instant (in-memory). A POST repaint returns the full payload (no lane)
   and we merge it whole.

   LANE_KEYS maps each lane to the data.* keys its modules read, so a lazy
   response is merged by COPYING ONLY that lane's keys — a GUESTS fetch can
   never null-out already-loaded TEAM/MORE data (the Edge Fn returns null for
   un-asked lanes). Keys shared by the lean home (tasks/complaints/financials/
   the two pinned contests/stores/manager) are always present, so they're not
   listed here — they arrive with first paint and never need a lazy merge.
   ========================================================================= */
const LANE_KEYS = {
  GUESTS: ["customer_feedback", "voice_trend", "voice_view", "voice_comments_recent", "pace_current"],
  TEAM:   ["manager_scorecards", "operations", "newHireTraining", "datapass_labor", "datapass_food",
           "datapass_sales", "service_times", "turnover", "shiftLeaders", "shiftLeaderMetrics",
           "manager_rank", "bonus_results", "bonus_adjustments", "waste_compliance", "sales_summary",
           "cash_integrity", "pmix", "speed_vs_labor", "crew_readouts", "visits", "labor",
           // v2-0.30 Jolt cards. NOT in LANE_DISTINCTIVE — like voice_trend they
           // also arrive with the TODAY home (the priorities row reads them), so
           // they can't prove a TEAM load. The TEAM fetch re-merges them WITH the
           // GM per-run drill rows (runs_today ships only on the TEAM lane).
           "jolt_checklists", "jolt_temps",
           // v2-0.35 owner-only bonus (Q3 shadow). Owner-gated + null for non-owners,
           // so it's kept OUT of LANE_DISTINCTIVE (can't prove a TEAM load). Listed
           // here so a lazy TEAM fetch actually copies data.bonus into STATE.
           "bonus",
           // v2-0.47 crew flight risk (Owner/Sup/GM, RO excluded → role-gated,
           // so NOT in LANE_DISTINCTIVE; listed so the lazy TEAM fetch copies it).
           "flight_risk"],
  MORE:   ["campaigns", "rgr", "check_in", "meeting", "contacts", "owner_pulse", "manual_reports",
           "advisor_briefing", "key_dates", "hazel"],
};
// DISTINCTIVE keys = keys that are strictly null UNLESS their lane was gathered
// (so a populated value PROVES the lane's data arrived). Used only by the
// back-compat auto-mark (an older Fn that ignores ?lane= and returns everything).
// NOTE: several "lane" keys are ALWAYS stubbed even when un-asked (customer_feedback
// + voice_view default to a {summary:{...}} stub; campaigns/rgr default to []), so
// they CANNOT prove a lazy load — only these strictly-null keys can. MORE has no
// such GM-visible key (its keys are Owner-gated), so MORE simply always lazy-fetches
// — correct, just one extra (cheap) fetch. The auto-mark is an optimization, not
// correctness: missing it only costs a redundant, correct fetch.
const LANE_DISTINCTIVE = {
  GUESTS: ["voice_comments_recent"],   // voice_trend now arrives with the TODAY home, so it can't prove a GUESTS load; voice_comments_recent stays GUESTS-only (default null)
  TEAM:   ["manager_scorecards", "operations", "newHireTraining", "datapass_labor", "service_times", "shiftLeaders", "waste_compliance"],
  MORE:   ["meeting", "contacts", "owner_pulse", "manual_reports", "advisor_briefing", "hazel"],
};
function laneDataPresent(payloadData, lane){
  return (LANE_DISTINCTIVE[lane] || []).some(k => payloadData[k] != null);
}
// Which lanes already have their data (TODAY+NUMBERS land with first paint).
const LOADED_LANES = new Set(["TODAY", "NUMBERS"]);
// In-flight lazy fetches, so a fast double-tap doesn't double-fetch.
const LANE_INFLIGHT = {};

/* =========================================================================
   sect() — per-module isolation. One slice throwing can't blank the board.
   (must-keep resilience, plan §4)
   ========================================================================= */
function sect(fn){
  try { return fn(); }
  catch(e){
    console.error("module render error:", e && (e.stack||e.message||e));
    return card("Module unavailable", '<div class="cbody">This card hit an error and was skipped. The rest of the board is unaffected.</div>', {});
  }
}

/* =========================================================================
   COMPONENT KIT — the only components anywhere. Return HTML strings.
   ========================================================================= */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// MODULE TILE / generic card. opts: {through, newBadge, drill, icon}
//   drill: true            -> static "tap for detail" cue (scaffold placeholders)
//   drill: {kind, ...arg}  -> the WHOLE card is clickable and opens the NUMBERS
//                             detail sheet via openNumbersSheet(kind, arg) (§10).
function card(title, bodyHtml, opts={}){
  // `through` = a hard data-through DATE (prefixed "data thru"); `info` = a plain
  // caption for LIVE surfaces (tasks/complaints) that have no data-through date.
  const through = opts.through ? '<span class="ct">data thru '+esc(opts.through)+'</span>'
                : opts.info ? '<span class="ct">'+esc(opts.info)+'</span>' : "";
  const nb = opts.newBadge ? '<span class="newbadge">NEW</span>' : "";
  const isObjDrill = opts.drill && typeof opts.drill === "object";
  const drillCue = opts.drill ? '<div class="tapcue"><span>tap for detail</span><span class="chev">›</span></div>' : "";
  // Object drill = a live door (plan §10). Stash kind+arg on data attrs; a single
  // delegated #app handler dispatches to openNumbersSheet so action controls
  // inside the card (which call stopPropagation) still fire their own behavior.
  const drillAttrs = isObjDrill
    ? ' class="card drillcard" data-card-drill="'+esc(opts.drill.kind)+'"'
      + (opts.drill.store_id!=null ? ' data-card-id="'+esc(opts.drill.store_id)+'"' : '')
    : ' class="card"';
  return '<div'+drillAttrs+'>'

// sparkline(values) — bare trend line, freshest point dotted.
function sparkline(values, opts={}){
  const v = (values||[]).filter(x=>typeof x==="number" && !isNaN(x));
  if(v.length < 2) return "";
  const w = opts.w||120, h = opts.h||26, pad=2;
  const mn=Math.min(...v), mx=Math.max(...v), rng=(mx-mn)||1;
  const x=i=>pad+(i/(v.length-1))*(w-2*pad);
  const y=val=>h-pad-((val-mn)/rng)*(h-2*pad);
  const d = v.map((val,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(val).toFixed(1)).join(" ");
  const lx=x(v.length-1).toFixed(1), ly=y(v[v.length-1]).toFixed(1);
  return '<svg class="svgwrap" viewBox="0 0 '+w+' '+h+'" height="'+h+'" role="img" aria-label="trend">'
    + '<path d="'+d+'" fill="none" stroke="var(--svg-this)" stroke-width="2" '
    + 'vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="'+lx+'" cy="'+ly+'" r="2.6" fill="var(--svg-this)"/></svg>';
}

// salesTrendChart(rows) — YoY weekly sales LINE chart ported from the v1 Lab
// view (manager-page-static labTrendChart). This-year solid + last-year dashed
// gray on shared axes, min/max value labels, month x-ticks, per-week LTO segment
// coloring + legend. Token-themed (--svg-this / --svg-prior / --svg-grid).
// rows = data.lab.avg_check_weekly (already COMPLETE-week-filtered by the caller).
function salesTrendChart(rows, ltos){
  const series = (rows||[]).filter(r=>r && r.sales!=null);
  if(series.length < 2) return '<div class="cap">Not enough complete weeks to chart yet.</div>';
  const W=440,H=120,padX=12,padT=16,padB=20;
  const cur=series.map(r=>r.sales), lyv=series.map(r=>r.sales_ly).filter(v=>v!=null);
  const all=cur.concat(lyv), maxV=Math.max.apply(null,all), minV=Math.min.apply(null,all);
  const sp=(maxV-minV)||1, pad=sp*0.18||0.25, mn=minV-pad, mx=maxV+pad;
  const x=i=>padX+i*(W-2*padX)/(series.length-1), y=v=>H-padB-(v-mn)/(mx-mn)*(H-padT-padB);
  // last-year dashed gray
  let lyLine='',pv=-1;
  series.forEach((r,i)=>{ if(r.sales_ly!=null){ if(pv>=0) lyLine+='<line x1="'+x(pv).toFixed(1)+'" y1="'+y(series[pv].sales_ly).toFixed(1)+'" x2="'+x(i).toFixed(1)+'" y2="'+y(r.sales_ly).toFixed(1)+'" stroke="var(--svg-prior)" stroke-width="1.4" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>'; pv=i; } });
  // this-year, each segment colored by the prior week's LTO (falls back to --svg-this)
  let seg='';
  for(let i=1;i<series.length;i++){ const c=series[i-1].lto_color||'var(--svg-this)'; seg+='<line x1="'+x(i-1).toFixed(1)+'" y1="'+y(series[i-1].sales).toFixed(1)+'" x2="'+x(i).toFixed(1)+'" y2="'+y(series[i].sales).toFixed(1)+'" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'; }
  const dots=series.map((r,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(r.sales).toFixed(1)+'" r="'+(r.lto_color?2.6:1.7)+'" fill="'+(r.lto_color||'var(--svg-this)')+'"/>').join('');
  let lastM=''; const xl=series.map((r,i)=>{const m=new Date(r.week+'T00:00:00').toLocaleDateString('en-US',{month:'short'}); if(m!==lastM){lastM=m; return '<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" fill="var(--svg-frame)" font-size="8.5" text-anchor="middle">'+m+'</text>';} return '';}).join('');
  const salesFmt=v=>'$'+(v>=1e6?(v/1e6).toFixed(2)+'M':Math.round(v/1e3)+'K');
  const cMax=Math.max.apply(null,cur),cMin=Math.min.apply(null,cur),iMx=cur.indexOf(cMax),iMn=cur.indexOf(cMin),cx=i=>Math.min(Math.max(x(i),22),W-22).toFixed(1);
  const vl=(i,v,above)=>'<text x="'+cx(i)+'" y="'+(y(v)+(above?-5:12)).toFixed(1)+'" fill="var(--svg-frame)" font-size="8.5" text-anchor="middle">'+salesFmt(v)+'</text>';
  const svg='<svg class="svgwrap" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" height="118" role="img" aria-label="weekly sales year over year">'+lyLine+seg+dots+vl(iMx,cMax,true)+vl(iMn,cMin,false)+xl+'</svg>';
  const leg='<div class="strendleg">'+
    '<span><svg width="16" height="6"><line x1="0" y1="3" x2="16" y2="3" stroke="var(--svg-this)" stroke-width="2.4"/></svg> This year</span>'+
    '<span><svg width="16" height="6"><line x1="0" y1="3" x2="16" y2="3" stroke="var(--svg-prior)" stroke-width="1.4" stroke-dasharray="3 2"/></svg> Last year</span>'+
    (ltos||[]).map(l=>'<span><span class="strenddot" style="background:'+esc(l.color)+'"></span>'+esc(l.name)+'</span>').join('')+
    '</div>';
  return svg+leg;
}

// trend(values, ly) — this-year solid + last-year dashed gray on shared axes.
function trend(values, ly, opts={}){
  const v=(values||[]).filter(x=>typeof x==="number");
  if(v.length<2) return "";
  const l=(ly||[]).filter(x=>typeof x==="number");
  const w=opts.w||300, h=opts.h||72, pad=4;
  const all=v.concat(l.length?l:[]);
  const mn=Math.min(...all), mx=Math.max(...all), rng=(mx-mn)||1;
  const x=(i,n)=>pad+(i/((n||v.length)-1))*(w-2*pad);
  const y=val=>h-pad-((val-mn)/rng)*(h-2*pad);
  const path=(arr)=>arr.map((val,i)=>(i?"L":"M")+x(i,arr.length).toFixed(1)+" "+y(val).toFixed(1)).join(" ");
  let lyPath="";
  if(l.length>=2) lyPath='<path d="'+path(l)+'" fill="none" stroke="var(--svg-prior)" stroke-width="1.6" '
    +'stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>';
  return '<svg class="svgwrap" viewBox="0 0 '+w+' '+h+'" height="'+h+'" role="img" aria-label="year-over-year trend">'
    + '<line x1="0" x2="'+w+'" y1="'+y(mn).toFixed(1)+'" y2="'+y(mn).toFixed(1)+'" stroke="var(--svg-grid)" stroke-width="1"/>'
    + lyPath
    + '<path d="'+path(v)+'" fill="none" stroke="var(--svg-this)" stroke-width="2" '
    + 'vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

// bullet(value, target, max) — Stephen-Few cost-% bar; color by favorability
// (lower=better). When target is null, render the LEVEL only (no target mark,
// no fabricated band) — honest for the no-pac_target case (§6.4).
function bullet(name, val, target, max, unit="%", note){
  const w=320,h=26,pad=2;
  const M=max||(target?target*1.6:(val*1.4||1));
  const sx=x=>pad+(Math.max(0,Math.min(x,M))/M)*(w-2*pad);
  const hasT = (target!=null && !isNaN(target));
  const over = hasT && val>target;
  const col = !hasT ? "var(--svg-this)" : over ? "var(--bad)" : "var(--good)";
  let bands="";
  if(hasT){
    const b1=target*0.92;
    bands = '<rect x="0" y="6" width="'+sx(b1)+'" height="14" rx="7" fill="var(--good-bg)"/>'
      + '<rect x="'+sx(b1)+'" y="6" width="'+(sx(target)-sx(b1))+'" height="14" fill="var(--warn-bg)"/>'
      + '<rect x="'+sx(target)+'" y="6" width="'+(w-sx(target))+'" height="14" fill="var(--bad-bg)"/>';
  }
  const tmark = hasT ? '<line x1="'+sx(target)+'" x2="'+sx(target)+'" y1="3" y2="23" stroke="var(--svg-frame)" stroke-width="2.4"/>' : "";
  const valTxt = (typeof val==="number"?val.toFixed(2):"—")+unit;
  const noteTxt = note || (hasT
    ? ("Target &le; "+target+unit+(over?" · over by "+(val-target).toFixed(2)+unit:" · within band"))
    : "Level shown — target pending source (§6.4)");
  return '<div class="brow" style="margin-bottom:11px">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:700;margin-bottom:4px">'
    + '<span style="color:var(--ink-2)">'+esc(name)+'</span><span style="font-weight:900;color:'+col+'">'+valTxt+'</span></div>'
    + '<svg class="svgwrap" viewBox="0 0 '+w+' '+h+'" height="'+h+'" role="img" aria-label="'+esc(name)+'">'
    + '<rect x="0" y="6" width="'+w+'" height="14" rx="7" fill="var(--surface-3)"/>'
    + bands
    + '<rect x="0" y="9" width="'+sx(val)+'" height="8" rx="4" fill="'+col+'"/>'
    + tmark + '</svg>'
    + '<div style="font-size:9px;color:var(--ink-muted);font-weight:600;margin-top:3px">'+noteTxt+'</div></div>';
}

// moneyK formatter for the waterfall
function moneyK(n){
  if(n==null||isNaN(n)) return "—";
  const a=Math.abs(n);
  if(a>=1e6) return (n/1e6).toFixed(2)+"M";
  if(a>=1e3) return Math.round(n/1e3)+"K";
  return Math.round(n).toString();
}

// waterfall(steps) — Sales->PAC. steps: [{label,val,type:'start'|'down'|'end'}]
function waterfall(steps){
  steps=(steps||[]).filter(s=>s && typeof s.val==="number");
  if(steps.length<2) return "";
  const W=400,H=190,padL=4,padR=4, top=14, bottom=H-40, plot=bottom-top;
  const maxV=Math.max(...steps.map(s=>Math.abs(s.val)))||1;
  const y=v=>bottom-(v/maxV)*plot;
  let cum=0, bw=Math.min(46,(W-padL-padR)/steps.length*0.7);
  const gap=(W-padL-padR-steps.length*bw)/Math.max(1,steps.length-1);
  let x=padL, bars="", labels="";
  steps.forEach((s,i)=>{
    let y0,y1,fill,val;
    if(s.type==="start"){y0=y(0);y1=y(s.val);cum=s.val;fill="var(--accent)";val=s.val;}
    else if(s.type==="end"){y0=y(0);y1=y(Math.max(0,s.val));cum=s.val;fill=s.val>=0?"var(--good)":"var(--bad)";val=s.val;}
    else{const start=cum;cum+=s.val;y0=y(start);y1=y(cum);fill="var(--svg-prior)";val=s.val;}
    const yt=Math.min(y0,y1), hh=Math.max(2,Math.abs(y1-y0));
    bars+='<rect x="'+x+'" y="'+yt+'" width="'+bw+'" height="'+hh+'" rx="2" fill="'+fill+'"/>';
    if(i<steps.length-1 && s.type!=="end"){const cy=y(cum);
      bars+='<line x1="'+x+'" x2="'+(x+bw+gap)+'" y1="'+cy+'" y2="'+cy+'" stroke="var(--line-2)" stroke-dasharray="2 2" stroke-width="1"/>';}
    labels+='<text x="'+(x+bw/2)+'" y="'+(bottom+13)+'" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink-muted)">'+esc(s.label)+'</text>';
    labels+='<text x="'+(x+bw/2)+'" y="'+(bottom+25)+'" text-anchor="middle" font-size="9" font-weight="800" fill="'+(s.type==="end"?(s.val<0?"var(--bad)":"var(--good)"):"var(--ink-2)")+'">'+moneyK(val)+'</text>';
    x+=bw+gap;
  });
  return '<svg class="svgwrap" viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="Sales to PAC waterfall">'
    + '<line x1="0" x2="'+W+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--svg-grid)" stroke-width="1"/>'
    + bars + labels + '</svg>';
}

/* =========================================================================
   TODAY LANE (Phase 1 — the GM "Today / priorities" home, plan §3.1)
   ADDED ADDITIVELY: render fns below + MANIFEST rows + POST action wiring at
   the bottom of the script. No other module's code is touched.

   The lane is the zero-training check / act / done loop:
     • PRIORITIES — an ADVISORY exception feed synthesized from open complaints,
       overdue/high tasks, and visibly off-target voice/cleanliness vs the 12-store
       median. Severity-ranked verdict→why→action rows. No fabricated reds: every
       row is justified by a real trigger and states its data-through date.
     • TASKS HUB — the GM's top open tasks with an inline "Done" action, written
       through the audited POST spine (action:"close") which re-fetches + recounts.
     • COMPLAINTS — the SLA-sorted resolve list with an inline "Resolve" action
       (action:"resolve_complaint", confirm-gated; closes the linked task too).
     • PINNED CONTESTS — the June Cleanliness Race + $100 OSAT Incentive cards,
       pinned to the top of TODAY (plan §2) with this store's rank + honest gap.
   ========================================================================= */

// Central-time "today" for due/SLA math (data-through honesty).
function _now(){ return Date.now(); }
// "Due today" means the due timestamp falls on TODAY'S America/Chicago calendar
// date (fix #5, task #22) — never the viewer's local date and never a rolling
// 24h window. Same CT pattern the Edge Fn + service screen use (en-CA → YYYY-MM-DD).
const CT_DAY_FMT = new Intl.DateTimeFormat("en-CA", { timeZone:"America/Chicago" });
function ctDay(ts){ try{ return CT_DAY_FMT.format(ts==null ? new Date() : new Date(ts)); }catch(_e){ return ""; } }
function ctDayPlus(days){ const p = ctDay().split("-").map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2]+days)).toISOString().slice(0,10); }

// Severity ranks for sorting the exception feed (lower = more urgent).
const SEV_RANK = { bad:0, warn:1, info:2 };

// --- the advisory priorities-scoring engine (client-side synthesis, §7.5) -----
// Returns a severity-ranked array of {sev, title, why, meta} exception items
// from the data already in the payload — purely advisory in Phase 1 (no writes).
function computeTodayPriorities(data){
  const items = [];
  const stores = data.stores || [];
  const nameById = new Map(stores.map(s=>[s.id, s.name]));
  const now = _now();

  // (1) Open complaints — SLA-keyed off the linked task's 72h due_at.
  for(const c of (data.complaints||[])){
    const due = c.due_at ? new Date(c.due_at).getTime() : null;
    const overdue = due!=null && due < now;
    const dueToday = due!=null && !overdue && ctDay(due) === ctDay();   // CT calendar day, not a 24h window
    if(!overdue && !dueToday && !c.recovery_needed) continue;  // only surface the pressured ones
    const issue = c.issue_subcode || c.issue_reason || c.issue_category || "Guest complaint";
    const sev = overdue ? "bad" : (dueToday || c.recovery_needed) ? "warn" : "info";
    const st = c.store_name || (c.store_id!=null ? (nameById.get(c.store_id)||"") : "");
    items.push({
      sev,
      title: "Complaint: "+esc(issue),
      why: overdue ? "Past the 72-hour SLA — respond now."
         : dueToday ? "SLA clock runs out today."
         : "Guest recovery requested — reach out.",
      meta: (st? esc(st)+" · ":"") + "case #"+esc(c.case_number||c.id) + " · received "+ageSince(c.received_at),
    });
  }

  // (2) Overdue or high/urgent open tasks assigned to this manager.
  for(const t of (data.tasks||[])){
    const due = t.due_at ? new Date(t.due_at).getTime() : null;
    const overdue = due!=null && due < now;
    const hot = t.priority==="urgent" || t.priority==="high";
    if(!overdue && !hot) continue;
    const sev = overdue ? "bad" : (t.priority==="urgent" ? "warn" : "info");
    const st = t.store_id!=null ? (nameById.get(t.store_id)||"") : "Cross-store";
    items.push({
      sev,
      title: "Task: "+esc(t.title||("#"+t.id)),
      why: overdue ? "Past its due date — close it out or re-date."
         : (t.priority==="urgent" ? "Urgent priority — needs attention today."
            : "High priority — keep it moving."),
      meta: esc(st) + " · " + esc(String(t.priority||"normal")) + (t.due_at? " · due "+fmtDate(t.due_at):" · no due date"),
    });
  }

  // (3) Visibly off-target VOICE vs the 12-store median (advisory, honest).
  //     Cleanliness (race) + OSAT (incentive). Only flags THIS store(s) when it
  //     sits below the org median or below the 72% OSAT money line.
  const myIds = new Set((data.scope_all? [] : stores.map(s=>s.id)));  // GM/sup scope = the returned stores
  const flagVoice = (race, label, thresh) => {
    if(!race || !Array.isArray(race.standings) || !race.standings.length) return;
    const scores = race.standings.map(s=>s.score).filter(x=>typeof x==="number");
    if(scores.length < 2) return;
    const sorted = [...scores].sort((a,b)=>a-b);
    const median = sorted[Math.floor(sorted.length/2)];
    for(const s of race.standings){
      if(!myIds.has(s.store_id)) continue;
      const belowThresh = thresh!=null && s.score < thresh;
      const belowMedian = s.score < median;
      if(!belowThresh && !belowMedian) continue;
      const sev = belowThresh ? "warn" : "info";
      const gapTxt = thresh!=null && belowThresh
        ? ("<b>"+(thresh - s.score).toFixed(1)+" pts</b> below the "+thresh+"% line")
        : ("<b>"+(median - s.score).toFixed(1)+" pts</b> below the 12-store median ("+median.toFixed(1)+"%)");
      items.push({
        sev,
        title: label+": "+s.score.toFixed(1)+"% (rank "+s.rank+"/"+race.standings.length+")",
        why: gapTxt + ".",
        meta: "VOICE"+(s.n!=null?" · n="+s.n:"") + (race.data_through? " · data thru "+esc(race.data_through):""),
      });
    }
  };
  flagVoice(data.cleanliness_race, "Cleanliness", null);
  flagVoice(data.osat_incentive, "OSAT", (data.osat_incentive && data.osat_incentive.threshold) || null);

  // (4) Jolt (v2-0.30): ONLY out-of-range fridge/freezer temps + missed
  //     FOOD-SAFETY checklists today (per spec) — small rows linking to the
  //     TEAM cards. out_of_range is the Edge Fn's labeled conservative band
  //     (fridge >48°F / freezer >20°F, reading ≤24h old, active sensor).
  const goTeam = ' <a href="#" onclick="gotoLane(\'TEAM\');return false;">Team tab ›</a>';
  const jtA = data.jolt_temps;
  for(const sn of ((jtA&&jtA.sensors)||[])){
    if(!sn.out_of_range) continue;
    items.push({
      sev:"warn",
      title:"Temp: "+esc(sn.sensor_name)+" at "+esc(sn.temp_f)+"°F",
      why:"Above the "+(sn.is_freezer?"20":"48")+"°F safety band at its last reading — check the unit."+goTeam,
      meta:(sn.store_name?esc(sn.store_name)+" · ":"")+"Jolt · read "+esc(joltAge(sn.age_min)),
    });
  }
  const jcA = data.jolt_checklists;
  for(const st of ((jcA&&jcA.stores)||[])){
    if(!(st.fs_missed_today>0)) continue;
    items.push({
      sev:"warn",
      title:"Food safety: "+st.fs_missed_today+" checklist"+(st.fs_missed_today===1?"":"s")+" missed today",
      why:"Due earlier today and not completed as of the last Jolt sync."+goTeam,
      meta: esc(st.store_name||"")+" · Jolt data thru "+esc(fmtCT(jcA.data_through)),
    });
  }

  items.sort((a,b)=>(SEV_RANK[a.sev]??9)-(SEV_RANK[b.sev]??9));
  return items;
}

// shared TODAY data-through (financials MTD/YTD as the freshest hard date).
function todayThru(data){
  const fin = data.financials || {};
  return (fin.mtd && fin.mtd.data_through) || (fin.ytd && fin.ytd.data_through) || null;
}

// MODULE — the priority / exception feed (verdict→why→action, advisory).
function renderTodayPriorities(data){
  const items = computeTodayPriorities(data);
  let body;
  if(!items.length){
    body = emptyState("✅", "Nothing flagged right now",
      "No overdue complaints, hot tasks, or below-median voice scores in your scope. "
      + "This feed is advisory — it surfaces what the live data says needs you, with its data-through date.");
  } else {
    const top = items.slice(0, 7);  // 3–7 cards (plan §3.1 Zone 2)
    body = '<div class="exwrap">' + top.map(it =>
      '<div class="exrow sev-'+it.sev+'">'
      + '<div class="exhead"><div class="extitle">'+it.title+'</div>'
      + '<span class="exsev sev-'+it.sev+'">'+(it.sev==="bad"?"Now":it.sev==="warn"?"Soon":"Watch")+'</span></div>'
      + '<div class="exwhy">'+it.why+'</div>'
      + '<div class="exmeta">'+it.meta+'</div></div>').join("")
      + '</div>';
    if(items.length > top.length)
      body += '<div class="empline">+'+(items.length-top.length)+' more lower-severity item'+((items.length-top.length)===1?"":"s")+'.</div>';
  }
  return card("What needs you", body, { icon:"⚡", through: todayThru(data) });
}

// MODULE — tasks action hub (top open tasks + inline Done; +Add later phase).
function renderTodayTasks(data){
  const tasks = (data.tasks||[]).slice();
  const PR = { urgent:0, high:1, normal:2, low:3 };
  tasks.sort((a,b)=>{
    const pa=PR[a.priority]??2, pb=PR[b.priority]??2;
    if(pa!==pb) return pa-pb;
    const ad=a.due_at?new Date(a.due_at).getTime():Infinity;
    const bd=b.due_at?new Date(b.due_at).getTime():Infinity;
    return ad-bd;
  });
  const top = tasks.slice(0, 6);
  let body;
  if(!top.length){
    body = '<div class="empline">No open tasks assigned to you. Clean slate.</div>';
  } else {
    body = top.map(t => {
      const pr = String(t.priority||"normal");
      const dt = dueChip(t.due_at);
      const co = t.cohorts ? '<span class="actsub">with '+esc(t.cohorts)+'</span>' : '';
      return '<div class="actrow t-row" data-id="'+t.id+'">'
        + '<div class="actmain"><div class="acttitle">'+esc(t.title||("Task #"+t.id))+'</div>'
        + '<div class="actsub"><span class="pchip '+pr+'">'+esc(pr)+'</span>'+dt
        + (t.category?'<span class="duechip">'+esc(t.category)+'</span>':'')+co+'</div></div>'
        + '<button class="actbtn" onclick="v2ReplyTask(event,this)" title="reply — add context, snooze, or flag a false alarm">Reply</button>'
        + '<button class="actbtn go" onclick="v2CloseTask(event,this)">Done</button>'
        + '</div>';
    }).join("");
    if(tasks.length > top.length)
      body += '<div class="empline">+'+(tasks.length-top.length)+' more on your list.</div>';
  }
  return card("Your tasks", body, { icon:"🗂️", info: "live" });
}

// MODULE — complaints resolve list (SLA-sorted + inline Resolve).
function renderTodayComplaints(data){
  const rows = (data.complaints||[]).slice();
  if(!rows.length){
    return card("Open complaints", '<div class="empline">No open complaints in your scope. ✅</div>',
      { icon:"📮" });
  }
  const order = { over:0, today:1, tom:2, ok:3 };
  const enriched = rows.map(c => ({ ...c, _sla: v2Sla(c.due_at) }));
  enriched.sort((a,b)=>{
    const oa=order[a._sla.key]??9, ob=order[b._sla.key]??9;
    if(oa!==ob) return oa-ob;
    const ad=a.due_at?new Date(a.due_at).getTime():Infinity;
    const bd=b.due_at?new Date(b.due_at).getTime():Infinity;
    return ad-bd;
  });
  const body = enriched.map(c => {
    const issue = c.issue_subcode || c.issue_reason || c.issue_category || "Guest complaint";
    const sla = c._sla;
    const cust = c.customer_name || "(unknown customer)";
    const comment = (c.comment && String(c.comment).trim()) || "(no comment captured)";
    const draft = extractDraft(c.task_description);
    const dchip = '<span class="duechip '+(sla.key==="over"?"over":sla.key==="today"?"today":"")+'">'+esc(sla.label)+'</span>';
    const rec = c.recovery_needed ? '<span class="pchip urgent">Recovery</span>' : '';
    const st = c.store_name ? '<span class="actsub">'+esc(c.store_name)+'</span>' : '';
    // expandable detail (matches the prod GM view): customer's words, contact +
    // McD-portal close link, copyable draft response, Mark resolved.
    const phoneLine = c.customer_phone ? '<div><span class="ck">Phone</span>'+esc(c.customer_phone)+'</div>' : '';
    const emailLine = c.customer_email ? '<div><span class="ck">Email</span><a href="mailto:'+esc(c.customer_email)+'">'+esc(c.customer_email)+'</a></div>' : '';
    const closureLine = c.closure_url ? '<div style="margin-top:5px"><a href="'+esc(c.closure_url)+'" target="_blank" rel="noopener" style="color:var(--proj);font-weight:800">→ Close case in McD portal</a></div>' : '';
    const draftBlock = draft ? '<div class="cxsec"><div class="cxlab">Draft response email<button class="cxcopy" data-copy-id="'+c.id+'" onclick="copyDraft(event,this)">Copy</button></div><div class="cxquote draft" id="draft-'+c.id+'">'+esc(draft)+'</div></div>' : '';
    return '<div class="c-row cxrow sla-'+sla.key+'" data-id="'+c.id+'">'
      + '<div class="cxhead" onclick="toggleComplaint(this)">'
        + '<div class="actmain"><div class="acttitle">'+esc(issue)+' <span class="cxchev">›</span></div>'
        + '<div class="actsub">'+dchip+rec+'<span>#'+esc(c.case_number||c.id)+'</span><span>'+esc(ageSince(c.received_at))+'</span>'+st+'</div></div>'
      + '</div>'
      + '<div class="cxbody">'
        + '<div class="cxsec"><div class="cxlab">'+esc(cust)+' — customer’s words</div><div class="cxquote">'+esc(comment)+'</div></div>'
        + (phoneLine||emailLine||closureLine ? '<div class="cxsec"><div class="cxlab">Contact</div><div class="cxcontact">'+phoneLine+emailLine+closureLine+'</div></div>' : '')
        + draftBlock
        + '<div class="cxact"><button class="actbtn go" onclick="v2ResolveComplaint(event,this)">Mark resolved</button></div>'
      + '</div></div>';
  }).join("");
  return card("Open complaints", body,
    { icon:"📮", info: enriched.length+" open · tap to expand · McD Care 72h SLA" });
}
// extract the "Draft response email" body out of a linked task's description.
function extractDraft(desc){
  if(!desc) return "";
  const m = String(desc).match(/\*\*Draft response email\*\*[^\n]*\n+([\s\S]+)$/);
  return m ? m[1].trim() : "";
}
// expand/collapse a complaint detail (the c-row toggles the .open class).
function toggleComplaint(headEl){ headEl.parentElement.classList.toggle("open"); }
// copy the draft response to the clipboard.
function copyDraft(ev, btn){
  ev.stopPropagation();
  const pre = document.getElementById("draft-"+btn.dataset.copyId); if(!pre) return;
  const txt = pre.innerText;
  const done = ()=>{ btn.textContent="Copied!"; setTimeout(()=>{ btn.textContent="Copy"; }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>done());
  } else { try{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); done(); }catch(_e){ alert("Copy failed — select the draft manually."); } }
}
