// MODULE — Bonus payouts (v2-0.35, OWNER-ONLY, READ-ONLY Q3 SHADOW surface).
// Self-gates to owner (belt-and-suspenders on the server role gate); returns ""
// for any non-owner or when there are no rows. Renders a recipient x component
// matrix ($ amounts) + a SHADOW/not-payable watermark + the data-through label +
// a "Why $0 / held" list so no $0 is ever a bare number. NO write path.
// Column order mirrors build_renee_bonus_xlsx.py.
var BX_COMPONENT_ORDER = ["osat","b2b","ead","fob","turnover","onboarded",
  "oepe_breakfast","oepe_lunch","oepe_dinner","labor",
  "operational_share","pac_growth","pac_vs_target","profit_share"];
var BX_COMPONENT_LABEL = {
  osat:"OSAT", b2b:"B2B", ead:"EAD %", fob:"FOB", turnover:"Turnover", onboarded:"Onboarded",
  oepe_breakfast:"OEPE-bkf", oepe_lunch:"OEPE-lun", oepe_dinner:"OEPE-din",
  labor:"Labor", operational_share:"Op share", pac_growth:"PAC$ growth",
  pac_vs_target:"PAC% vs tgt", profit_share:"Profit share"
};
var BX_ROLE_ORDER = { supervisor:0, gm:1, dm:2, am:3 };
function renderTeamBonusPayouts(data){
  const b = data.bonus;
  if(!b || !(data.manager && data.manager.role === "Owner")) return "";
  const rows = b.rows || [];
  if(!rows.length) return "";
  // Pivot rows[] into recipient groups keyed by manager_id.
  const byMgr = new Map();
  for(const r of rows){
    let g = byMgr.get(r.manager_id);
    if(!g){ g = { manager_id:r.manager_id, recipient:r.recipient, bonus_role:r.bonus_role,
                  store_name:r.store_name, cells:{}, total:0 }; byMgr.set(r.manager_id, g); }
    // last cell wins per component (one row per recipient x component in practice)
    g.cells[r.component] = r;
    g.total += Number(r.amount||0);
  }
  const recips = [...byMgr.values()].sort((a,c)=>{
    const ra = BX_ROLE_ORDER[a.bonus_role]!=null?BX_ROLE_ORDER[a.bonus_role]:9;
    const rc = BX_ROLE_ORDER[c.bonus_role]!=null?BX_ROLE_ORDER[c.bonus_role]:9;
    if(ra!==rc) return ra-rc;
    return String(a.recipient||"").localeCompare(String(c.recipient||""));
  });
  // Only render columns that appear in the data (keeps the matrix lean).
  const present = new Set(rows.map(r=>r.component));
  const cols = BX_COMPONENT_ORDER.filter(c=>present.has(c));
  // --- SHADOW watermark (hard requirement) ---
  let body = "";
  if(b.is_shadow){
    body += '<div class="shadowwm">⚠ SHADOW RUN — NOT PAYABLE. Preview only; no money moves from this view.</div>';
  }
  // --- matrix table ---
  let h = '<div class="bxwrap"><table class="bxtab"><thead><tr>';
  h += '<th class="bxrh">Recipient</th>';
  for(const c of cols){ h += '<th>'+esc(BX_COMPONENT_LABEL[c]||c)+'</th>'; }
  h += '<th class="bxtot">Month total</th></tr></thead><tbody>';
  for(const g of recips){
    h += '<tr><td class="bxrh">'+esc(g.recipient)
       + '<small>'+esc(String(g.bonus_role||"").toUpperCase())
       + (g.store_name?" · "+esc(g.store_name):"")+'</small></td>';
    for(const c of cols){
      const cell = g.cells[c];
      if(!cell){ h += '<td class="bxc-zero">—</td>'; continue; }
      const amt = Number(cell.amount||0);
      if(cell.held){
        h += '<td class="bxc-held" title="'+esc(cell.why||"")+'">$'+amt.toLocaleString()+' †</td>';
      } else if(amt===0){
        h += '<td class="bxc-zero" title="'+esc(cell.why||"")+'">$0'+(cell.why?" †":"")+'</td>';
      } else {
        h += '<td class="bxc-pay">$'+amt.toLocaleString()+'</td>';
      }
    }
    h += '<td class="bxtot">$'+Number(g.total||0).toLocaleString()+'</td></tr>';
  }
  h += '</tbody></table></div>';
  body += h;
  // --- "Why $0 / held" list — every held/$0-with-reason row, explained ---
  const held = rows.filter(r=>r.held || (Number(r.amount||0)===0 && r.why));
  if(held.length){
    let w = '<div class="bxwhy"><div class="cap" style="margin-bottom:4px">Why $0 / held — every held or $0 line, explained (so no $0 is a bare number):</div>';
    for(const r of held){
      const compLbl = BX_COMPONENT_LABEL[r.component] || r.component;
      w += '<div class="bxwrow"><div class="bxwn">'+esc(r.recipient)
         + ' · <span class="bxwc">'+esc(compLbl)+'</span>'
         + (r.store_name?' · '+esc(r.store_name):'')+'</div>'
         + '<div class="bxwd">'+esc(r.why||"$0")
         + (r.tiers?' · tiers: '+esc(r.tiers):'')
         + (r.derivation?' · '+esc(r.derivation):'')+'</div></div>';
    }
    w += '</div>';
    body += w;
  }
  body += '<div class="cap" style="margin-top:10px">'+esc(b.note||"")
       + ' Held count: '+Number(b.held_count||0)+'. From bonus_payouts (READ-ONLY preview).</div>';
  return card("Bonus payouts (Q3 shadow)", body, {
    icon:"💵",
    info:"operational data thru "+(b.op_data_through||"")+" · profit "+(b.profit_data_through||""),
    newBadge:true
  });
}

// MODULE — Operations (Jolt): pre-shift completion + grill temps + sensor health.
/* =========================================================================
   JOLT CARDS (v2-0.30, spec docs/plans/jolt-v2-cards/plan-spec.md)
   Card 1 — Checklists & Food Safety: today due/on-time/late/missed + trailing
   7-day on-time % per template group; GM drill = today's per-run list; owner/
   sup = 12-store worst-first rollup, tap a store to expand its groups.
   Card 2 — Fridge & Freezer Temps: latest reading per sensor with its age;
   stale (>2h or inactive) flagged; out-of-range = the Edge Fn's LABELED
   conservative band (no numeric thresholds exist in the Jolt feed).
   Data-through = real max completion_ts / reading_ts ("Jolt data thru <t> CT").
   ========================================================================= */
function joltStatusDot(st){
  if(st==="on_time")  return '<span class="statedot sd-ok">on time</span>';
  if(st==="late")     return '<span class="statedot sd-warn">late</span>';
  if(st==="missed")   return '<span class="statedot sd-miss">missed</span>';
  return '<span class="statedot">upcoming</span>';
}
function joltGroupRow(g, multi){
  const t=g.today||{}, wp=(g.week&&g.week.pct_on_time!=null)?g.week.pct_on_time:(g.week_pct_on_time!=null?g.week_pct_on_time:null);
  const bits=[];
  if(t.on_time) bits.push(t.on_time+" on time");
  if(t.late)    bits.push(t.late+" late");
  if(t.missed)  bits.push('<b>'+t.missed+' missed</b>');
  if(t.upcoming)bits.push(t.upcoming+" upcoming");
  return '<div class="dprow"><span class="dpn">'+esc(g.group)
    + '<small>today: '+(t.due? (bits.join(" · ")||"—") : "none due")+'</small></span>'
    + '<span class="dprate">'+(wp!=null? wp.toFixed(0)+"% 7d" : "—")+'</span>'
    + '<span class="statedot '+((t.missed||0)>0?"sd-miss":((t.late||0)>0?"sd-warn":"sd-ok"))+'">'
    + ((t.missed||0)>0? t.missed+" missed" : (t.due? "on track":"—"))+'</span></div>';
}

  const t = jc.today||{}, w = jc.week||{};

  const pctCls = p => p==null?"":(p>=90?"fav":p>=70?"warn":"unfav");
  let body = '<div class="opbar">'
    + '<div class="optile"><div class="opl">Today on-time</div><div class="opv '+pctCls(t.pct_on_time)+'">'

    + '<div class="optile"><div class="opl">Missed today</div><div class="opv '+((t.missed||0)?"unfav":"fav")+'">'+(t.missed||0)+'</div><div class="ops">runs</div></div>'

        inner += '<div class="dsub">'+esc(g)+'</div>'

    { icon:"✅", newBadge:true, info: "Jolt data thru "+fmtCT(jc.data_through) });

      const stt = st.today||{};
      return '<div class="dprow"><span class="dpn">'+esc(st.store_name||("Store "+st.store_id))
        + '<small>'+(st.week_pct_on_time!=null? Number(st.week_pct_on_time).toFixed(0)+'% on time 7d':'no 7d history')
        + ((st.fs_missed_today||0)?' · ⚠ food safety':'')+'</small></span>'
        + '<span class="dprate"></span>'
        + '<span class="statedot '+((stt.missed||0)>0?"sd-miss":((stt.late||0)>0?"sd-warn":"sd-ok"))+'">'
        + ((stt.missed||0)>0? stt.missed+' missed':'on track')+'</span></div>';
    }).join("");
    body += '<div class="cap">Worst first. Every store drills in the full view.</div>';
  }
  // v2-0.41: for Owner/Sup/GM the grill min-temps live on the Today home tile,
  // not in the full Jolt Ops view — the tap-for list must not promise them.
  body += '<div class="cap">Checklist statuses vs the last Jolt sync per store (twice daily pull). '
    + 'Tap for the full Jolt Ops view: checklists, pre-shift readiness, '+(grillMovedHome(data)?'':'grill temps, ')+'fridge and freezer temps, sensor health.</div>';
  const thru = maxTs(jc && jc.data_through, jt && jt.data_through);
  return card("Jolt Ops", body,
    { icon:"🧾", newBadge:true, info:"Jolt data thru "+fmtCT(thru), drill:{kind:"jolt_ops"} });
}

// ---- the full view (drill sheet). Opens on a skeleton, ensures the TEAM lane
// (operations + GM per-run rows), then paints; store pills repaint client-side.
let JOLT_OPS_STORE = null;
async function openJoltOpsSheet(storeId){
  document.getElementById("sheetTitle").textContent = "Jolt Ops";
  document.getElementById("sheetBody").innerHTML =
    '<div class="skel" style="border:0;box-shadow:none;margin:0;padding:4px 0 0">'
    + '<div class="sl w40"></div><div class="sl w90"></div><div class="sl w70"></div><div class="sl tall"></div></div>'
    + '<div class="cap">Loading pre-shift, grill and sensor detail…</div>';
  document.getElementById("veil").classList.add("show");
  document.getElementById("sheet").classList.add("show");
  try{ await ensureLane("TEAM"); }catch(_e){ /* sections render honest empty states */ }
  const data = (STATE && STATE.data) || {};
  JOLT_OPS_STORE = storeId!=null ? Number(storeId) : joltOpsDefaultStore(data);
  joltOpsPaint();
}
window.openJoltOpsSheet = openJoltOpsSheet;
function joltOpsDefaultStore(data){
  const jc = data.jolt_checklists;
  if(jc && jc.multi_store && (jc.stores||[]).length) return jc.stores[0].store_id;  // worst first
  const st = data.stores||[];
  return st.length ? st[0].id : null;
}
function joltOpsPick(id){ JOLT_OPS_STORE = Number(id); joltOpsPaint(); }
window.joltOpsPick = joltOpsPick;

function joltOpsPaint(){
  const data = (STATE && STATE.data) || {};
  const jc = data.jolt_checklists, jt = data.jolt_temps, ops = data.operations;
  const sid = JOLT_OPS_STORE;
  const stores = data.stores||[];
  const multi = stores.length > 1;
  const dr2 = (k,v)=>'<div class="drow"><span class="dk">'+k+'</span><span class="dv">'+v+'</span></div>';
  const stEntry = jc ? ((jc.stores||[]).find(s=>s.store_id===sid) || null) : null;
  const stName = ((stores.find(s=>s.id===sid)||{}).name) || (stEntry && stEntry.store_name) || "";

  // store pills (owner/sup): worst-first (the server-sorted jc.stores order),
  // then any in-scope store with no checklist rows yet.
  let pills = "";
  if(multi){
    const order = [], seen = new Set();
    for(const st of ((jc && jc.stores)||[])){
      if(seen.has(st.store_id)) continue;
      seen.add(st.store_id);
      order.push({ id:st.store_id, name:st.store_name||("Store "+st.store_id),
                   warn:((st.today&&st.today.missed)||0)+((st.fs_missed_today)||0) });
    }
    for(const s of stores){ if(!seen.has(s.id)){ seen.add(s.id); order.push({id:s.id, name:s.name, warn:0}); } }
    pills = '<div class="segtog" style="margin:0 0 10px">'+order.map(o=>
      '<button class="segb'+(o.id===sid?" on":"")+'" onclick="joltOpsPick('+o.id+')">'+esc(o.name)+(o.warn?' ⚠':'')+'</button>').join("")+'</div>';
  }

  // store-scoped slices
  const groups  = stEntry ? (stEntry.groups||[]) : ((jc && !jc.multi_store && jc.groups)||[]);
  const stToday = stEntry ? (stEntry.today||{})  : ((jc && !jc.multi_store && jc.today)||{});
  const sensors = jt ? (jt.sensors||[]).filter(s=>s.store_id===sid) : [];
  const outN = sensors.filter(s=>s.out_of_range).length, staleN = sensors.filter(s=>s.stale).length;
  const psL = ops ? (ops.preshift_latest||[]).filter(r=>r.store_id===sid)
      .slice().sort((a,b)=>((JOLT_DP_ORD[a.daypart]??9)-(JOLT_DP_ORD[b.daypart]??9))) : [];
  const psR = ops ? (ops.preshift_rate||[]).filter(r=>r.store_id===sid) : [];
  const psM = ops ? (ops.preshift_misses||[]).filter(r=>r.store_id===sid && r.top_misser) : [];
  // v2-0.41: grill min-temps moved to the TODAY home tile for Owner/Sup/GM —
  // gated out of this view (verdict flags + Module D below) for those roles.
  const grillHome = grillMovedHome(data);
  const grill = (!grillHome && ops) ? (ops.grill_temps||[]).filter(r=>r.store_id===sid) : [];
  const sh = ops ? ((ops.sensors||[]).find(r=>r.store_id===sid) || null) : null;

  // ---- verdict (BLUF): readiness today ----
  const psDone = psL.filter(p=>p.completed).length;
  const grillBad = grill.filter(g=>grillFlag(g.min_cook_temp_f)==="bad").length;
  const grillWarn = grill.filter(g=>g.min_cook_temp_f!=null && grillFlag(g.min_cook_temp_f)==="warn").length;
  const shOk = sh ? (sh.sensors_functioning||0) : null, shTot = sh ? (sh.sensors_total||0) : null;
  const thru = maxTs(jc && jc.data_through, jt && jt.data_through);
  let h = '<div class="crumb">Today › <b>Jolt Ops</b>'+(stName?' · '+esc(stName):'')+'</div>' + pills;
  h += '<div class="dsub">Operations readiness · today</div>'
    + '<div class="opbar">'
    + '<div class="optile"><div class="opl">Pre-shifts</div><div class="opv '+(psL.length?(psDone===psL.length?"fav":"warn"):"")+'">'
      +(psL.length? psDone+'/'+psL.length : "—")+'</div><div class="ops">done today</div></div>'
    + '<div class="optile"><div class="opl">Missed</div><div class="opv '+((stToday.missed||0)?"unfav":"fav")+'">'+(stToday.missed||0)+'</div><div class="ops">checklists today</div></div>'
    + '<div class="optile"><div class="opl">Temp alerts</div><div class="opv '+(outN?"unfav":"fav")+'">'+outN+'</div><div class="ops">'+(staleN? staleN+" stale":"sensors")+'</div></div>'
    + (shTot!=null? '<div class="optile"><div class="opl">Sensors OK</div><div class="opv '+(shOk<shTot?"warn":"fav")+'">'+shOk+'/'+shTot+'</div><div class="ops">functioning</div></div>':'')
    + '</div>'
    + '<div class="vflags">'
    + (grill.length ? (grillBad? '<span class="flag warn">'+grillBad+' grill below safe</span>'
        : (grillWarn? '<span class="flag warn">'+grillWarn+' grill on watch</span>' : '<span class="flag good">grill safe</span>')) : '')
    + ((stEntry && (stEntry.fs_missed_today||0)) ? '<span class="flag warn">food safety missed today</span>' : '')
    + (outN? '<span class="flag warn">'+outN+' temp alert'+(outN===1?"":"s")+'</span>' : (sensors.length? '<span class="flag good">temps ok</span>':''))
    + (shTot!=null ? (shOk<shTot? '<span class="flag warn">'+(shTot-shOk)+' sensor'+((shTot-shOk)===1?"":"s")+' need a look</span>'
        : '<span class="flag good">sensors ok</span>') : '')
    + '</div>'
    + '<div class="cap">Jolt data thru '+esc(fmtCT(thru))+'. '+esc((jc && jc.status_note)||"")+'</div>';

  // ---- Checklists & Food Safety (today + trailing 7d per template group) ----
  h += '<div class="dsub">Checklists &amp; food safety</div>';
  if(groups.length){
    h += groups.map(g=>joltGroupRow(g)).join("");
    const runs = (jc && jc.runs_today) || [];
    if(runs.length && !multi){
      const byG = {};
      for(const r of runs){ (byG[r.group]=byG[r.group]||[]).push(r); }
      let inner = "";
      for(const g of Object.keys(byG)){
        inner += '<div class="dsub">'+esc(g)+'</div>'
          + byG[g].map(r=>'<div class="dprow"><span class="dpn">'+esc(r.title)
            + '<small>due '+esc(fmtCTTime(r.deadline_ts))
            + (r.completion_ts? ' · done '+esc(fmtCTTime(r.completion_ts)) : '')
            + (r.submitted_by? ' · '+esc(r.submitted_by) : '')
            + (r.score!=null? ' · score '+esc(r.score) : '')+'</small></span>'
            + '<span class="dprate"></span>'+joltStatusDot(r.status)+'</div>').join("");
      }
      h += '<details class="stexp"><summary>Today&rsquo;s runs · '+runs.length+'</summary>'+inner+'</details>';
    } else if(multi){
      h += '<div class="cap">Per-run detail ships on the single-store GM link.</div>';
    }
    h += '<div class="cap">'+esc((jc && jc.status_note)||"")
      + (jc && jc.names_shown===false? ' Submitted-by names hidden on this view-only link.' : '')
      + ' Last Jolt sync '+esc(fmtCT(jc && jc.synced_at))+' · Jolt data thru '+esc(fmtCT(jc && jc.data_through))+'.</div>';
  } else {
    h += '<div class="empline">No checklist data for this store in the last 7 days.</div>';
  }

  // ---- Pre-shift readiness (Module A latest + Module B MTD rate) ----
  h += '<div class="dsub">Pre-shift readiness</div>';
  if(!ops){
    h += '<div class="empline">Pre-shift, grill and sensor detail did not load. Open the Team tab once, then reopen this view.</div>';
  } else if(psL.length){
    const rateBy = {}; for(const r of psR) rateBy[r.daypart]=r;
    h += psL.map(p=>{
      const r = rateBy[p.daypart]||{};
      const rate = r.completion_rate_pct;
      const rc = rate==null?"":(rate>=90?"good":rate>=70?"warn":"bad");
      const stat = !p.completed ? '<span class="statedot sd-miss">not done</span>'
        : (p.on_time===false ? '<span class="statedot sd-warn">late</span>' : '<span class="statedot sd-ok">on time</span>');
      const sub = p.completed
        ? ((p.submit_person? 'by '+esc(p.submit_person)+' · ':'')+esc(fmtCT(p.completion_ts||p.display_ts)))
        : ('due '+esc(fmtCTTime(p.deadline_ts))+' · latest not completed');
      return '<div class="dprow"><span class="dpn">'+esc(p.daypart)+'<small>'+sub+'</small></span>'
        + '<span class="dprate '+(rc==="good"?"fav":rc==="warn"?"warn":rc==="bad"?"unfav":"")+'">'
        + (rate!=null? 'MTD '+Number(rate).toFixed(0)+'% · '+(r.completed_total||0)+'/'+(r.assigned_total||0) : '—')+'</span>'
        + stat + '</div>'
        + (rate!=null? '<div class="jbar"><i style="width:'+Math.max(3,Math.min(100,rate)).toFixed(0)+'%;background:var(--'+(rc==="good"?"good":rc==="warn"?"warn":"bad")+')"></i></div>' : '');
    }).join("");
    if(psM.length){
      h += '<div class="cap">Top missers (MTD): '+psM.map(m=>esc(m.daypart)+' '+esc(m.top_misser)+' ('+(m.miss_count||0)+')').join(' · ')+'</div>';
    }
    const psThru = psL.reduce((m,r)=>{ const t2=r.completion_ts||r.display_ts; return t2&&String(t2)>m?String(t2):m; },"");
    h += '<div class="cap">Latest completion per daypart + MTD completed/assigned, from the Jolt pre-shift views. '
      + (jc && jc.names_shown===false? 'Names hidden on this view-only link. ':'')
      + 'Jolt data thru '+esc(psThru?fmtCT(psThru):"—")+'.</div>';
  } else {
    h += '<div class="empline">No pre-shift checklist data for this store yet.</div>';
  }

  // ---- Grill min-temps (Module D) ----
  // v2-0.41: SKIPPED entirely for Owner/Sup/GM — the module moved to the
  // Today home tile (today_grill). Department keeps it here.
  if(!grillHome){
    h += '<div class="dsub">Grill min-temps</div>';
    if(grill.length){
      const gThru = grill.reduce((m,r)=>{ const t2=r.completion_ts; return t2&&String(t2)>m?String(t2):m; },"");
      h += '<div class="jgrid">'+grill.slice().sort((a,b)=>String(a.product_category).localeCompare(String(b.product_category))).map(g=>{
        const f = grillFlag(g.min_cook_temp_f);
        return '<div class="jgt g-'+f+'"><div class="jgl">'+esc(g.product_category)+'</div>'
          + '<div class="jgv">'+(g.min_cook_temp_f!=null? Number(g.min_cook_temp_f).toFixed(1):"—")+'<span class="jdeg">°F</span></div>'
          + '<div class="jgs">min of '+(g.cook_reading_count||0)+' cook reads · '+esc(fmtCT(g.completion_ts))+'</div></div>';
      }).join("")+'</div>';
      h += '<div class="cap">Lowest cooked product temp on the latest food safety check per product. '
        + '<b style="color:var(--good)">≥155°F in range</b> · <b style="color:var(--warn)">130 to 154°F watch</b> · <b style="color:var(--bad)">&lt;130°F below safe</b>. '
        + 'YES/NO and N/A items excluded. Jolt data thru '+esc(gThru?fmtCT(gThru):"—")+'.</div>';
    } else if(ops){
      h += '<div class="empline">No grill cook-temp reads for this store yet.</div>';
    }
  }

  // ---- Fridge & freezer temps (latest reading per sensor, with age) ----
  h += '<div class="dsub">Fridge &amp; freezer temps</div>';
  if(sensors.length){
    h += sensors.map(s=>{
      const flag = s.out_of_range ? '<span class="statedot sd-miss">OUT OF RANGE</span>'
        : s.stale ? '<span class="statedot sd-warn">stale</span>'
        : '<span class="statedot sd-ok">ok</span>';
      return '<div class="dprow"><span class="dpn">'+(s.is_freezer?"❄️ ":"")+esc(s.sensor_name)
        + '<small>read '+esc(joltAge(s.age_min))+(s.is_active?'':' · sensor inactive')+'</small></span>'
        + '<span class="dprate'+(s.out_of_range?' unfav':'')+'">'+(s.temp_f!=null? esc(s.temp_f)+"°F":"—")+'</span>'
        + flag+'</div>';
    }).join("");
    h += '<div class="cap">'+esc((jt && jt.threshold_note)||"")+' Jolt data thru '+esc(fmtCT(jt && jt.data_through))+'.</div>';
  } else {
    h += '<div class="empline">No RTS temp sensors reporting for this store.</div>';
  }

  // ---- Sensor health (Module E: ring + problem list) ----
  h += '<div class="dsub">Sensor health</div>';
  if(sh){
    const tot = sh.sensors_total||0, fn = sh.sensors_functioning||0;
    const pct = tot? Math.round(100*fn/tot) : 0;
    const C = 2*Math.PI*16, off = tot? C*(1-fn/tot) : C;
    const ringCol = (tot && fn===tot) ? "var(--good)" : ((tot && fn/tot>=0.8) ? "var(--warn)" : "var(--bad)");
    h += '<div class="shhero"><svg width="60" height="60" viewBox="0 0 40 40" role="img" aria-label="sensors functioning">'
      + '<circle cx="20" cy="20" r="16" fill="none" stroke="var(--surface-3)" stroke-width="5"/>'
      + '<circle cx="20" cy="20" r="16" fill="none" stroke="'+ringCol+'" stroke-width="5" stroke-linecap="round"'
      + ' stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 20 20)"/>'
      + '<text x="20" y="23" text-anchor="middle" font-size="11" font-weight="900" fill="var(--ink)">'+pct+'%</text></svg>'
      + '<div><div class="shbig">'+fn+'<small> of '+tot+' functioning</small></div>'
      + '<div class="shlab">'+((sh.sensors_with_problem||0)? sh.sensors_with_problem+' need a look' : 'all reporting')+'</div></div></div>';
    const probs = sh.problem_list||[];
    h += probs.length
      ? probs.map(p=>dr2(esc(p.sensor||"sensor"), esc(p.reason||"")+(p.last_reading_ts?' · '+esc(fmtCT(p.last_reading_ts)):''))).join("")
      : '<div class="allc">✓ All '+tot+' sensors reporting.</div>';
    h += '<div class="cap">'+esc((ops && ops.sensor_note)||"")
      + ' As of the last Jolt sync'+(jc && jc.synced_at? ' '+esc(fmtCT(jc.synced_at)):'')+'.</div>';
  } else if(ops){
    h += '<div class="empline">No sensor health data for this store.</div>';
  }

  document.getElementById("sheetTitle").textContent = "Jolt Ops"+(stName?" · "+stName:"");
  document.getElementById("sheetBody").innerHTML = h;
}

// MODULE — waste-count compliance (X/N stores filed raw waste).
function renderTeamWaste(data){
  const wc = data.waste_compliance;
  if(!wc){
    return card("Waste compliance", '<div class="empline">No raw-waste compliance data for your scope yet.</div>', { icon:"🗑️" });
  }
  if(wc.thin_enabled === false && (wc.expected_stores||0) <= 1){
    // single store: report whether it counted.
    const ok = (wc.missed_stores||0) === 0;
    return card("Waste compliance",
      '<div class="contest"><div class="medal '+(ok?"win":"miss")+'">'+(ok?"✓":"✗")+'</div>'
      + '<div class="contestmain"><div class="contesthd">'+(ok?"Raw waste logged":"Raw waste NOT logged")+'</div>'
      + '<div class="contestsub">For the latest settled day. Baseline: '+(wc.baseline_settled_days||0)+' settled days.</div></div></div>'
      + '<div class="cap">Did the store file its raw-waste count for the last settled day? From v_datapass_waste_compliance_day.</div>',
      { icon:"🗑️", through: wc.data_through?fmtDate(wc.data_through):null });
  }
  const counted = wc.counted_stores||0, exp = wc.expected_stores||0;
  let body = '<div class="opbar"><div class="optile"><div class="opl">Counted</div><div class="opv '+(counted>=exp?"fav":"warn")+'">'+counted+'/'+exp+'</div><div class="ops">stores</div></div>'
    + '<div class="optile"><div class="opl">Missed</div><div class="opv '+((wc.missed_stores||0)?"unfav":"fav")+'">'+(wc.missed_stores||0)+'</div><div class="ops">stores</div></div></div>';
  if((wc.missed||[]).length){
    body += (wc.missed||[]).map(m=>'<div class="dprow"><span class="dpn">'+esc(m.location_name||m.store_number||"")+'<small>closing leader '+esc(m.leader||m.leader_geid||"?")+'</small></span>'
      + '<span class="statedot sd-miss">missed</span><span></span></div>').join("");
  }
  body += '<div class="cap">X of N in-scope stores that logged raw waste for the last settled day, with the closing leader on misses. From v_datapass_waste_compliance_day.</div>';
  return card("Waste compliance", body, { icon:"🗑️", through: wc.data_through?fmtDate(wc.data_through):null });
}

   MORE LANE (Pass 2 — Owner-Hub overflow, GM-relevant subset)
   ADDED ADDITIVELY: render fns + MANIFEST rows. For a GM token the Owner/Sup-
   only tools (campaigns admin, advisor, deck editor, meeting, ticketing)
   render DARK (a locked tool tile) or are omitted (plan §5) — the GM sees the
   campaigns they must ACT on (upload) + the RGR prep checklist when a visit
   is in-window + (v2 launch spec §1) the shared contacts directory read-only.

function isOwnerSup(data){ const r = data.manager && data.manager.role; return r==="Owner" || r==="Supervisor"; }

// MODULE — submission campaigns (GM sees their store's upload status).
function renderMoreCampaigns(data){
  const cs = data.campaigns || [];
  if(!cs.length){
    return card("Submission campaigns", '<div class="empline">No open campaigns right now.</div>', { icon:"📸" });
  }
  const body = cs.map(c=>{
    const mine = (c.stores||[]).filter(s=>true);
    const total = c.total||mine.length, done = c.done||mine.filter(s=>s.done).length;
    const pct = total? Math.round(done/total*100) : 0;
    // GM single-store "you" line.
    const myStore = (c.stores||[])[0];
    const meLine = myStore
      ? (myStore.done ? '<div class="campme done">✓ Your store submitted.</div>'
                      : '<div class="campme todo">⬆ Your store still needs to submit'+(c.can_upload?" — upload from the live board.":"."))+'</div>'
      : "";
    return '<div class="camp"><div class="camphd"><span class="camptt">'+esc(c.title)+'</span>'
      + (c.due_at?'<span class="campdue">due '+esc(fmtDate(c.due_at))+'</span>':'')+'</div>'
      + (c.prompt?'<div class="campp">'+esc(c.prompt)+'</div>':'')
      + '<div class="campprog"><div class="cpbar"><i style="width:'+pct+'%"></i></div><span class="cpn">'+done+'/'+total+' stores</span></div>'
      + meLine + '</div>';
  }).join("");
  return card("Submission campaigns", body
    + '<div class="cap">Owner/sup track all stores here; a GM uploads their store’s photo/file from the live board. From campaigns.</div>',
    { icon:"📸", through: null, newBadge:true });
}

// MODULE — RGR prep checklist (GM-relevant; shown only in the visit window).
function renderMoreRgr(data){
  const runs = data.rgr || [];
  if(!runs.length){
    return card("RGR prep checklist", '<div class="empline">No RGR visit in the prep window (D-30 to D+3) for your store.</div>', { icon:"📋" });
  }
  const body = runs.map(run=>{
    const items = run.items || run.entries || [];
    const done = items.filter(i=>i.checked||i.done).length;
    const head = '<div class="camphd"><span class="camptt">'+esc(run.store_name||run.location_name||"RGR visit")+'</span>'
      + (run.visit_date?'<span class="campdue">visit '+esc(fmtDate(run.visit_date))+'</span>':'')+'</div>';
    const rows = items.slice(0,12).map(i=>{
      const d = i.checked||i.done;
      return '<div class="ckrow"><span class="ckbox'+(d?" on":"")+'">'+(d?"✓":"")+'</span>'
        + '<span class="cklab'+(d?" done":"")+'">'+esc(i.label||i.item||"")+'</span></div>';
    }).join("");
    return head + (items.length?'<div class="campprog"><div class="cpbar"><i style="width:'+(items.length?Math.round(done/items.length*100):0)+'%"></i></div><span class="cpn">'+done+'/'+items.length+'</span></div>'+rows
      : '<div class="empline">Checklist template loads on the live board.</div>');
  }).join('<div style="height:11px"></div>');
  return card("RGR prep checklist", body
    + '<div class="cap">Restaurant General Review prep — tick items + attach photos from the live board. From the RGR checklist runs.</div>',
    { icon:"📋", through: null });
}

// MODULE — Contacts directory (v2 launch spec §1): VIEW widened to AM+
// (Owner/Sup/GM/Department). Since v2-0.44 the BOARD list is repair vendors
// only (managers.repair_vendor). v2-0.48: Owner/Sup get an inline editor here
// (✎ per row + add) with the REPAIR-VENDOR toggle — the checkbox drives this
// very list. The Fn contact_save gate is unchanged (Owner/Sup only; RO/guest
// rejected by the global POST guard). data.contacts is null for RO/guest
// tokens (PII gate) and on an older Fn → render nothing (no leak, no shell).
function renderMoreContacts(data){
  const cs = data.contacts;
  if(cs == null) return "";
  const canEdit = isOwnerSup(data);
  const addBtn = canEdit ? '<button type="button" class="ctcadd" onclick="ctcAdd()">＋ Add a repair vendor</button><div id="ctcEd"></div>' : "";
  if(!cs.length) return card("Contacts", addBtn + '<div class="empline">No repair vendors flagged in the directory yet.</div>', { icon:"📇", info:"live directory" });
  const CATS = [["staff","Staff"],["vendor","Vendors"],["support","Support"],["other","Other"]];
  let body = addBtn
           + '<input class="ctcfind" type="search" placeholder="Search name, company, store…" oninput="contactsFilter(this)">'
           + '<div id="ctcList">';
  for(const cat of CATS){
    const rows = cs.filter(c => (c.contact_category||"other") === cat[0]);
    if(!rows.length) continue;
    body += '<div class="ctcgrp"><div class="ctcgh">'+esc(cat[1])+' · '+rows.length+'</div>'
      + rows.map(c=>{
          const name = ((c.first_name||"")+" "+(c.last_name||"")).trim() || (c.company||"Contact");
          const bits = [];
          if(c.title) bits.push(c.title); else if(c.role && c.role!=="Other") bits.push(c.role);
          if(c.company && c.company !== name) bits.push(c.company);
          if(c.store_name) bits.push(c.store_name);
          const sub = bits.join(" · ");
          const q = (name+" "+sub+" "+(c.email||"")+" "+(c.mobile||"")).toLowerCase();
          const acts = (c.mobile?'<a class="ctcbtn" href="tel:'+esc(c.mobile)+'" onclick="event.stopPropagation()">📞</a>':'')
                     + (c.email?'<a class="ctcbtn" href="mailto:'+esc(c.email)+'" onclick="event.stopPropagation()">✉️</a>':'')
                     + (canEdit?'<button type="button" class="ctcbtn" style="cursor:pointer" onclick="ctcEdit('+Number(c.id)+')">✎</button>':'');
          return '<div class="ctcrow" data-q="'+esc(q)+'"><div class="ctcmain"><div class="ctcname">'+esc(name)+'</div>'
            + (sub?'<div class="ctcsub">'+esc(sub)+'</div>':'')
            + '</div><div class="ctcact">'+acts+'</div></div>';
        }).join("")
      + '</div>';
  }
  body += '</div><div class="cap">Who to call when something breaks — repair vendors from the shared directory ('+cs.length+' listed, live from managers). '
    + (canEdit ? 'Tap ✎ to edit; the repair-vendor toggle controls who shows on this list.' : 'Read-only — ask a supervisor or the owner for changes.')
    + '</div>';
  return card("Contacts", body, { icon:"📇", info:"live directory", newBadge:true });
}

// Client-side filter for the contacts rolodex (name/company/store/email/phone).
function contactsFilter(inp){
  const q = String(inp.value||"").trim().toLowerCase();
  const wrap = document.getElementById("ctcList");
  if(!wrap) return;
  wrap.querySelectorAll(".ctcrow").forEach(r=>{
    r.style.display = (!q || (r.getAttribute("data-q")||"").indexOf(q) >= 0) ? "" : "none";
  });
  wrap.querySelectorAll(".ctcgrp").forEach(g=>{
    const any = Array.prototype.some.call(g.querySelectorAll(".ctcrow"), r=>r.style.display!=="none");
    g.style.display = any ? "" : "none";
  });
}
window.contactsFilter = contactsFilter;

/* v2-0.48 — Owner/Sup inline contact editor (repair-vendor toggle). Sends the
   FULL field set contact_save writes (first/last/company/title/category/email/
   mobile/store_id/role/notes) so an edit never nulls a field the form did not
   show; role + store_id ride through hidden. repair_vendor posts "1"/"0". */
function ctcFormHtml(c){
  c = c || {};
  const isNew = c.id == null;
  const cats = ["staff","vendor","support","other"];
  const curCat = c.contact_category || "vendor";
  let catSel = '<select id="ceCat" class="tf-sel">';
  for(const k of cats) catSel += '<option value="'+k+'"'+(curCat===k?' selected':'')+'>'+k.charAt(0).toUpperCase()+k.slice(1)+'</option>';
  catSel += '</select>';
  const rv = isNew ? true : (c.repair_vendor !== false);   // board rows ARE repair vendors; new defaults on
  return '<div class="ctced">'
    + '<div class="tf-agh">'+(isNew?"Add a repair vendor":"Edit contact")+'</div>'
    + '<input type="hidden" id="ceId" value="'+(isNew?"":Number(c.id))+'">'
    + '<input type="hidden" id="ceRole" value="'+esc(c.role||"Other")+'">'
    + '<input type="hidden" id="ceStore" value="'+(c.store_id!=null?Number(c.store_id):"")+'">'
    + '<label class="tf-lab" for="ceFirst">First name</label><input id="ceFirst" class="tf-inp" value="'+esc(c.first_name||"")+'">'
    + '<label class="tf-lab" for="ceLast">Last name</label><input id="ceLast" class="tf-inp" value="'+esc(c.last_name||"")+'">'
    + '<label class="tf-lab" for="ceCo">Company</label><input id="ceCo" class="tf-inp" value="'+esc(c.company||"")+'">'
    + '<label class="tf-lab" for="ceTitle">Title / what they fix</label><input id="ceTitle" class="tf-inp" value="'+esc(c.title||"")+'">'
    + '<label class="tf-lab" for="ceMob">Mobile</label><input id="ceMob" class="tf-inp" inputmode="tel" value="'+esc(c.mobile||"")+'">'
    + '<label class="tf-lab" for="ceEmail">Email</label><input id="ceEmail" class="tf-inp" inputmode="email" value="'+esc(c.email||"")+'">'
    + '<label class="tf-lab">Category</label>'+catSel
    + '<label class="tf-arow" style="border:0;margin-top:8px"><input type="checkbox" id="ceRepair"'+(rv?" checked":"")+'>'
    + '<span class="tf-anm">Repair vendor</span><span class="tf-arl">shows on every board</span></label>'
    + '<label class="tf-lab" for="ceNotes">Notes</label><textarea id="ceNotes" class="tf-txa" style="min-height:52px">'+esc(c.notes||"")+'</textarea>'
    + '<div class="ctced-btns">'
    + '<button type="button" class="tf-sub" style="margin-top:0" onclick="ctcSave(this)">'+(isNew?"Add contact":"Save")+'</button>'
    + '<button type="button" class="tf-tab" style="flex:0 0 88px" onclick="ctcCancel()">Cancel</button>'
    + '</div><div id="ceMsg"></div></div>';
}
function ctcEdit(id){
  const cs = (STATE && STATE.data && STATE.data.contacts) || [];
  const c = cs.filter(x=>Number(x.id)===Number(id))[0];
  const box = document.getElementById("ctcEd");
  if(!box || !c) return;
  box.innerHTML = ctcFormHtml(c);
  box.scrollIntoView({ behavior:"smooth", block:"nearest" });
}
window.ctcEdit = ctcEdit;
function ctcAdd(){
  const box = document.getElementById("ctcEd");
  if(!box) return;
  box.innerHTML = ctcFormHtml(null);
}
window.ctcAdd = ctcAdd;
function ctcCancel(){ const box = document.getElementById("ctcEd"); if(box) box.innerHTML = ""; }
window.ctcCancel = ctcCancel;
async function ctcSave(btn){
  const v = id => { const el = document.getElementById(id); return el ? el.value : ""; };
  const first = v("ceFirst").trim(), last = v("ceLast").trim();
  if(!first && !last){ tfMsg("ceMsg", false, "A first or last name is required."); return; }
  const body = {
    action: "contact_save",
    first_name: first, last_name: last,
    company: v("ceCo").trim(), title: v("ceTitle").trim(),
    contact_category: v("ceCat"),
    mobile: v("ceMob").trim(), email: v("ceEmail").trim(),
    store_id: v("ceStore") === "" ? "" : Number(v("ceStore")),
    role: v("ceRole") || "Other",
    notes: v("ceNotes").trim(),
    repair_vendor: (document.getElementById("ceRepair")||{}).checked ? "1" : "0",
  };
  const idVal = v("ceId");
  if(idVal !== "") body.id = Number(idVal);
  if(btn) btn.disabled = true;
  try{
    const payload = await v2CallApi(body);
    if(payload && payload.result && payload.result.ok === false){
      tfMsg("ceMsg", false, payload.result.msg || "Save failed.");
      if(btn) btn.disabled = false;
      return;
    }
    renderBoard(payload);   // repaints the list; an untoggled repair vendor drops off
  }catch(e){
    tfMsg("ceMsg", false, "Save failed: "+(e && e.message));
    if(btn) btn.disabled = false;
  }
}
window.ctcSave = ctcSave;

// MODULE — Owner/Sup-only tools, rendered DARK for a GM (plan §5).
function renderMoreOwnerTools(data){
  if(isOwnerSup(data)) return "";   // Owner/Sup get the live tools in Phase 3; not a GM concern here.
  const tools = [];
  // Contacts is locked ONLY when this viewer did not receive the directory

    { ic:"🧭", h:"Business advisor", s:"Biweekly owner briefing + interrupts" },
    { ic:"🗓️", h:"Supervisor check-in", s:"GPS-geofenced store check-in" },
    { ic:"🎟️", h:"Ticketing", s:"Maintenance / IT tickets (reserved)" },
  );
  const body = tools.map(t=>'<div class="darktool"><span class="dtic">'+t.ic+'</span>'
    + '<div class="dtmain"><div class="dth">'+esc(t.h)+'</div><div class="dts">'+esc(t.s)+'</div></div>'

    + '<div class="cap">These tools are for owners and supervisors — shown here locked. Your hub is campaigns + RGR + contacts above.</div>',
    { icon:"⋯" });
}

/* =========================================================================
   LANE DRILL SHEET (plan §10) — GUESTS/TEAM/MORE cards open detail here, a
   sibling of openNumbersSheet. laneDrill() wires row-level drills (scorecards,
   etc.); the delegated card-drill handler routes object-drills with a non-NUMBERS
   kind here. Detail restates its data-through date and never fabricates a number.
   ========================================================================= */
const LANE_DRILL_KINDS = new Set(["gfeedback","gvoice","scorecard","training","deploy","servicetimes","turnover","shiftleaders","shiftmetrics","operations","jolt_ops"]);
function laneDrill(el, ev){
  telemetrySee("drill_" + (el.getAttribute("data-drill") || "row"));   // usage telemetry (spec 02)
  if(ev) ev.stopPropagation();
  const kind = el.getAttribute("data-drill");
  const nsn = el.getAttribute("data-nsn");
  openLaneSheet(kind, nsn!=null ? { nsn: Number(nsn) } : {});
}
window.laneDrill = laneDrill;

function openLaneSheet(kind, arg){
  // v2-0.34: the Jolt Ops full view manages its own sheet (it awaits the TEAM
  // lane for the pre-shift/grill/sensor slices, then paints + repaints on the
  // per-store pills) — hand off and return.
  if(kind==="jolt_ops"){ openJoltOpsSheet(arg && arg.store_id); return; }
  const data = (STATE && STATE.data) || {};
  let title="Detail", body="", crumb="";
  const dr = (k,v) => '<div class="drow"><span class="dk">'+k+'</span><span class="dv">'+v+'</span></div>';

  if(kind==="gfeedback"){
    const fb = data.customer_feedback || {}; title="Guest feedback · detail"; crumb="Guests › <b>Feedback</b>";
    body = '<div class="crumb">'+crumb+'</div>'
      + dr("Needs response", (fb.summary&&fb.summary.needs_response)||0)
      + dr("Last 30 days", (fb.summary&&fb.summary.last30_total)||0)
      + dr("Negative (30d)", (fb.summary&&fb.summary.last30_negative)||0)
      + '<div class="dsub">By source (30d)</div>'
      + ((fb.summary&&fb.summary.by_source)||[]).map(s=>dr(esc(s.source), s.count+" ("+s.negative+" neg)")).join("")
      + '<div class="cap">Unified v_customer_feedback. Data thru '+esc(fb.data_through?fmtDate(fb.data_through):"—")+'.</div>';
  } else if(kind==="gvoice"){
    const vt = data.voice_trend || {}; const ent = (vt.entities||[])[0]||{}; title=(ent.name||"")+" · Voice detail"; crumb="Guests › <b>Voice</b>";
    const cells = ent.cells||{};
    const all = [].concat(vt.groups&&vt.groups.osat||[], vt.groups&&vt.groups.qsc||[], vt.groups&&vt.groups.b2b||[]);
    const seen=new Set();
    body = '<div class="crumb">'+crumb+'</div><div class="dsub">All metrics · score · MoM · vs BU · rank</div>'
      + all.filter(m=>!seen.has(m)&&(seen.add(m),cells[m]&&cells[m].june!=null)).map(m=>{
          const c=cells[m];
          return dr(esc(c.label||m)+(c.lower_better?" ↓":""), Number(c.june).toFixed(1)+(c.delta!=null?" · "+(c.delta>0?"+":"")+Number(c.delta).toFixed(1)+" MoM":"")+(c.bu!=null?" · BU "+Number(c.bu).toFixed(1):"")+(c.rank!=null?" · #"+c.rank+"/"+c.rank_of:""));
        }).join("")
      + '<div class="cap">Polarity-aware (↓ = lower is better). vs CHICAGO-MOCNI BU. From voice_scores. Data thru '+esc(vt.data_through||"—")+'.</div>';
  } else if(kind==="scorecard"){
    const sc = data.manager_scorecards || {}; const s = (sc.stores||[]).find(x=>x.nsn===(arg&&arg.nsn)) || (sc.stores||[])[0];
    title = (s?s.store_name+" · ":"")+"Scorecard"; crumb = "Team › "+(s?esc(s.store_name)+" › ":"")+"<b>Monthly</b>";
    if(s){
      body = '<div class="crumb">'+crumb+'</div>'
        + dr("GM overall", (s.gm_overall!=null?Number(s.gm_overall).toFixed(2):"—")+" ("+rateWord(s.gm_overall)+")")
        + dr("GM big-6 scorecard", s.gm_scorecard!=null?Number(s.gm_scorecard).toFixed(2):"—")
        + dr("GM profit rating", s.gm_profit!=null?Number(s.gm_profit).toFixed(2):"—")
        + dr("Swing scorecard", s.sw_scorecard!=null?Number(s.sw_scorecard).toFixed(2):"—")
        + '<div class="dsub">Monthly trend (GM overall)</div>'
        + sparkline((s.monthly||[]).map(m=>m.gm_overall).filter(x=>x!=null))
        + '<div class="dsub">Latest month components</div>'
        + (()=>{ const m=(s.monthly||[]).slice(-1)[0]; if(!m) return '<div class="cap">No monthly rows.</div>';
            return dr("OSAT DT / IR", (m.gm_osat_dt!=null?Number(m.gm_osat_dt).toFixed(1):"—")+" / "+(m.gm_osat_ir!=null?Number(m.gm_osat_ir).toFixed(1):"—"))

// MODULE — Voice (Owner/GM home): ports the LIVE v1 "voice_trend" methodology to the
// home top-line. Five SMG KPIs — OSAT / Accuracy / Digital %EAD / Cleanliness / Executed-
// as-Designed — for the Combined org (owner = entities[0]) or the GM's store (entities[0]).
// CONDITIONAL-FORMAT vs the per-metric "...BU" benchmark (CHICAGO-MOCNI co-op, the `bu`
// field on each cell), NOT the org self-average: polarity-aware (lower_better) + two
// intensities (|diff|>=5 = strong). OSAT shows org rank #/12. Cleanliness/%EAD/Exec come
// ONLY from the Digital source (merged into cells by gatherVoiceTrend's vvBuild). Period
// label = "<Month> MTD" from voice_trend.data_through (UTC-anchored MAX(period_start),
// already "June 2026") — kills the legacy voice_view "thru May 31" off-by-one.
function renderHomeVoice(data){
  const vt = data.voice_trend;
  if(!vt || !Array.isArray(vt.entities) || !vt.entities.length) return "";
  const ent = vt.entities[0];                 // owner: Org (Combined); GM/sup: focal store
  const cells = ent.cells || {};
  const c = (m)=> cells[m] || null;
  const HOME_KEYS = ["Overall Satisfaction","Accuracy","Digital - % EAD","Overall Cleanliness","Pull Forward - Executed as Designed (Yes)"];
  if(HOME_KEYS.every(m=>!c(m) || c(m).june==null)) return "";
  const f1 = (x)=> x!=null ? Number(x).toFixed(1)+"%" : "—";
  // BU-benchmarked, polarity-aware, two intensities (mirrors v1 vtVsBU's |diff|>=5 rule).
  // v2 has one favorability class pair, so strong is conveyed by ★ (strong-good) / ⚠ +
  // the "BU n.n" sub line (strong-bad) rather than a second color shade.
  const fmtBU = (cell)=>{
    if(!cell || cell.june==null) return {v:"—", cls:"", strong:false, ok:null};
    if(cell.bu==null) return {v:f1(cell.june), cls:"", strong:false, ok:null};
    const good = cell.lower_better ? (cell.june <= cell.bu) : (cell.june >= cell.bu);
    const strong = Math.abs(cell.june - cell.bu) >= 5;
    return {v:f1(cell.june), cls:(good?"fav":"unfav"), strong, ok:good};
  };
  const LABELS = {"Overall Satisfaction":"OSAT","Accuracy":"Accuracy","Digital - % EAD":"Digital %EAD","Overall Cleanliness":"Cleanliness","Digital - Greeted by Name":"Greeted by Name"};
  const osatC = c("Overall Satisfaction");
  const rankChip = (osatC && osatC.rank!=null && osatC.rank_of!=null)
    ? ' · <b>#'+osatC.rank+'/'+osatC.rank_of+'</b> org rank' : '';
  const tiles = '<div class="trio voicewrap">'+HOME_KEYS.map(m=>{
    const cell = c(m), f = fmtBU(cell);
    const sub = (cell && cell.bu!=null) ? '<div class="gs">BU '+f1(cell.bu)+(cell.lower_better?' ↓':'')+(f.strong&&f.ok===false?' ⚠':'')+'</div>' : '';
    return '<div class="gtile"><div class="gl">'+esc(LABELS[m]||m)+'</div><div class="gv '+f.cls+'">'+f.v+(f.strong&&f.ok?'<span style="font-size:11px">★</span>':'')+'</div>'+sub+'</div>';
  }).join("")+'</div>';
  const nVal = (osatC && osatC.n!=null) ? osatC.n : null;
  const foot = '<div class="cap">'+(nVal!=null?'n='+nVal+' surveys · ':'')
    +'color vs CHICAGO-MOCNI BU (↓ = lower is better)'+rankChip+' · SMG VOICE</div>';
  const isStore = ent.id != null;
  return card("Voice — "+voiceMtdLabel(vt.current_period||vt.data_through), tiles + foot,
    { icon:"⭐", info: "VOICE · "+voiceMtdLabel(vt.current_period||vt.data_through)+(isStore?" · "+esc(ent.name):" · portfolio"), newBadge:true });
}

/* =========================================================================
   TRIAGE INTERFACE (docs/plans/triage-interface) — "The Ledger" + "The Stack".

var TR = { page:null, surface:null, id:null, sessionId:null, t0:0, taps:0, reopens:0,
           decided:0, dwell:{}, dwellCur:null, dwellT0:0, flushed:false, deck:[], idx:0,

function trIdem(p){ return (p||"tr")+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8); }

function trSlot(slot){ if(!slot||!slot.prep_for) return ""; return " · slot "+esc(String(slot.prep_for).slice(0,16).replace("T"," "))+(slot.prep_status?(" ("+esc(slot.prep_status)+")"):""); }

async function trPost(body){
  var r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN), {
    method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body||{}) });
  if(r.status===401) throw new Error("link expired");
  if(!r.ok){ var j={}; try{ j=await r.json(); }catch(e){} throw new Error((j.result&&j.result.msg)||("HTTP "+r.status)); }
  return r.json();
}
function trReopen(){ if(!TR.id) return; TR._reopening=true; delete PAGE_CACHE[TR.id]; openPage(TR.id,{noHistory:true}); }

/* ---- tap + undo ---- */
async function trTap(ref, verb, itype, side, payloadEnc, ev){
  var btn = ev && ev.currentTarget; if(btn) btn.disabled=true;
  var card = btn && btn.closest(".tr-card, .tr-scard"); if(card) card.classList.add("busy");
  TR.taps++;
  var payload={}; try{ payload = payloadEnc ? JSON.parse(decodeURIComponent(payloadEnc)) : {}; }catch(e){}
  try{
    var res = await trPost({ action:"triage_act", surface:TR.surface, verb:verb, item_type:itype, item_ref:ref, idempotency_key:trIdem("t"), payload:payload });
    if(!res.result || res.result.ok===false){ if(card) card.classList.remove("busy"); if(btn) btn.disabled=false; alert((res.result&&res.result.msg)||"Action failed"); return; }
    TR.decided++;
    trShowToast(res.result.msg, res.receipt);
    if(TR.surface==="ledger") trLedgerResolve(card, res);
    else trStackAdvance();
  }catch(e){ if(card) card.classList.remove("busy"); if(btn) btn.disabled=false; alert("Failed: "+(e&&e.message)); }
}
function trShowToast(msg, receipt){
  trClearToast();
  if(!receipt || !receipt.qa_id) return;
  var grace=(TR.page&&TR.page.undo_grace_ms)||60000, secs=Math.round(grace/1000);
  var el=document.createElement("div"); el.className="tr-toast"; el.id="tr-toast";
  el.innerHTML='<span>'+esc(msg||"Done")+'</span><button id="tr-undo">Undo ('+secs+'s)</button>';
  document.body.appendChild(el);
  document.getElementById("tr-undo").onclick=function(){ trUndo(receipt.qa_id); };
  var left=secs;
  TR.undoTimer=setInterval(function(){ left--; var b=document.getElementById("tr-undo"); if(b) b.textContent="Undo ("+left+"s)"; if(left<=0) trClearToast(); }, 1000);
  TR._toastTimeout=setTimeout(trClearToast, grace+400);
}
function trClearToast(){ if(TR.undoTimer){clearInterval(TR.undoTimer);TR.undoTimer=null;} if(TR._toastTimeout){clearTimeout(TR._toastTimeout);TR._toastTimeout=null;} var e=document.getElementById("tr-toast"); if(e) e.remove(); }
async function trUndo(qaId){
  trClearToast();
  try{ var res=await trPost({action:"triage_cancel", qa_id:qaId}); if(res.result&&res.result.ok===false){ alert(res.result.msg); return; } TR.decided=Math.max(0,TR.decided-1); TR.reopens++; trReopen(); }
  catch(e){ alert("Undo failed: "+(e&&e.message)); }
}
function trLedgerResolve(card, res){
  if(!card) return;
  card.classList.remove("busy");
  var staging=(res.receipt && res.receipt.status==="staged" && res.receipt.side==="graph");
  var msg = staging ? "Staging in Outlook Drafts…" : (res.result.msg||"Done");
  card.innerHTML='<div class="tr-done">✓ '+esc(msg)+'</div>';
}

/* ---- dwell + session metrics ---- */
function trDwellStart(ref){ trDwellEnd(); TR.dwellCur=ref; TR.dwellT0=Date.now(); }
function trDwellEnd(){ if(TR.dwellCur){ TR.dwell[TR.dwellCur]=(TR.dwell[TR.dwellCur]||0)+(Date.now()-TR.dwellT0); TR.dwellCur=null; } }
function trSessionStart(surface){
  if(TR._reopening){ TR._reopening=false; TR.surface=surface; trBindFlush(); return; }
  trFlush();
  TR.surface=surface; TR.id = surface==="ledger"?"triage_ledger":"triage_stack";
  TR.sessionId=trIdem("s"); TR.t0=Date.now(); TR.taps=0; TR.reopens=0; TR.decided=0; TR.dwell={}; TR.dwellCur=null; TR.flushed=false;
  trBindFlush();
}
function trBindFlush(){
  if(TR._flushBound) return; TR._flushBound=true;
  window.addEventListener("beforeunload", trFlush);
  var layer=document.getElementById("pageLayer");

const PAGE_INFLIGHT = {};   // id -> promise (fast double-tap = one fetch)
let ACTIVE_PAGE = null;
let BOARD_BOOTED = false;

function pageSkeleton(){
  let s = "";
  for(let i=0;i<3;i++){
    s += '<div class="skel"><div class="sl w40"></div><div class="sl w90"></div><div class="sl w70"></div><div class="sl tall"></div></div>';
  }
  return s;
}

async function fetchPage(id){
  const reg = PAGE_REGISTRY[id];
  if(reg && reg.local) return {};   // client-only page (Ask the Brain): no fn fetch
  const c = PAGE_CACHE[id];
  if(c && (Date.now() - c.at) < (reg.ttlMs || 5*60*1000)) return c.payload;
  if(PAGE_INFLIGHT[id]) return PAGE_INFLIGHT[id];
  const p = (async () => {
    try{
      const r = await fetch(ENDPOINT + "?t=" + encodeURIComponent(TOKEN) + "&page=" + encodeURIComponent(id));
      if(r.status === 401) throw new Error("link expired");
      if(r.status === 403 || r.status === 404) throw new Error("not available on this link");
      if(!r.ok) throw new Error("HTTP " + r.status);
      const payload = await r.json();
      PAGE_CACHE[id] = { at: Date.now(), payload };
      return payload;
    } finally {
      delete PAGE_INFLIGHT[id];
    }
  })();
  PAGE_INFLIGHT[id] = p;
  return p;
}

function openPage(id, opts){
  opts = opts || {};
  const reg = PAGE_REGISTRY[id];
  if(!reg){ console.error("unknown page:", id); return; }
  ACTIVE_PAGE = id;
  const layer = document.getElementById("pageLayer");
  document.getElementById("pageTitle").textContent = reg.title;
  document.getElementById("pageBody").innerHTML = pageSkeleton();
  layer.classList.add("open");
  layer.scrollTop = 0;
  if(!opts.noHistory){
    const u = new URL(location.href); u.searchParams.set("p", reg.route);
    if(opts.deeplink){
      // Deep link boot: seed a board entry UNDER the page entry so the phone
      // back button lands on the board instead of exiting the app.
      const b = new URL(location.href); b.searchParams.delete("p"); b.searchParams.delete("view");
      history.replaceState({ board: true }, "", b);
      history.pushState({ page: id }, "", u);
    } else {
      history.pushState({ page: id }, "", u);
    }
  }
  fetchPage(id).then(function(payload){
    if(ACTIVE_PAGE !== id) return;
    const body = document.getElementById("pageBody");
    body.innerHTML = sect(function(){ return reg.render(payload); });
    if(reg.after){ try{ reg.after(body, payload); }catch(e){ console.error("page after-hook error:", e); } }
  }).catch(function(e){
    if(ACTIVE_PAGE !== id) return;
    document.getElementById("pageBody").innerHTML =
      '<div class="errbox">' + esc("Could not load this page: " + (e && e.message ? e.message : e)) + '</div>';
  });
}
window.openPage = openPage;

function hidePageLayer(){
  ACTIVE_PAGE = null;
  document.getElementById("pageLayer").classList.remove("open");
  if(!BOARD_BOOTED) bootBoard();   // deep-linked session: board loads on first close
}
function closePage(){ history.back(); }   // popstate below does the actual hide
window.closePage = closePage;
window.addEventListener("popstate", function(ev){
  const st = ev.state;
  if(st && st.page && PAGE_REGISTRY[st.page]) openPage(st.page, { noHistory: true });
  else hidePageLayer();
});

/* =========================================================================
   Q3 BONUS — shared formatting + the ranker page + the home tile.
   Full $ transparency (owner decision): every manager token sees all 12 GM
   names + dollars. RO/guest links never reach here (server 403s the page and
   never gathers bonus_home). Watermarked PRELIMINARY on BOTH surfaces.
   ========================================================================= */
function bnsMoney(n){
  const v = Number(n) || 0;
  const cents = Math.round(v * 100) % 100 !== 0;
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: 2 });
}
function bnsMd(iso){   // '2026-06-30' -> '6/30'
  if(!iso || String(iso).length < 10) return String(iso || "");
  return Number(String(iso).slice(5,7)) + "/" + Number(String(iso).slice(8,10));
}
const BNS_CLS = { HIT:"b-hit", MISS:"b-miss", HELD:"b-held", PENDING:"b-pend" };
function bnsMetricVal(c){
  if(c.status === "HIT") return "✓ " + bnsMoney(c.amount);
  if(c.status === "MISS") return (c.metric_value != null ? (Math.round(Number(c.metric_value)*10)/10) + " · " : "") + "MISS";
  if(c.status === "HELD") return "HELD †";
  return "PENDING";
}

/* ---- the GM BONUS RANKER page (reference implementation) ---- */
function rkComps(components){
  let h = "";
  for(const c of (components || [])){
    const cls = BNS_CLS[c.status] || "b-pend";
    h += '<div class="rk-cc ' + cls + '" title="' + esc(c.why || "") + '">'
       + '<div class="rk-cl">' + esc(c.label) + '</div>'
       + '<div class="rk-cv">' + esc(bnsMetricVal(c)) + '</div>'
       + (c.status !== "HIT" && c.why ? '<div class="rk-cw">' + esc(c.why) + '</div>' : "")
       + '</div>';
  }
  return h;
}
function rkToggle(el){ el.classList.toggle("open"); }
window.rkToggle = rkToggle;
function rkJumpYou(){

     + ' · whole run (all roles) ' + esc(bnsMoney(org.all_roles_total)) + ' · ' + esc(org.held_count != null ? org.held_count : "—") + ' components held'
     + '<br>' + esc(p.note || "")
     + '</div>';
  h += '</div>';

}

// after-hook: count-up the $ figures (transform/text only; skipped under
// prefers-reduced-motion — the numbers are already painted as the final value).
function rkAfterRender(root){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  root.querySelectorAll("[data-rk-count]").forEach(function(el){
    const target = Number(el.getAttribute("data-rk-count")) || 0;
    if(target <= 0) return;
    const t0 = performance.now(), dur = 850;
    function step(t){
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = bnsMoney(target * e);
      if(k < 1) requestAnimationFrame(step); else el.textContent = bnsMoney(target);
    }
    requestAnimationFrame(step);
  });
}

/* ---- the Q3 BONUS home tile (TODAY lane, all manager roles) ---- */
// v2-0.37 (feature 2): richer tile — per-component TARGET + earned/potential $,
// hero "earned $X of $Y possible", earned-progress bar, status pills, tinted
// chips. Every target/potential figure comes from the Fn (parsed server-side
// from bonus_payouts.inputs — bonusTargetPotential) so the tile ties to the
// engine to the cent; NOTHING is computed client-side beyond display math.
// All new fields are null-guarded, so the tile still renders against an older
// Fn payload that lacks them (back-compat both ways).
function bhFmtVal(v){
  if(v == null) return null;
  return String(Math.round(Number(v) * 10) / 10);
}
function bhChip(m){
  const cls = BNS_CLS[m.status] || "b-pend";
  const act = bhFmtVal(m.metric_value);
  const hasPot = m.potential != null;
  let money = "", detail = "";
  if(m.status === "HIT"){
    money = "✓ " + bnsMoney(m.amount)
      + (hasPot && Number(m.amount) < Number(m.potential) ? " of " + bnsMoney(m.potential) : "");
    detail = (act != null ? act : "") + (m.target ? (act != null ? " · " : "") + "target " + m.target : "");
  } else if(m.status === "MISS"){
    money = hasPot ? "$0 of " + bnsMoney(m.potential) : "MISS";
    detail = (act != null && m.target) ? act + " vs " + m.target
           : (m.target ? "target " + m.target : (act != null ? act : ""));
  } else if(m.status === "HELD"){
    money = "HELD" + (hasPot ? " · up to " + bnsMoney(m.potential) : "");
    detail = (act != null ? act : "") + (m.target ? (act != null ? " · " : "") + "target " + m.target : "");
  } else {
    money = "PENDING" + (hasPot ? " · up to " + bnsMoney(m.potential) : "");
    detail = m.target ? "target " + m.target : "";
  }
  const tip = (m.why ? m.why : "") + (m.tiers ? (m.why ? " — " : "") + "tiers: " + m.tiers : "");
  return '<div class="bhc ' + cls + '" title="' + esc(tip) + '">'
    + '<div class="bhtop"><span class="bhl">' + esc(m.label) + '</span><span class="bhpill ' + cls + '">' + esc(m.status) + '</span></div>'
    + '<div class="bhs">' + esc(money) + '</div>'
    + (detail ? '<div class="bht">' + esc(detail) + '</div>' : "")
    + '</div>';
}
function bhProgress(earned, possible){
  const e = Number(earned) || 0, p = Number(possible) || 0;
  if(p <= 0) return "";
  const w = Math.max(0, Math.min(100, Math.round(100 * e / p)));
  return '<div class="bhbar"><i style="width:' + w + '%"></i></div>';
}
function renderBonusHomeTile(data){
  const bh = data.bonus_home;
  if(!bh) return "";   // RO/guest token, or the slice failed — no tile
  const info = "op thru " + bnsMd(bh.op_data_through) + " · profit " + (bh.profit_data_through || "").replace(" (open/preliminary)", " prelim");
  let body = '<div class="bhwm">⚠ ' + esc(bh.watermark || "PRELIMINARY — not yet payable") + '</div>';
  if(bh.mode === "store" && bh.store){
    const s = bh.store;
    const metrics = s.metrics || [];
    const hitsN = s.hits_n != null ? s.hits_n : metrics.filter(function(m){ return m.status === "HIT"; }).length;
    body += '<div class="bhhero"><span class="bhv">' + esc(bnsMoney(s.total)) + '</span>'
      + (s.potential_total != null ? '<span class="bhof">of ' + esc(bnsMoney(s.potential_total)) + ' possible</span>' : "")
      + '<span class="bhrank">#' + esc(s.rank) + ' of ' + esc(s.of) + '</span></div>'
      + bhProgress(s.total, s.potential_total)
      + '<div class="bhsub2">' + esc(bh.period_label || "") + ' · ' + esc(hitsN) + ' of ' + metrics.length + ' hit'
      + ' · top store ' + esc(bnsMoney(bh.org_top_total)) + '</div>';
    body += '<div class="bhgrid">';
    for(const m of metrics){ body += bhChip(m); }
    body += '</div>';
  } else if(bh.mode === "org" && bh.org){
    const o = bh.org;
    body += '<div class="bhhero"><span class="bhv">' + esc(bnsMoney(o.all_roles_total)) + '</span>'
      + '<span class="bhsub">' + esc(o.recipients) + ' recipients · ' + esc(o.held_count) + ' held'
      + (o.top ? ' · top ' + esc(o.top.store_name || "") + ' ' + esc(bnsMoney(o.top.total)) : "") + '</span></div>';
    // GM-block progress: gm_total vs gm_potential_total share the SAME basis
    // (GM rows only) — never mixed with the all-roles hero figure above.
    if(o.gm_potential_total != null){
      body += bhProgress(o.gm_total, o.gm_potential_total)
        + '<div class="bhsub2">GM blocks ' + esc(bnsMoney(o.gm_total)) + ' of ' + esc(bnsMoney(o.gm_potential_total)) + ' possible</div>';
    } else {
      body += '<div class="bhsub2">GM blocks ' + esc(bnsMoney(o.gm_total)) + '</div>';
    }
    body += '<div class="bhgrid">';
    for(const m of (o.metrics || [])){
      // 0 hits stays NEUTRAL gray (an all-PENDING metric like PAC-vs-target is
      // not a red org miss); any hits amber; a clean sweep green.
      const cls = (m.of > 0 && m.hits >= m.of) ? "b-hit" : m.hits > 0 ? "b-held" : "b-pend";
      body += '<div class="bhc ' + cls + '">'
        + '<div class="bhtop"><span class="bhl">' + esc(m.label) + '</span><span class="bhpill ' + cls + '">' + esc(m.hits) + '/' + esc(m.of) + '</span></div>'
        + '<div class="bhs">' + esc(bnsMoney(m.paid_total))
        + (m.potential_total != null ? ' of ' + esc(bnsMoney(m.potential_total)) : "") + '</div>'
        + '</div>';
    }
    body += '</div>';
  } else {
    body += emptyState("💰", "No bonus run yet", "The tile lights up when the first monthly run lands.");
  }
  // Monthly framing: the tile shows the latest single monthly run (e.g. "June
  // 2026"), so title by the month, not the containing quarter. Payout cadence
  // (pays at Q3 close) stays in the watermark/info — accurate, just not the header.
  const tileTitle = (bh.period_label ? bh.period_label + " " : "") + "Bonus — Preliminary";
  return card(tileTitle, body,
    { icon:"💰", info: info, newBadge:true, drill:{ kind:"page:bonus_ranker" } });
}

/* =========================================================================
   SHIFT LEADER OEPE — MTD (v2-0.39): the sl_oepe page + its TODAY home tile.
   Data = qsr_shift_manager_stats peak rows, aggregated + scope-shaped by the
   Fn (?page=sl_oepe): Owner/org = one section per supervisor patch (+ Owner
   stores), Supervisor = their patch, GM/Department = their store. Names
   arrive pre-minimized ("First L.") — no GEIDs, no full last names. Ranked
   ascending (faster = better) at min_shifts+; the rest render dimmed and
   unranked as "building sample". RO/guest tokens never reach here (server
   403s the page and never gathers sl_oepe_home).
   ========================================================================= */
function slrSecs(v){ return v == null ? "—" : (Math.round(Number(v) * 10) / 10) + "s"; }

// One leader row. `best` = the group leader OEPE (bar width = best/oepe, so a
// longer bar = faster). Unranked rows render dimmed with a dot for the rank.
function slrRow(x, best, showStores){
  const stLine = (showStores && x.stores && x.stores.length) ? x.stores.join(", ") : "";
  const w = (x.rank && x.oepe_s != null && best != null && Number(x.oepe_s) > 0)
    ? Math.max(6, Math.min(100, Math.round(100 * best / Number(x.oepe_s)))) : 0;
  return '<div class="slr-row' + (x.rank ? "" : " slr-dim") + '">'
    + '<div class="slr-rank' + (x.rank && x.rank <= 3 ? " top" : "") + '">' + (x.rank ? esc(x.rank) : "·") + '</div>'
    + '<div class="slr-who"><div class="slr-nm">' + esc(x.name) + '</div>'
    + (stLine ? '<div class="slr-st">' + esc(stLine) + '</div>' : "")
    + (w ? '<div class="slr-bar"><i style="width:' + w + '%"></i></div>' : "")
    + '</div>'
    + '<div class="slr-right"><div class="slr-oepe">' + esc(slrSecs(x.oepe_s)) + '</div>'
    + '<div class="slr-sh">' + esc(x.shifts) + (Number(x.shifts) === 1 ? " shift" : " shifts") + '</div></div>'
    + '</div>';
}

/* ---- shared mini-helpers (ported from the mockup, namespaced) ---- */
function flPctEl(v){
  if(v==null || isNaN(Number(v))) return '<span class="fl-pct flat">–</span>';
  var n = Math.round(Number(v));
  var c = n>8?"up":n<-8?"dn":"flat";
  return '<span class="fl-pct '+c+'">'+(n>0?"+"+n:n)+'%</span>';
}
function flStatusChip(r){
  if(r.dark) return '<span class="fl-chip fl-c-gray">not logging</span>';
  if(r.phigh) return '<span class="fl-chip fl-c-bad">promo high</span>';
  if(r.mlow) return '<span class="fl-chip fl-c-warn">meals low</span>';
  return '<span class="fl-chip fl-c-good">on norm</span>';
}
// normalized bar: value vs norm; the tick at 50% of the track IS the norm.
function flNormBar(v, norm, unit){
  var val = Number(v)||0, nm = Number(norm)||0;
  var frac = nm>0 ? Math.min(1, val/(nm*2)) : 0;
  var col = nm>0 && val>=nm*1.5 ? "var(--bad)" : nm>0 && val<=nm*0.5 ? "var(--warn)" : "var(--good)";
  var label = unit==="$" ? "$"+val.toFixed(1) : val.toFixed(2);
  return '<div class="fl-nbar"><i style="width:'+(frac*100).toFixed(0)+'%;background:'+col+'"></i>'
    +'<u style="left:50%"></u><em>'+label+'</em></div>';
}
function flSpark(arr, norm){
  arr = arr && arr.length ? arr : [0];
  var w=64,h=18,n=arr.length,nm=Number(norm)||0,max=Math.max(nm*1.2,0.1);
  for(var i=0;i<n;i++) max=Math.max(max, Number(arr[i])||0);
  var pts=arr.map(function(v,i){ return ((n>1? i/(n-1):0)*w).toFixed(1)+","+(h-(Number(v)||0)/max*h).toFixed(1); }).join(" ");
  var ny=(h-nm/max*h).toFixed(1);
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="vertical-align:middle">'
    +'<line x1="0" y1="'+ny+'" x2="'+w+'" y2="'+ny+'" stroke="var(--ink-2)" stroke-dasharray="2 2" stroke-width="1"/>'
    +'<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>';
}
function flDial(label, v, norm, vn, dark){
  var val=Number(v)||0, nm=Number(norm)||0;
  var frac = nm>0 ? Math.min(1, val/(nm*2)) : 0;
  var col = dark?"var(--ink-2)": nm>0&&val>=nm*1.5?"var(--bad)": nm>0&&val<=nm*0.5?"var(--warn)":"var(--good)";
  return '<div class="fl-dial"><div class="fl-dh"><span>'+esc(label)+'</span><b>'+(dark?'—':val.toFixed(3))+' '+flPctEl(vn)+'</b></div>'
    +'<div class="fl-track"><i style="width:'+(frac*100).toFixed(0)+'%;background:'+col+'"></i><u style="left:50%"></u></div></div>';
}
// v_food_log_store_card row -> the mockup's compact shape
function flRow(r){
  return {
    id:r.store_id, sn:r.store_number, loc:r.location_name, gm:r.gm_name||"",
    sev:Number(r.severity)||0, dl:Number(r.days_logged_7d)||0, od:Number(r.operating_days_7d)||0,
    pd:Number(r.person_days_7d)||0, gc:Number(r.guests_7d)||0,
    meals:Number(r.crew_meals_7d)||0, mm:Number(r.mgmt_meals_7d)||0, promos:Number(r.promos_7d)||0,
    mpc:Number(r.meals_per_clocked_in_7d)||0, p1k:Number(r.promos_per_1k_gc_7d)||0,
    pd1k:Number(r.promo_dollars_per_1k_gc_7d)||0,
    mvn:r.meals_vs_norm_pct==null?null:Number(r.meals_vs_norm_pct),

    dark:r.flag_not_logging===true, phigh:r.flag_promo_high===true, mlow:r.flag_meals_low===true,

  var h='<div class="fl-tblwrap"><table class="fl-tbl"><thead><tr><th>Store</th><th class="num">Meals / clocked-in</th>'

/* ---- Look C: Exceptions only ---- */

      +'<div class="fl-aff">→ nudge each GM to start logging · '+dark.map(function(r){return esc(String(r.gm).split(' ')[0]);}).join(', ')+'</div></div>';
  }
  for(var i=0;i<phigh.length;i++){ var r=phigh[i];
    h+='<div class="fl-act red"><div class="fl-top"><h4>'+esc(r.loc)+' — promo food '+(r.pvn!=null?(r.pvn>0?'+':'')+Math.round(r.pvn):'?')+'% vs norm</h4>'
      +'<span class="fl-chip fl-c-bad">'+r.p1k.toFixed(2)+' / 1k GC</span></div>'
      +'<div class="fl-why">'+r.promos+' promo incidents on '+r.gc.toLocaleString()+' guests (org norm '+Number(nm.norm_promos_per_1k_gc||0).toFixed(2)+'/1k). $'+r.pd1k.toFixed(0)+' of promo food per 1k GC. GM '+esc(r.gm)+'.</div></div>';

  }

/* =========================================================================
   BOARD PROMPTS (v2-0.58) — targeted explain-and-respond cards on HOME.
   data.board_prompts (fn: active prompts targeting THIS manager, already
   linger-filtered per manager; never sent to RO). Un-responded -> body +
   textarea + Update; responded (within linger) -> the recorded response(s)
   + timestamp + an optional follow-up. body_html is fn/owner-authored
   (board_prompts.body_html), same trust class as every fn-built string.
   ========================================================================= */
function bpWhen(ts){
  if(!ts) return "";
  try{ return new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
  catch(e){ return String(ts).slice(0,16); }
}
function renderBoardPromptCards(data){
  var ps = (data && data.board_prompts) || [];
  if(!ps.length) return "";
  flEnsureCss();
  var out = "";
  for(var i=0;i<ps.length;i++){ var p=ps[i];
    var resp = p.responses || [];
    var inner = '<div class="bp-body">'+(p.body_html||"")+'</div>';
    if(resp.length){
      inner += '<div class="bp-done">✓ Your update is on record — Eddie sees it on his board. This card clears about '+esc(String(p.linger_hours||24))+'h after your first response.</div>';
      for(var j=0;j<resp.length;j++){
        inner += '<div class="bp-resp"><div class="bp-rt">'+esc(resp[j].response_text)+'</div><div class="bp-ra">posted '+esc(bpWhen(resp[j].created_at))+'</div></div>';
      }
      inner += '<span class="bp-more" onclick="bpToggleMore(event,this)">+ Add a follow-up update</span>'
        +'<div class="bp-form" style="display:none"><textarea class="bp-ta" placeholder="Add anything else Eddie should know…"></textarea>'
        +'<button class="bp-btn" onclick="bpRespond(event,this,'+Number(p.id)+')">Update</button><div class="bp-msg"></div></div>';
    } else {
      inner += '<div class="bp-form"><textarea class="bp-ta" placeholder="Type your update — it goes straight to Eddie…"></textarea>'
        +'<button class="bp-btn" onclick="bpRespond(event,this,'+Number(p.id)+')">Update</button><div class="bp-msg"></div></div>';
    }
    out += '<div class="card bp-card"><div class="chead"><div class="ctitle">📣 '+esc(p.title||"Please respond")+'<span class="newbadge">ACTION</span></div></div>'+inner+'</div>';
  }
  return out;
}
function bpToggleMore(ev, el){
  ev.stopPropagation();
  var f = el.parentElement.querySelector(".bp-form");
  if(f){ f.style.display = f.style.display==="none" ? "" : "none"; }
}
window.bpToggleMore = bpToggleMore;
async function bpRespond(ev, btn, promptId){
  ev.stopPropagation();
  var form = btn.closest(".bp-form") || btn.parentElement;
  var ta = form.querySelector(".bp-ta");
  var msg = form.querySelector(".bp-msg");
  var text = (ta && ta.value || "").trim();
  if(!text){ if(msg) msg.textContent = "Write your update first."; return; }
  btn.disabled = true; if(msg) msg.textContent = "Posting…";
  try{
    var payload = await v2CallApi({ action:"prompt_respond", prompt_id: promptId, response_text: text });
    if(payload && payload.result && payload.result.ok === false){
      btn.disabled = false; if(msg) msg.textContent = payload.result.msg || "Could not post."; return;
    }
    renderBoard(payload);   // re-gathered board_prompts now shows the recorded response
  }catch(e){
    btn.disabled = false; if(msg) msg.textContent = "Failed: " + (e && e.message);
  }
}
window.bpRespond = bpRespond;

function renderPromptResponsesCard(data){
  var rs = data && data.prompt_responses;

      +'<div class="pr-h"><span>'+esc(r.prompt_title||"")+'</span></div>'
      +'<div class="pr-t">'+esc(r.response_text||"")+'</div></div>';

function bpAgo(ts){
  if(!ts) return "";
  var ms = Date.now() - new Date(ts).getTime();
  if(!(ms >= 0)) return bpWhen(ts);
  var m = Math.round(ms/60000);
  if(m < 60) return m + "m ago";
  var h = Math.round(m/60);
  if(h < 48) return h + "h ago";
  return bpWhen(ts);
}

/* ---- the GRILL MIN-TEMPS home tile (TODAY lane; Owner/Sup/GM — v2-0.41) ----
   MOVED from the Jolt section (Jolt Ops full-view Module D + the Operations
   (Jolt) card optile + its lane sheet): per meat product, the MINIMUM
   cooked-product temp on that product's LATEST food-safety check
   (data.grill_temps_home, v_jolt_grill_min_temp_latest). Pass/fail colors =
   the UNCHANGED grillFlag thresholds (>=155 in range / 130-154 watch /
   <130 below safe). These are REAL probe readings entered on the food-safety
   check — NOT the inferred (TEMPERATURE_SIMULATED) fridge/freezer sensor
   temps, which keep their own card + labeling. Self-gates on
   data.grill_temps_home (the Fn sends it only to Owner/Sup/GM — Department
   keeps the Jolt-section placement). GM = their store's product grid;
   sup/owner = per-store expanders, worst first. Each product tile carries its
   session timestamp; the card carries the scope-wide Jolt data-through. */
function renderGrillHomeTile(data){
  const gh = data.grill_temps_home;
  if(!gh || !(gh.products||[]).length) return "";   // Department / other roles or no data — no tile
  const rows = gh.products||[];
  const tile = g => {
    const f = grillFlag(g.min_cook_temp_f);
    return '<div class="jgt g-'+f+'"><div class="jgl">'+esc(g.product_category)+'</div>'
      + '<div class="jgv">'+(g.min_cook_temp_f!=null? Number(g.min_cook_temp_f).toFixed(1):"—")+'<span class="jdeg">°F</span></div>'
      + '<div class="jgs">min of '+(g.cook_reading_count||0)+' cook reads · '+esc(fmtCT(g.completion_ts))+'</div></div>';
  };
  const grid = list => '<div class="jgrid">'
    + list.slice().sort((a,b)=>String(a.product_category).localeCompare(String(b.product_category))).map(tile).join("")+'</div>';
  let body;
  if(gh.multi_store){
    // per-store expanders, worst store first (below-safe count, then watch count).
    const byStore = {};
    for(const r of rows){ (byStore[r.store_id]=byStore[r.store_id]||{name:r.store_name||("Store "+r.store_id),list:[]}).list.push(r); }
    const stores = Object.values(byStore).map(s=>({ ...s,
      bad: s.list.filter(g=>grillFlag(g.min_cook_temp_f)==="bad").length,
      warn: s.list.filter(g=>g.min_cook_temp_f!=null && grillFlag(g.min_cook_temp_f)==="warn").length,
    })).sort((a,b)=>(b.bad-a.bad)||(b.warn-a.warn)||String(a.name).localeCompare(String(b.name)));
    const badTot = stores.reduce((a,s)=>a+s.bad,0), warnTot = stores.reduce((a,s)=>a+s.warn,0);
    body = '<div class="vflags">'
      + (badTot? '<span class="flag warn">'+badTot+' below safe</span>' : '')
      + (warnTot? '<span class="flag warn">'+warnTot+' on watch</span>' : '')
      + ((!badTot && !warnTot)? '<span class="flag good">all products in range</span>' : '')
      + '</div>'
      + stores.map(s=>'<details class="stexp"><summary>'+esc(s.name)
        + ' · '+(s.bad? ('<b>'+s.bad+' below safe</b>') : (s.warn? (s.warn+' on watch') : 'in range'))
        + '</summary>'+grid(s.list)+'</details>').join("")
      + '<div class="cap">Worst first. Tap a store for its products.</div>';
  } else {
    body = grid(rows);
  }
  body += '<div class="cap">Lowest cooked product temp on each product&rsquo;s latest food safety check. '
    + '<b style="color:var(--good)">≥155°F in range</b> · <b style="color:var(--warn)">130 to 154°F watch</b> · <b style="color:var(--bad)">&lt;130°F below safe</b>. '
    + 'Real probe readings entered on the check &mdash; not the inferred fridge/freezer sensor temps. '
    + 'YES/NO and N/A items excluded. From the Jolt feed (twice daily pull).</div>';
  return card("Grill Min-Temps — Food Safety", body,
    { icon:"🔥", newBadge:true, info:"Jolt data thru "+fmtCT(gh.data_through) });
}

function ciOnArrival(oa){
  if(!oa) return "";

    + (String(t.priority||"").match(/urgent|high/i) ? ' <span class="ci-hi">'+esc(t.priority)+'</span>' : '')+'</div>'; };
  const cmp = function(c){ return '<div class="ci-row">'+esc(c.issue_category||c.issue_reason||c.comment||("Case "+(c.case_number||c.id||"")))
    + (c.customer_name ? ' - '+esc(c.customer_name) : '')+'</div>'; };

async function ciCheckIn(storeId, btn){
  if(!navigator.geolocation){ alert("This phone cannot share location, so check-in is not available."); return; }
  if(btn) btn.disabled = true;
  navigator.geolocation.getCurrentPosition(async function(pos){
    try{
      const c = pos.coords;
      const payload = await v2CallApi({ action:"check_in", store_id:storeId, lat:c.latitude, lng:c.longitude, accuracy:c.accuracy });
      if(payload && payload.result && payload.result.ok === false){
        if(btn) btn.disabled = false; alert(payload.result.msg || "Check-in failed."); return;
      }
      renderBoard(payload);
    }catch(e){ if(btn) btn.disabled = false; alert("Check-in failed: "+(e && e.message)); }
  }, function(){ if(btn) btn.disabled = false;
    alert("Location is required to check in. Please allow location access and try again.");
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:0 });
}
async function ciCheckOut(btn){
  if(btn) btn.disabled = true;
  try{
    const payload = await v2CallApi({ action:"check_out" });
    if(payload && payload.result && payload.result.ok === false){
      if(btn) btn.disabled = false; alert(payload.result.msg || "Check-out failed."); return;
    }
    renderBoard(payload);
  }catch(e){ if(btn) btn.disabled = false; alert("Check-out failed: "+(e && e.message)); }
}
