<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Report an issue</title>
<style>
  :root{--ink:#20262b;--mut:#5a6670;--line:#d9dddb;--acc:#c2410c;--bg:#f3f4f2;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--ink:#e7eae6;--mut:#98a4ab;--line:#3a4248;--acc:#f97316;--bg:#14181b;--card:#1d2327}}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:16px;line-height:1.45}
  .card{max-width:440px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  h1{font-size:20px;margin:0 0 2px}.store{color:var(--mut);font-size:13px;margin:0 0 14px}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px;font-weight:700}
  textarea,input,select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;background:var(--bg);color:var(--ink)}
  textarea{min-height:88px;resize:vertical}
  .seg{display:flex;gap:8px}.seg button{flex:1;padding:11px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--mut);font-size:15px;font-weight:700;cursor:pointer}
  .seg button.on{border-color:var(--acc);color:var(--acc);background:transparent}
  .submit{width:100%;margin-top:16px;padding:13px 0;border:none;border-radius:9px;background:var(--acc);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
  .submit:disabled{opacity:.5}
  .ok{text-align:center;padding:30px 10px;display:none}
  .ok .big{font-size:46px}.ok .ref{font-family:ui-monospace,monospace;font-size:22px;font-weight:800;margin:8px 0}
  .err{color:#b91c1c;font-size:13px;margin-top:10px;display:none}
  .hint{font-size:12px;color:var(--mut);margin-top:4px}
  .dead{text-align:center;padding:40px 10px;display:none;color:var(--mut)}
</style></head><body>
<!-- ops issue-report button v1 (2026-07-27) — SHARED SNIPPET, keep copies in sync.
     Source of truth: edge-functions/_shared/issue-report-button.html
     Injected by inject_issue_button.py into every INTERACTIVE surface (crew TVs excluded
     per Eddie 2026-07-27 — nobody types a bug report at a glanceable screen).

     DESIGN RULES (all three exist because of the 2026-07-27 Brandon incident, where his
     ticket queue rendered "invalid token" and he had no way to report it but email):
       1. Static + inline + FIRST in <body>. It must not depend on the app's JS, which is
          exactly what may already be broken.
       2. It must NOT need a valid capability token. A dead token is the failure we are
          catching, so the endpoint is unauthenticated.
       3. It must never leak the raw token. We send it so the server can hash it into a
          12-char hint; the server redacts the URL and stores no raw credential.
     Everything is wrapped in try/catch so a failure in THIS code can never take down a
     page that was otherwise fine. -->
<div id="opsIssueBtnRoot"></div>
<script>
(function () {
  "use strict";
  var SURFACE = "ticket";
  var ENDPOINT = "https://nnsuyrhubsidwmrrsumm.supabase.co/functions/v1/issue-report";
  var errs = [];
  try {
    window.addEventListener("error", function (e) {
      try { errs.push(String(e && e.message || e)); if (errs.length > 8) errs.shift(); } catch (_) {}
    });
    window.addEventListener("unhandledrejection", function (e) {
      try { errs.push("promise: " + String((e && e.reason && e.reason.message) || (e && e.reason) || e)); if (errs.length > 8) errs.shift(); } catch (_) {}
    });
  } catch (_) {}

  function tokenFromUrl() {
    try { return new URLSearchParams(location.search).get("t") || ""; } catch (_) { return ""; }
  }
  // Best-effort scrape of whatever the page is currently showing the user.
  // MUST exclude our own button/panel: their copy contains the word "error", so a
  // naive body scrape reported the panel's own helper text as the page error
  // (caught in browser E2E, 2026-07-27).
  function pageText() {
    try {
      var clone = document.body.cloneNode(true);
      ["opsIssueBtn", "opsIssuePanel", "opsIssueBtnRoot"].forEach(function (id) {
        var n = clone.querySelector("#" + id);
        if (n && n.parentNode) n.parentNode.removeChild(n);
      });
      return (clone.innerText || clone.textContent || "").trim();
    } catch (_) {
      try { return (document.body.innerText || "").trim(); } catch (__) { return ""; }
    }
  }
  function visibleError() {
    try {
      var t = pageText();
      var m = t.match(/[^\n]*(invalid token|not valid|denied|failed|unable|unavailable|no access|expired|went wrong|error)[^\n]*/i);
      if (m) return m[0].slice(0, 300);
      return t.length < 200 ? t.slice(0, 200) : "";
    } catch (_) { return ""; }
  }

  function build() {
    try {
      if (document.getElementById("opsIssueBtn")) return;
      var css = document.createElement("style");
      css.textContent =
        "#opsIssueBtn{position:fixed;right:14px;bottom:14px;z-index:2147483647;background:#b42318;color:#fff;" +
        "border:none;border-radius:999px;padding:10px 16px;font:600 13px/1.2 system-ui,Segoe UI,Arial,sans-serif;" +
        "cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}" +
        "#opsIssueBtn:hover{background:#912018}" +
        "#opsIssuePanel{position:fixed;right:14px;bottom:62px;z-index:2147483647;width:310px;max-width:92vw;" +
        "background:#fff;color:#111;border:1px solid #d0d5dd;border-radius:10px;padding:14px;display:none;" +
        "box-shadow:0 8px 28px rgba(0,0,0,.28);font:13px/1.45 system-ui,Segoe UI,Arial,sans-serif}" +
        "#opsIssuePanel h4{margin:0 0 4px;font-size:14px}" +
        "#opsIssuePanel p{margin:0 0 8px;color:#475467;font-size:12px}" +
        "#opsIssuePanel textarea,#opsIssuePanel input{width:100%;box-sizing:border-box;border:1px solid #d0d5dd;" +
        "border-radius:6px;padding:7px;font:13px system-ui,Segoe UI,Arial,sans-serif;margin-bottom:8px;background:#fff;color:#111}" +
        "#opsIssuePanel textarea{height:78px;resize:vertical}" +
        "#opsIssueSend{background:#b42318;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}" +
        "#opsIssueCancel{background:none;border:none;color:#475467;cursor:pointer;padding:8px;font-size:12px}" +
        "#opsIssueMsg{font-size:12px;margin-top:6px}";
      document.head ? document.head.appendChild(css) : document.documentElement.appendChild(css);

      var btn = document.createElement("button");
      btn.id = "opsIssueBtn"; btn.type = "button";
      btn.textContent = "⚠ Report issue";

      var panel = document.createElement("div");
      panel.id = "opsIssuePanel";
      panel.innerHTML =
        '<h4>Report a problem</h4>' +
        '<p>Tell us what went wrong. We attach the page and any error automatically.</p>' +
        '<textarea id="opsIssueText" placeholder="What happened? e.g. the page says invalid token"></textarea>' +
        '<input id="opsIssueWho" type="text" placeholder="Your name (optional)">' +
        '<button id="opsIssueSend" type="button">Send</button>' +
        '<button id="opsIssueCancel" type="button">Cancel</button>' +
        '<div id="opsIssueMsg"></div>';

      document.body.appendChild(btn);
      document.body.appendChild(panel);

      btn.onclick = function () {
        panel.style.display = panel.style.display === "block" ? "none" : "block";
        try { document.getElementById("opsIssueText").focus(); } catch (_) {}
      };
      document.getElementById("opsIssueCancel").onclick = function () { panel.style.display = "none"; };
      document.getElementById("opsIssueSend").onclick = function () {
        var msgEl = document.getElementById("opsIssueMsg");
        var text = (document.getElementById("opsIssueText").value || "").trim();
        var who = (document.getElementById("opsIssueWho").value || "").trim();
        var ve = visibleError();
        if (!text && !ve) { msgEl.style.color = "#b42318"; msgEl.textContent = "Please describe the problem."; return; }
        msgEl.style.color = "#475467"; msgEl.textContent = "Sending...";
        var payload = {
          surface: SURFACE, message: text, reporter_label: who,
          visible_error: ve, page_path: location.href, token: tokenFromUrl(),
          diagnostics: {
            errors: errs.slice(-5), title: document.title,
            viewport: (window.innerWidth || 0) + "x" + (window.innerHeight || 0),
            online: navigator.onLine, ts: new Date().toISOString()
          }
        };
        try {
          fetch(ENDPOINT, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }).then(function (r) { return r.json().catch(function () { return {}; }); })
            .then(function (j) {
              if (j && j.ok) {
                msgEl.style.color = "#067647";
                msgEl.textContent = "Thank you. Eddie has been notified.";
                document.getElementById("opsIssueText").value = "";
                setTimeout(function () { panel.style.display = "none"; msgEl.textContent = ""; }, 2200);
              } else {
                msgEl.style.color = "#b42318";
                msgEl.textContent = "Could not send. Please text Eddie.";
              }
            })
            .catch(function () {
              msgEl.style.color = "#b42318";
              msgEl.textContent = "Could not send. Please text Eddie.";
            });
        } catch (_) {
          msgEl.style.color = "#b42318";
          msgEl.textContent = "Could not send. Please text Eddie.";
        }
      };
    } catch (_) { /* the report button must never break the page */ }
  }

  try {
    if (document.body) build();
    else document.addEventListener("DOMContentLoaded", build);
  } catch (_) {}
})();
</script>
<!-- /ops issue-report button v1 -->

<div class="card" id="form" style="display:none">
  <h1>Report an issue</h1>
  <p class="store" id="store">…</p>
  <label>Type of problem</label>
  <div class="seg" id="cat">
    <button type="button" data-v="it">&#128421;&#65039; IT</button>
    <button type="button" data-v="maintenance" class="on">&#128295; Maintenance</button>
  </div>
  <label>What's wrong?</label>
  <textarea id="desc" placeholder="e.g. Walk-in cooler door won't seal — gasket torn on the hinge side" maxlength="2000"></textarea>
  <label>How urgent?</label>
  <select id="pri">
    <option value="normal">Normal — when someone can get to it</option>
    <option value="p1">High — hurting operations today</option>
    <option value="p0">Emergency — safety or store can't operate</option>
  </select>
  <label>Photo (optional, helps a lot)</label>
  <input type="file" id="photo" accept="image/*" capture="environment">
  <label>Your name</label>
  <input type="text" id="who" placeholder="First name and role, e.g. Maria — shift lead" maxlength="120">
  <button class="submit" id="go">Submit ticket</button>
  <div class="err" id="err"></div>
  <p class="hint">Photos and details go to the technician who claims this ticket.</p>
</div>
<div class="card ok" id="done">
  <div class="big">&#9989;</div>
  <div>Ticket submitted</div>
  <div class="ref" id="ref"></div>
  <div class="hint">The team has it. Keep this reference if you want to follow up.</div>
</div>
<div class="card dead" id="dead">This link isn't valid. Please use the QR poster in the store, or tell your GM.</div>
<script>
  var FN='https://nnsuyrhubsidwmrrsumm.supabase.co/functions/v1/ticket-submit';
  var MAXB=6*1024*1024;
  var tok=new URLSearchParams(location.search).get('t')||'';
  var cat='maintenance';
  function show(id){['form','done','dead'].forEach(function(x){document.getElementById(x).style.display=x===id?'block':'none'})}
  if(!tok){show('dead')}else{
    fetch(FN+'?api=loc&t='+encodeURIComponent(tok)).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(j){
      document.getElementById('store').textContent='📍 '+j.name+(j.store_number?' · #'+j.store_number:'')+' — goes straight to the fix team. No login.';
      show('form');
    }).catch(function(){show('dead')});
  }
  document.querySelectorAll('#cat button').forEach(function(b){
    b.onclick=function(){cat=b.dataset.v;document.querySelectorAll('#cat button').forEach(function(x){x.classList.remove('on')});b.classList.add('on')};
  });
  function b64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result.split(',')[1])};r.onerror=rej;r.readAsDataURL(f)})}
  document.getElementById('go').onclick=async function(){
    var d=document.getElementById('desc').value.trim();
    var e=document.getElementById('err');e.style.display='none';
    if(d.length<8){e.textContent='Please describe the problem (a sentence is plenty).';e.style.display='block';return}
    var btn=this;btn.disabled=true;btn.textContent='Sending…';
    var body={t:tok,category:cat,priority:document.getElementById('pri').value,description:d,
      submitter_name:document.getElementById('who').value.trim()||null};
    var f=document.getElementById('photo').files[0];
    if(f){if(f.size>MAXB){e.textContent='Photo is too large (6MB max).';e.style.display='block';btn.disabled=false;btn.textContent='Submit ticket';return}
      body.photo_b64=await b64(f);body.photo_mime=f.type||'image/jpeg'}
    try{
      var r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      var j=await r.json();
      if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
      document.getElementById('ref').textContent=j.ref;
      show('done');
    }catch(ex){e.textContent='Could not submit: '+ex.message+' — please tell your GM.';e.style.display='block';btn.disabled=false;btn.textContent='Submit ticket'}
  };
</script></body></html>
