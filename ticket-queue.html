<!-- ops issue-report button v1 (2026-07-27) — SHARED SNIPPET, keep copies in sync.
     Source of truth: edge-functions/_shared/issue-report-button.html
     Injected by inject_issue_button.py into every INTERACTIVE surface (crew TVs excluded
     per Eddie 2026-07-27 — nobody types a bug report at a glanceable screen).

     DESIGN RULES (all three exist because of the 2026-07-27 Brandon incident, where his
     ticket queue rendered "invalid token" and he had no way to report it but email):
       1. Static + inline + FIRST in <body>. It must not depend on the app's JS, which is
          exactly what may already be broken.
       2. It must NOT need a valid capability token. A dead token is the failure we are
          catching, so the endpoint is unauthenticated.
       3. It must never leak the raw token. We send it so the server can hash it into a
          12-char hint; the server redacts the URL and stores no raw credential.
     Everything is wrapped in try/catch so a failure in THIS code can never take down a
     page that was otherwise fine. -->
<div id="opsIssueBtnRoot"></div>
<script>
(function () {
  "use strict";
  var SURFACE = "ticket-queue";
  var ENDPOINT = "https://nnsuyrhubsidwmrrsumm.supabase.co/functions/v1/issue-report";
  var errs = [];
  try {
    window.addEventListener("error", function (e) {
      try { errs.push(String(e && e.message || e)); if (errs.length > 8) errs.shift(); } catch (_) {}
    });
    window.addEventListener("unhandledrejection", function (e) {
      try { errs.push("promise: " + String((e && e.reason && e.reason.message) || (e && e.reason) || e)); if (errs.length > 8) errs.shift(); } catch (_) {}
    });
  } catch (_) {}

  function tokenFromUrl() {
    try { return new URLSearchParams(location.search).get("t") || ""; } catch (_) { return ""; }
  }
  // Best-effort scrape of whatever the page is currently showing the user.
  // MUST exclude our own button/panel: their copy contains the word "error", so a
  // naive body scrape reported the panel's own helper text as the page error
  // (caught in browser E2E, 2026-07-27).
  // Read the LIVE rendered text with our own UI hidden. Do NOT cloneNode here: a
  // detached clone is unrendered, so innerText degrades to textContent and drags in
  // the contents of every <script> tag — the second thing browser E2E caught, after
  // the panel's own copy (both 2026-07-27).
  function pageText() {
    var ids = ["opsIssueBtn", "opsIssuePanel"];
    var prev = [];
    try {
      ids.forEach(function (id) {
        var n = document.getElementById(id);
        prev.push([n, n ? n.style.display : null]);
        if (n) n.style.display = "none";
      });
      return (document.body.innerText || "").trim();
    } catch (_) {
      return "";
    } finally {
      try {
        prev.forEach(function (p) { if (p[0]) p[0].style.display = p[1] || ""; });
      } catch (__) {}
    }
  }
  function visibleError() {
    try {
      var t = pageText();
      var m = t.match(/[^\n]*(invalid token|not valid|denied|failed|unable|unavailable|no access|expired|went wrong|error)[^\n]*/i);
      if (m) return m[0].slice(0, 300);
      return t.length < 200 ? t.slice(0, 200) : "";
    } catch (_) { return ""; }
  }

  function build() {
    try {
      if (document.getElementById("opsIssueBtn")) return;
      var css = document.createElement("style");
      css.textContent =
        "#opsIssueBtn{position:fixed;right:14px;bottom:14px;z-index:2147483647;background:#b42318;color:#fff;" +
        "border:none;border-radius:999px;padding:10px 16px;font:600 13px/1.2 system-ui,Segoe UI,Arial,sans-serif;" +
        "cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}" +
        "#opsIssueBtn:hover{background:#912018}" +
        "#opsIssuePanel{position:fixed;right:14px;bottom:62px;z-index:2147483647;width:310px;max-width:92vw;" +
        "background:#fff;color:#111;border:1px solid #d0d5dd;border-radius:10px;padding:14px;display:none;" +
        "box-shadow:0 8px 28px rgba(0,0,0,.28);font:13px/1.45 system-ui,Segoe UI,Arial,sans-serif}" +
        "#opsIssuePanel h4{margin:0 0 4px;font-size:14px}" +
        "#opsIssuePanel p{margin:0 0 8px;color:#475467;font-size:12px}" +
        "#opsIssuePanel textarea,#opsIssuePanel input{width:100%;box-sizing:border-box;border:1px solid #d0d5dd;" +
        "border-radius:6px;padding:7px;font:13px system-ui,Segoe UI,Arial,sans-serif;margin-bottom:8px;background:#fff;color:#111}" +
        "#opsIssuePanel textarea{height:78px;resize:vertical}" +
        "#opsIssueSend{background:#b42318;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}" +
        "#opsIssueCancel{background:none;border:none;color:#475467;cursor:pointer;padding:8px;font-size:12px}" +
        "#opsIssueMsg{font-size:12px;margin-top:6px}";
      document.head ? document.head.appendChild(css) : document.documentElement.appendChild(css);

      var btn = document.createElement("button");
      btn.id = "opsIssueBtn"; btn.type = "button";
      btn.textContent = "⚠ Report issue";

      var panel = document.createElement("div");
      panel.id = "opsIssuePanel";
      panel.innerHTML =
        '<h4>Report a problem</h4>' +
        '<p>Tell us what went wrong. We attach the page and any error automatically.</p>' +
        '<textarea id="opsIssueText" placeholder="What happened? e.g. the page says invalid token"></textarea>' +
        '<input id="opsIssueWho" type="text" placeholder="Your name (optional)">' +
        '<button id="opsIssueSend" type="button">Send</button>' +
        '<button id="opsIssueCancel" type="button">Cancel</button>' +
        '<div id="opsIssueMsg"></div>';

      document.body.appendChild(btn);
      document.body.appendChild(panel);

      btn.onclick = function () {
        panel.style.display = panel.style.display === "block" ? "none" : "block";
        try { document.getElementById("opsIssueText").focus(); } catch (_) {}
      };
      document.getElementById("opsIssueCancel").onclick = function () { panel.style.display = "none"; };
      document.getElementById("opsIssueSend").onclick = function () {
        var msgEl = document.getElementById("opsIssueMsg");
        var text = (document.getElementById("opsIssueText").value || "").trim();
        var who = (document.getElementById("opsIssueWho").value || "").trim();
        var ve = visibleError();
        if (!text && !ve) { msgEl.style.color = "#b42318"; msgEl.textContent = "Please describe the problem."; return; }
        msgEl.style.color = "#475467"; msgEl.textContent = "Sending...";
        var payload = {
          surface: SURFACE, message: text, reporter_label: who,
          visible_error: ve, page_path: location.href, token: tokenFromUrl(),
          diagnostics: {
            errors: errs.slice(-5), title: document.title,
            viewport: (window.innerWidth || 0) + "x" + (window.innerHeight || 0),
            online: navigator.onLine, ts: new Date().toISOString()
          }
        };
        try {
          fetch(ENDPOINT, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }).then(function (r) { return r.json().catch(function () { return {}; }); })
            .then(function (j) {
              if (j && j.ok) {
                msgEl.style.color = "#067647";
                msgEl.textContent = "Thank you. Eddie has been notified.";
                document.getElementById("opsIssueText").value = "";
                setTimeout(function () { panel.style.display = "none"; msgEl.textContent = ""; }, 2200);
              } else {
                msgEl.style.color = "#b42318";
                msgEl.textContent = "Could not send. Please text Eddie.";
              }
            })
            .catch(function () {
              msgEl.style.color = "#b42318";
              msgEl.textContent = "Could not send. Please text Eddie.";
            });
        } catch (_) {
          msgEl.style.color = "#b42318";
          msgEl.textContent = "Could not send. Please text Eddie.";
        }
      };
    } catch (_) { /* the report button must never break the page */ }
  }

  try {
    if (document.body) build();
    else document.addEventListener("DOMContentLoaded", build);
  } catch (_) {}
})();
</script>

<div class="wrap">
  <header>
    <div><h1>Ticket queue</h1><div class="sub" id="who">Signing in&#8230;</div></div>
    <div class="hdr-r"><span class="upd" id="upd"></span><button class="btn" id="rfr">&#8635; Refresh</button></div>
  </header>
  <div id="app"><div class="empty">Loading&#8230;</div></div>
</div>
<script>
var API="https://nnsuyrhubsidwmrrsumm.supabase.co/functions/v1/ticket-tech";
// ticket-queue v3 (2026-10-23): TECH PICKER. Brandon issue report #54 (2026-09-22).
// The Discord embed links here with NO token (a personal token must never sit in a
// shared channel), so the shared link authenticates NOBODY. It only lets the person
// choose among the techs already signed in on THIS browser: a local keyring of personal
// tokens, each re-checked by the server on every call. Nothing on the shared link, and
// no public roster, can sign anyone in, so it cannot be used to impersonate a tech.
// A tech is added to the keyring by opening their personal link here once, or by pasting
// that link into the setup box (required inside Discord's in-app browser, which keeps
// its storage separate from Safari). New techs (George, Virgilio) need NO code change:
// gen_tech_token.py --add, then deliver their personal link.
// A VALID ?t= is stripped from the address bar once saved, so the working credential
// never lands in a bookmark, screenshot or copied URL. A DEAD ?t= is left in place so
// the Report issue button still carries its hash hint for diagnosis.
// v2 (2026-09-08) kept one token under schmittnet_tkt_token; v3 migrates it once.
// NOTE: appHtml() inside the ticket-tech Edge Fn is a stale pre-v2 copy; THIS file is
// the source of truth (the Edge Fn only 302s here).
var KR_KEY='schmittnet_tkt_keyring_v1',LEGACY_KEY='schmittnet_tkt_token',ACT_KEY='schmittnet_tkt_active';
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(_){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(_){return null}}
function ssSet(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(_){}}
function krLoad(){try{var a=JSON.parse(lsGet(KR_KEY)||'[]');return Array.isArray(a)?a.filter(function(e){return e&&typeof e.t==='string'&&e.id!=null}):[]}catch(_){return []}}
function krSave(a){lsSet(KR_KEY,JSON.stringify(a))}
function krGet(id){var a=krLoad();for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i]}return null}
function krDrop(id){krSave(krLoad().filter(function(e){return e.id!==id}))}
function krPut(u,t){
 var a=krLoad().filter(function(e){return e.id!==u.id&&e.t!==t});
 a.push({id:u.id,name:u.name||('Tech '+u.id),role:u.role||'',t:t,ts:Date.now()});
 a.sort(function(x,y){return String(x.name).localeCompare(String(y.name))});
 krSave(a);
}
// Accepts a full personal link (ticket-tech?t=... or ticket-queue.html?t=...) or a bare token.
function tokFrom(s){
 s=String(s||'').trim();
 var m=s.match(/[?&]t=([^&#\s]+)/);
 if(m){try{s=decodeURIComponent(m[1])}catch(_){s=m[1]}}
 return /^[A-Za-z0-9_-]{16,200}$/.test(s)?s:'';
}
function stripUrlToken(){try{var u=new URL(location.href);if(!u.searchParams.has('t'))return;u.searchParams.delete('t');history.replaceState(null,'',u.pathname+u.search+u.hash)}catch(_){}}
function checkToken(t){
 return fetch(API+'?api=queue&t='+encodeURIComponent(t)).then(function(r){
  return r.json().then(function(j){return{s:r.status,j:j}},function(){return{s:r.status,j:{}}});
 });
}
function isAuthFail(x){return x.s===403||/invalid token/i.test(String((x.j&&x.j.error)||''))}
var T='',ACTIVE_ID=null;
var USER=null,TICKETS=[],EXP=null,DET={},CLOSED_OPEN=false;
function esc(s){s=String(s==null?'':s);return s.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function age(iso){var m=(Date.now()-new Date(iso).getTime())/60000;if(m<1)return 'now';if(m<60)return Math.floor(m)+'m';var h=m/60;if(h<24)return Math.floor(h)+'h';return Math.floor(h/24)+'d'}
function fmt(iso){var d=new Date(iso);return d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
var PRI={p0:['P0 EMERGENCY','cp0'],p1:['P1 HIGH','cp1'],p2:['P2 MEDIUM','cp2'],normal:['NORMAL','cn']};
var CAT={it:'&#128421;&#65039; IT',maintenance:'&#128295; MAINT'};
var PRANK={p0:0,p1:1,p2:2,normal:3};
function groupOf(t){if(t.status==='open')return 'open';if(t.status==='in_progress'||t.status==='approved')return 'prog';if(t.status==='on_hold')return 'hold';if(t.status==='awaiting_approval')return 'appr';return 'closed'}
// ---------- the picker: "Which tech are you?" ----------
function deactivate(){T='';ACTIVE_ID=null;USER=null;TICKETS=[];EXP=null;DET={};ssSet(ACT_KEY,null)}
function showPicker(msg){
 deactivate();
 document.getElementById('who').textContent='Choose who is signing in';
 document.getElementById('upd').textContent='';
 var a=krLoad();
 var h='<div class="pick"><div class="pk-h">Which tech are you?</div>';
 if(msg)h+='<div class="pk-msg" id="pkWarn">'+esc(msg)+'</div>';
 if(a.length){
  a.forEach(function(e){
   h+='<div class="pk-row"><button class="btn primary pk-who" data-id="'+esc(e.id)+'">'+esc(e.name)+
      (e.role?'<span class="pk-role">'+esc(String(e.role).replace('_',' '))+'</span>':'')+'</button>'+
      '<button class="pk-x" data-x="'+esc(e.id)+'" title="Remove from this device" aria-label="Remove '+esc(e.name)+' from this device">&times;</button></div>';
  });
 }else{
  h+='<div class="pk-note">No tech is signed in on this browser yet.</div>';
 }
 h+='<div class="pk-add"><div class="pk-sub">'+(a.length?'Add another tech on this device':'Sign in on this device')+'</div>'+
    '<div class="pk-note">Open your personal ticket queue link (the one emailed to you) once in this same browser, or copy that link and paste it here. Links opened from Discord use their own browser, so paste it here once if this screen came from Discord.</div>'+
    '<div class="inrow"><input id="pkIn" type="text" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste your personal link">'+
    '<button class="btn" id="pkGo">Add</button></div><div class="pk-note" id="pkMsg" style="margin-top:6px"></div></div>'+
    '<div class="pk-fine">Each link is personal. Never paste it into Discord or share it with anyone. If yours stopped working, ask Eddie for a new one.</div></div>';
 document.getElementById('app').innerHTML=h;
 document.querySelectorAll('.pk-who').forEach(function(b){b.onclick=function(){activate(Number(b.dataset.id))}});
 document.querySelectorAll('.pk-x').forEach(function(b){b.onclick=function(){
  var e=krGet(Number(b.dataset.x));
  if(e&&confirm('Remove '+e.name+' from this device? They can be added back with their personal link.')){krDrop(e.id);showPicker()}
 }});
 var go=document.getElementById('pkGo'),inp=document.getElementById('pkIn');
 go.onclick=addFromPaste;
 inp.onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();addFromPaste()}};
}
function addFromPaste(){
 var inp=document.getElementById('pkIn'),pm=document.getElementById('pkMsg');
 var t=tokFrom(inp.value);
 if(!t){pm.style.color='var(--bad)';pm.textContent='That does not look like a ticket queue link. Copy the whole link from your email and paste it here.';return}
 pm.style.color='';pm.textContent='Checking…';
 checkToken(t).then(function(x){
  if(x.j&&x.j.ok){inp.value='';krPut(x.j.user,t);startAs(t,x.j);return}
  pm.style.color='var(--bad)';
  pm.textContent=isAuthFail(x)?'That link is not valid anymore (it was replaced by a newer one). Ask Eddie for a new link.':String((x.j&&x.j.error)||('error '+x.s));
 }).catch(function(){pm.style.color='var(--bad)';pm.textContent='Network error. Try again.'});
}
function activate(id){
 var e=krGet(id);
 if(!e){showPicker();return}
 T=e.t;ACTIVE_ID=e.id;ssSet(ACT_KEY,String(e.id));
 document.getElementById('app').innerHTML='<div class="empty">Loading&#8230;</div>';
 loadQueue();
}
// Begin a session from an already-validated queue payload (no second fetch).
function startAs(t,j){T=t;ACTIVE_ID=j.user.id;ssSet(ACT_KEY,String(j.user.id));applyQueue(j)}
function applyQueue(j){
 USER=j.user;TICKETS=j.tickets||[];
 document.getElementById('who').innerHTML=esc(USER.name||'')+' · '+esc(String(USER.role).replace('_',' '))+
   ' <a href="#" id="switchUser" style="margin-left:.5rem;font-size:.85rem">switch tech</a>';
 var su=document.getElementById('switchUser');
 if(su)su.onclick=function(ev){ev.preventDefault();showPicker()};
 document.getElementById('upd').textContent='updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 render();
}
function loadQueue(cb){
 if(!T){showPicker();return}
 var asTok=T,asId=ACTIVE_ID;
 checkToken(asTok).then(function(x){
  if(T!==asTok)return; // the person switched tech while this was in flight
  if(!x.j.ok){
   if(isAuthFail(x)){
    var gone=krGet(asId);krDrop(asId);
    showPicker((gone?gone.name:'That tech')+'’s sign-in on this device is not valid anymore (the link was replaced or switched off). Open the newest link once, or paste it below.');
    return;
   }
   document.getElementById('app').innerHTML='<div class="empty">'+esc(String(x.j.error||('error '+x.s)))+'</div>';return}
  krPut(x.j.user,asTok); // refresh the stored name/role
  applyQueue(x.j);if(cb)cb();
 }).catch(function(){if(T===asTok)document.getElementById('app').innerHTML='<div class="empty">Network error. Tap Refresh to retry.</div>'});
}
// ---------- boot ----------
function migrateLegacy(){
 var old=lsGet(LEGACY_KEY);
 if(!old)return Promise.resolve();
 var t=tokFrom(old);
 if(!t){lsSet(LEGACY_KEY,null);return Promise.resolve()}
 for(var a=krLoad(),i=0;i<a.length;i++){if(a[i].t===t){lsSet(LEGACY_KEY,null);return Promise.resolve()}}
 return checkToken(t).then(function(x){
  if(x.j&&x.j.ok)krPut(x.j.user,t);
  lsSet(LEGACY_KEY,null); // valid ones now live in the keyring; dead ones are dropped
 }).catch(function(){/* offline: keep it and retry next load */});
}
function boot(){
 var q=new URLSearchParams(location.search);
 var hasUrlTok=q.has('t')&&q.get('t')!=='';
 var urlTok=hasUrlTok?tokFrom(q.get('t')):'';
 migrateLegacy().then(function(){
  if(hasUrlTok){
   if(!urlTok){showPicker('That link is not a valid ticket queue link.');return}
   checkToken(urlTok).then(function(x){
    if(x.j&&x.j.ok){krPut(x.j.user,urlTok);stripUrlToken();startAs(urlTok,x.j);return}
    if(isAuthFail(x)){showPicker('That link is not valid anymore. It was probably replaced by a newer one. Pick a tech below or paste your newest link.');return}
    document.getElementById('app').innerHTML='<div class="empty">'+esc(String((x.j&&x.j.error)||('error '+x.s)))+'</div>';
   }).catch(function(){document.getElementById('app').innerHTML='<div class="empty">Network error. Tap Refresh to retry.</div>'});
   return;
  }
  // Same tab, already chose a tech (reload / auto refresh): continue without re-asking.
  var act=Number(ssGet(ACT_KEY)||0);
  if(act&&krGet(act)){activate(act);return}
  showPicker(); // every fresh arrival (e.g. a Discord click) asks which tech
 });
}
function render(){
 var g={open:[],prog:[],hold:[],appr:[],closed:[]};
 TICKETS.forEach(function(t){g[groupOf(t)].push(t)});
 ['open','prog','hold','appr'].forEach(function(k){g[k].sort(function(a,b){return (PRANK[a.priority]-PRANK[b.priority])||(a.created_at<b.created_at?-1:1)})});
 var h='';
 h+=section('open','Open — unclaimed',g.open,false);
 h+=section('prog','In progress',g.prog,false);
 h+=section('hold','On hold',g.hold,false);
 h+=section('appr','Awaiting approval',g.appr,false);
 h+=section('closed','Recently closed',g.closed,true);
 if(TICKETS.length===0)h='<div class="empty">Queue is clear. No tickets.</div>';
 document.getElementById('app').innerHTML=h;
 bind();
 if(EXP&&DET[EXP]&&document.getElementById('d'+EXP))renderDetail(EXP);
}
function section(key,label,list,coll){
 var open=!coll||CLOSED_OPEN;
 var h='<div class="sec"><div class="sech'+(coll?' tog':'')+'" data-sec="'+key+'">'+label+' <span class="cnt">'+list.length+'</span>'+(coll?' <span>'+(open?'&#9662;':'&#9656;')+'</span>':'')+'</div>';
 if(open){if(list.length===0)h+='<div class="none">none</div>';list.forEach(function(t){h+=card(t)})}
 h+='</div>';return h;
}
function card(t){
 var mine=USER&&t.assignee_id===USER.id;
 var h='<div class="card pri-'+esc(t.priority)+(mine?' mine':'')+'" data-id="'+t.id+'">';
 h+='<div class="row1"><span class="ref">'+esc(t.ref)+'</span><span class="chip">'+(CAT[t.category]||esc(t.category))+'</span><span class="chip '+PRI[t.priority][1]+'">'+PRI[t.priority][0]+'</span>';
 if(t.status==='approved')h+='<span class="chip okc">APPROVED</span>';
 if(t.status==='resolved')h+='<span class="chip okc">RESOLVED</span>';
 if(t.status==='cancelled')h+='<span class="chip">CANCELLED</span>';
 h+='<span class="age">'+age(t.created_at)+'</span></div>';
 h+='<div class="ttl">'+esc(t.title)+'</div>';
 h+='<div class="meta">'+esc(t.location);
 if(t.submitter_name)h+=' · from '+esc(t.submitter_name);
 if(t.assignee)h+=' · <b>'+esc(t.assignee)+(mine?' (you)':'')+'</b>';
 if(t.deadline_at)h+=' · <span class="'+(new Date(t.deadline_at)<new Date()?'over':'')+'">due '+fmt(t.deadline_at)+'</span>';
 h+='</div><div id="d'+t.id+'"></div></div>';
 return h;
}
function bind(){
 document.querySelectorAll('.sech.tog').forEach(function(el){el.onclick=function(){CLOSED_OPEN=!CLOSED_OPEN;render()}});
 document.querySelectorAll('.card').forEach(function(el){
  el.addEventListener('click',function(ev){
   if(ev.target.closest('button')||ev.target.closest('a')||ev.target.closest('input')||ev.target.closest('textarea'))return;
   var id=Number(el.dataset.id);
   if(EXP===id){EXP=null;render();return}
   EXP=id;render();loadDetail(id);
  });
 });
}
function loadDetail(id){
 var d=document.getElementById('d'+id);
 if(d&&!DET[id])d.innerHTML='<div class="none">loading&#8230;</div>';
 fetch(API+'?api=ticket&id='+id+'&t='+encodeURIComponent(T)).then(function(r){return r.json()}).then(function(j){
  if(!j.ok){if(d)d.innerHTML='<div class="none">'+esc(j.error||'error')+'</div>';return}
  DET[id]=j;if(EXP===id)renderDetail(id);
 }).catch(function(){});
}
function kv(k,v){return '<div class="k">'+k+'</div><div>'+v+'</div>'}
function renderDetail(id){
 var d=document.getElementById('d'+id);if(!d)return;var j=DET[id];if(!j)return;
 var t=j.ticket;var h='<div>';
 if(t.description)h+='<div class="desc">'+esc(t.description)+'</div>';
 h+='<div class="kv">';
 h+=kv('Opened',fmt(t.created_at)+' ('+age(t.created_at)+' ago)');
 if(t.submitter_name)h+=kv('Submitted by',esc(t.submitter_name));
 h+=kv('Status',esc(String(t.status).replace('_',' ')));
 if(t.assignee)h+=kv('Assigned',esc(t.assignee));
 h+=kv('Deadline',t.deadline_at?fmt(t.deadline_at):'none');
 if(t.resolved_at)h+=kv('Resolved',fmt(t.resolved_at));
 if(j.approval)h+=kv('Approval',esc(j.approval.status)+(j.approval.requested_by?' · asked by '+esc(j.approval.requested_by):'')+(j.approval.note?' · '+esc(j.approval.note):''));
 h+='</div>';
 if(j.photos&&j.photos.length){h+='<div class="ph">';j.photos.forEach(function(p){h+='<a href="'+esc(p.url)+'" target="_blank" rel="noopener"><img src="'+esc(p.url)+'" alt="ticket photo"></a>'});h+='</div>'}
 if(j.timeline&&j.timeline.length){h+='<div class="tl">';j.timeline.forEach(function(e){h+=tlItem(e)});h+='</div>'}
 h+=actionsHtml(t)+'</div>';
 d.innerHTML=h;bindDetail(id);
}
function tlItem(e){
 var who=e.actor?esc(e.actor):'system';
 var b='';
 if(e.kind==='note')b='<b>'+who+'</b>: '+esc(e.body);
 else if(e.entry_type==='status_change')b='<b>'+who+'</b> — status '+esc(e.from||'new')+' → '+esc(e.to||'');
 else if(e.entry_type==='assignment')b='<b>'+who+'</b> claimed — assigned to '+esc(e.to||'');
 else if(e.entry_type==='deadline_change')b='<b>'+who+'</b> set deadline → '+(e.to&&e.to!=='none'?fmt(e.to):'none');
 else if(e.entry_type==='approval')b='<b>'+who+'</b> — approval '+esc(e.to||'');
 else b='<b>'+who+'</b> '+esc(e.entry_type||'');
 return '<div class="tli"><span class="tlt">'+fmt(e.at)+'</span> '+b+'</div>';
}
function btn(act,label,cls){return '<button class="btn '+cls+'" data-act="'+act+'">'+label+'</button>'}
function actionsHtml(t){
 var s=t.status,b=[];
 var closed=(s==='resolved'||s==='cancelled');
 if(closed){
  if(USER.can_approve)b.push(btn('reopen','Reopen',''));
 }else if(s==='awaiting_approval'){
  if(USER.can_approve){b.push(btn('approve','Approve','good'));b.push(btn('decline','Decline','danger'))}
  b.push(btn('note','Add note',''));
 }else{
  if(s==='open'&&!t.assignee_id)b.push(btn('claim','Claim','primary'));
  if(s==='on_hold'||s==='approved')b.push(btn('st-in_progress','Resume',''));
  if(s==='in_progress')b.push(btn('st-on_hold','Hold',''));
  b.push(btn('st-resolved','Resolve','good'));
  if(s!=='approved')b.push(btn('req','Request approval',''));
  b.push(btn('note','Add note',''));
  b.push(btn('dl','Deadline',''));
  b.push(btn('st-cancelled','Cancel','danger'));
 }
 var h='<div class="acts">'+b.join('')+'</div>';
 h+='<div class="inbox" id="nb'+t.id+'"><textarea id="nt'+t.id+'" maxlength="2000" placeholder="Note for the ticket timeline"></textarea><div class="inrow"><button class="btn primary" data-act="savenote">Save note</button></div></div>';
 h+='<div class="inbox" id="db'+t.id+'"><input type="datetime-local" id="dt'+t.id+'"><div class="inrow"><button class="btn primary" data-act="savedl">Set deadline</button><button class="btn" data-act="cleardl">Clear</button></div></div>';
 return h;
}
function tgl(eid){var el=document.getElementById(eid);if(el)el.style.display=(el.style.display==='flex'?'none':'flex')}
function bindDetail(id){
 var d=document.getElementById('d'+id);if(!d)return;
 d.querySelectorAll('button[data-act]').forEach(function(bt){
  bt.onclick=function(ev){
   ev.stopPropagation();
   var a=bt.dataset.act;
   if(a==='note'){tgl('nb'+id);return}
   if(a==='dl'){tgl('db'+id);return}
   if(a==='savenote'){var v=document.getElementById('nt'+id).value.trim();if(!v)return;post({action:'add_note',ticket_id:id,body:v});return}
   if(a==='savedl'){var v2=document.getElementById('dt'+id).value;if(!v2)return;post({action:'set_deadline',ticket_id:id,deadline_at:new Date(v2).toISOString()});return}
   if(a==='cleardl'){post({action:'set_deadline',ticket_id:id,deadline_at:null});return}
   if(a==='claim'){post({action:'claim',ticket_id:id});return}
   if(a==='req'){post({action:'request_approval',ticket_id:id});return}
   if(a==='approve'){post({action:'approve',ticket_id:id});return}
   if(a==='decline'){post({action:'decline',ticket_id:id});return}
   if(a==='reopen'){post({action:'set_status',ticket_id:id,status:'in_progress'});return}
   if(a.indexOf('st-')===0){
    var to=a.slice(3);
    if(to==='cancelled'&&!confirm('Cancel this ticket?'))return;
    post({action:'set_status',ticket_id:id,status:to});return}
  };
 });
}
function post(p){
 if(!T){showPicker();return}
 p.t=T;
 fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
 .then(function(r){return r.json()}).then(function(j){
  if(!j.ok){
   if(/invalid token/i.test(String(j.error||''))){loadQueue();return} // re-check: drops a dead sign-in, shows the picker
   alert(j.error||'action failed');return}
  loadQueue(function(){if(EXP)loadDetail(EXP)});
 }).catch(function(){alert('network error')});
}
document.getElementById('rfr').onclick=function(){if(T)loadQueue(function(){if(EXP)loadDetail(EXP)});else showPicker()};
// Auto refresh only while a tech is signed in: never re-render the picker under someone typing.
setInterval(function(){if(T&&USER)loadQueue(function(){if(EXP)loadDetail(EXP)})},60000);
boot();
</script></body></html>
